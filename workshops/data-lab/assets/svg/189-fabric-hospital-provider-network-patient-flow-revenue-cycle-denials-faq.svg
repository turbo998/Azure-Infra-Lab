  <text x="46" y="54" fill="#FFFFFF" font-size="20.5" font-weight="800">🏥 R181 · Hospital Network (IDN) Patient Flow, OR Block Scheduling &amp; RCM Denial AI (75th Sim · &gt;$360K/mo Saved!)</text>
  <text x="46" y="81" fill="#E0F2FE" font-size="13.5" font-weight="600">Scenario GF (DL-765..DL-768): 48 Hospital Campuses + 28,000 Beds · 995K EPS HL7v2 ADT &amp; OR Stream + 592M Clinical/LCD Vectors · 16ms (4²ms) E2E · -$361.1K/mo · $62.45M SLA!</text>
  <rect x="1216" y="34" width="222" height="58" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="1327" y="58" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="800">16ms (4²ms) · -$361.1K/mo</text>
  <text x="1327" y="79" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">75th Sim · $62.45M SLA</text>

