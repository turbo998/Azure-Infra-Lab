  <rect x="24" y="124" width="930" height="500" rx="14" fill="url(#fabricBoxGrad189)" stroke="#0EA5E9" stroke-width="1.8" filter="url(#shadow189)"/>
  <text x="44" y="156" fill="#38BDF8" font-size="17" font-weight="800">🏗️ Microsoft Fabric Unified Hospital Patient Flow, OR Block Backfill &amp; RCM Denial AI Loop (16ms = 4²ms E2E)</text>
  <text x="44" y="177" fill="#94A3B8" font-size="12.5">OneLake Zero-Copy (Epic Caboodle/Clarity + Cerner) + Eventhouse KQL (995K EPS HL7v2 ADT/OR) + 592M SSD DiskANN ($0/GB Tax)</text>

  <!-- Step 1 -->
