  <text x="162" y="539" fill="#F8FAFC" font-size="14.5" font-weight="700">Teams CMO &amp; RCM Director Card + Epic Bed/OR Board, EDI 835 Appeal &amp; 1GB SQL Commit (4ms!)</text>
  <text x="56" y="563" fill="#CBD5E1" font-size="12.5">• Updates Epic bed/OR schedules, dispatches EDI 835 payer appeals, and commits audit logs to 1GB Free Fabric SQL + hospital ALDO edge in 4ms.</text>
  <text x="56" y="584" fill="#C4B5FD" font-size="12.5" font-weight="600">• Total E2E: 4ms + 4ms + 4ms + 4ms = 16ms (4²ms) Loop! 75th Ontology Sim, -$361.1K/mo (&gt;$360K!) Saved &amp; $62.45M SLA!</text>

