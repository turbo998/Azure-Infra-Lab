  <rect x="56" y="204" width="92" height="26" rx="6" fill="#0284C7"/>
  <text x="102" y="222" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 1 · 4ms</text>
  <text x="162" y="221" fill="#F8FAFC" font-size="14.5" font-weight="700">Eventhouse KQL + HDS FHIR R4: 4ms Inpatient Bed Turnover, Open OR Block &amp; DRG Sense ($0 Tax!)</text>
  <text x="56" y="245" fill="#CBD5E1" font-size="12.5">• Ingests 995,000 EPS HL7v2 ADT events, anesthesia milestones, EVS bed-cleaning &amp; EDI 835 denials across 48 hospitals (28,000 beds).</text>
  <text x="56" y="266" fill="#38BDF8" font-size="12.5" font-weight="600">• Eliminates $138,800/mo in RCM SaaS &amp; FHIR stream taxes; isolates 620 imminent discharges, 84 open OR blocks &amp; 130 DRG warnings in 4ms.</text>

  <!-- Step 2 -->
  <rect x="44" y="298" width="890" height="94" rx="10" fill="#0B192C" stroke="#10B981" stroke-width="1.4"/>
  <rect x="56" y="310" width="92" height="26" rx="6" fill="#059669"/>
  <text x="102" y="328" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 2 · 4ms</text>
  <text x="162" y="327" fill="#F8FAFC" font-size="14.5" font-weight="700">Cosmos DB SSD DiskANN (592M Clinical/LCD Vectors) + In-Lake PREDICT &amp; ai.extract CDI (4ms!)</text>
  <text x="56" y="351" fill="#CBD5E1" font-size="12.5">• Searches 592,000,000 progress notes, payer LCD/NCD policies &amp; appeal vectors via SSD DiskANN ($3,220/mo vs $73,600/mo 4.52TB DRAM).</text>
  <text x="56" y="372" fill="#34D399" font-size="12.5" font-weight="600">• Lifts OR utilization +16.2% (-38% ED boarding) and generates citation-backed EDI 835 appeals recovering $14.8M net revenue in 4ms.</text>

  <!-- Step 3 -->
  <rect x="44" y="404" width="890" height="94" rx="10" fill="#0B192C" stroke="#F59E0B" stroke-width="1.4"/>
  <rect x="56" y="416" width="92" height="26" rx="6" fill="#D97706"/>
  <text x="102" y="434" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 3 · 4ms</text>
  <text x="162" y="433" fill="#F8FAFC" font-size="14.5" font-weight="700">Foundry IQ Objective Lab-Proof (Zero Upcoding), CMS Two-Midnight &amp; HIPAA Gate (SOP-188 · 4ms!)</text>
  <text x="56" y="457" fill="#CBD5E1" font-size="12.5">• Validates HOSPITAL-PROVIDER-PATIENT-FLOW-RCM-SOP-188: requires timestamped lab/pathology proof for every CC/MCC coding prompt (0 upcoding),</text>
  <text x="56" y="478" fill="#FBBF24" font-size="12.5" font-weight="600">• Verifies CMS Two-Midnight inpatient criteria and enforces HIPAA Minimum Necessary PHI CLS across 15,400 users in 4ms.</text>

  <!-- Step 4 -->
  <rect x="44" y="510" width="890" height="98" rx="10" fill="#0B192C" stroke="#8B5CF6" stroke-width="1.4"/>
  <rect x="56" y="522" width="92" height="26" rx="6" fill="#7C3AED"/>
