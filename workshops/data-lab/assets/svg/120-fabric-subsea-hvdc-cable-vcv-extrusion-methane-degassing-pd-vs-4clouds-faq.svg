  <text x="1032" y="498" fill="#FBBF24" font-size="12.5" font-weight="800">Better Together 跨云零拷贝黄金分工</text>
  <text x="1032" y="518" fill="#E2E8F0" font-size="11">• Azure HPC / Databricks：3D 粘弹流变 CFD &amp; 空间电荷 FEM</text>
  <text x="1032" y="538" fill="#E2E8F0" font-size="11">• Snowflake / SAP：超净 XLPE 粒子、铜套保与 TSO 合同 ERP</text>
  <text x="1032" y="558" fill="#34D399" font-size="11" font-weight="700">• Fabric：OneLake 零拷贝挂载 + 26ms 立塔码头实时控制面</text>
  <text x="1032" y="578" fill="#94A3B8" font-size="10.5">• 官方规格引用：115 条 (115-Spec 里程碑 · SPEC-HVDC-CABLE-R112)</text>

