  <rect x="1018" y="338" width="364" height="126" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="1032" y="360" fill="#67E8F9" font-size="12.5" font-weight="800">双分母延迟基准 (sealed report.json R112)</text>
  <text x="1032" y="382" fill="#F8FAFC" font-size="11.5">• 路由评估矩阵 (n=492)：     491 / 492 (99.80% 准确率)</text>
