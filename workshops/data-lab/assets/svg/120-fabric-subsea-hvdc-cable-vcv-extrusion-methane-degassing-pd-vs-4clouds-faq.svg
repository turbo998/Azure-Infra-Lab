  <text x="218" y="66" fill="#040814" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="0.8">🏆 R112 · #120 SVG, #115 SPEC &amp; 160.0ms MEAN!</text>
  <text x="394" y="66" fill="#F8FAFC" font-size="16" font-weight="800">±525kV 柔直海缆 (HVDC XLPE) 160m 立塔三层共挤防偏心焦烧、70°C 甲烷脱气与软接头空间电荷/局放 26ms 闭环</text>
  <text x="58" y="100" fill="#94A3B8" font-size="12.5">Scenario DO · 14 座深水海缆基地 (84 座 160m 立塔 + 420 座万吨脱气室 + 180 间软接头室) × 990K EPS · 3.16 亿向量 (316M!) · 1.15% 偏心 &amp; 28ppm 甲烷 · 守护 $38.30M (&gt;$38M!) SLA</text>

  <rect x="1156" y="46" width="226" height="64" rx="10" fill="#064E3B" stroke="#06B6D4" stroke-width="1.8"/>
