  <text x="524" y="449" fill="#F8FAFC" font-size="11.5">• 校验 28mm 绝缘同心偏心度压回 1.15% &lt;= 3.00% 且 &gt;20μm 焦烧粒子 = 0</text>
  <text x="524" y="468" fill="#CBD5E1" font-size="11">• 心部残余甲烷降至 28 ppm &lt;= 50 ppm (提前 38 小时出室，节能 -19.4%)</text>
  <text x="524" y="485" fill="#34D399" font-size="11" font-weight="700">• 软接头 PEA 空间电荷场畸变压至 4.2% &lt;= 10.0% · UHF 局放 0.35 pC</text>

  <!-- Step 4 -->
  <rect x="508" y="510" width="454" height="84" rx="10" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.4"/>
  <text x="524" y="531" fill="#C4B5FD" font-size="12.5" font-weight="800">STEP 4 · Teams 绝缘总工确认 + ALDO 边缘 + CIGRE 护照 (6 ms)</text>
  <text x="524" y="551" fill="#F8FAFC" font-size="11.5">• 立塔 ALDO 边缘下发 Profinet/OPC-UA 偏心环与转盘内热脱气指令</text>
  <text x="524" y="570" fill="#34D399" font-size="11" font-weight="700">• 1GB 免费 SQL 签发 CIGRE TB 852 65km 零缺陷海缆护照 (26ms!)</text>

