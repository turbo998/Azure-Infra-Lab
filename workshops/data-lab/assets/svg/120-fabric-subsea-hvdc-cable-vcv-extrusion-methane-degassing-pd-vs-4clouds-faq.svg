  <rect x="40" y="624" width="1360" height="240" rx="14" fill="#0E192D" stroke="#2563EB" stroke-width="1.5"/>
  <text x="60" y="654" fill="#60A5FA" font-size="14.5" font-weight="800">04 · ±525kV 柔直海缆三层共挤、脱气与空间电荷三大物理护栏矩阵 (SOP-119 · 120-SVG &amp; 115-Spec Milestone)</text>

  <rect x="60" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="76" y="694" fill="#67E8F9" font-size="13" font-weight="800">① 160m 立塔三层共挤防焦烧与太赫兹纠偏</text>
  <text x="76" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：Carreau-Yasuda 剪切稀化与 Arrhenius 焦烧积分</text>
  <text x="76" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：第 34.2km 偏心升至 4.80% 且现 38μm 焦烧前驱</text>
  <text x="76" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：第4区油温 -2.4°C + 偏心环 -145μm + 氮冷 +11.5%</text>
  <text x="76" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：偏心度锁死 1.15% &lt;= 3.00%，&gt;20μm 焦烧粒子 = 0</text>
  <text x="76" y="800" fill="#94A3B8" font-size="11">• 连续生产：30 天 65km 大长度无接头芯线零停塔报废</text>

  <rect x="506" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#10B981" stroke-width="1.2"/>
  <text x="522" y="694" fill="#6EE7B7" font-size="13" font-weight="800">② 70°C 万吨转盘室导体内热梯度脱气闭环</text>
  <text x="522" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：圆柱坐标 Fick 径向扩散 ∂C/∂t = r⁻¹∂r(r·D(T)·∂rC)</text>
  <text x="522" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：底圈 61.5°C 冷点导致心部甲烷滞留 185 ppm (&gt;50)</text>
  <text x="522" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：底圈导流风幕 +22% + 导体 72.5°C 微电流内加热</text>
  <text x="522" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：心部残余甲烷压至 28 ppm，提前 38 小时出室</text>
  <text x="522" y="800" fill="#94A3B8" font-size="11">• 节能效益：万吨脱气烘房能耗降低 -19.4%，零甲烷积聚爆炸</text>

  <rect x="952" y="670" width="428" height="174" rx="10" fill="#091326" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="968" y="694" fill="#FBBF24" font-size="13" font-weight="800">③ 软接头 PEA 空间电荷与 UHF 局部放电闭环</text>
  <text x="968" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：直流电场分布 E(r) ∝ 1/γ(T,E) 与双极性陷阱电荷</text>
  <text x="968" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：苯乙酮残留使场强畸变冲上 24.2%，PD=4.6 pC</text>
  <text x="968" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：纳米 MgO/交联度梯度匹配消除界面深陷阱</text>
  <text x="968" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：PEA 电场畸变压至 4.2% &lt;= 10%，UHF PD=0.35 pC</text>
  <text x="968" y="800" fill="#FDE68A" font-size="11" font-weight="700">• 国际合规：1GB 免费 SQL 签发 CIGRE TB 852 海缆护照 · 26ms</text>
