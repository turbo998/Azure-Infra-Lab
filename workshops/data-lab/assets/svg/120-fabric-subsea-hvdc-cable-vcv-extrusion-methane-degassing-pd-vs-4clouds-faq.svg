  <!-- Left Column -->
  <rect x="40" y="138" width="430" height="470" rx="14" fill="#131B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · ±525kV 柔直海缆三大物理危机与传统死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #06 号 160m 立塔第 18 天焦烧微粒与热悬垂偏心</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• 机头第4区剪切生热升至 135.8°C，DCP 提前交联生成 38μm 焦烧</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 重力热悬垂使 28mm 绝缘偏心度冲至 4.80% (&gt;3.00% CIGRE 红线)</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 525kV 直流高场强 (&gt;25kV/mm) 下引发海底电树枝绝缘击穿</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：只切首尾两端化验漏检第 34.2km 缺陷，海底打捞维修超 $30M！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="344" fill="#FCA5A5" font-size="12.5" font-weight="800">② #12 万吨脱气室心部甲烷滞留与空间电荷电场反转</text>
  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• 转盘底圈 61.5°C 冷点导致第 32km 心部甲烷残余 185 ppm (&gt;50)</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 极性副产物苯乙酮诱发软接头界面同极性空间电荷深陷阱积聚</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• PEA 直流电场畸变率冲上 24.2% (&gt;10.0%)，UHF 局放达 4.6 pC</text>
  <text x="72" y="424" fill="#F87171" font-size="11" font-weight="700">• 痛点：极性反转或满载阶跃时直接引发工厂软接头闪络爆炸！</text>

  <rect x="58" y="466" width="394" height="126" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($246.2K/月 vs $14.1K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：990K EPS 太赫兹/激光/FTIR/UHF 流月费 $174.9K</text>
  <text x="72" y="528" fill="#E2E8F0" font-size="11.5">• 内存税：316M 全内存 DRAM 向量索引月耗 $37.0K</text>
  <text x="72" y="548" fill="#E2E8F0" font-size="11.5">• 刷新税：Snowflake 60s 滞后 / 事后切片错失立塔调环窗口</text>
  <text x="72" y="570" fill="#34D399" font-size="11.5" font-weight="700">• Fabric 破局：$0/GB 写入税 + SSD DiskANN 省 92% 内存</text>

