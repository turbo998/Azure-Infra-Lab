  <!-- Background -->
  <rect width="1440" height="900" fill="url(#bg43)"/>
  <rect x="24" y="20" width="1392" height="860" rx="20" fill="#0B1528" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <rect x="44" y="38" width="1352" height="86" rx="14" fill="#13223E" stroke="#EC4899" stroke-width="1.5"/>
  <rect x="64" y="52" width="230" height="26" rx="13" fill="url(#accent43)"/>
  <text x="179" y="70" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">DATA LAB · ROUND 35 · MEDIA &amp; OTT</text>
  <text x="310" y="70" fill="#F8FAFC" font-size="18" font-weight="800">流媒体 OTT 直播体验 (650K EPS CMCD)、多 CDN 切流、动态插播广告 (SSAI) 与版权分账选型 FAQ</text>
  <text x="64" y="102" fill="#94A3B8" font-size="12.5">Microsoft Fabric (Eventhouse KQL 4ms CMCD + Cosmos SSD DiskANN 6ms SSAI + OneLake 版权图谱) vs AWS Elemental / GCP BigQuery / Databricks / Snowflake</text>
  <rect x="1168" y="50" width="208" height="60" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="1272" y="72" fill="#34D399" font-size="11.5" font-weight="700" text-anchor="middle">Scenario AP · 18M 并发决赛闭环</text>
  <text x="1272" y="96" fill="#F8FAFC" font-size="17" font-weight="800" text-anchor="middle">20ms · 省 83.6% TCO</text>

  <!-- Row 1 Left: 3 Pain Points vs First-Principles Breakthroughs -->
  <rect x="44" y="140" width="664" height="250" rx="14" fill="#101E36" stroke="#1E293B" stroke-width="1.5"/>
  <text x="64" y="168" fill="#F472B6" font-size="14" font-weight="800">01 · 第一性原理：流媒体三大生死劫 vs Fabric 零税实时闭环机理</text>

  <rect x="64" y="182" width="624" height="60" rx="8" fill="#172554" stroke="#EC4899" stroke-width="1"/>
  <text x="78" y="202" fill="#F9A8D4" font-size="12" font-weight="800">① Eventhouse KQL 650K EPS CMCD 心跳聚合 (4ms 锁定边缘卡顿 · $0/GB 写入税)</text>
  <text x="78" y="220" fill="#E2E8F0" font-size="11">• 传统痛点：第三方商业 QoE 按播放会话收费，或 BigQuery 吞吐 650K EPS 月交 $11,400+ 流式写入税，且滞后 5 分钟</text>
  <text x="78" y="235" fill="#34D399" font-size="11" font-weight="700">• Fabric 破局：原生解析 CTA-5004 CMCD (bl/br/sf)，4ms 检出法兰克福 PoP 6.8% 重缓冲并切流 145 万观众</text>

  <rect x="64" y="250" width="624" height="60" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="78" y="270" fill="#C4B5FD" font-size="12" font-weight="800">② Cosmos DB SSD DiskANN 提前 15 秒广告预分配 (6ms 匹配 · 省 92% 内存 · 99.2% 填充)</text>
  <text x="78" y="288" fill="#E2E8F0" font-size="11">• 传统痛点：1,800 万观众在 SCTE-35 哨响瞬间同时请求广告，常驻内存 Redis 昂贵且超时降级播“空白垫片”</text>
  <text x="78" y="303" fill="#34D399" font-size="11" font-weight="700">• Fabric 破局：借 SCTE-35 15s 预告信令在 NVMe SSD DiskANN 预分配高 CPM 广告包，0 秒空白垫片锁单 $4.20M</text>

  <rect x="64" y="318" width="624" height="58" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="78" y="338" fill="#6EE7B7" font-size="12" font-weight="800">③ Fabric IQ 6 跳版权摊销 (ASC 926) 与演职员残值 (SAG-AFTRA) 图谱 + DirectLake $0 席位</text>
  <text x="78" y="356" fill="#E2E8F0" font-size="11">• 零拷贝打通完播小时、GAM 360 广告流水与 SAP S/4HANA 影视资产账本，1,200 名播控/广告/财务人员免许可看数</text>

  <!-- Row 1 Right: Decision Tree & Coexistence -->
  <rect x="728" y="140" width="668" height="250" rx="14" fill="#101E36" stroke="#1E293B" stroke-width="1.5"/>
  <text x="748" y="168" fill="#60A5FA" font-size="14" font-weight="800">02 · 五大平台选型决策树与“视频流走边缘 × 控制脑在 Fabric”共存</text>

  <rect x="748" y="182" width="304" height="92" rx="8" fill="#172554" stroke="#10B981" stroke-width="1.2"/>
  <text x="762" y="202" fill="#34D399" font-size="12" font-weight="800">✅ 首选 Microsoft Fabric (省 83.6% TCO)</text>
  <text x="762" y="220" fill="#E2E8F0" font-size="11">• 650K EPS CMCD 播放体验监控与多 CDN 切流</text>
  <text x="762" y="236" fill="#E2E8F0" font-size="11">• 1.4 亿家庭 SCTE-35 广告频次控制与防垫片</text>
  <text x="762" y="252" fill="#6EE7B7" font-size="11" font-weight="700">• 影视版权 ASC 926 摊销与 SAG-AFTRA 残值核算</text>

  <rect x="1068" y="182" width="308" height="92" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1082" y="202" fill="#FBBF24" font-size="12" font-weight="800">🤝 零拷贝共存 (AWS Elemental / GAM / DBX)</text>
  <text x="1082" y="220" fill="#E2E8F0" font-size="11">• 实时音视频编码/切片拼接 → AWS Elemental</text>
  <text x="1082" y="236" fill="#E2E8F0" font-size="11">• GAM 360 广告竞价日志 → BigQuery Mirroring ($0)</text>
  <text x="1082" y="252" fill="#FDE68A" font-size="11" font-weight="700">• 老片 GPU 修复与 AI 配音 → Databricks GPU</text>

  <rect x="748" y="284" width="628" height="92" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
  <text x="764" y="304" fill="#93C5FD" font-size="12" font-weight="800">🛡️ Foundry IQ 流媒体地域版权与未成年广告合规硬护栏 (MEDIA-OTT-QOE-SSAI-ROYALTY-SOP-042)</text>
  <text x="764" y="324" fill="#E2E8F0" font-size="11">1. 地域播映权围栏 (Territorial Geo-Rights)：多 CDN 故障切流严禁将赛事流路由至无转播权国家边缘节点</text>
  <text x="764" y="342" fill="#E2E8F0" font-size="11">2. 未成年与品牌安全 (COPPA / GARM)：100% 拦截酒精、博彩与成人分级广告投向儿童档案或未满法定年龄家庭账户</text>
  <text x="764" y="360" fill="#34D399" font-size="11" font-weight="700">3. 完播率防刷审计：通过 CMCD 心跳连续性校验剔除机器人刷量，确保 SAG-AFTRA 残值与广告结算 100% 真实可信</text>

  <!-- Row 2: Scenario AP 20ms Closed-Loop Pipeline -->
  <rect x="44" y="406" width="1352" height="206" rx="14" fill="#101E36" stroke="#EC4899" stroke-width="1.5"/>
  <text x="64" y="434" fill="#F9A8D4" font-size="14" font-weight="800">03 · Scenario AP 实测仿真：洲际足球决赛 1,800 万并发观众 × 650K EPS 切流、广告锁单与残值分账 20ms 闭环</text>

  <rect x="64" y="450" width="312" height="142" rx="10" fill="#0F172A" stroke="#EC4899" stroke-width="1.2"/>
  <text x="80" y="472" fill="#F472B6" font-size="12" font-weight="800">Step 1 · Eventhouse 650K EPS 感知 (4ms)</text>
  <text x="80" y="492" fill="#E2E8F0" font-size="11">• $0/GB 写入税摄入 1,800 万终端 CMCD 心跳</text>
  <text x="80" y="510" fill="#E2E8F0" font-size="11">• 第 89 分钟绝平进加时赛，并发暴增 +380%</text>
  <text x="80" y="528" fill="#E2E8F0" font-size="11">• 锁定法兰克福 PoP-04 重缓冲飙至 6.8%</text>
  <text x="80" y="548" fill="#34D399" font-size="11" font-weight="700">✓ 同步捕获加时赛前 15s SCTE-35 预告信令</text>

  <rect x="396" y="450" width="322" height="142" rx="10" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="412" y="472" fill="#C4B5FD" font-size="12" font-weight="800">Step 2 · 6 跳图谱与 DiskANN 预分配 (6ms)</text>
  <text x="412" y="492" fill="#E2E8F0" font-size="11">• 145 万受影响观众无感切流至阿姆斯特丹 PoP</text>
  <text x="412" y="510" fill="#E2E8F0" font-size="11">• SSD DiskANN 预分配 1,800 万观众广告包</text>
  <text x="412" y="528" fill="#E2E8F0" font-size="11">• SSAI 广告填充率从 78.4% 拉升至 99.2%</text>
  <text x="412" y="548" fill="#34D399" font-size="11" font-weight="700">✓ 单次 90s 广告口锁单 $4.20M (0 秒空白垫片)</text>

  <rect x="738" y="450" width="312" height="142" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="754" y="472" fill="#60A5FA" font-size="12" font-weight="800">Step 3 · Foundry IQ 版权与合规门控 (5ms)</text>
  <text x="754" y="492" fill="#E2E8F0" font-size="11">• 核验 MEDIA-OTT-QOE-SSAI-ROYALTY-SOP-042</text>
  <text x="754" y="510" fill="#E2E8F0" font-size="11">• 备用 CDN 节点 100% 位于 UEFA 授权地域内</text>
  <text x="754" y="528" fill="#E2E8F0" font-size="11">• 家庭儿童档案 100% 剔除啤酒/博彩赞助广告</text>
  <text x="754" y="548" fill="#34D399" font-size="11" font-weight="700">✓ 同步校验 SAG-AFTRA 加时赛残值计提比例</text>

  <rect x="1070" y="450" width="306" height="142" rx="10" fill="#172554" stroke="#10B981" stroke-width="1.5"/>
  <text x="1086" y="472" fill="#34D399" font-size="12" font-weight="800">Step 4 · Teams 联签与多系统锁定 (5ms)</text>
  <text x="1086" y="492" fill="#F8FAFC" font-size="11">• 播控总监与商业化 VP Teams 联签 Confirm</text>
  <text x="1086" y="510" fill="#F8FAFC" font-size="11">• Multi-CDN 切流生效，重缓冲压回 0.18%</text>
  <text x="1086" y="528" fill="#F8FAFC" font-size="11">• GAM 360 广告锁单 + SAP 版权摊销凭证回写</text>
  <text x="1086" y="548" fill="#6EE7B7" font-size="11" font-weight="800">✓ 20ms 闭环 · 守护 $11.35M 决赛营收与留存 SLA</text>

  <!-- Row 3: TCO Bars & Quantitative KPIs -->
  <rect x="44" y="628" width="820" height="232" rx="14" fill="#101E36" stroke="#1E293B" stroke-width="1.5"/>
  <text x="64" y="656" fill="#60A5FA" font-size="14" font-weight="800">04 · 流媒体平台月度 TCO 对比 (650K EPS CMCD × 1.4 亿家庭画像 × 1,200 席位)</text>

  <text x="64" y="684" fill="#F8FAFC" font-size="12" font-weight="700">Microsoft Fabric (Eventhouse $0 写入税 + SSD DiskANN -92% 内存 + DirectLake $0 席位)</text>
  <rect x="64" y="692" width="126" height="16" rx="8" fill="url(#fabricBar43)"/>
  <text x="200" y="705" fill="#34D399" font-size="12.5" font-weight="800">$7,600 / 月 (基准最优 · 立省 83.6% / 年省 $465.6K)</text>

  <text x="64" y="728" fill="#CBD5E1" font-size="11.5">Databricks (常驻流式 DLT DBU + 内存特征存储 + SQL Serverless BI)</text>
  <rect x="64" y="735" width="612" height="12" rx="6" fill="#475569"/>
  <text x="686" y="746" fill="#F97316" font-size="11.5" font-weight="700">$37,800 / 月</text>

  <text x="64" y="768" fill="#CBD5E1" font-size="11.5">AWS (Kinesis/CloudWatch 按 GB 写入 + ElastiCache Redis + Redshift/QuickSight)</text>
  <rect x="64" y="775" width="630" height="12" rx="6" fill="#475569"/>
  <text x="704" y="786" fill="#FBBF24" font-size="11.5" font-weight="700">$38,900 / 月</text>

  <text x="64" y="808" fill="#CBD5E1" font-size="11.5">传统拼装栈 (商业 QoE 按会话费 + BigQuery 流式写入税 + Redis + T+30 版权跑批)</text>
  <rect x="64" y="815" width="710" height="12" rx="6" fill="#64748B"/>
  <text x="782" y="826" fill="#EF4444" font-size="11.5" font-weight="700">$46,400 / 月</text>

  <!-- Right KPI Summary Card -->
  <rect x="884" y="628" width="512" height="232" rx="14" fill="#13223E" stroke="#10B981" stroke-width="1.5"/>
  <text x="904" y="656" fill="#34D399" font-size="14" font-weight="800">05 · Round 35 架构师核心量化战果速览</text>

  <rect x="904" y="672" width="228" height="76" rx="10" fill="#0F172A" stroke="#EC4899" stroke-width="1.2"/>
  <text x="1018" y="696" fill="#F9A8D4" font-size="11" font-weight="700" text-anchor="middle">CMCD 卡顿感知与广告填充率</text>
  <text x="1018" y="722" fill="#F8FAFC" font-size="19" font-weight="800" text-anchor="middle">4ms · 99.2% Fill</text>
  <text x="1018" y="740" fill="#34D399" font-size="10" text-anchor="middle">重缓冲 6.8%→0.18% · 0 秒空白垫片</text>

  <rect x="1148" y="672" width="228" height="76" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="1262" y="696" fill="#6EE7B7" font-size="11" font-weight="700" text-anchor="middle">流媒体与版权平台月度 TCO</text>
  <text x="1262" y="722" fill="#34D399" font-size="19" font-weight="800" text-anchor="middle">-83.6% ($38.8K/mo)</text>
  <text x="1262" y="740" fill="#94A3B8" font-size="10" text-anchor="middle">$7,600 vs $46,400 · 省 92% 内存</text>

  <rect x="904" y="762" width="472" height="80" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="920" y="784" fill="#60A5FA" font-size="12" font-weight="800">评测基准更新 (Sealed Benchmark DL-01..DL-184 · n=42 Ontologies)</text>
  <text x="920" y="804" fill="#E2E8F0" font-size="11">• 路由准确率：183 / 184 (99.46%) · 88 / 88 Python 单元测试 100% 通过</text>
  <text x="920" y="822" fill="#34D399" font-size="11" font-weight="700">• 双分母均值：n=184 矩阵均值 371.0ms | n=42 本体均值 327.5ms (Scenario AP = 20ms)</text>
</svg>
