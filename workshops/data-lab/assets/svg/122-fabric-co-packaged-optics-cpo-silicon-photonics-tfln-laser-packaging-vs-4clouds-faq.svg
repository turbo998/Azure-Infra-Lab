  <!-- Header -->
  <rect x="40" y="34" width="1360" height="88" rx="14" fill="#111F3A" stroke="#F59E0B" stroke-width="2.2"/>
  <rect x="58" y="48" width="350" height="26" rx="13" fill="url(#gold122)"/>
  <text x="233" y="66" fill="#040814" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="0.8">🏆 R114 · 500-SCENARIO HALF-MILLENNIUM MILESTONE!</text>
  <text x="424" y="66" fill="#F8FAFC" font-size="16" font-weight="800">1.6T/3.2T 共封装光学 (CPO) 薄膜铌酸锂 (TFLN)、微环 DWDM 热解耦与 6-DoF 亚百纳米激光对准 22ms 闭环</text>
  <text x="58" y="100" fill="#94A3B8" font-size="12.5">Scenario DQ · 16 座硅光与 CPO 基地 (540 台 6-DoF 激光对准焊台 + 420 台探针台 + 1,200 套 224G 老化架) × 990K EPS · 3.24 亿向量 (324M!) · 0.76dB 插损 &amp; 0.92dB TDECQ · 省电 65.8%</text>

  <rect x="1146" y="46" width="236" height="64" rx="10" fill="#064E3B" stroke="#F59E0B" stroke-width="2"/>
  <text x="1264" y="68" fill="#FDE68A" font-size="11.5" font-weight="900" text-anchor="middle">499 / 500 = 99.80% (n=500!)</text>
  <text x="1264" y="95" fill="#FFFFFF" font-size="19" font-weight="900" text-anchor="middle">324M Vectors · 22ms</text>

  <!-- Left Column -->
  <rect x="40" y="138" width="430" height="470" rx="14" fill="#131B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · 1.6T/3.2T CPO 三大物理危机与传统死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #18 有源光纤阵列 (FAU) 激光点焊 +185nm 焊后位移</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• 硅光边缘倒锥波导模场仅 3.2μm，双束激光 3.5% 不对称凝固</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 5ms 熔池收缩产生 +185nm 焊后位移 (Post-Weld Shift, PWS)</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 耦合插损从 0.70 dB 暴涨至 2.85 dB (&gt;1.10 dB 报废红线)</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：焊点凝固不可返修，直接连带报废 $18K CoWoS+CPO 模组！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="344" fill="#FCA5A5" font-size="12.5" font-weight="800">② #07 光引擎 8 波长微环 (MRR) 热串扰与 224G 眼图闭合</text>
  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• 硅热光系数大，ASIC 升温使 #3 微环谐振波长漂移 -0.42 nm</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 单路 PID 猛加 TiN 加热器导致 22% 热量串扰烘偏邻居 #2/#4 环</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• 叠加 TFLN 光电折变偏置漂移，224G PAM4 TDECQ 冲至 2.65 dB</text>
  <text x="72" y="424" fill="#F87171" font-size="11" font-weight="700">• 痛点：超出 IEEE 802.3dj 1.40 dB 上限，万卡 GPU AllReduce 丢包！</text>

  <rect x="58" y="466" width="394" height="126" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($250.0K/月 vs $14.1K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：990K EPS 10kHz 压电/光谱/眼图流月费 $178.2K</text>
  <text x="72" y="528" fill="#E2E8F0" font-size="11.5">• 内存税：324M 全内存 DRAM 向量索引月耗 $38.0K</text>
  <text x="72" y="548" fill="#E2E8F0" font-size="11.5">• 刷新税：Snowflake 60s 滞后 / 焊后检测错失焊前预偏置窗口</text>
  <text x="72" y="570" fill="#34D399" font-size="11.5" font-weight="700">• Fabric 破局：$0/GB 写入税 + SSD DiskANN 省 92% 内存</text>

  <!-- Center Column -->
  <rect x="488" y="138" width="494" height="470" rx="14" fill="#0D1F33" stroke="#F59E0B" stroke-width="2.2"/>
  <text x="508" y="168" fill="#FDE68A" font-size="14.5" font-weight="800">02 · Microsoft Fabric 22ms CPO 光电合封闭环 (n=500!)</text>

  <!-- Step 1 -->
  <rect x="508" y="184" width="454" height="96" rx="10" fill="#112A45" stroke="#06B6D4" stroke-width="1.4"/>
  <text x="524" y="205" fill="#67E8F9" font-size="12.5" font-weight="800">STEP 1 · Eventhouse KQL 990K EPS 焊偏与微环感知 (5 ms)</text>
  <text x="524" y="225" fill="#F8FAFC" font-size="11.5">• $0/GB 写入税摄入 540 台激光对准焊台、420 台探针台与 BERT 流</text>
  <text x="524" y="244" fill="#CBD5E1" font-size="11">• series_fit_line() 5ms 预判 #18 焊台不对称应力将致 +185nm 焊偏</text>
  <text x="524" y="263" fill="#34D399" font-size="11" font-weight="700">• 同时捕获 #07 引擎微环 #3 漂移 -0.42nm (224G TDECQ=2.65 dB)</text>

  <!-- Step 2 -->
  <rect x="508" y="292" width="454" height="104" rx="10" fill="#132F2B" stroke="#10B981" stroke-width="1.8"/>
  <text x="524" y="313" fill="#6EE7B7" font-size="12.5" font-weight="800">STEP 2 · 6 跳硅光孪生 &amp; 3.24 亿向量 SSD DiskANN 检索 (6 ms)</text>
  <text x="524" y="333" fill="#F8FAFC" font-size="11.5">• 检索 324,000,000 (🏆 500场景半千大关!) FDTD、PWS 与逆热矩阵向量</text>
  <text x="524" y="352" fill="#CBD5E1" font-size="11">• 相似度 0.99 (省 92% 内存)：焊前压电反相预偏置 (-172nm X, +48nm Y)</text>
  <text x="524" y="371" fill="#FDE68A" font-size="11" font-weight="700">• 左束激光能量 -3.8% 平衡凝固 + 8×8 逆热阻雅可比矩阵协同解耦电流</text>

  <!-- Step 3 -->
  <rect x="508" y="408" width="454" height="90" rx="10" fill="#172554" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="524" y="429" fill="#93C5FD" font-size="12.5" font-weight="800">STEP 3 · Foundry IQ OIF CPO 与 IEEE 802.3dj 护栏 SOP-121 (6 ms)</text>
  <text x="524" y="449" fill="#F8FAFC" font-size="11.5">• 校验激光点焊凝固回弹至中心：残余位移 32nm，插损 0.76 dB &lt;= 1.10</text>
  <text x="524" y="468" fill="#CBD5E1" font-size="11">• 8 波长 DWDM 谐振误差锁死 ±0.008 nm，224G PAM4 TDECQ=0.92 dB</text>
  <text x="524" y="485" fill="#34D399" font-size="11" font-weight="700">• 光互连比特能效降至 3.2 pJ/bit (较可插拔光模块省电 -65.8%)</text>

  <!-- Step 4 -->
  <rect x="508" y="510" width="454" height="84" rx="10" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.4"/>
  <text x="524" y="531" fill="#C4B5FD" font-size="12.5" font-weight="800">STEP 4 · Teams 硅光总监确认 + ALDO 边缘 + 绿色算力证 (5 ms)</text>
  <text x="524" y="551" fill="#F8FAFC" font-size="11.5">• 洁净室 ALDO 边缘下发 EtherCAT 压电预偏置与微环 DAC 电流矩阵</text>
  <text x="524" y="570" fill="#34D399" font-size="11" font-weight="700">• 1GB 免费 SQL 签发 OIF CPO 零缺陷与 3.2pJ/bit 绿色护照 (22ms!)</text>

  <!-- Right Column -->
  <rect x="1000" y="138" width="400" height="470" rx="14" fill="#111C33" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="1020" y="168" fill="#60A5FA" font-size="14.5" font-weight="800">03 · 定量基准与五云零拷贝协同 (R114)</text>

  <rect x="1018" y="184" width="364" height="142" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="1032" y="206" fill="#34D399" font-size="12.5" font-weight="800">月度 TCO 对比 (省 94.4% · 净省 $235.9K/月!)</text>
  <text x="1032" y="228" fill="#F8FAFC" font-size="11.5">• Microsoft Fabric 归一化：  $14,100 / 月 (基准最优)</text>
  <rect x="1032" y="234" width="52" height="10" rx="5" fill="#10B981"/>
  <text x="1032" y="258" fill="#CBD5E1" font-size="11.5">• 四云拼装栈归一化：         $250,000 / 月 (贵 17.7x)</text>
  <rect x="1032" y="264" width="320" height="10" rx="5" fill="#EF4444"/>
  <text x="1032" y="290" fill="#93C5FD" font-size="11">• 集团全量专用容量 (16 基地)：$40.6K vs $688.0K/月</text>
  <text x="1032" y="310" fill="#FDE68A" font-size="11.5" font-weight="800">• 守护 SLA 风险敞口：        $39,000,000 ($39M 整数大关!)</text>

  <rect x="1018" y="338" width="364" height="126" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1032" y="360" fill="#FDE68A" font-size="12.5" font-weight="900">🏆 500 场景半千大关基准 (sealed report.json R114)</text>
  <text x="1032" y="382" fill="#FFFFFF" font-size="12" font-weight="800">• 路由评估矩阵 (n=500 大关!)：499 / 500 (99.80% 准确率!)</text>
  <text x="1032" y="402" fill="#34D399" font-size="11.5" font-weight="700">• 分母 A 路由矩阵算术均值：   158.0 ms (-1.0ms!)</text>
  <text x="1032" y="422" fill="#34D399" font-size="11.5" font-weight="700">• 分母 B 121大行业本体均值：  142.0 ms (-1.0ms!)</text>
  <text x="1032" y="442" fill="#CBD5E1" font-size="11">• Python 确定性单测套件：    246 / 246 (100% 通过)</text>

  <rect x="1018" y="476" width="364" height="118" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="1032" y="498" fill="#67E8F9" font-size="12.5" font-weight="800">Better Together 跨云零拷贝黄金分工</text>
  <text x="1032" y="518" fill="#E2E8F0" font-size="11">• Azure HPC / Databricks：3D FDTD 电磁波导 &amp; 激光熔池 FEM</text>
  <text x="1032" y="538" fill="#E2E8F0" font-size="11">• Snowflake / SAP：SOI/TFLN 晶圆、InP 激光器与交换机 ERP</text>
  <text x="1032" y="558" fill="#34D399" font-size="11" font-weight="700">• Fabric：OneLake 零拷贝挂载 + 22ms 洁净室实时控制面</text>
  <text x="1032" y="578" fill="#94A3B8" font-size="10.5">• 官方规格引用：117 条 (新增 SPEC-CPO-SILICON-PHOTONICS-R114)</text>

  <!-- Bottom Strip -->
  <rect x="40" y="624" width="1360" height="240" rx="14" fill="#0E192D" stroke="#2563EB" stroke-width="1.5"/>
  <text x="60" y="654" fill="#60A5FA" font-size="14.5" font-weight="800">04 · 1.6T/3.2T 共封装光学 (CPO) 有源对准、微环解耦与 TFLN 调制三大物理护栏矩阵 (SOP-121 · 500-Scenario Milestone)</text>

  <rect x="60" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="76" y="694" fill="#67E8F9" font-size="13" font-weight="800">① 6-DoF 有源光纤阵列 (FAU) 反相预偏置激光点焊</text>
  <text x="76" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：高斯模场重叠 ΔIL ≈ 4.34·(Δr/w0)²，w0=1.6μm</text>
  <text x="76" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：焊点不对称凝固收缩产生 +185nm PWS (插损 2.85dB)</text>
  <text x="76" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：焊前压电预偏置 (-172nm, +48nm) + 左束激光 -3.8%</text>
  <text x="76" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：焊后残余位移 32nm &lt;= 80nm，耦合插损 0.76 dB</text>
  <text x="76" y="800" fill="#94A3B8" font-size="11">• 良率保护：100% 杜绝因光口焊偏连带报废 $18K 算力模组</text>

  <rect x="506" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#10B981" stroke-width="1.2"/>
  <text x="522" y="694" fill="#6EE7B7" font-size="13" font-weight="800">② 8 波长微环 (MRR) 逆雅可比矩阵热串扰解耦</text>
  <text x="522" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：Δλ = J_thermal · P，非对角元热串扰高达 22%</text>
  <text x="522" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：#3 微环漂移 -0.42nm 引发全阵列失锁 (TDECQ=2.65dB)</text>
  <text x="522" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：注入逆矩阵 ΔP = J_thermal⁻¹·Δλ 前馈对冲邻居温升</text>
  <text x="522" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：8 波长误差锁死 ±0.008nm，224G TDECQ=0.92 dB</text>
  <text x="522" y="800" fill="#94A3B8" font-size="11">• 调制稳健：TFLN 光电折变偏置零漂移，Pre-FEC BER=4.2e-6</text>

  <rect x="952" y="670" width="428" height="174" rx="10" fill="#091326" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="968" y="694" fill="#FBBF24" font-size="13" font-weight="800">③ 吉瓦级 AIDC 3.2 pJ/bit 绿色光互连数字护照</text>
  <text x="968" y="716" fill="#E2E8F0" font-size="11.5">• 能效跃迁：CPO 3.2 pJ/bit vs 传统可插拔 OSFP 11.5 pJ/bit</text>
  <text x="968" y="736" fill="#E2E8F0" font-size="11.5">• 机柜省电：光互连功耗直降 -65.8%，释放更多功率给 GPU</text>
  <text x="968" y="756" fill="#E2E8F0" font-size="11.5">• 可靠性：外置激光源 (ELS) 热插拔与盲插 MPO 全链路溯源</text>
  <text x="968" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：1GB 免费 SQL 签发 OIF CPO 与绿色算力护照</text>
  <text x="968" y="800" fill="#FDE68A" font-size="11" font-weight="700">• 半千大关：499/500 = 99.80% · 22ms 闭环 · 省 94.4% TCO</text>
