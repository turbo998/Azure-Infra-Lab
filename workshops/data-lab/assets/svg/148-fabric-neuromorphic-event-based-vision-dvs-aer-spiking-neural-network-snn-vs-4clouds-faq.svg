  <text x="64" y="196" fill="#94A3B8" font-size="12">18 Autonomy Hubs · 18,000 3D Vision Pods · 720 AER Concentrators · 9,000 Users</text>

  <rect x="62" y="212" width="384" height="142" rx="10" fill="#111C33" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="78" y="236" fill="#FDA4AF" font-size="13.5" font-weight="800">⚠️ 痛点 1：镜面眩光 82.4 MEPS 背景脉冲雪崩 (BAN) 死锁</text>
  <text x="78" y="258" fill="#E2E8F0" font-size="12">• 每个像素在对数光强变化 |Δln I| &gt; θ 时异步发射 1μs AER 脉冲</text>
  <text x="78" y="278" fill="#E2E8F0" font-size="12">• 阳光水面反射与暗电流触发 82.4 MEPS 噪声风暴，AER 总线冲至 94.8%</text>
  <text x="78" y="298" fill="#E2E8F0" font-size="12">• 突破 45.0% 仲裁上限导致行列死锁丢包，高速无人机致盲 ($48.10M)</text>
  <text x="78" y="320" fill="#FB7185" font-size="11.5" font-weight="700">❌ 30fps 帧视频回传与 Snowflake 60s 延迟无法秒级调节偏置 DAC</text>

  <rect x="62" y="368" width="384" height="142" rx="10" fill="#111C33" stroke="#F59E0B" stroke-width="1.2"/>
