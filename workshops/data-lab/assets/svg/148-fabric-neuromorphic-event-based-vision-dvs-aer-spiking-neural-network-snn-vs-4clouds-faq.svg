  <text x="64" y="756" fill="#E2E8F0" font-size="12.5">1. 离线替代梯度 BPTT 训练归 HPC/Databricks，在线 51ms 调参归 Fabric：将 Surrogate-Gradient SNN 训练与 RRAM 导电细丝朗之万模拟留在 Azure HPC / Databricks GPU，</text>
