  <text x="78" y="414" fill="#E2E8F0" font-size="12">• 底层存算一体 RRAM 交叉阵列氧空位导电细丝发生亚阈值弛豫漂移</text>
  <text x="78" y="434" fill="#E2E8F0" font-size="12">• SNN 积分发放 (LIF) 神经元高速障碍物召回率从 99.42% 跌至 81.6%</text>
  <text x="78" y="454" fill="#E2E8F0" font-size="12">• 跌破 ISO 21448 SOTIF 98.50% 安全红线，威胁低空走廊与产线安全</text>
  <text x="78" y="476" fill="#FBBF24" font-size="11.5" font-weight="700">❌ AWS SiteWise 995K EPS 按属性计费高达 $210,680/月</text>

