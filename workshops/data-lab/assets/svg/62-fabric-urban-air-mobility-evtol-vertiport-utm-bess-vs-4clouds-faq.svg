  <!-- Header Banner -->
  <rect x="32" y="24" width="1376" height="92" rx="14" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.5"/>
  <rect x="48" y="42" width="186" height="28" rx="6" fill="url(#hdrGrad62)"/>
  <text x="141" y="61" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">DATA LAB · ROUND 54 FAQ</text>
  <text x="250" y="62" fill="#F8FAFC" font-size="18.2" font-weight="800">低空经济与城市空中交通 (UAM 4,200架eVTOL + 180座Vertiport 860K EPS 风切变改航与4C超充) 选型：Fabric vs 四大云</text>
  <text x="48" y="94" fill="#94A3B8" font-size="12.5">4,200 架 eVTOL + 180 座起降场 · Eventhouse H3 (13ms) + SSD DiskANN 8,400万城市风场/EIS匹配 (15ms) + 空地孪生 + ALDO 楼顶边缘 · 55ms 闭环省 88.1% TCO</text>
  <rect x="1204" y="38" width="186" height="64" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1297" y="62" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BI · 259/260 (99.62%)</text>
  <text x="1297" y="86" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">55ms · 省 88.1% TCO</text>

  <!-- Left Column: First-Principles Pain Points -->
  <rect x="32" y="132" width="436" height="360" rx="14" fill="#111C33" stroke="#F43F5E" stroke-width="1.4"/>
  <text x="52" y="162" fill="#FDA4AF" font-size="15" font-weight="800">01 · 传统城市低空 UAM 与起降场三大致命痛点 ($184.8K/月)</text>

  <rect x="48" y="178" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 摩天大楼“城市峡谷下洗风切变 (11.2m/s)”致倾转失速</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 高楼背风面卡门涡街袭击正处于旋翼-固定翼倾转过渡的 eVTOL</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 传统分钟级气象格点无法感知百米级楼宇微尺度下沉涡流</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 倾转过渡段失速与低空走廊瘫痪直接威胁 $8.40M 资产与营收</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="302" fill="#FB7185" font-size="13" font-weight="700">② 楼顶 Vertiport 占坪引发“空中悬停排队把电耗光”</text>
  <text x="62" y="322" fill="#E2E8F0" font-size="11.5">• 悬停耗电高达巡航 5 倍！前机占坪 3 分钟即令后方排队机跌破 18% SoC</text>
  <text x="62" y="340" fill="#E2E8F0" font-size="11.5">• 缺乏 8,400万条城市 LES 风场与电芯 EIS 阻抗向量毫秒级联动</text>
  <text x="62" y="358" fill="#FCA5A5" font-size="11" font-weight="700">✗ 860K EPS 遥测与全内存风场/电化学向量集群月烧 $138.8K</text>

  <rect x="48" y="382" width="404" height="94" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="404" fill="#FB7185" font-size="13" font-weight="700">③ 800V/4C 兆瓦超充负极析锂内短路与楼顶断网风险</text>
  <text x="62" y="424" fill="#E2E8F0" font-size="11.5">• 8 分钟快充翻台下若不按阻抗动态降流，锂枝晶将刺穿航空电池隔膜</text>
  <text x="62" y="442" fill="#E2E8F0" font-size="11.5">• 180 座高层楼顶起降场在暴雨断网时无法靠纯云端引导盲降</text>
  <text x="62" y="460" fill="#FCA5A5" font-size="11" font-weight="700">✗ 固态航空电池报废与 EASA SC-VTOL 适航风险高达 $9.60M</text>

  <!-- Center Column: Fabric 55ms Closed-Loop Architecture -->
  <rect x="486" y="132" width="484" height="360" rx="14" fill="#0F2238" stroke="#10B981" stroke-width="1.8"/>
  <text x="506" y="162" fill="#6EE7B7" font-size="15" font-weight="800">02 · Microsoft Fabric 空地一体 55ms 自愈与适航闭环</text>

  <rect x="504" y="178" width="448" height="68" rx="9" fill="#0B192C" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="518" y="199" fill="#38BDF8" font-size="12.5" font-weight="800">Step 1 (13ms) · Eventhouse KQL H3 860K EPS 风切变与占坪感知</text>
  <text x="518" y="218" fill="#E2E8F0" font-size="11.2">• $0/GB 写入税执行 H3 三维网格连接，锁定 CBD 350m 11.2m/s 下洗涡流</text>
  <text x="518" y="235" fill="#93C5FD" font-size="11">• 同步捕获 16 架进港机悬停失电风险与 24 台 4C 超充桩极化阻抗抬头</text>

  <rect x="504" y="254" width="448" height="72" rx="9" fill="#0B192C" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="518" y="275" fill="#C4B5FD" font-size="12.5" font-weight="800">Step 2 (15ms) · SSD DiskANN 8,400万风场/EIS匹配与巡航分流</text>
  <text x="518" y="294" fill="#E2E8F0" font-size="11.2">• 检索 8,400万 LES/EIS 向量 (0.99 相似，省92%内存)：28 机绕楼 +450m/+120m</text>
  <text x="518" y="312" fill="#DDD6FE" font-size="11">• 16 机在巡航段提前平飞分流至 2.4km 备降场 + 24 台超充桩降至 2.6C</text>

  <rect x="504" y="334" width="448" height="68" rx="9" fill="#0B192C" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="518" y="355" fill="#FDE68A" font-size="12.5" font-weight="800">Step 3 (14ms) · Foundry IQ EASA SC-VTOL 与防析锂护栏</text>
  <text x="518" y="374" fill="#E2E8F0" font-size="11.2">• 核验 SOP-061：落地备用电量 SoC = 22.4% &gt;= 18.0% + 噪声 61.4 &lt;= 62dBA</text>
  <text x="518" y="391" fill="#FDE68A" font-size="11">• 确认 2.6C 阶梯快充下负极电位 +0.065V &gt; +0.040V vs Li/Li+ 零析锂</text>

  <rect x="504" y="410" width="448" height="68" rx="9" fill="#064E3B" stroke="#10B981" stroke-width="1.4"/>
  <text x="518" y="431" fill="#6EE7B7" font-size="12.5" font-weight="800">Step 4 (13ms) · ALDO 楼顶边缘 C2 改航上注与超充 BMS 调流</text>
  <text x="518" y="450" fill="#F8FAFC" font-size="11.2">• 低空 UTM 主任 Teams 联签 Confirm → ALDO 下发 C2 航路与 BMS 曲线</text>
  <text x="518" y="467" fill="#A7F3D0" font-size="11" font-weight="700">✓ 端到端 55ms 自愈 · 守护 $18.00M 飞行安全、航空电池与适航准入 SLA</text>

  <!-- Right Column: Better Together & Decision Matrix -->
  <rect x="988" y="132" width="420" height="360" rx="14" fill="#111C33" stroke="#38BDF8" stroke-width="1.4"/>
  <text x="1008" y="162" fill="#7DD3FC" font-size="15" font-weight="800">03 · 五云分工边界与 Better Together 共存</text>

  <rect x="1004" y="178" width="388" height="94" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="1018" y="200" fill="#34D399" font-size="12.5" font-weight="800">🏆 首选 Microsoft Fabric (Eventhouse H3 + DiskANN + ALDO)</text>
  <text x="1018" y="220" fill="#E2E8F0" font-size="11.2">• 860K EPS 12 旋翼飞控、测风激光雷达与超充流 ($0/GB 写入税)</text>
  <text x="1018" y="238" fill="#E2E8F0" font-size="11.2">• 8,400万 LES 风场/EIS SSD DiskANN + 走廊-起降坪-超充孪生</text>
  <text x="1018" y="256" fill="#6EE7B7" font-size="11" font-weight="700">• 180 座楼顶 ALDO 断网自治 + 1,650 人 $0 DirectLake 看数</text>

  <rect x="1004" y="282" width="388" height="94" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="1018" y="304" fill="#60A5FA" font-size="12.5" font-weight="800">🤝 Better Together：CycleCloud HPC + Databricks GPU</text>
  <text x="1018" y="324" fill="#E2E8F0" font-size="11.2">• 城市建筑群百米级大涡模拟 (PALM-4U LES CFD) → CycleCloud HPC</text>
  <text x="1018" y="342" fill="#E2E8F0" font-size="11.2">• 机载视觉-激光雷达自主盲降大模型 → Databricks GPU</text>
  <text x="1018" y="360" fill="#93C5FD" font-size="11" font-weight="700">• 三维楼宇尾流张量与模型权重通过 OneLake Shortcut 零拷贝回挂</text>

  <rect x="1004" y="386" width="388" height="90" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1018" y="408" fill="#FBBF24" font-size="12.5" font-weight="800">⚠️ 竞对局限与避坑指南 (Anti-Patterns)</text>
  <text x="1018" y="428" fill="#E2E8F0" font-size="11.2">• 严禁让 eVTOL 在楼顶上空高功耗悬停排队导致备用电量 &lt;18%</text>
  <text x="1018" y="446" fill="#E2E8F0" font-size="11.2">• 严禁在极化阻抗升高时强推 4.0C 满倍率导致固态电池析锂</text>
  <text x="1018" y="464" fill="#FDE68A" font-size="11" font-weight="700">• 严禁将 4,200 架 eVTOL 12 旋翼高频流写入按属性计费的 SiteWise</text>

  <!-- Bottom Row Left: Quantitative TCO Comparison -->
  <rect x="32" y="510" width="684" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="52" y="540" fill="#38BDF8" font-size="15" font-weight="800">04 · 定量 TCO 对比 (4,200 架 eVTOL + 180 座 Vertiport · 860K EPS · 1,650 用户)</text>

  <rect x="52" y="558" width="644" height="68" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="68" y="582" fill="#6EE7B7" font-size="13.5" font-weight="800">🏆 Microsoft Fabric (F64 + Eventhouse H3 + SSD DiskANN + Twin + ALDO)</text>
  <text x="68" y="606" fill="#E2E8F0" font-size="12">内部全量: $22,000/月 · 500人归一化: $9,500/月 ($0/GB 写入税 + SSD DiskANN 省92%内存 + $0 Viewer)</text>
  <rect x="520" y="570" width="160" height="42" rx="8" fill="#022C22"/>
  <text x="600" y="596" fill="#34D399" font-size="15" font-weight="800" text-anchor="middle">省 88.1% TCO</text>

  <rect x="52" y="638" width="644" height="58" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="68" y="662" fill="#F8FAFC" font-size="13" font-weight="700">Databricks + 独立时空/时序库 + 内存 Vector Search</text>
  <text x="68" y="683" fill="#94A3B8" font-size="11.5">内部全量: $147,600/月 · 500人归一化: $63,700/月 (常驻 Streaming DBU + 内存向量节点 + BI 消耗)</text>

  <rect x="52" y="706" width="644" height="58" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="68" y="730" fill="#F8FAFC" font-size="13" font-weight="700">AWS 拼接栈 (IoT SiteWise + Kinesis + OpenSearch + QuickSight)</text>
  <text x="68" y="751" fill="#94A3B8" font-size="11.5">内部全量: $184,800/月 · 500人归一化: $79,800/月 (按消息/属性计费 + 内存向量 + 1,650人BI席位)</text>

  <rect x="52" y="774" width="644" height="74" rx="10" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="68" y="798" fill="#7DD3FC" font-size="12.5" font-weight="800">💡 $18.00M 风险敞口保护拆解 (Scenario BI 定量收益)：</text>
  <text x="68" y="818" fill="#E2E8F0" font-size="11.5">• 28机避涡改航与 16机巡航分流防悬停失电：$8.40M · 24台超充降流护电池：$5.70M</text>
  <text x="68" y="836" fill="#6EE7B7" font-size="11.5" font-weight="700">• 100% 满足 EASA SC-VTOL (SoC&gt;=18%) 与城市低噪声 (&lt;=62dBA) 准入：$3.90M</text>

  <!-- Bottom Row Right: Dual-Denominator & Production Checklist -->
  <rect x="734" y="510" width="674" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="754" y="540" fill="#FBBF24" font-size="15" font-weight="800">05 · 双分母基准对账 (R54) 与生产落地核验清单 (Architect Checklist)</text>

  <rect x="754" y="556" width="634" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="770" y="578" fill="#34D399" font-size="12.5" font-weight="800">📊 严格区分两大延迟分母 (Dual-Denominator Reconciliation · 2026-11-14 R54)</text>
  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=260 (DL-01..260) 均值 = 279.5 ms (259/260 = 99.62%)</text>
  <text x="770" y="618" fill="#F8FAFC" font-size="11.5">• 分母 B (行业本体端到端仿真均值 ontology_simulations[])：n=61 (场景 A..BI，范围 5–780ms) 均值 = 235.0 ms</text>
  <text x="770" y="636" fill="#93C5FD" font-size="11">• 本轮新增 Scenario BI 端到端延迟 = 55 ms (13ms H3感知 + 15ms DiskANN/孪生 + 14ms SC-VTOL护栏 + 13ms 回写) · 126/126 单测通过</text>

  <rect x="754" y="658" width="634" height="190" rx="10" fill="#0B192C" stroke="#334155" stroke-width="1"/>
  <text x="770" y="682" fill="#7DD3FC" font-size="13" font-weight="800">🛠️ 售前打单与生产落地 5 步核验清单 (Production Checklist)：</text>
  <text x="770" y="706" fill="#E2E8F0" font-size="11.5">☑ 1. eVTOL 与测风雷达流直通：860K EPS 遥测直推 Eventhouse H3 ($0/GB 写入税)</text>
  <text x="770" y="730" fill="#E2E8F0" font-size="11.5">☑ 2. Cosmos SSD DiskANN 8,400万风场/EIS库：城市 LES 与电池阻抗建索引 (&lt; 15ms)</text>
  <text x="770" y="754" fill="#E2E8F0" font-size="11.5">☑ 3. 走廊-起降坪-超充桩数字孪生：在 Digital Twin Builder 实时同步坪位与 ETA</text>
  <text x="770" y="778" fill="#E2E8F0" font-size="11.5">☑ 4. 180 座楼顶 Vertiport ALDO 自治：部署 SQL Server on Azure Local 保障盲降</text>
  <text x="770" y="802" fill="#E2E8F0" font-size="11.5">☑ 5. 适航与电池护栏 (SOP-061)：落地 SoC &gt;= 18%，噪声 &lt;= 62dBA，负极 &gt; +0.04V</text>
  <text x="770" y="830" fill="#6EE7B7" font-size="11" font-weight="700">🔗 关联代码与密封证据：src/data_lab/benchmark_suite.py · tests/test_data_lab.py (126/126) · reports/report.json</text>
