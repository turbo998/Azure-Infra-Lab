  <text x="1106" y="262" fill="#38bdf8" font-size="28" font-weight="800" text-anchor="middle">48 ms</text>
  <text x="1106" y="284" fill="#7dd3fc" font-size="11" text-anchor="middle">12 + 12 + 12 + 12ms 四步对称!</text>

  <rect x="1206" y="206" width="176" height="92" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
