  <text x="1020" y="192" fill="#94a3b8" font-size="12">历史性 150-Ontology (n=150!)、440M 向量、&gt;$290K/mo 净省与 &gt;$49M SLA</text>

  <rect x="1018" y="206" width="176" height="92" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
