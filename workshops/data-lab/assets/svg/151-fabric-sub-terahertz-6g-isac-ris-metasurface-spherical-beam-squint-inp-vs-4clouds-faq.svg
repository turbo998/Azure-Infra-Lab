  <text x="330" y="728" fill="#34d399" font-size="12" font-weight="700">✅ Foundry IQ 12ms + ALDO RIC 12ms (48ms)</text>
  <text x="615" y="728" fill="#fcd34d" font-size="12">⚠️ 无原生 O-RAN Near-RT RIC 边缘控制面</text>
