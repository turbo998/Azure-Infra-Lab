    <linearGradient id="bgGrad151" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accentGrad151" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad151" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c35" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a1122" stop-opacity="0.95"/>
