      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="url(#bgGrad151)"/>
  <rect x="20" y="18" width="1400" height="864" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="40" y="34" width="1360" height="94" rx="12" fill="url(#cardGrad151)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow151)"/>
  <rect x="56" y="48" width="330" height="26" rx="13" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
  <text x="221" y="65" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">ROUND 143 · HISTORIC 150-ONTOLOGY (n=150!) &amp; 440M VECTORS</text>
  <text x="404" y="66" fill="#f8fafc" font-size="20" font-weight="800">Sub-Terahertz 6G (140–300GHz ISAC) &amp; 10,240-Element RIS Near-Field Spherical Loop</text>
  <text x="56" y="95" fill="#cbd5e1" font-size="13.5">亚太赫兹 6G 通感算一体与可重构智能超表面：42ps 真延时 (TTD) 波束斜视补偿、3-Bit RIS 互耦消栅瓣、0.38mm 雷达感知与 48ms 闭环</text>
  <text x="56" y="116" fill="#34d399" font-size="12.5" font-weight="700">995K EPS $0/GB Write Tax · 440M (0.44B) SSD DiskANN (-92% RAM) · 48ms E2E (12+12+12+12ms) · 122.5ms Ontology Mean (n=150) · 135.5ms Matrix Mean (615/616 = 99.84%)</text>

  <!-- Left Column: First-Principles Physics & 3 Failure Modes -->
  <rect x="40" y="144" width="430" height="390" rx="12" fill="url(#cardGrad151)" stroke="#ef4444" stroke-width="1.4"/>
  <text x="60" y="172" fill="#f87171" font-size="15" font-weight="800">① 140GHz D-Band Near-Field &amp; Legacy Cloud Pain Points</text>
  <text x="60" y="192" fill="#94a3b8" font-size="12">24 座 6G ISAC 园区 (960 基站 / 1,920 RIS / 4,800 AGV) 三大物理与成本死穴</text>

  <rect x="58" y="206" width="394" height="96" rx="8" fill="#1e1b2e" stroke="#f87171" stroke-width="1"/>
  <text x="72" y="226" fill="#fca5a5" font-size="13" font-weight="700">死穴 1：28GHz 超宽带近场“波束分裂 (Beam Split)” (-14.8 dB)</text>
  <text x="72" y="246" fill="#e2e8f0" font-size="11.5">• 140GHz (λ=2.14mm) 孔径 0.35m 瑞利距离达 114m，全车间处于菲涅尔近场</text>
  <text x="72" y="264" fill="#e2e8f0" font-size="11.5">• 28GHz 带宽下纯移相器令高低子载波径向焦距偏移 ±1.85m，增益暴跌 -14.8dB</text>
  <text x="72" y="282" fill="#fca5a5" font-size="11.5" font-weight="600">• 传统 60s 流表/慢速 SMO 轮询无法在 12ms 内重构 True-Time-Delay (TTD)</text>

  <rect x="58" y="312" width="394" height="96" rx="8" fill="#1e1b2e" stroke="#fb923c" stroke-width="1"/>
  <text x="72" y="332" fill="#fdba74" font-size="13" font-weight="700">死穴 2：AGV 8ms 视距阻挡与 10,240 元 RIS 寄生栅瓣 (-11 dBc)</text>
  <text x="72" y="352" fill="#e2e8f0" font-size="11.5">• AGV 金属立柱遮挡 140GHz 直达视距 (LoS) 时，8ms 内衰减 &gt;35 dB 掉线</text>
  <text x="72" y="370" fill="#e2e8f0" font-size="11.5">• 盲切墙面 10,240 单元变容管 RIS 未补偿互耦与相位量化，激发出 -11dBc 栅瓣</text>
  <text x="72" y="388" fill="#fdba74" font-size="11.5" font-weight="600">• 强镜面栅瓣直接淹没同频 ISAC 雷达微多普勒回波，定位误差恶化至 6.80mm</text>

  <rect x="58" y="418" width="394" height="100" rx="8" fill="#1e1b2e" stroke="#facc15" stroke-width="1"/>
  <text x="72" y="438" fill="#fde047" font-size="13" font-weight="700">死穴 3：995K EPS 流写入税与 4.40 亿 (440M) 全内存码本天价</text>
  <text x="72" y="458" fill="#e2e8f0" font-size="11.5">• 995K EPS 近场球面 CSI + 微多普勒流按属性写入云端月烧 $214,940/月</text>
  <text x="72" y="476" fill="#e2e8f0" font-size="11.5">• 4.40 亿条 (440M) 菲涅尔 (r,θ,φ) 球面聚焦与 RIS 互耦向量全放 DRAM 需 $52,240/月</text>
  <text x="72" y="494" fill="#fde047" font-size="11.5" font-weight="600">• 拼接云总账单高达 $305,200/月，且 LLM Token 调参存在严重雷达致盲风险</text>

  <!-- Center Column: Fabric 48ms Closed-Loop Architecture -->
  <rect x="488" y="144" width="494" height="390" rx="12" fill="url(#cardGrad151)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="508" y="172" fill="#38bdf8" font-size="15" font-weight="800">② Microsoft Fabric 48ms Sub-THz 6G ISAC &amp; RIS Loop</text>
  <text x="508" y="192" fill="#94a3b8" font-size="12">12ms 感知 + 12ms 440M 向量召回 + 12ms 物理护栏 + 12ms ALDO RIC 边缘下发</text>

  <!-- Step 1 -->
  <rect x="506" y="206" width="458" height="72" rx="8" fill="#0f2942" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="520" y="225" fill="#7dd3fc" font-size="12.5" font-weight="700">Step 1 (12ms) · Eventhouse KQL 995K EPS 球面波分裂与微多普勒感知 ($0/GB 税)</text>
  <text x="520" y="244" fill="#e2e8f0" font-size="11.3">• series_fit_line() + series_fft() 实时解析 960 基站球面 CSI 与 4,800 AGV 微多普勒谱图</text>
  <text x="520" y="261" fill="#34d399" font-size="11.3" font-weight="600">• 12ms 锁定 Sector-DBand-19 -14.8dB 宽带波束分裂与 AGV 12ms 视距阻挡前兆，省 $214.9K/mo</text>

  <!-- Step 2 -->
  <rect x="506" y="286" width="458" height="72" rx="8" fill="#172554" stroke="#818cf8" stroke-width="1.2"/>
  <text x="520" y="305" fill="#a5b4fc" font-size="12.5" font-weight="700">Step 2 (12ms) · Fabric IQ 6-Hop 本体 + Cosmos DB 440M SSD DiskANN (-92% RAM)</text>
  <text x="520" y="324" fill="#e2e8f0" font-size="11.3">• OneLake 零拷贝挂载 Sionna 菲涅尔球面波码本 + Zero-ETL 镜像 Snowflake 6G 切片 ERP</text>
  <text x="520" y="341" fill="#34d399" font-size="11.3" font-weight="600">• 12ms 召回 (0.99 相似度)：42ps 开关 LC 真延时 (TTD) + RIS-08 3-Bit 球面聚焦偏置矩阵</text>

  <!-- Step 3 -->
  <rect x="506" y="366" width="458" height="72" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
  <text x="520" y="385" fill="#6ee7b7" font-size="12.5" font-weight="700">Step 3 (12ms) · Foundry IQ 确定性护栏 (SUB-THZ-6G-ISAC-RIS-BEAM-SQUINT-SOP-150)</text>
  <text x="520" y="404" fill="#e2e8f0" font-size="11.3">• 严禁 RIS 栅瓣 &gt; -22.0 dBc 或吞吐 &lt; 100.0 Gbps 时切换反射路径，要求感知误差 &lt;= 1.00 mm</text>
  <text x="520" y="421" fill="#fde047" font-size="11.3" font-weight="600">• 校验通过：增益恢复 +14.4dB (吞吐 112.4Gbps) · ISAC 精度 0.38mm · 栅瓣 -28.5dBc</text>

  <!-- Step 4 -->
  <rect x="506" y="446" width="458" height="72" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="520" y="465" fill="#fcd34d" font-size="12.5" font-weight="700">Step 4 (12ms) · Teams 首席架构师卡片 + ALDO Near-RT RIC 边缘 + 3GPP ISAC 护照</text>
  <text x="520" y="484" fill="#e2e8f0" font-size="11.3">• SQL on Azure Local (ALDO) 12ms 下发 E2SM-RC TTD 延时表与 10,240 元 RIS FPGA 偏置 LUT</text>
  <text x="520" y="501" fill="#34d399" font-size="11.3" font-weight="600">• 0.0ms 无损切换 + SDS 签发 112.4Gbps/0.38mm 3GPP Rel-20 护照至 1GB 免费 SQL (48ms E2E!)</text>

