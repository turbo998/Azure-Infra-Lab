  <text x="1294" y="284" fill="#6ee7b7" font-size="11" text-anchor="middle">$14.2K vs $305.2K (-$291.0K/mo!)</text>

  <rect x="1018" y="310" width="176" height="92" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
  <text x="1106" y="332" fill="#94a3b8" font-size="11.5" text-anchor="middle">SSD DiskANN 球面码本向量</text>
  <text x="1106" y="366" fill="#a5b4fc" font-size="26" font-weight="800" text-anchor="middle">440M</text>
  <text x="1106" y="388" fill="#c7d2fe" font-size="11" text-anchor="middle">4.40 亿向量 · 省 92% DRAM</text>

  <rect x="1206" y="310" width="176" height="92" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="1294" y="332" fill="#94a3b8" font-size="11.5" text-anchor="middle">守护 6G 园区 SLA 价值</text>
  <text x="1294" y="366" fill="#fbbf24" font-size="26" font-weight="800" text-anchor="middle">$49.15M</text>
  <text x="1294" y="388" fill="#fde68a" font-size="11" text-anchor="middle">突破 &gt;$49M 里程碑 · 112.4Gbps/0.38mm</text>

  <rect x="1018" y="414" width="364" height="104" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="1032" y="436" fill="#7dd3fc" font-size="12" font-weight="700">双分母延迟审计披露 (Dual-Denominator Audit):</text>
  <text x="1032" y="458" fill="#e2e8f0" font-size="11.5">• Denominator A (选型矩阵): n = 616 · 准确率 615/616 = 99.84%</text>
  <text x="1032" y="476" fill="#38bdf8" font-size="11.5" font-weight="700">  平均建模延迟 = 135.5 ms (DL-613..616 均为 59ms)</text>
  <text x="1032" y="496" fill="#34d399" font-size="11.5" font-weight="700">• Denominator B (Ontology 闭环): n = 150 (150-Ontology 里程碑!) · 均值 = 122.5 ms</text>

