  <text x="966" y="688" fill="#F8FAFC" font-size="12" font-weight="700">• 评测矩阵得分：311 / 312 (99.68%) · 152/152 单测通过</text>
  <text x="966" y="712" fill="#F8FAFC" font-size="11.5">• 连铸零漏钢：拉速 1.80→0.75 m/min 保持 22s 焊合坯壳 (0 漏钢)</text>
  <text x="966" y="734" fill="#F8FAFC" font-size="11.5">• O5 汽车板防卷渣：EMBr 锁死弯月面波动 ±1.1 mm (&lt;= ±1.5 mm)</text>
  <text x="966" y="756" fill="#F8FAFC" font-size="11.5">• 氢竖炉与电弧炉：海绵铁金属化率 94.8% + EAF 电耗 338 kWh/t</text>
  <text x="966" y="778" fill="#F8FAFC" font-size="11.5">• 欧盟 CBAM 绿钢护照：0.39 tCO2e/t (较传统高炉降碳 81.9%)</text>
  <text x="966" y="812" fill="#34D399" font-size="13" font-weight="800">🛡️ 守护 $22,550,000 连铸零漏钢、O5 汽车板与 CBAM 通关 SLA</text>
