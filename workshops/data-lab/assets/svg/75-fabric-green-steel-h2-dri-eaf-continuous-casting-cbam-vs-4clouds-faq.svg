  <rect x="60" y="54" width="218" height="28" rx="6" fill="url(#accent75)"/>
  <text x="169" y="73" fill="#FFFFFF" font-size="11.8" font-weight="800" text-anchor="middle">2026-11-14 · R67 · 136M VECTORS</text>
  <text x="294" y="72" fill="#F8FAFC" font-size="16.2" font-weight="800">Microsoft Fabric 零碳绿钢冶金（H2-DRI 氢竖炉）、电弧炉泡沫渣、连铸防漏钢与欧盟 CBAM 碳护照 vs 四大云选型一图流</text>
  <text x="60" y="104" fill="#94A3B8" font-size="12.5">16 座绿钢基地 · 32 座氢竖炉 + 48 座 EAF + 64 条连铸机 × 910K EPS · Eventhouse 13ms + SSD DiskANN 14ms 1.36 亿向量 + ALDO = 55ms 闭环 · 省 90.3% TCO ($100.5K/月)</text>
  <rect x="1182" y="50" width="196" height="58" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1280" y="72" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BV · 1.36 亿向量</text>
  <text x="1280" y="96" fill="#F8FAFC" font-size="18" font-weight="800" text-anchor="middle">55ms · 省 90.3% TCO</text>

  <!-- Left Column: Pain Points -->
  <rect x="44" y="140" width="430" height="440" rx="14" fill="#111C33" stroke="#EF4444" stroke-width="1.3"/>
  <text x="64" y="170" fill="#FCA5A5" font-size="15" font-weight="800">❌ 传统 5 秒二级轮询与公有云拼接栈三大痛点</text>

  <rect x="64" y="188" width="390" height="114" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="212" fill="#FECACA" font-size="13" font-weight="700">1. 5 秒二级轮询对连铸“粘结性漏钢”与氢竖炉悬料失明</text>
  <text x="80" y="234" fill="#CBD5E1" font-size="11.5">• 1,540°C 钢水初生坯壳粘结撕裂后，仅 12–16 秒即移出结晶器下口</text>
  <text x="80" y="254" fill="#CBD5E1" font-size="11.5">• 5s 传统轮询错失降速愈合窗口，引发漏钢停产 72h (单次损失 $4.8M)</text>
  <text x="80" y="274" fill="#FCA5A5" font-size="11.5" font-weight="700">• 纯氢竖炉无析碳润滑，还原温飘 +18°C 易致球团烧结悬料停炉</text>

  <rect x="64" y="316" width="390" height="114" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="340" fill="#FECACA" font-size="13" font-weight="700">2. 910K EPS 结晶器 2,400 点 FBG 光纤与 EAF 声学写入税</text>
  <text x="80" y="362" fill="#CBD5E1" font-size="11.5">• 64 条连铸机 FBG 测温 + 48 座 EAF 谐波/声发射 + 竖炉 = 910K EPS</text>
  <text x="80" y="382" fill="#CBD5E1" font-size="11.5">• 公有云 IoT 按属性点/按 GB 双重收费，炼钢强电磁脉冲易致外网闪断</text>
  <text x="80" y="402" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅遥测流摄入与热波重算即月烧 $49,500/月 (Normalized)</text>

  <rect x="64" y="444" width="390" height="120" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="468" fill="#FECACA" font-size="13" font-weight="700">3. 1.36 亿条二维热流映像与氢还原动力学全内存硬件税</text>
  <text x="80" y="490" fill="#CBD5E1" font-size="11.5">• 1.36 亿条 (136M) 结晶器二维热映像、EMBr 电磁制动、EAF</text>
  <text x="80" y="510" fill="#CBD5E1" font-size="11.5">  泡沫渣埋弧声谱与氢竖炉气固还原向量若常驻全内存需 6.0TB DRAM</text>
  <text x="80" y="532" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅全内存向量集群月费即达 $42,600/月，总拼接栈高达 $111,300/月</text>

  <!-- Center/Right Column: Fabric 55ms Closed Loop -->
  <rect x="492" y="140" width="904" height="440" rx="14" fill="#0F223D" stroke="#10B981" stroke-width="1.5"/>
  <text x="514" y="170" fill="#6EE7B7" font-size="15.5" font-weight="800">✅ Microsoft Fabric 零碳绿钢连铸防漏钢、氢竖炉防悬料与欧盟 CBAM 护照 55ms 闭环（省 90.3% TCO · $10,800/月）</text>

  <!-- Step 1 -->
  <rect x="514" y="188" width="860" height="84" rx="10" fill="#132D50" stroke="#38BDF8" stroke-width="1.2"/>
  <rect x="528" y="202" width="108" height="24" rx="5" fill="#0284C7"/>
  <text x="582" y="218" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 1 · 13 ms</text>
  <text x="648" y="218" fill="#F8FAFC" font-size="13.5" font-weight="800">Eventhouse KQL 910K EPS 结晶器 2,400 点 FBG 光纤、EAF 声谱与竖炉感知（$0/GB 写入税）</text>
  <text x="528" y="242" fill="#BAE6FD" font-size="11.5">• 实时摄入 16 座绿钢基地 64 条连铸 FBG、48 座 EAF 与 32 座氢竖炉流，series_fit_line() 追踪二维热波迁移</text>
  <text x="528" y="260" fill="#34D399" font-size="11.5" font-weight="700">• 13ms 锁定 3# 连铸机宽面 #14..#18 列倒 V 字粘结热波 (距下口 420mm / 抢出 14 秒窗口) 及 2# 氢竖炉压差 +12kPa</text>

  <!-- Step 2 -->
  <rect x="514" y="282" width="860" height="90" rx="10" fill="#132D50" stroke="#818CF8" stroke-width="1.2"/>
  <rect x="528" y="296" width="108" height="24" rx="5" fill="#4F46E5"/>
  <text x="582" y="312" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 2 · 14 ms</text>
  <text x="648" y="312" fill="#F8FAFC" font-size="13.5" font-weight="800">Fabric IQ 6 跳氢冶金孪生 × Cosmos SSD DiskANN 1.36 亿向量（136M）检索（省 92% 内存）</text>
  <text x="528" y="336" fill="#E0E7FF" font-size="11.5">• 14ms 在 NVMe SSD 上检索 1.36 亿条结晶器二维热流映像、EMBr 电磁制动、EAF 泡沫渣声纹与氢还原向量 (0.99 相似)</text>
  <text x="528" y="356" fill="#34D399" font-size="11.5" font-weight="700">• 拉速从 1.80 阶跃降至 0.75 m/min 保持 22s 焊合裂口 (0 漏钢) + 竖炉配入 4.5% 生物甲烷 (金属化率 94.8%) + EAF 338 kWh/t</text>

  <!-- Step 3 -->
  <rect x="514" y="382" width="860" height="88" rx="10" fill="#132D50" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="528" y="396" width="108" height="24" rx="5" fill="#D97706"/>
  <text x="582" y="412" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 3 · 14 ms</text>
  <text x="648" y="412" fill="#F8FAFC" font-size="13.5" font-weight="800">Foundry IQ 结晶器液面波动（&lt;=±1.5mm）与欧盟 CBAM 碳强度护栏（SOP-074）</text>
  <text x="528" y="436" fill="#FEF3C7" font-size="11.5">• 强制校核降速期间 EMBr 电磁制动同步锁死弯月面液位波动 = ±1.1 mm (&lt;= ±1.5 mm O5 汽车外板防卷渣红线)</text>
  <text x="528" y="454" fill="#34D399" font-size="11.5" font-weight="700">• 核算炉次级粗钢碳足迹 = 0.39 tCO2e/t (较传统高炉 2.15 tCO2e/t 降碳 81.9%)，100% 满足欧盟 CBAM 与 ISO 14067</text>

  <!-- Step 4 -->
  <rect x="514" y="480" width="860" height="84" rx="10" fill="#132D50" stroke="#10B981" stroke-width="1.2"/>
  <rect x="528" y="494" width="108" height="24" rx="5" fill="#059669"/>
  <text x="582" y="510" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 4 · 14 ms</text>
  <text x="648" y="510" fill="#F8FAFC" font-size="13.5" font-weight="800">连铸主任 Teams 联签 + ALDO 炼钢车间断网边缘下发 + OneLake IQ CBAM 护照签发</text>
  <text x="528" y="534" fill="#D1FAE5" font-size="11.5">• 连铸值班主任在 Teams 联签 Confirm，驱动炼钢车间 SQL Server on Azure Local (ALDO) 下发拉矫机/振动台/EMBr PLC 指令</text>
  <text x="528" y="552" fill="#6EE7B7" font-size="11.5" font-weight="700">• 端到端 55ms 保住连铸机零漏钢与 O5 汽车板表面质量，月省突破 $100,500 (-90.3% TCO)，守护 $22.55M SLA</text>

