  <rect x="44" y="596" width="1352" height="264" rx="14" fill="#0E1B31" stroke="#334155" stroke-width="1.2"/>
  <text x="64" y="624" fill="#F8FAFC" font-size="14.5" font-weight="800">📊 五大云平台零碳绿钢冶金、1.36 亿向量检索与欧盟 CBAM 碳护照对比矩阵（n=312 路由均值 236.0ms · n=74 本体均值 201.0ms）</text>

  <rect x="64" y="638" width="420" height="204" rx="10" fill="#132642" stroke="#10B981" stroke-width="1.2"/>
  <text x="80" y="662" fill="#6EE7B7" font-size="13" font-weight="800">🏆 Microsoft Fabric 必赢三大铁律（省 90.3% · 破 $100K/月）</text>
  <text x="80" y="686" fill="#F8FAFC" font-size="11.5">1. $0/GB 写入税 + 13ms KQL 热波感知：910K EPS 结晶器 FBG</text>
  <text x="80" y="704" fill="#94A3B8" font-size="11">   直入 Eventhouse，提前 14 秒拦截粘结性漏钢与竖炉球团悬料</text>
  <text x="80" y="728" fill="#F8FAFC" font-size="11.5">2. 1.36 亿向量 SSD DiskANN 14ms 检索：二维热流映像、EMBr</text>
  <text x="80" y="746" fill="#94A3B8" font-size="11">   与泡沫渣声纹向量驻留 NVMe SSD，省去 92% DRAM 硬件税</text>
  <text x="80" y="770" fill="#F8FAFC" font-size="11.5">3. ALDO 炼钢车间边缘 + SDS CBAM 护照 + F64 $0 读者税：</text>
  <text x="80" y="788" fill="#94A3B8" font-size="11">   抗强电磁干扰本地降速，2,050 名冶金/碳审计师 $0 Viewer 费</text>
  <text x="80" y="818" fill="#34D399" font-size="12" font-weight="800">✓ 月度标准化 TCO：$10,800/月 vs 竞对 $111,300/月（月省 $100.5K！）</text>

  <rect x="502" y="638" width="430" height="204" rx="10" fill="#132642" stroke="#64748B" stroke-width="1"/>
  <text x="518" y="662" fill="#93C5FD" font-size="13" font-weight="800">🤝 四大云竞对定位与 OneLake 零拷贝共存边界</text>
  <text x="518" y="688" fill="#E2E8F0" font-size="11.5">• Databricks GPU ($111.3K/mo)：适合吉帕级汽车钢 CPFEM</text>
  <text x="518" y="706" fill="#94A3B8" font-size="11">  晶体塑性与相变模拟，CCT 冷却曲线零拷贝写回 OneLake</text>
  <text x="518" y="730" fill="#E2E8F0" font-size="11.5">• Snowflake ($115.4K/mo)：适合铁矿球团/废钢采购与车企 EDI</text>
