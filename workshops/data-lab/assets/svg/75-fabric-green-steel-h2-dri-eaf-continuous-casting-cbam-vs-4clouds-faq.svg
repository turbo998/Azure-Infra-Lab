  <text x="518" y="772" fill="#E2E8F0" font-size="11.5">• AWS SiteWise ($109.6K/mo)：910K EPS 按点写入与 1.36 亿</text>
  <text x="518" y="790" fill="#94A3B8" font-size="11">  OpenSearch 全内存向量 OCU 账单高昂</text>
  <text x="518" y="818" fill="#E2E8F0" font-size="11.5">• GCP BigQuery ($110.5K/mo)：缺炼钢车间断网边缘与内置 CBAM 表</text>

  <rect x="950" y="638" width="424" height="204" rx="10" fill="#092E26" stroke="#10B981" stroke-width="1.4"/>
