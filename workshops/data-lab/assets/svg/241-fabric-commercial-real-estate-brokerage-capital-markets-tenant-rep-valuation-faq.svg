  <text x="58" y="360" fill="#CBD5E1" font-size="12.5">• 845,000,000 向量：150页大宗投资备忘录 (OM) + ARGUS Enterprise 10年 DCF 现金流模型 + 历史可比租约免租期/TI 条款 + 容积率/环评报告</text>
  <text x="58" y="381" fill="#CBD5E1" font-size="12.5">• NVMe SSD DiskANN 量化索引将内存需求削减 -92% (仅 $4,280/月，彻底淘汰 $103,800/月 的 6.75TB 纯内存 OpenSearch/Mosaic 集群)</text>
