  <text x="58" y="494" fill="#CBD5E1" font-size="12.5">• 门禁 1 (双边代理信息墙 Chinese Wall)：物理隔离同一标的下卖方代表、买方代表及竞争竞标财团的 VDR 文档与保留底价，严防串标泄密</text>
