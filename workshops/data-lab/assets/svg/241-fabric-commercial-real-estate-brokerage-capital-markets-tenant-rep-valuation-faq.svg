  <text x="58" y="230" fill="#CBD5E1" font-size="12.5">• 实时流：Intralinks/Datasite 虚拟数据室 (VDR) 买方翻阅停留热力 + CoStar/RCA 交易对标 + 商圈客流信令 + SOFR/CMBS 1秒利差</text>
  <text x="58" y="251" fill="#CBD5E1" font-size="12.5">• 零拷贝镜像：VTS / Dealpath 租售委托管线、Yardi/MRI、Salesforce CRM 与 SAP S/4HANA 经纪佣金分账表 (立省 $187,200/月)</text>
