  <text x="1297" y="62" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BB · 231/232 (99.57%)</text>
  <text x="1297" y="86" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">49ms · 省 86.7% TCO</text>

  <!-- Left Column: First-Principles Pain Points -->
  <rect x="32" y="132" width="436" height="360" rx="14" fill="#111C33" stroke="#F43F5E" stroke-width="1.4"/>
  <text x="52" y="162" fill="#FDA4AF" font-size="15" font-weight="800">01 · 传统核能 SMR 与聚变装置三大致命痛点 ($147.4K/月)</text>

  <rect x="48" y="178" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 托卡马克 2/1 撕裂模破裂与 HTS 超导失超毫秒级毁第一壁</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 1.5 亿度等离子体 2/1 磁岛降频锁相或 REBCO 超导磁体局部失超</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 传统 Historian 分钟级轮询无法在毫秒级触发 ECCD 压制磁岛</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 逃逸电子束击穿钨铜偏滤器单次维修与停机直接损失 $6.80M</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="302" fill="#FB7185" font-size="13" font-weight="700">② AI 超算突发甩负荷 -180MW 引发 SMR 氙毒死区停堆 36h</text>
  <text x="62" y="322" fill="#E2E8F0" font-size="11.5">• 相连 500MW 智算中心保存 Checkpoint 瞬间甩负荷 -180MW</text>
  <text x="62" y="340" fill="#E2E8F0" font-size="11.5">• 若直接下插控制棒急降功率，氙-135 毒物累积致 36h 无法满发</text>
  <text x="62" y="358" fill="#FCA5A5" font-size="11" font-weight="700">✗ 5,600万条 EFIT/DNBR 全内存向量库与 Tag 税月烧 $111,200+</text>

  <rect x="48" y="382" width="404" height="94" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="404" fill="#FB7185" font-size="13" font-weight="700">③ NRC 10 CFR 73.54 单向光闸隔离与 24/7 无碳 PPA 断链</text>
  <text x="62" y="424" fill="#E2E8F0" font-size="11.5">• 核电 1E 级安全仪控强制单向光闸输出，纯公有云架构无法落地</text>
  <text x="62" y="442" fill="#E2E8F0" font-size="11.5">• 缺乏厂内 BOP 边缘与熔盐储热协同，痛失超算 24/7 CFE 溢价</text>
  <text x="62" y="460" fill="#FCA5A5" font-size="11" font-weight="700">✗ 单次非计划停堆与超算 PPA 违约罚金合计超 $8.75M</text>

