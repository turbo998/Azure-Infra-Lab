  <!-- Bottom Row Right: Dual-Denominator & Production Checklist -->
  <rect x="734" y="510" width="674" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="754" y="540" fill="#FBBF24" font-size="15" font-weight="800">05 · 双分母基准对账 (R47) 与生产落地核验清单 (Architect Checklist)</text>

  <rect x="754" y="556" width="634" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="770" y="578" fill="#34D399" font-size="12.5" font-weight="800">📊 严格区分两大延迟分母 (Dual-Denominator Reconciliation · 2026-11-13/14 R47)</text>
  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=232 (DL-01..232) 均值 = 311.0 ms (231/232 = 99.57%)</text>
  <text x="770" y="618" fill="#F8FAFC" font-size="11.5">• 分母 B (行业本体端到端仿真均值 ontology_simulations[])：n=54 (场景 A..BB，范围 5–780ms) 均值 = 261.0 ms</text>
  <text x="770" y="636" fill="#93C5FD" font-size="11">• 本轮新增 Scenario BB 端到端延迟 = 49 ms (12ms 感知 + 13ms DiskANN/孪生 + 12ms NRC/IAEA 护栏 + 12ms 回写) · 112/112 单测通过</text>

