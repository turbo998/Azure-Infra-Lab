  <text x="518" y="218" fill="#E2E8F0" font-size="11.2">• $0/GB 写入税执行 series_fft() 捕获托卡马克 2/1 撕裂模降至 380Hz</text>
  <text x="518" y="235" fill="#93C5FD" font-size="11">• 同步锁定 SMR-Unit-14 因 AI 超算甩负荷 -180MW 引发的蒸汽压力陡升</text>

  <rect x="504" y="254" width="448" height="72" rx="9" fill="#0B192C" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="518" y="275" fill="#C4B5FD" font-size="12.5" font-weight="800">Step 2 (13ms) · SSD DiskANN 5,600万 EFIT/DNBR 匹配与熔盐储热</text>
  <text x="518" y="294" fill="#E2E8F0" font-size="11.2">• 检索 5,600万条磁平衡与热工向量 (0.99 相似，省92%内存)：4.5MW ECCD 压磁岛</text>
  <text x="518" y="312" fill="#DDD6FE" font-size="11">• 开启 SMR 二回路 28% 蒸汽旁路导入熔盐储热罐 (TES)，保堆芯 92% 稳定热功率</text>

  <rect x="504" y="334" width="448" height="68" rx="9" fill="#0B192C" stroke="#FBBF24" stroke-width="1.2"/>
