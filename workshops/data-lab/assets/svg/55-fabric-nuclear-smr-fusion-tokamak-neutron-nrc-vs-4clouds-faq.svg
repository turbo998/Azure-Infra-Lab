  <text x="141" y="61" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">DATA LAB · ROUND 47 FAQ</text>
  <text x="250" y="62" fill="#F8FAFC" font-size="18.2" font-weight="800">新一代核能 SMR 小堆与托卡马克聚变 (880K EPS 防破裂/防停堆)、NRC 合规与超算 PPA 选型：Fabric vs 四大云</text>
  <text x="48" y="94" fill="#94A3B8" font-size="12.5">68 座 SMR + 4 座聚变堆 · Eventhouse KQL FFT (12ms) + SSD DiskANN 5,600万 EFIT/DNBR 匹配 (13ms) + 核热电孪生 + ALDO 单向光闸边缘 · 49ms 闭环省 86.7% TCO</text>
