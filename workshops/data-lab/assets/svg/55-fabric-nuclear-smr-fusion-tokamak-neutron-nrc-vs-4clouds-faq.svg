  <text x="518" y="374" fill="#E2E8F0" font-size="11.2">• 核验 SOP-054：DNBR = 2.18 &gt;= 1.30 红线 + 超导温升 1.8K &lt; 4.5K 失超线</text>
  <text x="518" y="391" fill="#FDE68A" font-size="11">• 确认零向 1E 级 RPS 写指令 (单向光闸合规) &amp; IAEA 乏燃料数字指纹 100% 匹配</text>

  <rect x="504" y="410" width="448" height="68" rx="9" fill="#064E3B" stroke="#10B981" stroke-width="1.4"/>
  <text x="518" y="431" fill="#6EE7B7" font-size="12.5" font-weight="800">Step 4 (12ms) · ALDO 核厂边缘 ECCD 转向、熔盐储热与 CFE 签证</text>
  <text x="518" y="450" fill="#F8FAFC" font-size="11.2">• 主控室 SRO 操纵员 Teams 联签 Confirm → ALDO 下发 ECCD 与 BOP 蒸汽旁路指令</text>
  <text x="518" y="467" fill="#A7F3D0" font-size="11" font-weight="700">✓ 端到端 49ms 自愈 · 守护 $15.55M 聚变第一壁、SMR 防氙毒停堆与超算 PPA</text>

