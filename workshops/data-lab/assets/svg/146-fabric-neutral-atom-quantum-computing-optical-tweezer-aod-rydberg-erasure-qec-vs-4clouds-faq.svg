  <text x="516" y="608" fill="#E2E8F0" font-size="11.8">• SQL on Azure Local (ALDO) 暗室边缘更新 RF-AWG 啁啾波形、EOM 滤波器与 FPGA</text>
  <text x="516" y="628" fill="#E2E8F0" font-size="11.8">• Fabric SDS 签发 99.72% CZ 容错量子算力数字护照写入 1GB Free Fabric SQL</text>
  <text x="516" y="648" fill="#34D399" font-size="11.8" font-weight="700">• 端到端 53 ms！月省 $281.5K (&gt;$280K/mo! · -95.1%)，守护 $47.40M SLA</text>

