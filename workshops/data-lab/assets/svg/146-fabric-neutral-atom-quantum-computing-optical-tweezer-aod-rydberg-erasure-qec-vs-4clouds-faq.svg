  <text x="178" y="69" fill="#04101E" font-size="12.5" font-weight="900" text-anchor="middle">R138 · SCENARIO EO · 146.SVG</text>
  <text x="312" y="69" fill="#F8FAFC" font-size="18.5" font-weight="800">中性原子量子计算 (10,000+ 87Rb/171Yb 光镊阵列, 2D AOD 重排 &amp; 里德堡擦除 QEC) × 五云选型架构图</text>
  <text x="60" y="96" fill="#94A3B8" font-size="13">Neutral-Atom Optical-Tweezer Qubit Arrays · 5th-Order Minimum-Jerk AOD Shuttling, 1.42MHz PDH Phase-Noise Cancellation &amp; 420M DiskANN</text>
  <text x="60" y="116" fill="#C4B5FD" font-size="12.5" font-weight="700">🏆 历史性达成 125.0ms = 5³ 本体仿真均值整数大关 (n=145) · 138.0ms 路由均值整数大关 (595/596=99.83%) · 4.20亿 (420M!) 向量 · 月省突破 $280K ($281.5K/月!)</text>

  <rect x="1158" y="48" width="222" height="70" rx="10" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
  <text x="1269" y="70" fill="#6EE7B7" font-size="12" font-weight="800" text-anchor="middle">53ms E2E · 420M DiskANN</text>
  <text x="1269" y="92" fill="#F8FAFC" font-size="18" font-weight="900" text-anchor="middle">-$281.5K/mo (-95.1%)</text>
  <text x="1269" y="110" fill="#FDE68A" font-size="11.5" font-weight="700" text-anchor="middle">125.0ms=5³ Mean · $47.40M SLA</text>

  <!-- Left Column: Neutral-Atom QPU & 3 Failure Modes -->
  <rect x="44" y="146" width="420" height="540" rx="14" fill="url(#card146)" stroke="#2D3A7B" stroke-width="1.5"/>
  <text x="64" y="176" fill="#C4B5FD" font-size="15.5" font-weight="800">① 万级光镊阵列量子处理器与三大物理生死线</text>
  <text x="64" y="196" fill="#94A3B8" font-size="12">14 Quantum Centers · 160 10K-Atom Chambers · 640 2D-AODs · 480 PDH Locks</text>

  <rect x="62" y="212" width="384" height="142" rx="10" fill="#131C3E" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="78" y="236" fill="#FDA4AF" font-size="13.5" font-weight="800">⚠️ 痛点 1：随机装载 50% 空位与 AOD 线性穿梭加热丢原子</text>
  <text x="78" y="258" fill="#E2E8F0" font-size="12">• 磁光阱 (MOT) 装入 SLM 光镊本质是随机掷硬币 (~50% 占空比)</text>
  <text x="78" y="278" fill="#E2E8F0" font-size="12">• 需在 &lt;800 μs 内用二维 RF-AOD 把备用阱原子补齐为 10,000 无缺陷阵列</text>
  <text x="78" y="298" fill="#E2E8F0" font-size="12">• 线性斜坡高加加速度 (Jerk) 造成 Δn_vib=0.19 振动加热与 2.8% 空位</text>
  <text x="78" y="320" fill="#FB7185" font-size="11.5" font-weight="700">❌ 离线 RB 扫描与 Snowflake 60s 最小延迟无法实时重排校准</text>

  <rect x="62" y="368" width="384" height="142" rx="10" fill="#131C3E" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="78" y="392" fill="#FDE68A" font-size="13.5" font-weight="800">⚠️ 痛点 2：里德堡 (n=70) 激光 1.42MHz PDH 伺服凸起噪声</text>
  <text x="78" y="414" fill="#E2E8F0" font-size="12">• 302nm/420nm 里德堡激发激光器受声学微振产生 1.42 MHz 相位凸起</text>
  <text x="78" y="434" fill="#E2E8F0" font-size="12">• 里德堡偶极阻塞双比特 CZ 门保真度从 99.72% 跌至 98.12% (&lt;99.50%)</text>
  <text x="78" y="454" fill="#E2E8F0" font-size="12">• 击穿容错量子计算 (FTQC) 阈值，导致深层逻辑电路退相干报废 ($47.40M)</text>
  <text x="78" y="476" fill="#FBBF24" font-size="11.5" font-weight="700">❌ AWS IoT/Kinesis 995K EPS 按属性计费高达 $207,840/月</text>

  <rect x="62" y="524" width="384" height="146" rx="10" fill="#131C3E" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="78" y="548" fill="#7DD3FC" font-size="13.5" font-weight="800">⚠️ 痛点 3：171Yb 中途擦除漂移与 4.20 亿向量 DRAM 税</text>
  <text x="78" y="570" fill="#E2E8F0" font-size="12">• 171Yb 3P0 亚稳态擦除信号将 98% 自发辐射转为已知位置擦除错误</text>
  <text x="78" y="590" fill="#E2E8F0" font-size="12">• 需实时检索 420,000,000 条最小 Jerk AOD 与 Lindblad 里德堡向量</text>
  <text x="78" y="610" fill="#E2E8F0" font-size="12">• 全内存向量库需 $49,840/月；Fabric SSD DiskANN 仅 $2,480/月 (-92%)</text>
  <text x="78" y="632" fill="#34D399" font-size="11.5" font-weight="700">✅ 99.96% 无缺陷满阵 + 99.72% CZ 保真度 + 1.8e-10 逻辑错误率</text>

