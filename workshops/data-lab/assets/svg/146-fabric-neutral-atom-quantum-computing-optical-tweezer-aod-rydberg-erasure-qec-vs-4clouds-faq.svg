  <text x="516" y="254" fill="#E2E8F0" font-size="11.8">• $0/GB 写入税汇聚 160 台万级光镊腔 qCMOS 荧光图、480 套 PDH 相位谱与擦除流</text>
  <text x="516" y="274" fill="#E2E8F0" font-size="11.8">• series_fit_line() + series_fft() 13ms 锁定 Chamber-Yb-12 异常</text>
  <text x="516" y="294" fill="#6EE7B7" font-size="11.8" font-weight="700">• 精准捕获：1.42 MHz PDH 伺服凸起 (CZ 98.12%) &amp; 2.8% 空位 (Δn_vib=0.19)</text>

