  <rect x="44" y="702" width="1352" height="160" rx="14" fill="#0B1330" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="64" y="730" fill="#C4B5FD" font-size="15" font-weight="800">④ 混合共生落地法则 (Hybrid Better Together) 与生产核验清单</text>
  <text x="64" y="756" fill="#E2E8F0" font-size="12.5">1. 离线量子主方程归 HPC/Databricks，在线 53ms 纠错归 Fabric：将 Lindblad 里德堡阻塞主方程与匈牙利算法二维 AOD 轨迹求解留在 Azure HPC / Databricks GPU，</text>
  <text x="64" y="778" fill="#E2E8F0" font-size="12.5">   通过 OneLake Zero-Copy Shortcut 挂载 4.20 亿向量至 Cosmos DB SSD DiskANN (13ms 检索，省 92% 内存)，并从 Snowflake 零 ETL 镜像超高真空腔与量子作业队列台账。</text>
  <text x="64" y="802" fill="#E2E8F0" font-size="12.5">2. 零写入税 + 光学暗室 ALDO 边缘自治：Eventhouse KQL 以 $0/GB 写入税在 13ms 内对 995K EPS qCMOS 荧光与 PDH 相位谱做 FFT；Foundry IQ SOP-145 13ms 核验</text>
  <text x="64" y="824" fill="#E2E8F0" font-size="12.5">   99.96% 满阵率与 99.72% CZ 保真度；SQL on Azure Local (ALDO) 在暗室边缘 14ms 下发五次多项式最小 Jerk AWG 啁啾与 -14dB EOM 前馈滤波，落盘 1GB 免费 SQL。</text>
  <text x="64" y="848" fill="#94A3B8" font-size="11.5">Provenance: Deterministic simulation &amp; routing benchmark (2026-11-17 R138 · 595/596 = 99.83% · Matrix Mean 138.0ms · Ontology Mean 125.0ms=5³ across n=145 · 294/294 tests).</text>
