  <text x="516" y="372" fill="#E2E8F0" font-size="11.8">• OneLake 零拷贝挂载 Azure HPC 匈牙利算法 AOD 轨迹与 Lindblad 主方程向量</text>
  <text x="516" y="392" fill="#E2E8F0" font-size="11.8">• Cosmos DB SSD DiskANN 检索 420,000,000 向量 (0.99 相似, 省 92% 内存仅 $2,480/月)</text>
  <text x="516" y="412" fill="#DDD6FE" font-size="11.8" font-weight="700">• 命中配方：s(τ)=10τ³-15τ⁴+6τ⁵ 最小Jerk AOD + 1.42MHz -14dB EOM + MWPM重加权</text>

  <!-- Step 3 -->
