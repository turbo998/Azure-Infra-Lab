  <text x="516" y="490" fill="#E2E8F0" font-size="11.8">• 校验《NEUTRAL-ATOM-OPTICAL-TWEEZER-RYDBERG-QEC-SOP-145》硬性红线</text>
  <text x="516" y="510" fill="#E2E8F0" font-size="11.8">• 10,000 格点无缺陷满占率锁在 99.96% &gt;= 99.90%，振动加热 Δn_vib = 0.018 &lt;= 0.05</text>
  <text x="516" y="530" fill="#FCD34D" font-size="11.8" font-weight="700">• 双比特里德堡 CZ 门保真度恢复至 99.72% &gt;= 99.50%，逻辑错误率 1.8×10⁻¹⁰</text>

  <!-- Step 4 -->
  <rect x="500" y="566" width="460" height="104" rx="10" fill="#0B1D39" stroke="#10B981" stroke-width="1.2"/>
