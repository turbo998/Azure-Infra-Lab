  <text x="52" y="456" class="t-box-b">• TFDS 轨旁高清车底开口销/弹簧图像</text>
  <text x="52" y="474" class="t-box-b">• 8.5万公里钢轨超声波探伤 B显波形</text>
  <text x="52" y="492" class="t-box-b">• 受电弓 3C/4C 视觉与检修规程向量</text>
  <text x="52" y="510" class="t-box-b" fill="#c084fc">🧠 SSD DiskANN $3,680 vs $86,000 整 DRAM</text>

  <rect x="40" y="554" width="253" height="124" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="52" y="576" class="t-box-h" fill="#fbbf24">4. 19,600 (140²!) 名调度与机辆专家</text>
