  <text x="52" y="214" class="t-box-b">• TADS 声学轴承 / THDS 红外热轴</text>
  <text x="52" y="232" class="t-box-b">• CBTC / ETCS / PTC 移动闭塞信号</text>
  <text x="52" y="250" class="t-box-b" fill="#34d399">⚡ 峰值吞吐：995,000 EPS 实时流</text>

  <rect x="40" y="284" width="253" height="115" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="52" y="306" class="t-box-h" fill="#34d399">2. SAP EAM / Maximo / CTC 运行图</text>
