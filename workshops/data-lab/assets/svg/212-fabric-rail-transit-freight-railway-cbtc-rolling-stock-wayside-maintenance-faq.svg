  <text x="46" y="50" class="t-title">212 · 🏆 七冠大满贯：干线铁路、高铁动车组与城轨集团（18,000列车 + 8.5万公里线路）轨旁维保与调度五云选型 (R204)</text>
  <text x="46" y="74" class="t-sub">Rail Transit &amp; Freight Railway Wayside TADS/THDS/TFDS AI, CBTC/ETCS Rescheduling &amp; FRA/ERA Safety · 700M=0.70B Vectors · &lt;180ms Mean · 200 Tests · -$400.7K/mo!</text>
  <rect x="1135" y="34" width="220" height="44" rx="8" fill="#38bdf8"/>
  <text x="1245" y="55" text-anchor="middle" class="t-pill">🏆 700M VECTORS · 200 TESTS</text>
  <text x="1245" y="70" text-anchor="middle" class="t-pill">179.8ms &lt;180ms · -$400.7K/mo!</text>

  <!-- Left Column: Railway & Rolling Stock Data Sources -->
  <rect x="24" y="110" width="285" height="585" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="42" y="138" class="t-sec">🚆 1.8万列车与 6,400套轨旁探测源</text>

  <rect x="40" y="154" width="253" height="115" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
