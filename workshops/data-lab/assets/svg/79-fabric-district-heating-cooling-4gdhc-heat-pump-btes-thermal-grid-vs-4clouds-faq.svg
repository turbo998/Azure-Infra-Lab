  <text x="1084" y="232" fill="#E2E8F0" font-size="10.5">• 4,200 站 180s S型缓闭 -28% 压回水至 34.2°C</text>
  <text x="1084" y="248" fill="#C084FC" font-size="10.5" font-weight="700">• 全额并入 145MWt 智算余热 + 提前 3.5h 楼宇蓄热</text>

  <rect x="748" y="278" width="310" height="92" rx="8" fill="#0A1729" stroke="#F97316" stroke-width="1.2"/>
