  <text x="1084" y="316" fill="#E2E8F0" font-size="10.5">• 热网总调 Teams 联签 Confirm (0.99)</text>
  <text x="1084" y="332" fill="#E2E8F0" font-size="10.5">• ALDO 边缘经 IEC-104/MBus 下发电动阀与热泵指令</text>
  <text x="1084" y="348" fill="#6EE7B7" font-size="10.5" font-weight="700">• 0 尖峰燃气启动 · 守护 $23.95M 民生供暖与碳税 SLA</text>

