  <text x="764" y="575" fill="#E2E8F0" font-size="11">• 分母 A（全量路由矩阵）：n = 328 场景 (DL-01..DL-328)，通过率 327 / 328 (99.70%)，算术均值 = 226.0 ms (R70 n=324 为 228.5 ms)</text>
