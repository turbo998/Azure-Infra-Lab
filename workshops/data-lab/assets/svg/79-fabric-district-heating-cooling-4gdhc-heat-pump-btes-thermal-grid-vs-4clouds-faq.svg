  <text x="213" y="66" fill="#FFFFFF" font-size="11.2" font-weight="800" text-anchor="middle" letter-spacing="0.6">DATA LAB · 2026-11-14 R71 · 160-TEST &amp; 99.70% MILESTONE</text>
  <text x="382" y="66" fill="#F8FAFC" font-size="16" font-weight="800">城市级区域供热供冷热网（4GDHC/5GDHC）、算力余热回收与跨季节蓄热（BTES）选型 FAQ</text>
  <text x="58" y="98" fill="#FDBA74" font-size="12.5">Microsoft Fabric (Eventhouse KQL 870K EPS 9ms 低温差/水锤感知 + Cosmos SSD DiskANN 10ms 1.52亿水力热力/BTES匹配 + SDS + ALDO 边缘) vs 四大云</text>
  <rect x="1156" y="46" width="224" height="60" rx="10" fill="#062E22" stroke="#10B981" stroke-width="1.5"/>
  <text x="1268" y="68" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BZ · 28 城市热网 + 64万站</text>
  <text x="1268" y="94" fill="#FFFFFF" font-size="17.5" font-weight="800" text-anchor="middle">39ms 闭环 · 省 90.7% TCO</text>

  <!-- Row 1 Left: Pain Points vs First-Principles Breakthrough -->
  <rect x="40" y="136" width="668" height="248" rx="14" fill="#0F2038" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="60" y="164" fill="#FB923C" font-size="14" font-weight="800">01 · 第一性原理痛点拆解：为什么 15 分钟 SCADA 轮询会逼热网烧高价燃气并排空算力余热？</text>

  <rect x="60" y="178" width="628" height="60" rx="8" fill="#2A1215" stroke="#EF4444" stroke-width="1.2"/>
  <text x="76" y="198" fill="#FCA5A5" font-size="12" font-weight="800">❌ 传统架构痛点：热水传输滞后 4 小时 + 低供回水温差阻塞算力余热 + 尖峰燃气碳税 (`$120.4K/月`)</text>
  <text x="76" y="216" fill="#FECACA" font-size="11">• 热水流速仅 1.8m/s，25km 管道滞后 4h；-18°C 晨峰等 SCADA 看到掉温为时已晚，只能点燃高价天然气尖峰炉</text>
  <text x="76" y="231" fill="#FECACA" font-size="11">• 二网大流量乱抽水致回水飙至 51.8°C，使邻近智算中心 48°C 免费液冷余热 (145 MWt) 无法并网被迫排向大气</text>

  <rect x="60" y="248" width="628" height="60" rx="8" fill="#062E22" stroke="#10B981" stroke-width="1.2"/>
  <text x="76" y="268" fill="#6EE7B7" font-size="12" font-weight="800">✅ Fabric 破局：9ms KQL 温差/水锤感知 + 10ms 1.52 亿向量检索 + ALDO 热力站边缘 (`$11.2K/月`)</text>
  <text x="76" y="286" fill="#D1FAE5" font-size="11">• Eventhouse KQL $0/GB 写入税摄入 870K EPS 遥测，series_fit_line() 9ms 锁定北区 19.4°C 低温差与 +0.38MPa 水锤波</text>
  <text x="76" y="301" fill="#D1FAE5" font-size="11">• Cosmos SSD DiskANN 10ms 检索 1.52 亿条楼宇热惯性与 BTES 向量：压回水至 34.2°C 收 145MWt 余热 + 提前 3.5h 错峰蓄热</text>

  <rect x="60" y="316" width="628" height="54" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="76" y="335" fill="#93C5FD" font-size="11.5" font-weight="800">🤝 互补共存 (Better Together)：十年期地下岩土三维有限元仿真 vs 39ms 实时水力热力闭环</text>
  <text x="76" y="353" fill="#E2E8F0" font-size="11">• FEFLOW / COMSOL 十年期岩土热扩散仿真归 Databricks/Azure HPC；1,200万户热费账单归 Snowflake/SAP IS-U；39ms 闭环归 Fabric</text>

