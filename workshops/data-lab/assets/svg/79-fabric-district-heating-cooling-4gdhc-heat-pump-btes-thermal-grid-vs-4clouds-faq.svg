  <text x="762" y="316" fill="#E2E8F0" font-size="10.5">• 校核《DISTRICT-THERMAL-4GDHC-EED-SOP-078》</text>
  <text x="762" y="332" fill="#E2E8F0" font-size="10.5">• 生活热水巴氏杀菌 62.4°C &gt;= 60.0°C，承压 1.28 &lt;= 1.6MPa</text>
  <text x="762" y="348" fill="#FDBA74" font-size="10.5" font-weight="700">• 核算绿热与余热占比 84.6% &gt;= 75.0% 欧盟 EED 标准</text>

  <rect x="1070" y="278" width="310" height="92" rx="8" fill="#062E22" stroke="#10B981" stroke-width="1.2"/>
