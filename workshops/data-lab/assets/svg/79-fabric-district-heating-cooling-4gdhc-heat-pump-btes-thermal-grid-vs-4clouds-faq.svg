  <text x="748" y="164" fill="#38BDF8" font-size="14" font-weight="800">02 · Scenario BZ：39ms 提前 3.5h 蓄热、145MWt 余热并网与防军团菌闭环 (`DL-325..328`)</text>

  <rect x="748" y="178" width="310" height="90" rx="8" fill="#0A1729" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="762" y="198" fill="#38BDF8" font-size="12" font-weight="800">① Eventhouse KQL 流式感知 (9 ms)</text>
  <text x="762" y="216" fill="#E2E8F0" font-size="10.5">• 870K EPS 64万换热站超声热量表 + 光纤 DTS</text>
  <text x="762" y="232" fill="#E2E8F0" font-size="10.5">• 检出北区 #12 温差塌缩至 19.4°C (回水 51.8°C)</text>
  <text x="762" y="248" fill="#34D399" font-size="10.5" font-weight="700">• 同步锁定 -18°C 晨峰负荷冲击与 +0.38MPa 水锤前兆</text>

