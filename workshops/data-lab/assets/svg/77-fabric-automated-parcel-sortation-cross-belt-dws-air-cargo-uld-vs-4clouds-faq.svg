  <text x="764" y="575" fill="#E2E8F0" font-size="11">• 分母 A（全量路由矩阵）：n = 320 场景 (DL-01..DL-320)，通过率 319 / 320 (99.69%)，算术均值 = 231.0 ms (R68 n=316 为 233.5 ms)</text>
