  <!-- Row 1 Left: Pain Points vs First-Principles Breakthrough -->
  <rect x="40" y="136" width="668" height="248" rx="14" fill="#0F1E36" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="60" y="164" fill="#FBBF24" font-size="14" font-weight="800">01 · 第一性原理痛点拆解：为什么 15 分钟 WCS 轮询防不住交叉带爆格与货机延误？</text>

  <rect x="60" y="178" width="628" height="60" rx="8" fill="#2A1215" stroke="#EF4444" stroke-width="1.2"/>
  <text x="76" y="198" fill="#FCA5A5" font-size="12" font-weight="800">❌ 传统架构痛点：光电死开关 3s 滞后 + 污损面单进异常道 + 航空 ULD 重心偏心 (`$115.8K/月`)</text>
  <text x="76" y="216" fill="#FECACA" font-size="11">• 小车以 3.2m/s 狂奔，光电开关被挡 3s 锁槽时已有 68 件在途包裹无处可落，引发整环 450 辆小车空转死锁</text>
  <text x="76" y="231" fill="#FECACA" font-size="11">• 雨水污损面单踢入人工异常道（$4.80/件）；航空集装器 ULD 重心偏移 +4.6% 导致停机坪拆板重装，货机延误 90 分钟</text>

  <rect x="60" y="248" width="628" height="60" rx="8" fill="#062E22" stroke="#10B981" stroke-width="1.2"/>
  <text x="76" y="268" fill="#6EE7B7" font-size="12" font-weight="800">✅ Fabric 破局：11ms KQL 滑槽体积积分 + 12ms 1.44 亿向量检索 + ALDO 车间边缘 (`$11.0K/月`)</text>
  <text x="76" y="286" fill="#D1FAE5" font-size="11">• Eventhouse KQL $0/GB 写入税摄入 950K EPS 遥测，series_fit_line() 11ms 提前 18 秒锁定法兰克福 14# 滑槽 112% 爆格</text>
  <text x="76" y="301" fill="#D1FAE5" font-size="11">• Cosmos SSD DiskANN 12ms 检索 1.44 亿条多语种 OCR 与 ULD 重心向量（省 92% 内存）：恢复 42 件污损单 + 切副滑槽 14B/14C</text>

  <rect x="60" y="316" width="628" height="54" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="76" y="335" fill="#93C5FD" font-size="11.5" font-weight="800">🤝 互补共存 (Better Together)：万车 AGV 3D 物理碰撞仿真 vs 47ms 实时分拣配载闭环</text>
  <text x="76" y="353" fill="#E2E8F0" font-size="11">• Omniverse / AnyLogic 3D 碰撞仿真归 Databricks/Azure HPC；SAP TM 运费与 CASS 清分归 Snowflake；47ms 闭环归 Fabric</text>

