  <text x="368" y="66" fill="#F8FAFC" font-size="16" font-weight="800">全球高速快递分拣中心、交叉带分拣机、DWS 视觉读码与航空货运 ULD 重心平衡选型 FAQ</text>
  <text x="58" y="98" fill="#93C5FD" font-size="12.5">Microsoft Fabric (Eventhouse KQL 950K EPS 11ms 滑槽防爆格 + Cosmos SSD DiskANN 12ms 1.44亿 OCR/ULD重心匹配 + 枢纽孪生 + ALDO 边缘) vs 四大云</text>
