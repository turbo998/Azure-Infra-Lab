  <text x="524" y="551" fill="#F8FAFC" font-size="11.5">• 洁净室 ALDO 边缘下发 Mo(CO)6/H2S 质量流量计与 UHV 铋束源炉指令</text>
  <text x="524" y="570" fill="#34D399" font-size="11" font-weight="700">• 1GB 免费 SQL 签发 Sub-1nm CFET 二维沟道数字护照 (63ms 闭环!)</text>

