  <!-- Step 3 -->
  <rect x="508" y="408" width="454" height="90" rx="10" fill="#172554" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="524" y="429" fill="#93C5FD" font-size="12.5" font-weight="800">STEP 3 · Foundry IQ 空位密度与 92Ω·μm 护栏 SOP-135 (16 ms)</text>
  <text x="524" y="449" fill="#F8FAFC" font-size="11.5">• 校验硫空位压回 1.8e11 &lt;= 5.0e11 cm⁻²，单向晶粒拼接率 99.92%</text>
  <text x="524" y="468" fill="#CBD5E1" font-size="11">• 拉曼 E2g-A1g 频差锁死 18.8 cm⁻¹，半金属接触电阻 92 &lt;= 120 Ω·μm</text>
  <text x="524" y="485" fill="#34D399" font-size="11" font-weight="700">• CFET 亚阈值摆幅达 61.8 mV/dec，逼近 60 mV/dec 玻尔兹曼极限</text>

