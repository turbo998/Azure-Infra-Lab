  <text x="60" y="654" fill="#60A5FA" font-size="14.5" font-weight="800">04 · 300mm 二维过渡金属硫族化合物 (2D TMD) 与 Sub-1nm CFET 三大物理护栏矩阵 (SOP-135 · R128=2^7, 380M &amp; 130.0ms Mean)</text>

