  <text x="524" y="333" fill="#F8FAFC" font-size="11.5">• 检索 380,000,000 (🏆 R128=2^7 &amp; 135本体!) DFT/台阶/NEGF 向量</text>
  <text x="524" y="352" fill="#CBD5E1" font-size="11">• 相似度 0.99 (省 92% 内存)：硫钼前驱体比拉升至 2,400:1 原位愈合空位</text>
