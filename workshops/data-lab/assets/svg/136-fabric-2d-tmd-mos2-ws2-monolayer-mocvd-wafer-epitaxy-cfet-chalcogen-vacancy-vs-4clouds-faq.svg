  <text x="76" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：硫空位捕获电子形成 1.84eV Trion，高硫化学势原位填补</text>
  <text x="76" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：#14 腔硫空位密度飙至 4.2 × 10¹³ cm⁻² (超标 84 倍)</text>
  <text x="76" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：硫钼前驱体比拉升至 2,400:1 + 载气 H2 +18 sccm</text>
  <text x="76" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：硫空位压回 1.8 × 10¹¹ &lt;= 5.0 × 10¹¹ cm⁻²</text>
  <text x="76" y="800" fill="#94A3B8" font-size="11">• 单向拼接：蓝宝石台阶引导 99.92% 单向对齐，拉曼频差 18.8 cm⁻¹</text>

  <rect x="506" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#10B981" stroke-width="1.2"/>
  <text x="522" y="694" fill="#6EE7B7" font-size="13" font-weight="800">② 半金属铋 (Bi) 范德华零势垒接触 (92 Ω·μm)</text>
  <text x="522" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：半金属费米面零态密度消除 MIGS，160°C 准范德华无损沉积</text>
  <text x="522" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：传统金属轰击导致费米钉扎与 &gt;1,500 Ω·μm 接触势垒</text>
  <text x="522" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：锁定 160°C 衬底冷台与 UHV 铋分子束外延沉积</text>
  <text x="522" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：接触电阻低至 92 &lt;= 120 Ω·μm，亚阈值摆幅 61.8 mV/dec</text>
