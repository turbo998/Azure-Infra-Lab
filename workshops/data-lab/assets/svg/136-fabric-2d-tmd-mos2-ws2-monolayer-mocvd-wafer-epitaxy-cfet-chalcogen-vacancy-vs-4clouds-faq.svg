  <text x="524" y="225" fill="#F8FAFC" font-size="11.5">• $0/GB 写入税摄入 480 台 MOCVD 1.88eV PL、拉曼与 RHEED 菊池线</text>
  <text x="524" y="244" fill="#CBD5E1" font-size="11">• series_fit_line() 15ms 捕获 #14 腔 V_S=4.2e13 cm⁻² 硫空位激增</text>
  <text x="524" y="263" fill="#34D399" font-size="11" font-weight="700">• 实时锁定拉曼 E2g-A1g 频差与蓝宝石台阶单向形核取向度</text>

