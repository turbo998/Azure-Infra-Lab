  <text x="261" y="66" fill="#030712" font-size="10.8" font-weight="900" text-anchor="middle" letter-spacing="0.4">🏆 R128=2^7 MILESTONE · 380M VECTORS · 135-ONT · 130.0ms MEAN!</text>
  <text x="478" y="66" fill="#F8FAFC" font-size="15.5" font-weight="800">300mm 单原子层二维半导体 (MoS2/WS2) MOCVD 原位抑硫空位与半金属铋接触 Sub-1nm CFET 63ms 闭环</text>
  <text x="58" y="100" fill="#94A3B8" font-size="12.5">Scenario EE · 12 座 Sub-1nm 2D-TMD 晶圆厂 (480 台 300mm MOCVD + 640 套原位 PL/拉曼/RHEED + 320 台 UHV 铋蒸镀) × 990K EPS · 3.80 亿向量 · 92 Ω·μm</text>

  <rect x="1146" y="46" width="236" height="64" rx="10" fill="#064E3B" stroke="#F59E0B" stroke-width="2"/>
  <text x="1264" y="68" fill="#FDE68A" font-size="11.5" font-weight="900" text-anchor="middle">555 / 556 = 99.82% (R128=2^7!)</text>
  <text x="1264" y="95" fill="#FFFFFF" font-size="19" font-weight="900" text-anchor="middle">380M Vectors · 63ms</text>

  <!-- Left Column -->
  <rect x="40" y="138" width="430" height="470" rx="14" fill="#131B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · 300mm 二维半导体外延与 CFET 三大危机与死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #14 腔硫空位爆发 (4.2e13 cm⁻²) 与 60° 反平行孪晶界</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• Mo(CO)6/H2S 热裂解失衡致 0.65nm 单层 MoS2 硫空位超标 84 倍</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 原位 1.84eV 缺陷三重激子 (Trion A⁻) 发光反超中性激子</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 60° 反平行晶畴拼合形成导电镜像孪晶界，迁移率暴跌 85%</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：12h 离线球差电镜 STEM 抽检滞后，整批 300mm 晶圆报废！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="344" fill="#FCA5A5" font-size="12.5" font-weight="800">② 金属诱导间隙态 (MIGS) 与费米能级钉扎接触墙</text>
  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• 传统高能金属蒸镀直接砸断 3 原子厚 Mo-S 键产生海量界面态</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 费米能级死死钉扎在禁带中，肖特基接触电阻高达 &gt;1,500 Ω·μm</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• 亚阈值摆幅劣化至 98 mV/dec，丧失 Sub-1nm 弹道输运优势</text>
  <text x="72" y="424" fill="#F87171" font-size="11" font-weight="700">• 痛点：缺乏半金属铋 (Bi) 低温范德华接触零态密度实时调控！</text>

  <rect x="58" y="466" width="394" height="126" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($276.9K/月 vs $14.4K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：990K EPS 480腔 PL/拉曼/RHEED 流月费 $200.9K</text>
  <text x="72" y="528" fill="#E2E8F0" font-size="11.5">• 内存税：380M 全内存 DRAM 向量索引月耗 $45.0K</text>
  <text x="72" y="548" fill="#E2E8F0" font-size="11.5">• 刷新税：Snowflake 60s 滞后 / 12h 离线电镜错失抑空位窗口</text>
  <text x="72" y="570" fill="#34D399" font-size="11.5" font-weight="700">• Fabric 破局：$0/GB 写入税 + SSD DiskANN 省 92% 内存</text>

