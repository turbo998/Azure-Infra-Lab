  <text x="968" y="716" fill="#E2E8F0" font-size="11.5">• 尾气治理：Mo(CO)6 与 H2S 尾气高温催化燃烧处理效率 99.98%</text>
  <text x="968" y="736" fill="#E2E8F0" font-size="11.5">• 全片晶圆图：300mm 全晶圆 PL/拉曼单层性图谱直绑 CoWoS 客户</text>
  <text x="968" y="756" fill="#E2E8F0" font-size="11.5">• 断网自治：洁净室 ALDO 边缘保障外延腔室毫秒级安全联锁</text>
