  <text x="74" y="242" fill="#E2E8F0" font-size="11.5">• 捕获 #14号LIDE 锥透镜热畸变致孔壁微裂纹达 2.35μm (&gt;1.0μm)</text>
  <text x="74" y="260" fill="#34D399" font-size="11" font-weight="700">✓ 提前拦截 ABF 热压合与 260°C 回流焊时整张 $12K 玻璃大板炸裂!</text>

