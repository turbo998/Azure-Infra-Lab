<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg74" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040D1A"/>
      <stop offset="50%" stop-color="#081C33"/>
      <stop offset="100%" stop-color="#051324"/>
    </linearGradient>
    <linearGradient id="accent74" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
