  <rect width="1440" height="900" fill="url(#bg74)"/>
  <rect x="24" y="20" width="1392" height="860" rx="18" fill="#0B1629" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="38" width="1352" height="86" rx="12" fill="#10223D" stroke="#06B6D4" stroke-width="1.2"/>
  <rect x="60" y="54" width="218" height="28" rx="6" fill="url(#accent74)"/>
  <text x="169" y="73" fill="#FFFFFF" font-size="11.8" font-weight="800" text-anchor="middle">2026-11-14 · R66 · 132M VECTORS</text>
  <text x="294" y="72" fill="#F8FAFC" font-size="16.2" font-weight="800">Microsoft Fabric 大型海水淡化（SWRO）、反渗透膜防赤潮污堵、PX 能量回收与浓盐水生态合规 vs 四大云选型一图流</text>
  <text x="60" y="104" fill="#94A3B8" font-size="12.5">18 座海淡厂 (日产 2,400 万吨) · 140 万支 RO 膜 + 4,200 台 PX × 860K EPS · Eventhouse 14ms + SSD DiskANN 15ms 1.32 亿向量 + ALDO = 59ms 闭环 · 省 90.2% TCO</text>
  <rect x="1182" y="50" width="196" height="58" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1280" y="72" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BU · 1.32 亿向量</text>
  <text x="1280" y="96" fill="#F8FAFC" font-size="18" font-weight="800" text-anchor="middle">59ms · 省 90.2% TCO</text>

  <!-- Left Column: Pain Points -->
  <rect x="44" y="140" width="430" height="440" rx="14" fill="#111C33" stroke="#EF4444" stroke-width="1.3"/>
  <text x="64" y="170" fill="#FCA5A5" font-size="15" font-weight="800">❌ 传统 4 小时 SDI 化验与公有云拼接栈三大痛点</text>

  <rect x="64" y="188" width="390" height="114" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="212" fill="#FECACA" font-size="13" font-weight="700">1. 4 小时 SDI 化验对赤潮 TEP 污堵与余氯氧化穿孔失明</text>
  <text x="80" y="234" fill="#CBD5E1" font-size="11.5">• 赤潮爆发时叶绿素飙至 48μg/L，TEP 多糖 18min 内令压差暴涨 +2.4bar</text>
  <text x="80" y="254" fill="#CBD5E1" font-size="11.5">• 亚硫酸氢钠 (SBS) 泵气缚致进膜 ORP &gt; 345mV (游离氯穿漏)</text>
  <text x="80" y="274" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅需 30 分钟即可氧化穿孔整套 $8.5M (18,000 支) 聚酰胺 RO 膜</text>

  <rect x="64" y="316" width="390" height="114" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="340" fill="#FECACA" font-size="13" font-weight="700">2. 860K EPS 荧光光谱、PX 声发射与排海 CTD 按点写入税</text>
  <text x="80" y="362" fill="#CBD5E1" font-size="11.5">• 140 万支 RO 膜段压差 + 4,200 台 PX 转子声学 + CTD = 860K EPS</text>
  <text x="80" y="382" fill="#CBD5E1" font-size="11.5">• 公有云 IoT 按属性点/按 GB 双重收费，高盐雾光纤中断易致停水</text>
  <text x="80" y="402" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅遥测流摄入与污堵斜率重算即月烧 $48,600/月 (Normalized)</text>

  <rect x="64" y="444" width="390" height="120" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="468" fill="#FECACA" font-size="13" font-weight="700">3. 1.32 亿条浓差极化、气浮混凝与浓盐水羽流全内存硬件税</text>
  <text x="80" y="490" fill="#CBD5E1" font-size="11.5">• 1.32 亿条 (132M) 膜面浓差极化、DAF 氯化铁投药与 CORMIX</text>
  <text x="80" y="510" fill="#CBD5E1" font-size="11.5">  海底浓盐水羽流扩散向量若常驻全内存需 5.8TB DRAM</text>
  <text x="80" y="532" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅全内存向量集群月费即达 $41,600/月，总拼接栈高达 $109,200/月</text>

  <!-- Center/Right Column: Fabric 59ms Closed Loop -->
  <rect x="492" y="140" width="904" height="440" rx="14" fill="#0F223D" stroke="#10B981" stroke-width="1.5"/>
  <text x="514" y="170" fill="#6EE7B7" font-size="15.5" font-weight="800">✅ Microsoft Fabric 海水淡化防赤潮污堵、零余氯保膜与珊瑚礁盐度 59ms 闭环（省 90.2% TCO · $10,700/月）</text>

  <!-- Step 1 -->
  <rect x="514" y="188" width="860" height="84" rx="10" fill="#132D50" stroke="#38BDF8" stroke-width="1.2"/>
  <rect x="528" y="202" width="108" height="24" rx="5" fill="#0284C7"/>
  <text x="582" y="218" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 1 · 14 ms</text>
  <text x="648" y="218" fill="#F8FAFC" font-size="13.5" font-weight="800">Eventhouse KQL 860K EPS 取水荧光、进膜双冗余 ORP 与跨膜压差感知（$0/GB 写入税）</text>
  <text x="528" y="242" fill="#BAE6FD" font-size="11.5">• 实时摄入 18 座海淡厂 140 万支 RO 膜、4,200 台 PX 与排海 CTD 流，series_fit_line() 追踪压差与 ORP 斜率</text>
  <text x="528" y="260" fill="#34D399" font-size="11.5" font-weight="700">• 14ms 提前 28 秒锁定取水赤潮叶绿素飙至 48μg/L (一段 TMP +2.4bar) 及 SBS 还原泵气缚致进膜 ORP 跃升至 345mV</text>

  <!-- Step 2 -->
  <rect x="514" y="282" width="860" height="90" rx="10" fill="#132D50" stroke="#818CF8" stroke-width="1.2"/>
  <rect x="528" y="296" width="108" height="24" rx="5" fill="#4F46E5"/>
  <text x="582" y="312" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 2 · 15 ms</text>
  <text x="648" y="312" fill="#F8FAFC" font-size="13.5" font-weight="800">Fabric IQ 6 跳海淡孪生 × Cosmos SSD DiskANN 1.32 亿向量（132M）检索（省 92% 内存）</text>
  <text x="528" y="336" fill="#E0E7FF" font-size="11.5">• 15ms 在 NVMe SSD 上检索 1.32 亿条膜面浓差极化、DAF 溶气气浮混凝与 CORMIX 浓盐水羽流向量 (0.99 相似)</text>
  <text x="528" y="356" fill="#34D399" font-size="11.5" font-weight="700">• 秒切备用 SBS 泵 (压 ORP 至 215mV, 游离氯 0.00ppm 保 $8.5M 膜组) + DAF 投加 3.2mg/L FeCl3 + 段间增压稳电耗 2.68kWh/m³</text>

  <!-- Step 3 -->
  <rect x="514" y="382" width="860" height="88" rx="10" fill="#132D50" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="528" y="396" width="108" height="24" rx="5" fill="#D97706"/>
  <text x="582" y="412" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 3 · 15 ms</text>
  <text x="648" y="412" fill="#F8FAFC" font-size="13.5" font-weight="800">Foundry IQ WHO 饮用水硼（&lt;0.50 mg/L）与珊瑚礁盐度增量（&lt;=+2.0 ppt）护栏（SOP-073）</text>
  <text x="528" y="436" fill="#FEF3C7" font-size="11.5">• 强制校核二段高 pH 脱硼后出厂淡水硼 = 0.38 mg/L (&lt; 0.50 mg/L WHO 标准)，方解石矿化 LSI = +0.15 防管网腐蚀</text>
  <text x="528" y="454" fill="#34D399" font-size="11.5" font-weight="700">• 调节海底排海口文丘里多端口扩散器掺混比，确认 100m 处珊瑚礁海底盐度增量 +1.1 ppt (&lt;= +2.0 ppt 环保红线)</text>

  <!-- Step 4 -->
  <rect x="514" y="480" width="860" height="84" rx="10" fill="#132D50" stroke="#10B981" stroke-width="1.2"/>
  <rect x="528" y="494" width="108" height="24" rx="5" fill="#059669"/>
  <text x="582" y="510" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 4 · 15 ms</text>
  <text x="648" y="510" fill="#F8FAFC" font-size="13.5" font-weight="800">水厂总工 Teams 联签 + ALDO 沿海高压泵房断网边缘下发 + 1GB 免费 SQL 落盘</text>
  <text x="528" y="534" fill="#D1FAE5" font-size="11.5">• 水厂总工在 Teams 联签 Confirm，驱动沿海泵房 SQL Server on Azure Local (ALDO) 下发 SBS 泵、DAF 与扩散器 PLC 指令</text>
  <text x="528" y="552" fill="#6EE7B7" font-size="11.5" font-weight="700">• 端到端 59ms 保住日产 2,400 万吨城市供水与 $8.5M 聚酰胺膜组，月省 $98,500 (-90.2% TCO)，守护 $22.20M SLA</text>

  <!-- Bottom Row: 5-Cloud Matrix & Quantitative KPIs -->
  <rect x="44" y="596" width="1352" height="264" rx="14" fill="#0E1B31" stroke="#334155" stroke-width="1.2"/>
  <text x="64" y="624" fill="#F8FAFC" font-size="14.5" font-weight="800">📊 五大云平台海水淡化 SWRO、1.32 亿向量检索与海洋生态合规对比矩阵（n=308 路由均值 239.0ms · n=73 本体均值 203.0ms）</text>

  <rect x="64" y="638" width="420" height="204" rx="10" fill="#132642" stroke="#10B981" stroke-width="1.2"/>
  <text x="80" y="662" fill="#6EE7B7" font-size="13" font-weight="800">🏆 Microsoft Fabric 必赢三大铁律（省 90.2% TCO）</text>
  <text x="80" y="686" fill="#F8FAFC" font-size="11.5">1. $0/GB 写入税 + 14ms KQL 斜率感知：860K EPS 荧光/ORP</text>
  <text x="80" y="704" fill="#94A3B8" font-size="11">   直入 Eventhouse，提前 28 秒拦截游离氯穿膜与赤潮 TEP 糊膜</text>
  <text x="80" y="728" fill="#F8FAFC" font-size="11.5">2. 1.32 亿向量 SSD DiskANN 15ms 检索：浓差极化、DAF 混凝与</text>
  <text x="80" y="746" fill="#94A3B8" font-size="11">   CORMIX 浓盐水羽流向量驻留 NVMe SSD，省去 92% DRAM 硬件税</text>
  <text x="80" y="770" fill="#F8FAFC" font-size="11.5">3. ALDO 沿海泵房边缘 + SDS 水足迹 + F64 $0 读者税：断网不</text>
  <text x="80" y="788" fill="#94A3B8" font-size="11">   烧膜不停水，2,000 名膜工艺/海洋环评工程师 $0 Viewer 许可费</text>
  <text x="80" y="818" fill="#34D399" font-size="12" font-weight="800">✓ 月度标准化 TCO：$10,700/月 vs 竞对 $109,200/月（立省 90.2%！）</text>

  <rect x="502" y="638" width="430" height="204" rx="10" fill="#132642" stroke="#64748B" stroke-width="1"/>
  <text x="518" y="662" fill="#93C5FD" font-size="13" font-weight="800">🤝 四大云竞对定位与 OneLake 零拷贝共存边界</text>
  <text x="518" y="688" fill="#E2E8F0" font-size="11.5">• Databricks GPU ($109.2K/mo)：适合水通道蛋白/石墨烯纳米孔</text>
  <text x="518" y="706" fill="#94A3B8" font-size="11">  RO 膜分子动力学模拟，脱盐率参数零拷贝写回 OneLake</text>
  <text x="518" y="730" fill="#E2E8F0" font-size="11.5">• Snowflake ($113.2K/mo)：适合国家水务阶梯水价账单与膜元件</text>
  <text x="518" y="748" fill="#94A3B8" font-size="11">  SAP ERP 结算，60s Dynamic Tables 无法拦截余氯穿膜</text>
  <text x="518" y="772" fill="#E2E8F0" font-size="11.5">• AWS SiteWise ($107.6K/mo)：860K EPS 按点写入与 1.32 亿</text>
  <text x="518" y="790" fill="#94A3B8" font-size="11">  OpenSearch 全内存向量 OCU 账单高昂</text>
  <text x="518" y="818" fill="#E2E8F0" font-size="11.5">• GCP BigQuery ($108.5K/mo)：缺沿海泵房断网边缘与内置水足迹表</text>

  <rect x="950" y="638" width="424" height="204" rx="10" fill="#092E26" stroke="#10B981" stroke-width="1.4"/>
  <text x="966" y="662" fill="#6EE7B7" font-size="13" font-weight="800">📈 Scenario BU 密封基准验证（150 单测里程碑 · DL-305..308）</text>
  <text x="966" y="688" fill="#F8FAFC" font-size="12" font-weight="700">• 评测矩阵得分：307 / 308 (99.68%) · 150/150 单测通过</text>
  <text x="966" y="712" fill="#F8FAFC" font-size="11.5">• 零余氯保膜：进膜 ORP 压回 215mV (0.00ppm Cl2，保 $8.5M 膜组)</text>
  <text x="966" y="734" fill="#F8FAFC" font-size="11.5">• 吨水电耗寻优：DAF 除藻 96.4% + PX 协同稳电耗 2.68 kWh/m³</text>
  <text x="966" y="756" fill="#F8FAFC" font-size="11.5">• 饮用水质合规：出厂水硼 0.38 mg/L (&lt; 0.50 mg/L WHO 标准)</text>
  <text x="966" y="778" fill="#F8FAFC" font-size="11.5">• 海洋生态护栏：100m 珊瑚礁盐度增量 +1.1 ppt (&lt;= +2.0 ppt 红线)</text>
  <text x="966" y="812" fill="#34D399" font-size="13" font-weight="800">🛡️ 守护 $22,200,000 城市供水、聚酰胺膜组与海洋环评 SLA</text>
</svg>
