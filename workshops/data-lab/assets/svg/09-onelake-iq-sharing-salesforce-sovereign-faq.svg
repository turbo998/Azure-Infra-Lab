  <rect x="996" y="182" width="380" height="358" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <text x="1012" y="206" fill="#F8FAFC" font-size="12" font-weight="800">端到端 515ms · 护航 42 家大客户 ($1.15M SLA 止损)</text>

  <text x="1012" y="230" fill="#38BDF8" font-size="11" font-weight="700">[Step 1 · 92ms] OneLake IQ Sharing 外部本体感知</text>
  <text x="1012" y="246" fill="#CBD5E1" font-size="10.5">订阅 TomTom 鹿特丹港 RDF 本体，捕获航线拥堵延误 +96 小时</text>

  <text x="1012" y="272" fill="#C084FC" font-size="11" font-weight="700">[Step 2 · 126ms] Salesforce Data 360 + Azure Local 穿透</text>
  <text x="1012" y="288" fill="#CBD5E1" font-size="10.5">零拷贝联查 42 家大客户 ($18.4M ARR) 合同与匈牙利工厂 WIP</text>

  <text x="1012" y="314" fill="#34D399" font-size="11" font-weight="700">[Step 3 · 108ms] Ontology Condition-Action 规则求解</text>
  <text x="1012" y="330" fill="#CBD5E1" font-size="10.5">华沙保税仓调拨 780 套 + 中欧铁空联运加急 500 套 (运费 $34.5K)</text>

  <text x="1012" y="356" fill="#FBBF24" font-size="11" font-weight="700">[Step 4 · 94ms] Foundry IQ + Purview 跨企主权护栏</text>
  <text x="1012" y="372" fill="#CBD5E1" font-size="10.5">拦截向外部承运商泄露 Salesforce 合同底价，仅下发脱敏交期</text>

  <text x="1012" y="398" fill="#60A5FA" font-size="11" font-weight="700">[Step 5 · 95ms] Rayfin 门户 + 1GB SQL &amp; CRM 回写</text>
  <text x="1012" y="414" fill="#CBD5E1" font-size="10.5">回写 1GB 免费 Fabric SQL 并刷新 Salesforce CSM 客户预警卡</text>

  <rect x="1012" y="434" width="348" height="90" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1"/>
  <text x="1026" y="456" fill="#93C5FD" font-size="11.5" font-weight="800">仿真验证指标 (Scenario H Verified Metrics)</text>
  <text x="1026" y="476" fill="#F8FAFC" font-size="11">• 跨企零拷贝联查延迟：92ms KQL + 126ms Graph (515ms E2E)</text>
  <text x="1026" y="494" fill="#F8FAFC" font-size="11">• 1,280 台 AI 机柜订单准时交付率：99.6% (42 家大客户)</text>
  <text x="1026" y="512" fill="#34D399" font-size="11" font-weight="700">• 单次规避 SLA 违约罚金与续约流失：$1,150,000</text>

