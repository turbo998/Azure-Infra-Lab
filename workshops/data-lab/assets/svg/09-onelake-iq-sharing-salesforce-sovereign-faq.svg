  <text x="616" y="660" fill="#E2E8F0" font-size="11">• Horizon 消费 Delta Shares (GA)</text>
  <text x="616" y="678" fill="#E2E8F0" font-size="11">• Polaris 开源 Iceberg REST 目录</text>
