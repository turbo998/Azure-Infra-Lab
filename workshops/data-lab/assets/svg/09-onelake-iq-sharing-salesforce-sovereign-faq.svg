  <text x="616" y="714" fill="#94A3B8" font-size="11">• 痛点：纯云端架构不支持车间断网</text>
  <text x="616" y="732" fill="#94A3B8" font-size="11">  部署，高频问数 Credit 成本高 56%</text>
  <text x="616" y="756" fill="#38BDF8" font-size="10.5" font-weight="700">建议：Mirroring + Ossie 零漂移接入</text>

  <rect x="868" y="618" width="256" height="184" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.2"/>
  <text x="884" y="640" fill="#34D399" font-size="12.5" font-weight="800">GCP Analytics Hub + BigLake</text>
  <text x="884" y="660" fill="#E2E8F0" font-size="11">• Analytics Hub 跨组织数据集发布</text>
  <text x="884" y="678" fill="#E2E8F0" font-size="11">• BigLake Managed Iceberg REST</text>
  <text x="884" y="696" fill="#E2E8F0" font-size="11">• Conversational Analytics GA</text>
  <text x="884" y="714" fill="#94A3B8" font-size="11">• 痛点：仅共享静态数据集，缺乏跨</text>
  <text x="884" y="732" fill="#94A3B8" font-size="11">  组织 RDF 本体指令与原生回写库</text>
  <text x="884" y="756" fill="#34D399" font-size="10.5" font-weight="700">建议：启用 OneLake BigQuery 镜像 GA</text>

  <rect x="1136" y="618" width="240" height="184" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="1.2"/>
