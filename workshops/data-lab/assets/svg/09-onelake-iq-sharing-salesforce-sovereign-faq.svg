  <!-- Header -->
  <rect x="44" y="38" width="1352" height="84" rx="14" fill="#131F38" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="64" y="54" width="276" height="26" rx="13" fill="url(#headGrad9)"/>
  <text x="202" y="72" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.8">FAQ ARCHITECTURE · 2026-11-08/09</text>
  <text x="356" y="72" fill="#F8FAFC" font-size="19.5" font-weight="800">OneLake 零拷贝三剑客 (Shortcuts / Mirroring / IQ Sharing) × Fabric IQ 本体 vs 四大云数据共享架构</text>
  <text x="64" y="102" fill="#94A3B8" font-size="13">第一性原理图解：为什么「只共享裸表」会让 AI 产生 +14.2% 口径幻觉？如何用 OneLake IQ Sharing + Salesforce Data 360 + Azure Local 构建 515ms 跨企闭环</text>

  <!-- Left Column: OneLake Zero-Copy Trio & Sovereign Edge -->
  <rect x="44" y="138" width="390" height="420" rx="14" fill="#111C33" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="64" y="166" fill="#38BDF8" font-size="14" font-weight="800">01 · OneLake 零拷贝三剑客与断网边缘接入</text>

  <rect x="64" y="182" width="350" height="88" rx="10" fill="url(#iqGrad)" stroke="#38BDF8" stroke-width="1.4"/>
  <text x="80" y="204" fill="#38BDF8" font-size="12.5" font-weight="800">① OneLake IQ Sharing (Preview) · 跨企业带脑子共享</text>
  <text x="80" y="222" fill="#F8FAFC" font-size="11">• 不止共享 Parquet 表，连同 RDF 本体 (.rdf) 与智能体</text>
  <text x="80" y="238" fill="#CBD5E1" font-size="11">  指令 (.md) 一起跨组织零拷贝共享 (TomTom / S&amp;P / EY)</text>
  <text x="80" y="256" fill="#34D399" font-size="10.5" font-weight="700">✓ 接收方 Agent 开箱即懂业务关系与行业红线，零二次建模</text>

  <rect x="64" y="280" width="350" height="82" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="80" y="302" fill="#34D399" font-size="12.5" font-weight="800">② OneLake Shortcuts · Salesforce Data 360 &amp; AWS S3</text>
  <text x="80" y="320" fill="#E2E8F0" font-size="11">• 原地指针直连 Salesforce Data 360 客户画像与 S3 Tables</text>
  <text x="80" y="336" fill="#94A3B8" font-size="11">• 智能缓存 (28ms 命中) + Outbound Access Protection 防泄露</text>
  <text x="80" y="352" fill="#34D399" font-size="10.5" font-weight="700">✓ 0 字节物理搬运、0 夜间定时 ETL、省 100% 重复跨云流量费</text>

  <rect x="64" y="372" width="350" height="82" rx="10" fill="#0F172A" stroke="#A855F7" stroke-width="1.2"/>
  <text x="80" y="394" fill="#C084FC" font-size="12.5" font-weight="800">③ OneLake Mirroring (GA) · BigQuery / Snowflake / Oracle</text>
  <text x="80" y="412" fill="#E2E8F0" font-size="11">• 自动监听源库 CDC 事务日志，近实时映射为 OneLake Delta</text>
  <text x="80" y="428" fill="#94A3B8" font-size="11">• 联合 Apache Ossie YAML 将外部 Verified Queries 无损带入</text>
  <text x="80" y="444" fill="#34D399" font-size="10.5" font-weight="700">✓ 彻底替代脆弱昂贵的第三方 CDC 与双写管道</text>

  <rect x="64" y="464" width="350" height="80" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="80" y="486" fill="#FBBF24" font-size="12.5" font-weight="800">④ SQL Server on Azure Local (ALDO) &amp; GCC High (GA)</text>
  <text x="80" y="504" fill="#E2E8F0" font-size="11">• 本地 Appliance-VM 断网控制面支撑涉密厂区与军工主权云</text>
  <text x="80" y="520" fill="#94A3B8" font-size="11">• 断网窗口期本地自治，恢复连接后差分增量同步至 OneLake</text>
  <text x="80" y="536" fill="#34D399" font-size="10.5" font-weight="700">✓ 解决纯公有云数仓无法落地的车间/国防断网合规盲区</text>

  <!-- Center Column: Fabric IQ Ontology Condition-Action Engine vs Raw Table Query -->
  <rect x="454" y="138" width="502" height="420" rx="14" fill="#111C33" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="474" y="166" fill="#60A5FA" font-size="14" font-weight="800">02 · 核心原理解析：裸表 Text-to-SQL vs Fabric IQ 本体接地</text>

  <rect x="474" y="182" width="462" height="106" rx="10" fill="#1F1224" stroke="#EF4444" stroke-width="1.3"/>
  <text x="490" y="204" fill="#F87171" font-size="12.5" font-weight="800">⛔ 传统模式痛点：只共享裸表 + 大模型直接拼 SQL (反例 DL-23)</text>
  <text x="490" y="224" fill="#E2E8F0" font-size="11">• 外部伙伴通过传统共享发来 50 张缩写列名表 (如 `tbl_ord_v2_tmp`)</text>
  <text x="490" y="242" fill="#E2E8F0" font-size="11">• LLM 缺乏业务口径，误连废弃中间表，导致毛利/风险算错 +14.2%</text>
  <text x="490" y="260" fill="#FCA5A5" font-size="11" font-weight="700">• 仅能回答被动图表问题，无法自动判断违约阈值或安全回写业务系统</text>

  <rect x="474" y="300" width="462" height="134" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.4"/>
  <text x="490" y="322" fill="#34D399" font-size="12.5" font-weight="800">✅ Fabric IQ Ontology 升维：实体 + 多跳关系 + 条件动作规则 (Rules)</text>
  <text x="490" y="342" fill="#E2E8F0" font-size="11">• 一键从 2000万+ Power BI 语义模型与 IQ Sharing RDF 生成统一业务本体</text>
  <text x="490" y="360" fill="#E2E8F0" font-size="11">• 内嵌 Condition-Action 规则：如 `PortDelay &gt; 24h AND ARR_At_Risk &gt;= $1M`</text>
  <text x="490" y="378" fill="#E2E8F0" font-size="11">• 结合 Microsoft IQ 四大支柱：Work IQ (省 80% Token) + Foundry IQ (+36% 相关性)</text>
  <text x="490" y="396" fill="#E2E8F0" font-size="11">• Purview 标签自动继承：向外部物流派单时自动掩码 Salesforce 合同底价</text>
  <text x="490" y="416" fill="#38BDF8" font-size="11" font-weight="700">• 实测 48 场景准确率达 97.92% (47/48)，选项逆序扰动漂移 &lt;= 0.5 pt</text>

  <rect x="474" y="446" width="462" height="94" rx="10" fill="#172554" stroke="#60A5FA" stroke-width="1.3"/>
  <text x="490" y="468" fill="#93C5FD" font-size="12.5" font-weight="800">M365 Copilot ($0 额外 Token) + Rayfin SDK + 1GB 免费 SQL 闭环</text>
  <text x="490" y="488" fill="#F8FAFC" font-size="11">• 业务高管在 Teams / M365 Copilot 中零额外 Token 随时追问跨企供应链状态</text>
  <text x="490" y="508" fill="#34D399" font-size="11" font-weight="700">• Rayfin TS 函数一键回写 1GB 免费 Fabric SQL 并推送 Salesforce 续约预警卡</text>

