  <text x="348" y="678" fill="#E2E8F0" font-size="11">• 支持表、AI模型、Lakebase 流共享</text>
  <text x="348" y="696" fill="#E2E8F0" font-size="11">• UC Metric View 关系定义 (Beta)</text>
