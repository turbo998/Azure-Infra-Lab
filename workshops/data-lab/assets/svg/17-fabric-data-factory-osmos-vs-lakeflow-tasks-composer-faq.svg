  <text x="80" y="834" fill="#60A5FA" font-size="13.5" font-weight="800">04 · AI Solution Architect 售前打单三大黄金选型法则 (Architect Selection Rules &amp; Coexistence Boundaries)</text>

  <text x="80" y="862" fill="#34D399" font-size="12" font-weight="800">法则 1 · 何时首选 Fabric Data Factory + Materialized Lake Views + Project Osmos：</text>
  <text x="80" y="882" fill="#E2E8F0" font-size="11.5">当客户希望终结 Informatica/SSIS/Airflow 多工具割裂税、用 SQL/PySpark 声明式维护铜→银→金层、并用 AI 智能体自动将老旧 ETL 迁移或修复 Schema 漂移时，首选 Fabric（省 67.4% TCO）。</text>

  <text x="80" y="910" fill="#F97316" font-size="12" font-weight="800">法则 2 · 何时选择 Fabric Data Factory × Databricks Lakeflow / Snowflake Tasks 混合编排 (Better Together)：</text>
  <text x="80" y="930" fill="#E2E8F0" font-size="11.5">若数据科学团队已在 Databricks DLT 或 Snowflake Dynamic Tables 沉淀核心清洗逻辑，切勿推倒重写！用 Fabric Data Factory 原生调用 Databricks/Snowflake 作业并联动 OneLake 零拷贝与 DirectLake 刷新。</text>

  <text x="80" y="958" fill="#FBBF24" font-size="12" font-weight="800">法则 3 · 严守生产 Git CI/CD 护栏（避坑边界）：</text>
  <text x="415" y="958" fill="#E2E8F0" font-size="11.5">任何由 Project Osmos 或 AI 生成的管道补丁严禁直接覆盖生产分支；必须走 Git PR + Deployment Pipeline 自动化数据质量断言 + 人类一键审批合并。</text>
