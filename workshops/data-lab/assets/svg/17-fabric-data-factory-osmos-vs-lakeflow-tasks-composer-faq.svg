  <text x="76" y="318" fill="#E2E8F0" font-size="11">• K8s 控制面 + Worker 节点 24×7 常驻 ($900–$2,400/mo)</text>
  <text x="76" y="336" fill="#E2E8F0" font-size="11">• Snowflake Dynamic Tables 高频刷新另有常驻 Credit 溢价</text>

