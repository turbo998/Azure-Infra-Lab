  <text x="1032" y="228" fill="#F8FAFC" font-size="11.5">• Microsoft Fabric 归一化：  $14,500 / 月 (基准最优)</text>
  <rect x="1032" y="234" width="52" height="10" rx="5" fill="#10B981"/>
  <text x="1032" y="258" fill="#CBD5E1" font-size="11.5">• 四云拼装栈归一化：         $258,000 / 月 (贵 17.8x)</text>
