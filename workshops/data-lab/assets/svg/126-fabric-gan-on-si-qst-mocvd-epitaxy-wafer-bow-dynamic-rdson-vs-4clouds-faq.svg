  <text x="1032" y="518" fill="#E2E8F0" font-size="11">• Azure HPC / Databricks：Sentaurus TCAD 2DEG &amp; 腔室 CFD</text>
  <text x="1032" y="538" fill="#E2E8F0" font-size="11">• Snowflake / SAP：Si/QST 衬底、MO 源与车规/电源订单 ERP</text>
  <text x="1032" y="558" fill="#34D399" font-size="11" font-weight="700">• Fabric：OneLake 零拷贝挂载 + 14ms 洁净室实时控制面</text>
  <text x="1032" y="578" fill="#94A3B8" font-size="10.5">• 官方规格引用：121 条 (新增 SPEC-GAN-MOCVD-EPITAXY-R118)</text>

  <!-- Bottom Strip -->
  <rect x="40" y="624" width="1360" height="240" rx="14" fill="#0E192D" stroke="#2563EB" stroke-width="1.5"/>
  <text x="60" y="654" fill="#60A5FA" font-size="14.5" font-weight="800">04 · 硅基氮化镓 (GaN-on-Si/QST) 超晶格应力、碳陷阱抑制与 2DEG 三大物理护栏矩阵 (SOP-125 · 99.81% Acc &amp; 14ms Milestone)</text>

  <rect x="60" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="76" y="694" fill="#67E8F9" font-size="13" font-weight="800">① Stoney 原位激光曲率与超晶格压应力补偿</text>
  <text x="76" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：∂κ/∂h_f = 6σ_f/(M_s·h_s²)，需预置 -1.22 GPa·μm 压应力</text>
  <text x="76" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：#16 腔第 42 周期压应力斜率跌 -28% (预测 +88.5μm 翘曲)</text>
  <text x="76" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：第 43–60 周期 TMAl +4.6% + 第 5 区灯丝 -1.8%</text>
  <text x="76" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：室温翘曲锁死 +11.2 μm &lt;= ±25.0 μm，0 裂片</text>
  <text x="76" y="800" fill="#94A3B8" font-size="11">• 光刻兼容：200mm/300mm 步进光刻机吸盘 100% 稳定吸附</text>

  <rect x="506" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#10B981" stroke-width="1.2"/>
  <text x="522" y="694" fill="#6EE7B7" font-size="13" font-weight="800">② V/III 比残碳清除与 1.07x 极低动态导通电阻</text>
  <text x="522" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：活性 H* 将甲基转化为 CH4，阻断 C_N 深受主侵入沟道</text>
  <text x="522" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：过渡区残碳尾随将致动态 Rdson 飙至 1.68x (&gt;1.20x)</text>
  <text x="522" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：UID 沟道层 NH3/TMGa 比上调 +14.0% + 21.5nm 势垒层</text>
  <text x="522" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：动态 Rdson 比值 1.07x，迁移率 2,040 cm²/V·s</text>
  <text x="522" y="800" fill="#94A3B8" font-size="11">• 均匀性：2DEG 方块电阻 288 Ω/sq (全片非均匀性仅 0.85%)</text>

  <rect x="952" y="670" width="428" height="174" rx="10" fill="#091326" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="968" y="694" fill="#FBBF24" font-size="13" font-weight="800">③ 吉瓦级 AIDC 98.4% 钛金电源与绿色外延护照</text>
  <text x="968" y="716" fill="#E2E8F0" font-size="11.5">• 算力节能：12kW AI 服务器 PSU 效率从 94.2% 跃升至 98.4%</text>
  <text x="968" y="736" fill="#E2E8F0" font-size="11.5">• 尾气减排：氨气催化裂解回收率达 99.6%，零 NOx 排放</text>
  <text x="968" y="756" fill="#E2E8F0" font-size="11.5">• 车规溯源：AEC-Q101 与 JEDEC JEP173 全晶圆电学基因库</text>
  <text x="968" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：1GB 免费 SQL 签发绿色算力电源与车规护照</text>
  <text x="968" y="800" fill="#FDE68A" font-size="11" font-weight="700">• 里程碑：99.81%准确率 · 125大本体 · 14ms闭环 · 省94.4%</text>
