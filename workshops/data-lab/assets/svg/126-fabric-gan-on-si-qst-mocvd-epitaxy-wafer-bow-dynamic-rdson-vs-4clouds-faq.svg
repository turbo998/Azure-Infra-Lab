  <text x="524" y="244" fill="#CBD5E1" font-size="11">• series_fit_line() 3ms 捕获 #16 腔第 42 周期 dκ/dh 斜率跌落 -28%</text>
  <text x="524" y="263" fill="#34D399" font-size="11" font-weight="700">• 同时识别托盘第 5 区 +4.8°C 径向温差与过渡区残碳超标前兆</text>

