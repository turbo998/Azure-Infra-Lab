  <rect x="1018" y="338" width="364" height="126" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1032" y="360" fill="#FDE68A" font-size="12.5" font-weight="900">🏆 99.81%准确率 &amp; 125大本体 &amp; 14ms (report.json R118)</text>
  <text x="1032" y="382" fill="#FFFFFF" font-size="12" font-weight="800">• 路由评估矩阵 (n=516)：    515 / 516 (99.81% 历史新高!)</text>
  <text x="1032" y="402" fill="#34D399" font-size="11.5" font-weight="700">• 分母 A 路由矩阵算术均值： 154.0 ms (正式跌破155ms!)</text>
  <text x="1032" y="422" fill="#FDE68A" font-size="11.5" font-weight="800">• 分母 B 125大行业本体均值：138.0 ms (n=125 整数大关!)</text>
  <text x="1032" y="442" fill="#CBD5E1" font-size="11">• Python 确定性单测套件：  254 / 254 (100% 通过)</text>

  <rect x="1018" y="476" width="364" height="118" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
