  <text x="524" y="551" fill="#F8FAFC" font-size="11.5">• 洁净室 ALDO 边缘下发高速 Run/Vent MFC 阀与红外温区指令</text>
  <text x="524" y="570" fill="#34D399" font-size="11" font-weight="700">• 1GB 免费 SQL 签发 AIDC 98.4% 钛金电源芯片护照 (14ms &lt;15ms!)</text>

