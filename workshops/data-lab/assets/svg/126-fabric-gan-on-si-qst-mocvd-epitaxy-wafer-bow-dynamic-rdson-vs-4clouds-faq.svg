  <rect x="58" y="48" width="356" height="26" rx="13" fill="url(#cyan126)"/>
  <text x="236" y="66" fill="#040814" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.6">🏆 R118 · 99.81% ACC, #125 ONTOLOGY &amp; 14ms E2E!</text>
  <text x="430" y="66" fill="#F8FAFC" font-size="16" font-weight="800">200mm/300mm 硅基氮化镓 (GaN-on-Si/QST) MOCVD 超晶格原位翘曲控制与动态导通电阻抑制 14ms 闭环</text>
  <text x="58" y="100" fill="#94A3B8" font-size="12.5">Scenario DU · 16 座 GaN 功率外延基地 (560 台 MOCVD 反应腔 + 480 套原位曲率仪 + 640 台 2DEG 测试仪) × 990K EPS · 3.40 亿向量 (340M!) · +11.2μm 翘曲 &amp; 1.07x 动态 Rdson</text>

  <rect x="1146" y="46" width="236" height="64" rx="10" fill="#064E3B" stroke="#F59E0B" stroke-width="2"/>
  <text x="1264" y="68" fill="#FDE68A" font-size="11.5" font-weight="900" text-anchor="middle">515 / 516 = 99.81% (n=125!)</text>
  <text x="1264" y="95" fill="#FFFFFF" font-size="19" font-weight="900" text-anchor="middle">340M Vectors · 14ms</text>

  <!-- Left Column -->
  <rect x="40" y="138" width="430" height="470" rx="14" fill="#131B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · 硅基氮化镓外延三大物理危机与传统死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #16 MOCVD 腔室 54% 热膨胀失配与 +88.5μm 翘曲裂片</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• GaN 热膨胀系数比 Si 大 54%，从 1,050°C 降温产生 1.18GPa 拉应力</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 托盘边缘 +4.8°C 温差使第 42 周期超晶格压应力斜率跌落 -28%</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 冷却后晶圆翘曲冲上 +88.5 μm (&gt; ±25.0 μm 光刻吸盘极限)</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：出炉后才测曲率早已定型炸裂，整炉报废损失 &gt;$96K！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="344" fill="#FCA5A5" font-size="12.5" font-weight="800">② C_N 深能级受主陷阱与 1.68x 动态 Rdson 电流崩塌</text>
  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• 高耐压缓冲层残碳向上尾随侵入 UID GaN 沟道层 300nm 内</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 650V–1,200V 关断电场激发 C_N 陷阱 (Ev+0.9eV) 锁死 2DEG 电子</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• 动态导通电阻飙至静态值的 1.68 倍 (&gt;1.20 倍 JEDEC JEP173 红线)</text>
  <text x="72" y="424" fill="#F87171" font-size="11" font-weight="700">• 痛点：引发吉瓦级 AIDC 电源与 800V 电驱高频开关热击穿！</text>

  <rect x="58" y="466" width="394" height="126" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($258.0K/月 vs $14.5K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：990K EPS 原位激光曲率/双波长干涉流月费 $184.6K</text>
  <text x="72" y="528" fill="#E2E8F0" font-size="11.5">• 内存税：340M 全内存 DRAM 向量索引月耗 $40.0K</text>
  <text x="72" y="548" fill="#E2E8F0" font-size="11.5">• 刷新税：Snowflake 60s 滞后 / 6h 出炉检测错失超晶格窗口</text>
  <text x="72" y="570" fill="#34D399" font-size="11.5" font-weight="700">• Fabric 破局：$0/GB 写入税 + SSD DiskANN 省 92% 内存</text>

