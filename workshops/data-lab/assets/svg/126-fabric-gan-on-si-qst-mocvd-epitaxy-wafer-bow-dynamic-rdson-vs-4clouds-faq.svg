  <text x="524" y="333" fill="#F8FAFC" font-size="11.5">• 检索 340,000,000 (🏆 99.81%准确率&amp;125大本体!) Stoney/SL/2DEG 向量</text>
  <text x="524" y="352" fill="#CBD5E1" font-size="11">• 相似度 0.99 (省 92% 内存)：第 43–60 周期 TMAl 占空比上调 +4.6%</text>
