  <text x="524" y="449" fill="#F8FAFC" font-size="11.5">• 校验出炉室温晶圆翘曲锁死 +11.2 μm &lt;= ±25.0 μm，0 边缘裂片</text>
  <text x="524" y="468" fill="#CBD5E1" font-size="11">• 高压动态 Rdson 比值压至 1.07x &lt;= 1.20x，2DEG 迁移率 2,040 cm²/V·s</text>
  <text x="524" y="485" fill="#34D399" font-size="11" font-weight="700">• 沟道残碳降至 4.2e15 cm⁻³，尾气氨气催化分解率达 99.6%</text>

  <!-- Step 4 -->
  <rect x="508" y="510" width="454" height="84" rx="10" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.4"/>
