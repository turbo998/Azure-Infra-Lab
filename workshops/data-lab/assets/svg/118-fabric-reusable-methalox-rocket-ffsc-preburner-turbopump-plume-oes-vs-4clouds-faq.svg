  <text x="524" y="205" fill="#67E8F9" font-size="12.5" font-weight="800">STEP 1 · Eventhouse KQL 990K EPS 热声 FFT &amp; 尾焰 OES (7 ms)</text>
  <text x="524" y="225" fill="#F8FAFC" font-size="11.5">• $0/GB 写入税摄入 360 台发动机 100kHz 压电、涡轮泵与 OES 光谱流</text>
  <text x="524" y="244" fill="#CBD5E1" font-size="11">• series_fft() 7ms 锁定 #19 机 2,450Hz 1T 振幅 11.8% Pc (Δφ=+12.4°)</text>
  <text x="524" y="263" fill="#34D399" font-size="11" font-weight="700">• 同时捕获尾焰 Cu I 510.5nm 达 14.8 SNR (壁温 794°C) 与空化 σ=0.038</text>

