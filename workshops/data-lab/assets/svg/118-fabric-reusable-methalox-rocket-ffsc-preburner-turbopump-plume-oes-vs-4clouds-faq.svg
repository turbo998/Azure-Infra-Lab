  <text x="213" y="66" fill="#040814" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="0.8">🏆 R110 · #115 FAQ &amp; 30ms E2E MILESTONE!</text>
  <text x="384" y="66" fill="#F8FAFC" font-size="16" font-weight="800">液氧甲烷 (Methalox) 全流量分级燃烧 (FFSC) 350bar 预燃室抑振、36,000RPM 涡轮泵防空化与尾焰 OES 防烧蚀 30ms 闭环</text>
  <text x="58" y="100" fill="#94A3B8" font-size="12.5">Scenario DM · 12 座试车与发射基地 (360 台 FFSC 发动机 + 720 套深冷涡轮泵 + 480 套 100kHz 压电/OES 阵列) × 990K EPS · 3.08 亿向量 (308M!) · 1.42% Pc &amp; 618°C 零铜侵蚀 · 50 次复飞</text>

  <rect x="1156" y="46" width="226" height="64" rx="10" fill="#064E3B" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="1269" y="68" fill="#FDE68A" font-size="11.5" font-weight="800" text-anchor="middle">R110 · #115 FAQ &amp; 146.0ms MEAN!</text>
  <text x="1269" y="95" fill="#FFFFFF" font-size="19" font-weight="900" text-anchor="middle">308M Vectors · 30ms</text>

  <!-- Left Column -->
  <rect x="40" y="138" width="430" height="470" rx="14" fill="#131B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · 350bar FFSC 火箭三大物理危机与传统死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #19 发动机 2,450 Hz 第一阶切向 (1T) 热声振荡</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• 变推力节流触发 Rayleigh 热声同相耦合 (Δφ = +12.4°)</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 1T 压力振幅在 15ms 内冲上 11.8% Pc (±41.3 bar &gt; 5.0% 上限)</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 横向激波剥离低温甲烷冷却气膜，壁面热流突破 185 MW/m²</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：传统死板红线关机在着陆点火段直接导致箭体坠毁！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="344" fill="#FCA5A5" font-size="12.5" font-weight="800">② 尾焰绿光 Cu I 510.5nm 富金属烧蚀与诱导轮空化</text>
  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• GRCop-42 铜铬铌喉部壁温冲至 794°C (&gt;680°C 蠕变上限)</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 尾焰 OES 铜原子谱线跃升至 14.8 SNR (&gt;2.0 SNR 零烧蚀上限)</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• 36,000 RPM 液氧泵空化数跌至 σ=0.038 (&lt;0.055 旋转空化线)</text>
  <text x="72" y="424" fill="#F87171" font-size="11" font-weight="700">• 痛点：距离 Engine-Rich 喷管烧穿爆炸解体仅剩 100 毫秒！</text>

  <rect x="58" y="466" width="394" height="126" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($242.4K/月 vs $14.1K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：990K EPS 100kHz 压力与 OES 流月费高达 $171.8K</text>
  <text x="72" y="528" fill="#E2E8F0" font-size="11.5">• 内存税：308M 全内存 DRAM 向量索引月耗 $36.0K</text>
  <text x="72" y="548" fill="#E2E8F0" font-size="11.5">• 刷新税：Snowflake 60s 滞后 / 事后回放错失 30ms 救机窗口</text>
  <text x="72" y="570" fill="#34D399" font-size="11.5" font-weight="700">• Fabric 破局：$0/GB 写入税 + SSD DiskANN 省 92% 内存</text>

