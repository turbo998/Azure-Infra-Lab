  <rect x="508" y="292" width="454" height="104" rx="10" fill="#132F2B" stroke="#10B981" stroke-width="1.8"/>
  <text x="524" y="313" fill="#6EE7B7" font-size="12.5" font-weight="800">STEP 2 · 6 跳推进孪生 &amp; 3.08 亿向量 SSD DiskANN 检索 (8 ms)</text>
  <text x="524" y="333" fill="#F8FAFC" font-size="11.5">• 检索 308,000,000 (R110 &amp; 115-FAQ!) 热声移频、超临界气膜与空化向量</text>
  <text x="524" y="352" fill="#CBD5E1" font-size="11">• 相似度 0.99 (省 92% 内存)：富氧预燃室 O/F 混合比微调 -0.24 (移相+112°)</text>
  <text x="524" y="371" fill="#FDE68A" font-size="11" font-weight="700">• 边区液膜冷却阀 +18.5% 重建保护膜 + 贮箱自生增压 +0.32 bar 消除空化</text>

  <!-- Step 3 -->
  <rect x="508" y="408" width="454" height="90" rx="10" fill="#172554" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="524" y="429" fill="#93C5FD" font-size="12.5" font-weight="800">STEP 3 · Foundry IQ 防烧蚀与涡轮泵物理护栏 SOP-117 (8 ms)</text>
  <text x="524" y="449" fill="#F8FAFC" font-size="11.5">• 校验 1T 热声脉动压回 1.42% Pc &lt;= 5.0% 上限，声腔阻尼 +9.5%</text>
  <text x="524" y="468" fill="#CBD5E1" font-size="11">• GRCop-42 喉部壁温拉回 618°C &lt;= 680°C (尾焰 Cu I=0.18 SNR 零侵蚀)</text>
  <text x="524" y="485" fill="#34D399" font-size="11" font-weight="700">• 液氧泵空化数恢复 σ=0.074 &gt;= 0.055 · Bio-LCH4 碳减排达 -84.6%</text>

  <!-- Step 4 -->
  <rect x="508" y="510" width="454" height="84" rx="10" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.4"/>
  <text x="524" y="531" fill="#C4B5FD" font-size="12.5" font-weight="800">STEP 4 · Teams 推进总师确认 + ALDO 边缘 + FAA 复飞证 (7 ms)</text>
  <text x="524" y="551" fill="#F8FAFC" font-size="11.5">• 发射台 ALDO 边缘下发 EtherCAT/1553B 液膜冷却与预燃室伺服阀指令</text>
  <text x="524" y="570" fill="#34D399" font-size="11" font-weight="700">• 1GB 免费 SQL 签发 FAA 50次免大修复飞与 Bio-LCH4 零碳证 (30ms!)</text>

