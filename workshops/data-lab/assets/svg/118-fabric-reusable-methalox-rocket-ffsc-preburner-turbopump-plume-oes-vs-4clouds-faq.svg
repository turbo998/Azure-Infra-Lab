  <rect x="488" y="138" width="494" height="470" rx="14" fill="#0D1F33" stroke="#F59E0B" stroke-width="2"/>
  <text x="508" y="168" fill="#FDE68A" font-size="14.5" font-weight="800">02 · Microsoft Fabric 30ms 可复用火箭动力闭环 (R110!)</text>

