  <text x="1032" y="310" fill="#FDE68A" font-size="11.5" font-weight="800">• 守护 SLA 风险敞口：        $37,600,000 (R110 里程碑!)</text>

  <rect x="1018" y="338" width="364" height="126" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="1032" y="360" fill="#67E8F9" font-size="12.5" font-weight="800">双分母延迟基准 (sealed report.json R110)</text>
  <text x="1032" y="382" fill="#F8FAFC" font-size="11.5">• 路由评估矩阵 (n=484)：      483 / 484 (99.79% 准确率)</text>
  <text x="1032" y="402" fill="#34D399" font-size="11.5" font-weight="700">• 分母 A 路由矩阵算术均值：   162.0 ms (-1.0ms!)</text>
  <text x="1032" y="422" fill="#34D399" font-size="11.5" font-weight="700">• 分母 B 117大行业本体均值：  146.0 ms (-1.0ms!)</text>
  <text x="1032" y="442" fill="#CBD5E1" font-size="11">• Python 确定性单测套件：    238 / 238 (100% 通过)</text>

  <rect x="1018" y="476" width="364" height="118" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1032" y="498" fill="#FBBF24" font-size="12.5" font-weight="800">Better Together 跨云零拷贝黄金分工</text>
  <text x="1032" y="518" fill="#E2E8F0" font-size="11">• Azure HPC / Databricks：3D 超临界燃烧 LES &amp; CHT 仿真</text>
  <text x="1032" y="538" fill="#E2E8F0" font-size="11">• Snowflake / SAP：GRCop-42 3D打印粉末与商业发射 ERP</text>
  <text x="1032" y="558" fill="#34D399" font-size="11" font-weight="700">• Fabric：OneLake 零拷贝挂载 + 30ms 发射台实时控制面</text>
  <text x="1032" y="578" fill="#94A3B8" font-size="10.5">• 官方规格引用：113 条 (新增 SPEC-METHALOX-ROCKET-R110)</text>

  <!-- Bottom Strip -->
  <rect x="40" y="624" width="1360" height="240" rx="14" fill="#0E192D" stroke="#2563EB" stroke-width="1.5"/>
  <text x="60" y="654" fill="#60A5FA" font-size="14.5" font-weight="800">04 · 液氧甲烷全流量分级燃烧 (FFSC) 三大物理护栏矩阵 (SOP-117 · R110 &amp; 115-FAQ Milestone)</text>

  <rect x="60" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="76" y="694" fill="#67E8F9" font-size="13" font-weight="800">① 350bar 预燃室/主室 Rayleigh 热声移频抑振</text>
  <text x="76" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：Rayleigh 积分 ∮ p'(t)·q'(t-τ) dt &gt; 0 自激耦合</text>
  <text x="76" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：2,450Hz 1T 模态冲至 11.8% Pc (±41.3 bar)</text>
  <text x="76" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：富氧预燃室 O/F -0.24 移相 + 声腔阻尼孔 +9.5%</text>
  <text x="76" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：1T 压力振幅压回 1.42% Pc &lt;= 5.0%，避免着陆关机</text>
  <text x="76" y="800" fill="#94A3B8" font-size="11">• 变推力窗口：40%–100% 深度节流全程热声稳定</text>

  <rect x="506" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#10B981" stroke-width="1.2"/>
  <text x="522" y="694" fill="#6EE7B7" font-size="13" font-weight="800">② GRCop-42 喉部超临界甲烷气膜 &amp; 尾焰 OES 闭环</text>
  <text x="522" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：120 MW/m² 喉部极限热流与跨临界传热恶化 (HTD)</text>
  <text x="522" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：壁温 794°C 且尾焰 Cu I 510.5nm 冲至 14.8 SNR</text>
  <text x="522" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：边区液膜冷却阀 +18.5% 重建低温富燃边界层</text>
  <text x="522" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：喉部壁温锁死 618°C，尾焰 Cu I 降至 0.18 SNR</text>
  <text x="522" y="800" fill="#94A3B8" font-size="11">• 复飞寿命：单次发射 LCF 疲劳损耗 &lt;1.4%，支撑 50 次免大修</text>

  <rect x="952" y="670" width="428" height="174" rx="10" fill="#091326" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="968" y="694" fill="#FBBF24" font-size="13" font-weight="800">③ 36,000 RPM 深冷涡轮泵防空化与 Bio-LCH4 护照</text>
  <text x="968" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：诱导轮空化数 σ = (Pin - Pv)/(0.5·ρ·Utip²)</text>
  <text x="968" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：σ 跌至 0.038 引发超同步旋转空化与流量脉动</text>
  <text x="968" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：贮箱自生增压阀 +0.32 bar 恢复 σ=0.074 &gt;= 0.055</text>
  <text x="968" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：零气蚀磨损，30 分钟快速复飞数字健康证签发</text>
  <text x="968" y="800" fill="#FDE68A" font-size="11" font-weight="700">• 绿色航天：生物液态甲烷 Bio-LCH4 碳减排 -84.6% · 30ms 闭环</text>
