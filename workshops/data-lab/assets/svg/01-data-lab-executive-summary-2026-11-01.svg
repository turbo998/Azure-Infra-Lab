  <text x="80" y="510" fill="#E2E8F0" font-size="11.5">• 感知与图谱 (`328ms`)：负荷升至 18.84 MW (94.2% 合同上限) → 图谱定位 3号配电室 → B区 H200 训练集群</text>
  <text x="80" y="528" fill="#E2E8F0" font-size="11.5">• 协同优化方案：BESS 放电 2.00 MW + 推迟 2 个非关键推理批任务 1.10 MW + 液冷升温 +1.0°C (省 0.35 MW)</text>
  <text x="80" y="546" fill="#34D399" font-size="11.5" font-weight="700">• 闭环结果 (`780ms` E2E)：共削峰 3.45 MW → 负荷降至 15.39 MW (76.95%) · SOP 护栏校验通过 · 月省 $42,800</text>

