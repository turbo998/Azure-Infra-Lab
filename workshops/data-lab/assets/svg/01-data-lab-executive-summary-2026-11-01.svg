  <text x="80" y="612" fill="#E2E8F0" font-size="11.5">• 一键生成本体：从既有 Power BI 航班语义模型升级 Ontology，绑定 Eventhouse 跑道摩擦系数 (0.24 &lt; 0.30)</text>
  <text x="80" y="630" fill="#E2E8F0" font-size="11.5">• 图谱级联影响 (`164ms`)：穿透识别 T4/T8 航站楼受影响的 14 架进出港航班与 28 项除冰/行李地面任务</text>
  <text x="80" y="648" fill="#34D399" font-size="11.5" font-weight="700">• 预授权自动执行 (`640ms` E2E)：派遣 Alpha 扫雪车队 + 重分配 6 登机口 + 通知 1,840 旅客 · 延误缩减 38 分钟</text>

