  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=240 (DL-01..240) 均值 = 301.0 ms (239/240 = 99.58%)</text>
