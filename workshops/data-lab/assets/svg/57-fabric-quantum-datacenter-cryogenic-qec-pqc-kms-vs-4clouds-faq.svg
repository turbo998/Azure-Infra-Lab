  <!-- Left Column: First-Principles Pain Points -->
  <rect x="32" y="132" width="436" height="360" rx="14" fill="#111C33" stroke="#F43F5E" stroke-width="1.4"/>
  <text x="52" y="162" fill="#FDA4AF" font-size="15" font-weight="800">01 · 传统容错量子与混合超算中心三大痛点 ($156.6K/月)</text>

  <rect x="48" y="178" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 宇宙射线缪子轰击引发准粒子雪崩毁掉 72h 量子大任务</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 宇宙射线击中 15mK 硅基底致 16 比特 T1 暴跌至 9.2μs (错误率 +18.5x)</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 静态表面码解码权重失效，运行 58h 的 FeMoco 分子电路全盘作废</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 单次跨天量子相位估计 (QPE) 任务崩溃直接损失 $6.40M</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="302" fill="#FB7185" font-size="13" font-weight="700">② 6,400万条 DRAG 微波脉冲与解码权重全内存库爆炸</text>
  <text x="62" y="322" fill="#E2E8F0" font-size="11.5">• 二能级缺陷 (TLS) 随机跳变 +420kHz 导致双比特门跌破 99.9% 阈值</text>
  <text x="62" y="340" fill="#E2E8F0" font-size="11.5">• 传统离线重新跑全片 Ramsey 标定需停机数小时，打断科研流水线</text>
  <text x="62" y="358" fill="#FCA5A5" font-size="11" font-weight="700">✗ 960K EPS 综合征流与 6,400万全内存向量节点月烧 $118.6K</text>

  <rect x="48" y="382" width="404" height="94" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="404" fill="#FB7185" font-size="13" font-weight="700">③ 稀释制冷机 15 mK 微瓦级热失超 (停机 48h) 与 IP 风险</text>
  <text x="62" y="424" fill="#E2E8F0" font-size="11.5">• 盲目注入校准微波脉冲超出混合室 20μW 冷却极限引发热失超升温</text>
  <text x="62" y="442" fill="#E2E8F0" font-size="11.5">• 重新抽真空降温至 15 mK 耗时 48 小时；且分子哈密顿量严禁出机房</text>
  <text x="62" y="460" fill="#FCA5A5" font-size="11" font-weight="700">✗ 低温失超停机与主权分子专利违约风险敞口达 $9.85M</text>

