  <text x="250" y="62" fill="#F8FAFC" font-size="18.2" font-weight="800">容错量子计算与混合超算中心 (960K EPS 15mK 防失超、宇宙射线绕行与 QEC 校准) 选型：Fabric vs 四大云</text>
  <text x="48" y="94" fill="#94A3B8" font-size="12.5">32 台千比特 QPU + 10万卡 GPU · Eventhouse KQL (8ms) + SSD DiskANN 6,400万脉冲/QEC匹配 (9ms) + 量子低温孪生 + ALDO 屏蔽大厅边缘 · 33ms 闭环省 87.1% TCO</text>
