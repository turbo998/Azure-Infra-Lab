  <text x="310" y="548" fill="#34D399" font-size="11.5" font-weight="800" text-anchor="middle">11ms 强门禁 ★</text>
  <text x="400" y="548" fill="#94A3B8" font-size="11" text-anchor="middle">手工规则</text>
