  <text x="645" y="578" fill="#94A3B8" font-size="11" text-anchor="middle">纯云端</text>

  <rect x="60" y="596" width="628" height="38" rx="6" fill="#062E22" stroke="#10B981" stroke-width="1"/>
  <text x="74" y="620" fill="#6EE7B7" font-size="11.5" font-weight="800">12 颗中继星 + 8 座南极舱 + 140 台漫游车月度 TCO：Fabric $11,100/月 vs 传统栈 $118,100/月（直降 90.6%）</text>

  <!-- Row 2 Right: TCO Inflection & Dual-Denominator Governance -->
  <rect x="728" y="400" width="672" height="250" rx="14" fill="#0E1733" stroke="#1E293B" stroke-width="1.5"/>
  <text x="748" y="428" fill="#818CF8" font-size="14" font-weight="800">04 · 月度 TCO 拆解（省 $107,000/月）与 70 轮里程碑双分母治理</text>

  <text x="748" y="456" fill="#F8FAFC" font-size="12" font-weight="700">Microsoft Fabric (F64 共享容量 + 1.48 亿 SSD DiskANN + 地月孪生 + ALDO) — $11,100 / mo</text>
  <rect x="748" y="464" width="118" height="16" rx="8" fill="#10B981"/>
  <text x="876" y="476" fill="#34D399" font-size="12" font-weight="800">省 90.6% (月省 $107,000 · 全栈口径 $28.4K vs $302.1K)</text>

  <text x="748" y="502" fill="#CBD5E1" font-size="11.5">传统拼装栈 (880K EPS 按点位遥测 $79.0K + 98节点内存向量 $23.8K + 独立图/BI $15.3K) — $118,100 / mo</text>
  <rect x="748" y="510" width="610" height="14" rx="7" fill="#EF4444"/>

  <rect x="748" y="536" width="632" height="98" rx="8" fill="#091024" stroke="#334155" stroke-width="1.2"/>
  <text x="764" y="556" fill="#A5B4FC" font-size="11.5" font-weight="800">🔍 严格双分母与数据溯源披露 (70-Round Milestone · reports/report.json)</text>
  <text x="764" y="575" fill="#E2E8F0" font-size="11">• 分母 A（全量路由矩阵）：n = 324 场景 (DL-01..DL-324)，通过率 323 / 324 (99.69%)，算术均值 = 228.5 ms (R69 n=320 为 231.0 ms)</text>
  <text x="764" y="593" fill="#E2E8F0" font-size="11">• 分母 B（行业本体闭环）：n = 77 仿真 (Scenario A..BY)，端到端算术均值 = 195.0 ms (R69 n=76 为 197.0 ms；Scenario BY = 43 ms)</text>
  <text x="764" y="611" fill="#34D399" font-size="11" font-weight="700">• 本地实测：158 / 158 Python 单元测试 100% 通过 (measured_local_harness) · 73 条官方规格链接核验</text>

