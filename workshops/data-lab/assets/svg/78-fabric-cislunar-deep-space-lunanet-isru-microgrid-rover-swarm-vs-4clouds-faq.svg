  <text x="1084" y="216" fill="#E2E8F0" font-size="10.5">• 检索 1.48 亿条三体星历、5cm 地形与 MRE 热向量</text>
  <text x="1084" y="232" fill="#E2E8F0" font-size="10.5">• LN-Sat-04 +0.14m/s 修轨 + 16 车驶入玄武岩熔岩管</text>
  <text x="1084" y="248" fill="#C084FC" font-size="10.5" font-weight="700">• 4 台 1,600°C 电解炉降功 -65% 至 63kW 保温不凝固</text>

  <rect x="748" y="278" width="310" height="92" rx="8" fill="#091024" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="762" y="298" fill="#FBBF24" font-size="12" font-weight="800">③ Foundry IQ 生命支持与防翻车门禁 (11 ms)</text>
  <text x="762" y="316" fill="#E2E8F0" font-size="10.5">• 校核《CISLUNAR-ISRU-MICROGRID-SOP-077》</text>
  <text x="762" y="332" fill="#E2E8F0" font-size="10.5">• 基地电池剩余电量 SoC = 44.2% &gt;= 35.0% 绝对底线</text>
  <text x="762" y="348" fill="#FBBF24" font-size="10.5" font-weight="700">• 避险路径最大坡度 11.4° &lt;= 15.0° 且切换 FPGA TMR</text>

  <rect x="1070" y="278" width="310" height="92" rx="8" fill="#062E22" stroke="#10B981" stroke-width="1.2"/>
  <text x="1084" y="298" fill="#34D399" font-size="12" font-weight="800">④ 飞控联签 + ALDO 月面 DTN 闭环 (11 ms)</text>
  <text x="1084" y="316" fill="#E2E8F0" font-size="10.5">• 飞行主管 Teams 联签 + 月面 ALDO 断网自治代理</text>
  <text x="1084" y="332" fill="#E2E8F0" font-size="10.5">• 经 CCSDS Bundle Protocol v7 (DTN) 下发轨控与断路器</text>
  <text x="1084" y="348" fill="#6EE7B7" font-size="10.5" font-weight="700">• 0 漫游车死机 · 0 炉膛凝固 · 守护 $23.60M 登月 SLA</text>

