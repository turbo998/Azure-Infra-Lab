  <text x="205" y="66" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">DATA LAB · 2026-11-14 R70 · 70-ROUND MILESTONE!</text>
  <text x="368" y="66" fill="#F8FAFC" font-size="16" font-weight="800">地月空间深空导航（LunaNet）、月球南极原位资源（ISRU）微电网与漫游车蜂群选型 FAQ</text>
  <text x="58" y="98" fill="#A5B4FC" font-size="12.5">Microsoft Fabric (Eventhouse KQL 880K EPS 10ms 质量瘤/质子风暴感知 + Cosmos SSD DiskANN 11ms 1.48亿三体星历/地形匹配 + ALDO 月面边缘) vs 四大云</text>
  <rect x="1156" y="46" width="224" height="60" rx="10" fill="#062E22" stroke="#10B981" stroke-width="1.5"/>
  <text x="1268" y="68" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BY · 12 中继星 + 140 漫游车</text>
  <text x="1268" y="94" fill="#FFFFFF" font-size="17.5" font-weight="800" text-anchor="middle">43ms 闭环 · 省 90.6% TCO</text>

  <!-- Row 1 Left: Pain Points vs First-Principles Breakthrough -->
  <rect x="40" y="136" width="668" height="248" rx="14" fill="#0E1733" stroke="#1E293B" stroke-width="1.5"/>
  <text x="60" y="164" fill="#818CF8" font-size="14" font-weight="800">01 · 第一性原理痛点拆解：为什么 30 分钟地面星历批处理救不了月面漫游车与制氧微电网？</text>

  <rect x="60" y="178" width="628" height="60" rx="8" fill="#2A1215" stroke="#EF4444" stroke-width="1.2"/>
  <text x="76" y="198" fill="#FCA5A5" font-size="12" font-weight="800">❌ 传统架构痛点：2.56s 地月延迟 + 质量瘤引力偏航 + 太阳质子风暴与日食抽干电池 (`$118.1K/月`)</text>
  <text x="76" y="216" fill="#FECACA" font-size="11">• 月球质量瘤引发 +18.4 mGal 引力异常；S3 级太阳质子事件 (1,450 PFU) 叠加阴影坑失联，导致漫游车 FPGA 翻转或滑下陡坡</text>
  <text x="76" y="231" fill="#FECACA" font-size="11">• 环形山日食遮挡期间，1,600°C 熔融月壤电解炉 (MRE) 若停电则炉渣凝固报废，若满功率则抽空基地生命支持 (ECLSS) 电池</text>

  <rect x="60" y="248" width="628" height="60" rx="8" fill="#062E22" stroke="#10B981" stroke-width="1.2"/>
  <text x="76" y="268" fill="#6EE7B7" font-size="12" font-weight="800">✅ Fabric 破局：10ms KQL 多普勒/质子斜率 + 11ms 1.48 亿向量检索 + ALDO 月面边缘 (`$11.1K/月`)</text>
  <text x="76" y="286" fill="#D1FAE5" font-size="11">• Eventhouse KQL $0/GB 写入税摄入 880K EPS 遥测，series_fit_line() 10ms 提前 28 分钟捕获太阳质子陡升与 +18.4 mGal 漂移</text>
  <text x="76" y="301" fill="#D1FAE5" font-size="11">• Cosmos SSD DiskANN 11ms 检索 1.48 亿条三体晕轨道、5cm 激光点云与电解热平衡向量（省 92% 内存）：16 车入熔岩管 + MRE 保温</text>

  <rect x="60" y="316" width="628" height="54" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="76" y="335" fill="#93C5FD" font-size="11.5" font-weight="800">🤝 互补共存 (Better Together)：十万条 BLT 转移轨道蒙特卡洛积分 vs 43ms 实时地月闭环</text>
  <text x="76" y="353" fill="#E2E8F0" font-size="11">• GMAT / STK 1200 阶引力场 N 体积分归 Databricks/Azure HPC；CLPS 载荷合同归 Snowflake/SAP；43ms 闭环归 Fabric</text>

  <!-- Row 1 Right: 43ms 4-Step Closed Loop -->
  <rect x="728" y="136" width="672" height="248" rx="14" fill="#0E1733" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="748" y="164" fill="#22D3EE" font-size="14" font-weight="800">02 · Scenario BY：43ms 质量瘤修轨、熔岩管避辐射与月面微电网保命闭环 (`DL-321..324`)</text>

  <rect x="748" y="178" width="310" height="90" rx="8" fill="#091024" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="762" y="198" fill="#22D3EE" font-size="12" font-weight="800">① Eventhouse KQL 流式感知 (10 ms)</text>
  <text x="762" y="216" fill="#E2E8F0" font-size="10.5">• 880K EPS S/Ka 多普勒 + 粒子剂量计 + 漫游车 LiDAR</text>
  <text x="762" y="232" fill="#E2E8F0" font-size="10.5">• 锁定 LN-Sat-04 +18.4 mGal 质量瘤漂移 (+42m)</text>
  <text x="762" y="248" fill="#34D399" font-size="10.5" font-weight="700">• 提前 28m 捕获 1,450 PFU 质子风暴与山峰日食阴影</text>

