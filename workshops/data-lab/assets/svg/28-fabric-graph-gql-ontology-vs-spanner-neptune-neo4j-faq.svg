  <text x="70" y="174" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">❌ Legacy: Standalone Graph DB Silo + Nightly CSV Export ($37,900/mo · T+1 Lag)</text>

  <rect x="70" y="190" width="588" height="68" rx="8" fill="#2D1622" stroke="#7F1D1D"/>
  <text x="86" y="213" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 24×7 All-in-RAM Graph Instance &amp; License Tax ($24,500/mo + $7,400/mo ETL)</text>
  <text x="86" y="233" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Hosting 85M nodes &amp; 1.2B edges in dedicated Neptune / Neo4j SPCS requires costly high-RAM instances.</text>
  <text x="86" y="250" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Nightly export ETL from Lakehouse to Graph DB lags by 12–24h, missing same-day shell companies.</text>

  <rect x="70" y="268" width="588" height="78" rx="8" fill="#2D1622" stroke="#7F1D1D"/>
  <text x="86" y="291" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Relational SQL `WITH RECURSIVE` Hits a Wall at 8 Hops (46.8 Seconds / OOM)</text>
  <text x="86" y="311" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Full-table hash joins explode exponentially across 8 hops (avg degree 14), timing out inline AML checks.</text>
  <text x="86" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Truncating queries at 3 hops misses 58.3% of deep Marshall/Cayman circular UBO ownership rings.</text>

  <rect x="70" y="356" width="588" height="82" rx="8" fill="#2D1622" stroke="#7F1D1D"/>
  <text x="86" y="379" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Security Amnesia in DIY GraphRAG ($6,000/mo Vector + Graph Sync Overhead)</text>
  <text x="86" y="399" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exporting lakehouse tables into external Cypher/Gremlin stores strips OneLake RLS/CLS permissions.</text>
  <text x="86" y="418" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Multi-hop GraphRAG neighbor expansion leaks restricted executive nodes to unauthorized users.</text>

