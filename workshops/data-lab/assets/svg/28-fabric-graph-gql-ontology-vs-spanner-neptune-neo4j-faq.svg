  <text x="52" y="96" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Enterprise Graph &amp; ISO GQL: Fabric Graph &amp; IQ Ontology vs. Spanner Graph / Neptune / Neo4j SPCS</text>
  <text x="52" y="122" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Zero-Copy CSR Adjacency Graph over OneLake Delta (85M Nodes / 1.2B Edges) · 60ms 8-Hop ISO GQL UBO Carousel Traversal · -75.2% Graph TCO ($9.4K vs $37.9K/mo)</text>

