  <text x="746" y="311" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• `MATCH p=(c:Company)-[:CONTROLS|ENDORSES|SHIPS_TO*1..8]-&gt;(w:Watchlist)` runs in 60ms.</text>
  <text x="746" y="330" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Isolates 24-shell-company sanctions carousel (68.4% UBO stake &gt; 25% threshold) with 100% recall.</text>

