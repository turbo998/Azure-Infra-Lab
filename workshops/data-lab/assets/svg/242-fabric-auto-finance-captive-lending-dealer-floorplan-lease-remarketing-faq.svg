  <text x="46" y="48" fill="#E0F2FE" font-size="13" font-weight="700" letter-spacing="1.2">DATA LAB · SCENARIO IG · ROUND 234 (CONSECUTIVE) · 242 PALINDROME SVG · 528=T32 CASES · 128=2⁷ SIMS (121.52ms) · 260 ROUND-TEN TESTS</text>
  <text x="46" y="76" fill="#FFFFFF" font-size="22" font-weight="800">全球汽车金融、主机厂专属金融（Captive）、经销商库融与退租残值重营销选型 · Auto Finance &amp; Floorplan</text>
  <text x="46" y="99" fill="#A7F3D0" font-size="13.5" font-weight="600">18,500 家经销商 · 1,450万车贷租约 · $285B 资产 · 精确 1,100K (1.10M) EPS 流 · 8.50亿 (0.85B) 向量 · 16ms (4²ms) 闭环 · 净省 -$478.1K/月 (-96.6%)</text>

  <!-- Left Column: Sources & 4-Step 16ms Closed Loop -->
  <rect x="24" y="126" width="880" height="568" rx="14" fill="url(#fab242)" stroke="#10B981" stroke-width="1.8"/>
  <text x="44" y="156" fill="#6EE7B7" font-size="16" font-weight="800">🏆 Microsoft Fabric 主导架构：Eventhouse 4ms + 850M SSD DiskANN 4ms + Foundry IQ 4ms + 4ms = 16ms (4²ms)</text>

  <!-- Step 1 -->
  <rect x="44" y="172" width="840" height="118" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.4"/>
  <rect x="58" y="186" width="94" height="26" rx="6" fill="#0284C7"/>
  <text x="105" y="204" fill="#FFFFFF" font-size="12.5" font-weight="800" text-anchor="middle">STEP 1 · 4ms</text>
  <text x="166" y="204" fill="#F8FAFC" font-size="15" font-weight="800">Eventhouse KQL 精确 1,100K (1.10M) EPS 展厅/车联网/拍卖流 + OneLake 零拷贝 ($0/GB 流税 &amp; $0 复制税)</text>
  <text x="58" y="230" fill="#CBD5E1" font-size="12.5">• 实时流：RouteOne/Dealertrack 展厅 F&amp;I 车贷申请 + 车联网里程/围栏遥测 + 经销商 RFID 盘点 + Manheim/ADESA 二手车拍卖出价</text>
  <text x="58" y="251" fill="#CBD5E1" font-size="12.5">• 零拷贝镜像：FIS / Alfa / Defi Solutions 信贷租约核心主档、经销商 DMS 结算表与 SAP S/4HANA 总账 (立省 $188,400/月)</text>
  <text x="58" y="274" fill="#34D399" font-size="12.5" font-weight="700">✓ 4ms 精准锁定 805 个展厅秒级结构化反报价、经销商库融离场异常与退租车上游直售波次</text>

  <!-- Step 2 -->
  <rect x="44" y="302" width="840" height="122" rx="10" fill="#0F172A" stroke="#818CF8" stroke-width="1.4"/>
  <rect x="58" y="316" width="94" height="26" rx="6" fill="#4F46E5"/>
  <text x="105" y="334" fill="#FFFFFF" font-size="12.5" font-weight="800" text-anchor="middle">STEP 2 · 4ms</text>
  <text x="166" y="334" fill="#F8FAFC" font-size="15" font-weight="800">Azure SQL SSD DiskANN (8.50亿=0.85B 防伪/360°验车/残值向量) + 湖内 PREDICT ($4,300/月 vs $104.4K DRAM)</text>
  <text x="58" y="360" fill="#CBD5E1" font-size="12.5">• 850,000,000 向量：收入证明字体篡改/合成身份图谱特征 + 360° 退租验车划痕损伤图像切片 + Black Book/MMR 细分配置残值曲线</text>
  <text x="58" y="381" fill="#CBD5E1" font-size="12.5">• NVMe SSD DiskANN 量化索引将内存占用降低 -92% (精确 $4,300/月，单向量硬件即净省 $100,100/月 &gt;$100K! 淘汰 6.80TB DRAM)</text>
  <text x="58" y="406" fill="#A5B4FC" font-size="12.5" font-weight="700">✓ 4ms 完成 LTV/PTI 最优反报价与上游拍卖底价寻优：签约捕获率与残值回收提升精确 +42.0%，年增收节支 +$84.5M/年</text>

  <!-- Step 3 -->
  <rect x="44" y="436" width="840" height="122" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.4"/>
  <rect x="58" y="450" width="94" height="26" rx="6" fill="#D97706"/>
  <text x="105" y="468" fill="#FFFFFF" font-size="12.5" font-weight="800" text-anchor="middle">STEP 3 · 4ms</text>
  <text x="166" y="468" fill="#F8FAFC" font-size="15" font-weight="800">Foundry IQ 三重汽车金融硬门禁 (SOP-242) + Purview OBO 经销商隔离 (25,200 名核保/经销商 $0 席位费)</text>
  <text x="58" y="494" fill="#CBD5E1" font-size="12.5">• 门禁 1 (ECOA 公平信贷 Reg B)：强制剥离人口统计代理变量，严锁经销商利率加点 (Dealer Markup) 上限并生成合规拒贷原因码</text>
  <text x="58" y="515" fill="#CBD5E1" font-size="12.5">• 门禁 2 &amp; 3 (库融 SOT 防空卖 + SCRA 军人/破产防违规拖车)：质押车离场&gt;72h未回款自动锁额度；拖车前实时核验国防部 DMDC 与破产令</text>
  <text x="58" y="540" fill="#FCD34D" font-size="12.5" font-weight="700">✓ 4ms 物理拦截精确 365 次 (365天全年守护!) 利率歧视/库融空卖挪用/违规拖车风险 (+$19.20M 保护!)，对 25,200 人执行 RLS</text>

  <!-- Step 4 -->
  <rect x="44" y="570" width="840" height="108" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.4"/>
  <rect x="58" y="584" width="94" height="26" rx="6" fill="#059669"/>
  <text x="105" y="602" fill="#FFFFFF" font-size="12.5" font-weight="800" text-anchor="middle">STEP 4 · 4ms</text>
  <text x="166" y="602" fill="#F8FAFC" font-size="15" font-weight="800">首席风控官 (CRO) 与车贷副总裁 Teams 审批卡 + RouteOne 秒批回写 / 库融冻结 + 1GB 免费 SQL 审计落库</text>
  <text x="58" y="628" fill="#CBD5E1" font-size="12.5">• 风控官确认后，4ms 内向 RouteOne 下发结构化反报价、锁定异常经销商库融提车并在 Manheim 上架直售，写入 1GB 免费 Fabric SQL</text>
