<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 940" width="1480" height="940" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad181" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071120"/>
      <stop offset="50%" stop-color="#0C1B33"/>
      <stop offset="100%" stop-color="#081526"/>
    </linearGradient>
    <linearGradient id="headerGrad181" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="fabricBoxGrad181" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#0A1E32"/>
    </linearGradient>
    <linearGradient id="compBoxGrad181" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A1215"/>
      <stop offset="100%" stop-color="#1E0D10"/>
    </linearGradient>
    <filter id="shadow181" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1480" height="940" fill="url(#bgGrad181)"/>

  <!-- Header Banner -->
  <rect x="24" y="18" width="1432" height="92" rx="14" fill="url(#headerGrad181)" filter="url(#shadow181)"/>
  <text x="46" y="54" fill="#FFFFFF" font-size="21.5" font-weight="800">👗 R173 · Luxury, Apparel &amp; Footwear In-Season OTB, Store RFID Size Rebalancing &amp; Return Fraud (18ms E2E · 181st SVG)</text>
  <text x="46" y="81" fill="#E0F2FE" font-size="13.5" font-weight="600">Scenario FX (DL-733..DL-736): 8,600 Stores + 65,000 Style-Color-Size SKUs · 995K EPS UHF RFID &amp; Return-Camera Stream + 560M Garment/Auth Vectors · 18ms (5+4+4+5) E2E · $59.65M SLA</text>
  <rect x="1216" y="34" width="222" height="58" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="1327" y="58" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="800">18ms (5+4+4+5) E2E</text>
  <text x="1327" y="79" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">560M Vectors · -$346.6K/mo</text>

  <!-- Left Column: Enterprise Pain Points & 4-Step 18ms Loop -->
  <rect x="24" y="124" width="930" height="500" rx="14" fill="url(#fabricBoxGrad181)" stroke="#0EA5E9" stroke-width="1.8" filter="url(#shadow181)"/>
  <text x="44" y="156" fill="#38BDF8" font-size="17" font-weight="800">🏗️ Microsoft Fabric Unified Merchandising (OTB), Store RFID &amp; VIC Clienteling Loop (18ms E2E)</text>
  <text x="44" y="177" fill="#94A3B8" font-size="12.5">OneLake Zero-Copy SAP S/4HANA Fashion + Centric PLM + 995K EPS Store UHF RFID (EPC Gen2) &amp; Return Inspection ($0/GB Write Tax)</text>

  <!-- Step 1 -->
  <rect x="44" y="192" width="890" height="94" rx="10" fill="#0B192C" stroke="#0284C7" stroke-width="1.4"/>
  <rect x="56" y="204" width="92" height="26" rx="6" fill="#0284C7"/>
  <text x="102" y="222" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 1 · 5ms</text>
  <text x="162" y="221" fill="#F8FAFC" font-size="14.5" font-weight="700">Eventhouse KQL + Activator: 5ms Fitting-Room RFID Core-Size Stockout &amp; Return Spike Sense ($0/GB Tax)</text>
  <text x="56" y="245" fill="#CBD5E1" font-size="12.5">• Ingests 995,000 EPS UHF RFID tag reads across 8,600 stores (fitting-room smart mirrors, shelves, backrooms) and e-commerce wishlists.</text>
  <text x="56" y="266" fill="#38BDF8" font-size="12.5" font-weight="600">• Eliminates $132,800/mo in per-GB RFID streaming fees; isolates 320 flagship stores with broken core sizes (M/L &amp; EU 42) in 5ms.</text>

  <!-- Step 2 -->
  <rect x="44" y="298" width="890" height="94" rx="10" fill="#0B192C" stroke="#10B981" stroke-width="1.4"/>
  <rect x="56" y="310" width="92" height="26" rx="6" fill="#059669"/>
  <text x="102" y="328" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 2 · 4ms</text>
  <text x="162" y="327" fill="#F8FAFC" font-size="14.5" font-weight="700">Cosmos DB SSD DiskANN (560M Garment/Micro-Weave Vectors) + In-Lake PREDICT Size Rebalancing (4ms!)</text>
  <text x="56" y="351" fill="#CBD5E1" font-size="12.5">• Queries 560,000,000 garment micro-weave signatures, RFID TIDs &amp; return photos via SSD DiskANN (-92% RAM at $3,060/mo vs $70,400/mo DRAM).</text>
  <text x="56" y="372" fill="#34D399" font-size="12.5" font-weight="600">• Generates 28,000 inter-store size transfers &amp; quick-response OTB re-orders (+14.8% full-price sell-through, -9.2% markdown depth) in 4ms.</text>

  <!-- Step 3 -->
  <rect x="44" y="404" width="890" height="94" rx="10" fill="#0B192C" stroke="#F59E0B" stroke-width="1.4"/>
  <rect x="56" y="416" width="92" height="26" rx="6" fill="#D97706"/>
  <text x="102" y="434" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 3 · 4ms</text>
  <text x="162" y="433" fill="#F8FAFC" font-size="14.5" font-weight="700">Foundry IQ Counterfeit/Wardrobing Return Block, Icon Price Floor &amp; VIC Privacy Gate (SOP-180 · 4ms!)</text>
  <text x="56" y="457" fill="#CBD5E1" font-size="12.5">• Validates LUXURY-APPAREL-MERCHANDISING-RFID-RETURNS-SOP-180: matches return-bay macro images against pre-shipment micro-weave signatures,</text>
  <text x="56" y="478" fill="#FBBF24" font-size="12.5" font-weight="600">• Blocks 78 counterfeit tag-swap / wardrobing returns (+$2.85M recovered), enforces 0% discount on Carry-Over Icons &amp; VIC OBO RLS in 4ms.</text>

  <!-- Step 4 -->
  <rect x="44" y="510" width="890" height="98" rx="10" fill="#0B192C" stroke="#8B5CF6" stroke-width="1.4"/>
  <rect x="56" y="522" width="92" height="26" rx="6" fill="#7C3AED"/>
  <text x="102" y="540" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 4 · 5ms</text>
  <text x="162" y="539" fill="#F8FAFC" font-size="14.5" font-weight="700">Teams Chief Merchandising Officer Card + SAP S/4HANA Fashion STO, VIC Clienteling &amp; 1GB SQL Commit (5ms)</text>
  <text x="56" y="563" fill="#CBD5E1" font-size="12.5">• Dispatches 28,000 SAP Stock Transport Orders (STOs), pushes mobile Teams VIC stylist appointment alerts, and updates store ALDO edge in 5ms.</text>
  <text x="56" y="584" fill="#C4B5FD" font-size="12.5" font-weight="600">• Total E2E: 5ms + 4ms + 4ms + 5ms = 18ms Symmetrical Loop! Protects $59.65M SLA &amp; saves -$346,600/mo (-95.9% TCO).</text>

  <!-- Right Column: Competitor Stitched Anti-Patterns -->
  <rect x="974" y="124" width="482" height="500" rx="14" fill="url(#compBoxGrad181)" stroke="#EF4444" stroke-width="1.8" filter="url(#shadow181)"/>
  <text x="994" y="156" fill="#FCA5A5" font-size="16.5" font-weight="800">⛔ Stitched Multi-Cloud Apparel &amp; Luxury Anti-Patterns</text>
  <text x="994" y="177" fill="#F87171" font-size="12.5">$361.3K/mo TCO · Broken Size Curves &amp; Unchecked Return Fraud</text>

  <rect x="994" y="194" width="442" height="94" rx="10" fill="#180A0C" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1010" y="217" fill="#FCA5A5" font-size="13.5" font-weight="700">1. Per-GB Store RFID &amp; Clickstream Taxes ($132.8K/mo)</text>
  <text x="1010" y="239" fill="#E2E8F0" font-size="12">• Streaming 995K EPS of UHF RFID reads across 8,600 stores</text>
  <text x="1010" y="258" fill="#E2E8F0" font-size="12">  into per-GB cloud pipelines incurs $132.8K/mo and misses</text>
  <text x="1010" y="276" fill="#FCA5A5" font-size="12" font-weight="600">  weekend fitting-room size-stockout drop-offs.</text>

  <rect x="994" y="300" width="442" height="94" rx="10" fill="#180A0C" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1010" y="323" fill="#FCA5A5" font-size="13.5" font-weight="700">2. 4.20TB DRAM Vector Cluster ($70.4K/mo vs $3,060/mo)</text>
  <text x="1010" y="345" fill="#E2E8F0" font-size="12">• Indexing 560,000,000 garment micro-weave signatures, tech</text>
  <text x="1010" y="364" fill="#E2E8F0" font-size="12">  packs, and return photos in RAM-only HNSW clusters costs</text>
  <text x="1010" y="382" fill="#FCA5A5" font-size="12" font-weight="600">  $70,400/mo and fails to stop $2.85M in counterfeit swaps.</text>

  <rect x="994" y="406" width="442" height="94" rx="10" fill="#180A0C" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1010" y="429" fill="#FCA5A5" font-size="13.5" font-weight="700">3. SAP Fashion CDC &amp; 24/7 Endpoint Tax ($81.8K/mo)</text>
  <text x="1010" y="451" fill="#E2E8F0" font-size="12">• Replicating SAP S/4HANA Fashion Style-Color-Size grids and</text>
  <text x="1010" y="470" fill="#E2E8F0" font-size="12">  running 24/7 inference endpoints across 65K SKUs wastes</text>
  <text x="1010" y="488" fill="#FCA5A5" font-size="12" font-weight="600">  $81.8K/mo vs $0 OneLake Mirroring &amp; $0 idle In-Lake PREDICT.</text>

  <rect x="994" y="512" width="442" height="96" rx="10" fill="#180A0C" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1010" y="535" fill="#FCA5A5" font-size="13.5" font-weight="700">4. Per-User BI Seats for 13,800 Stylists &amp; Buyers ($76.3K/mo)</text>
  <text x="1010" y="557" fill="#E2E8F0" font-size="12">• Licensing BI seats for 13,800 merchandisers, allocators, and</text>
  <text x="1010" y="576" fill="#E2E8F0" font-size="12">  store VIC clienteling advisors costs $76.3K/mo vs $0 Power BI</text>
  <text x="1010" y="594" fill="#FCA5A5" font-size="12" font-weight="600">  Viewer + native Excel Direct Lake on Fabric F64+.</text>

  <!-- Bottom Section: 5-Cloud TCO & Decision Matrix -->
  <rect x="24" y="640" width="1432" height="278" rx="14" fill="#091526" stroke="#334155" stroke-width="1.5" filter="url(#shadow181)"/>
  <text x="44" y="672" fill="#F8FAFC" font-size="16.5" font-weight="800">📊 5-Cloud Luxury, Apparel &amp; Footwear Merchandising, RFID &amp; Returns Matrix (8,600 Stores · 995K EPS · 560M Vectors · 13,800 Users)</text>

  <!-- Table Header -->
  <rect x="44" y="686" width="1392" height="32" rx="6" fill="#1E293B"/>
  <text x="58" y="707" fill="#38BDF8" font-size="12.5" font-weight="800">Platform / Architecture</text>
  <text x="340" y="707" fill="#38BDF8" font-size="12.5" font-weight="800">Store RFID &amp; SAP Fashion</text>
  <text x="605" y="707" fill="#38BDF8" font-size="12.5" font-weight="800">560M Garment/Return Vectors</text>
  <text x="860" y="707" fill="#38BDF8" font-size="12.5" font-weight="800">Size PREDICT &amp; VIC BI</text>
  <text x="1145" y="707" fill="#38BDF8" font-size="12.5" font-weight="800">Monthly TCO &amp; Verdict</text>

  <!-- Row 1: Fabric -->
  <rect x="44" y="722" width="1392" height="36" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="58" y="745" fill="#6EE7B7" font-size="12.5" font-weight="800">Microsoft Fabric (F64 Pooled)</text>
  <text x="340" y="745" fill="#FFFFFF" font-size="12" font-weight="600">Eventhouse + OneLake ($0 Tax · 5ms)</text>
  <text x="605" y="745" fill="#6EE7B7" font-size="12" font-weight="700">SSD DiskANN (-92% RAM · $3,060/mo)</text>
  <text x="860" y="745" fill="#FFFFFF" font-size="12" font-weight="600">+14.8% Sell-Through · $0 Viewer (13.8K)</text>
  <text x="1145" y="745" fill="#6EE7B7" font-size="12.5" font-weight="800">$14.7K/mo (-95.9% · 18ms E2E!)</text>

  <!-- Row 2: AWS -->
  <rect x="44" y="762" width="1392" height="32" rx="4" fill="#0F172A"/>
  <text x="58" y="783" fill="#E2E8F0" font-size="12" font-weight="700">AWS Kinesis + OpenSearch + Redshift</text>
  <text x="340" y="783" fill="#CBD5E1" font-size="12">Kinesis + MSK ($83.5K/mo)</text>
  <text x="605" y="783" fill="#FCA5A5" font-size="12">OpenSearch 4.20TB RAM ($70.4K/mo)</text>
  <text x="860" y="783" fill="#CBD5E1" font-size="12">SageMaker + QuickSight ($88.9K/mo)</text>
  <text x="1145" y="783" fill="#FCA5A5" font-size="12" font-weight="700">$242.8K/mo (+$228.1K/mo)</text>

  <!-- Row 3: GCP -->
  <rect x="44" y="798" width="1392" height="32" rx="4" fill="#131E32"/>
  <text x="58" y="819" fill="#E2E8F0" font-size="12" font-weight="700">Google BigQuery + Vertex Vision</text>
  <text x="340" y="819" fill="#CBD5E1" font-size="12">Pub/Sub + BQ Slots ($93.5K/mo)</text>
  <text x="605" y="819" fill="#FCA5A5" font-size="12">Vertex Vector Search RAM ($72.8K/mo)</text>
  <text x="860" y="819" fill="#CBD5E1" font-size="12">Vertex Endpoints + Looker ($105.9K/mo)</text>
  <text x="1145" y="819" fill="#FCA5A5" font-size="12" font-weight="700">$272.2K/mo (+$257.5K/mo)</text>

  <!-- Row 4: Databricks -->
  <rect x="44" y="834" width="1392" height="32" rx="4" fill="#0F172A"/>
  <text x="58" y="855" fill="#E2E8F0" font-size="12" font-weight="700">Databricks Lakeflow + Mosaic AI</text>
  <text x="340" y="855" fill="#CBD5E1" font-size="12">DLT + Photon Streaming ($107.5K/mo)</text>
  <text x="605" y="855" fill="#FCA5A5" font-size="12">Mosaic Vector Search ($75.2K/mo)</text>
  <text x="860" y="855" fill="#CBD5E1" font-size="12">Fivetran SAP + BI Seats ($121.9K/mo)</text>
  <text x="1145" y="855" fill="#FCA5A5" font-size="12" font-weight="700">$304.6K/mo (+$289.9K/mo)</text>

  <!-- Row 5: Snowflake -->
  <rect x="44" y="870" width="1392" height="32" rx="4" fill="#131E32"/>
  <text x="58" y="891" fill="#E2E8F0" font-size="12" font-weight="700">Snowflake Retail Cloud + Cortex</text>
  <text x="340" y="891" fill="#CBD5E1" font-size="12">Snowpipe Streaming ($132.8K/mo)</text>
  <text x="605" y="891" fill="#FCA5A5" font-size="12">Cortex Vector + XL WH ($70.4K/mo)</text>
  <text x="860" y="891" fill="#CBD5E1" font-size="12">Fivetran SAP + BI ($158.1K/mo)</text>
  <text x="1145" y="891" fill="#FCA5A5" font-size="12" font-weight="700">$361.3K/mo (-$346.6K/mo Saved!)</text>
</svg>
