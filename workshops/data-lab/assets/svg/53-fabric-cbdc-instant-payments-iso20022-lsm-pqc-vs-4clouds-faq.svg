  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 28 家清算行 $4.82B 环形排队死锁 (Liquidity Gridlock)</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 14:30 高峰 A 等 B、B 等 C 致 1,420 笔 ($4.82B) 卡死队列</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 传统关系库导出至外部图库耗时数分钟，无法毫秒级解环</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 被迫向央行高息拆借 $4.51B 日间透支额度，年损失数千万</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
