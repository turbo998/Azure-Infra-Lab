  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=224 (DL-01..224) 均值 = 321.0 ms (223/224 = 99.55%)</text>
