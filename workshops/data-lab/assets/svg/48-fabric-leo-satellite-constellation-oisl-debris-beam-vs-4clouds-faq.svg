  <!-- Header Banner -->
  <rect x="32" y="24" width="1376" height="92" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="48" y="42" width="186" height="28" rx="6" fill="url(#hdrGrad48)"/>
  <text x="141" y="61" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">DATA LAB · ROUND 40 FAQ</text>
  <text x="250" y="62" fill="#F8FAFC" font-size="18.5" font-weight="800">商业航天低轨星座 (6,400 星)、星间激光 850K EPS、空间碎片避碰与 H3 波束跳频选型：Fabric vs 四大云</text>
  <text x="48" y="94" fill="#94A3B8" font-size="12.5">6,400 颗 LEO 卫星 + 140 座信关站 · Eventhouse KQL H3 850K EPS (4ms) + SSD DiskANN 5,400万轨控/频谱匹配 (5ms) + ALDO 极地站边缘 · 19ms 闭环省 85.2% TCO</text>
  <rect x="1204" y="38" width="186" height="64" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1297" y="62" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario AU · 203/204 (99.51%)</text>
  <text x="1297" y="86" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">19ms · 省 85.2% TCO</text>

  <!-- Left Column: First-Principles Pain Points -->
  <rect x="32" y="132" width="436" height="360" rx="14" fill="#111C33" stroke="#F43F5E" stroke-width="1.4"/>
  <text x="52" y="162" fill="#FDA4AF" font-size="15" font-weight="800">01 · 传统低轨星座地面段三大痛点 ($117.6K/月 · T+6h 盲区)</text>

  <rect x="48" y="178" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 6,400 星 CCSDS 与 OISL 激光遥测 850K EPS 按 GB 税</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 星载姿态/电推进/激光微弧度误差 + 140 座信关站每秒 85 万事件</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 传统云流与时序库按写入 GB / 测点计费月烧 $72,000+</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 降频采样导致无法提前捕获星间激光 PAT 跟瞄机构微失锁</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="302" fill="#FB7185" font-size="13" font-weight="700">② G4 太阳风暴大气阻力 +380% 致 T+6h 批处理定轨失准</text>
  <text x="62" y="322" fill="#E2E8F0" font-size="11.5">• 热层膨胀致 SAT-4108 与火箭残骸交会缩至 62m (Pc = 4.2e-3)</text>
  <text x="62" y="340" fill="#E2E8F0" font-size="11.5">• 等 6 小时批处理积分算完时卫星已飞出极地信关站上注弧段</text>
  <text x="62" y="358" fill="#FCA5A5" font-size="11" font-weight="700">✗ 一旦以 14 km/s 撞毁将损失 $6.5M 卫星并引发凯斯勒碎片云</text>

  <rect x="48" y="382" width="404" height="94" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="404" fill="#FB7185" font-size="13" font-weight="700">③ 变轨期间跨洋航空断网与 ITU-R 赤道 GSO 射频干扰</text>
  <text x="62" y="424" fill="#E2E8F0" font-size="11.5">• 卫星偏转点火若不提前切流将中断 480 架跨洋客机宽带</text>
  <text x="62" y="442" fill="#E2E8F0" font-size="11.5">• 相控阵波束跳频若切入赤道同步轨道 18° 禁区将导致 EPFD 超标</text>
  <text x="62" y="460" fill="#FCA5A5" font-size="11" font-weight="700">✗ 违反《ITU Radio Regulations Art.22》面临频谱停波重罚</text>

  <!-- Center Column: Fabric 19ms Closed-Loop Architecture -->
  <rect x="486" y="132" width="484" height="360" rx="14" fill="#0F2238" stroke="#10B981" stroke-width="1.8"/>
  <text x="506" y="162" fill="#6EE7B7" font-size="15" font-weight="800">02 · Microsoft Fabric 太空数字孪生 19ms 闭环架构</text>

  <rect x="504" y="178" width="448" height="68" rx="9" fill="#0B192C" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="518" y="199" fill="#38BDF8" font-size="12.5" font-weight="800">Step 1 (4ms) · Eventhouse KQL H3 850K EPS 大气阻尼与交会感知</text>
  <text x="518" y="218" fill="#E2E8F0" font-size="11.2">• $0/GB 写入税融合双频 GPS 残差与 18th SDS CDM，反演大气阻力 +380%</text>
  <text x="518" y="235" fill="#93C5FD" font-size="11">• 锁定 SAT-4108 与残骸 #DEB-99204 62m 极近交会 (Pc = 4.2e-3 &gt;&gt; 1e-4)</text>

  <rect x="504" y="254" width="448" height="72" rx="9" fill="#0B192C" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="518" y="275" fill="#C4B5FD" font-size="12.5" font-weight="800">Step 2 (5ms) · SSD DiskANN 5,400万摄动匹配与 OISL/H3 波束重路由</text>
  <text x="518" y="294" fill="#E2E8F0" font-size="11.2">• 5,400万条轨道协方差向量检索 (0.98 相似，省92%内存)，算出 +0.18 m/s 变轨</text>
  <text x="518" y="312" fill="#DDD6FE" font-size="11">• 480 架客机 OISL 激光流无感切至 SAT-4109/4208 + 重分配 84 个 H3 波束</text>

  <rect x="504" y="334" width="448" height="68" rx="9" fill="#0B192C" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="518" y="355" fill="#FDE68A" font-size="12.5" font-weight="800">Step 3 (5ms) · Foundry IQ NASA CARA 避碰与 ITU-R Art.22 护栏</text>
  <text x="518" y="374" fill="#E2E8F0" font-size="11.2">• 核验 SOP-047：抬轨 +320m 后交会扩至 2,850m (Pc=1.2e-7)，72h 零二次交会</text>
  <text x="518" y="391" fill="#FDE68A" font-size="11">• 84 个 Ka 波束相对赤道 GSO 隔离角 21.4° &gt;= 18.0° 红线 (EPFD 完全合规)</text>

  <rect x="504" y="410" width="448" height="68" rx="9" fill="#064E3B" stroke="#10B981" stroke-width="1.4"/>
  <text x="518" y="431" fill="#6EE7B7" font-size="12.5" font-weight="800">Step 4 (5ms) · 斯瓦尔巴极地站 ALDO 上注霍尔点火与波束掩码</text>
  <text x="518" y="450" fill="#F8FAFC" font-size="11.2">• 飞控总师 Teams 联签 Confirm → ALDO 极地边缘赶在出站前上注 +0.18 m/s 点火</text>
  <text x="518" y="467" fill="#A7F3D0" font-size="11" font-weight="700">✓ 端到端 19ms 自愈 (0ms 航空断网) · 守护 $13.10M 卫星、航空 SLA 与频谱</text>

