  <text x="1018" y="324" fill="#E2E8F0" font-size="11.2">• 按分钟租用物理抛物面测控天线 → AWS Ground Station / Orbital</text>
  <text x="1018" y="342" fill="#E2E8F0" font-size="11.2">• 原始 SAR 合成孔径雷达 / 高光谱图像训练 → Databricks GPU</text>
  <text x="1018" y="360" fill="#93C5FD" font-size="11" font-weight="700">• 解调 CCSDS 遥测流与视觉模型通过 OneLake 零拷贝回挂</text>

  <rect x="1004" y="386" width="388" height="90" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1018" y="408" fill="#FBBF24" font-size="12.5" font-weight="800">⚠️ 竞对局限与避坑指南 (Anti-Patterns)</text>
  <text x="1018" y="428" fill="#E2E8F0" font-size="11.2">• 严禁靠 T+6h 批处理定轨应对地磁暴期间的近地空间碎片告警</text>
  <text x="1018" y="446" fill="#E2E8F0" font-size="11.2">• 严禁在未排空星间激光流量前直接偏转卫星姿态执行推进器点火</text>
  <text x="1018" y="464" fill="#FDE68A" font-size="11" font-weight="700">• 严禁在未校验赤道 GSO 18° 隔离角前动态跳频相控阵波束</text>

  <!-- Bottom Row Left: Quantitative TCO Comparison -->
  <rect x="32" y="510" width="684" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="52" y="540" fill="#38BDF8" font-size="15" font-weight="800">04 · 定量 TCO 对比 (6,400 颗低轨卫星 + 140 信关站 · 850K EPS · 1,800 用户)</text>

  <rect x="52" y="558" width="644" height="68" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="68" y="582" fill="#6EE7B7" font-size="13.5" font-weight="800">🏆 Microsoft Fabric (F64 + Eventhouse H3 + SSD DiskANN + Twin + ALDO)</text>
  <text x="68" y="606" fill="#E2E8F0" font-size="12">内部全量: $17,400/月 · 500人归一化: $8,000/月 ($0/GB 写入税 + SSD DiskANN 省92%内存 + $0 Viewer)</text>
  <rect x="520" y="570" width="160" height="42" rx="8" fill="#022C22"/>
  <text x="600" y="596" fill="#34D399" font-size="15" font-weight="800" text-anchor="middle">省 85.2% TCO</text>

  <rect x="52" y="638" width="644" height="58" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="68" y="662" fill="#F8FAFC" font-size="13" font-weight="700">Databricks + 第三方时序库 + 内存 Vector Search</text>
  <text x="68" y="683" fill="#94A3B8" font-size="11.5">内部全量: $95,400/月 · 500人归一化: $43,900/月 (常驻 Streaming DBU + 内存向量节点 + BI 消耗)</text>

  <rect x="52" y="706" width="644" height="58" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="68" y="730" fill="#F8FAFC" font-size="13" font-weight="700">AWS 拼接栈 (Kinesis + Timestream + OpenSearch + QuickSight)</text>
  <text x="68" y="751" fill="#94A3B8" font-size="11.5">内部全量: $117,600/月 · 500人归一化: $54,100/月 (按流量与时序点计费 + 内存向量 + BI 席位)</text>

  <rect x="52" y="774" width="644" height="74" rx="10" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="68" y="798" fill="#7DD3FC" font-size="12.5" font-weight="800">💡 $13.10M 风险敞口保护拆解 (Scenario AU 定量收益)：</text>
  <text x="68" y="818" fill="#E2E8F0" font-size="11.5">• 规避 SAT-4108 撞击碎片损毁与补发成本：$6.50M · 守护北大西洋 480 架客机与 120 艘邮轮零断网 SLA：$3.80M</text>
  <text x="68" y="836" fill="#6EE7B7" font-size="11.5" font-weight="700">• 严格控制 84 个跳频波束 GSO 隔离角 21.4° (&gt;=18°) 规避 ITU-R Art.22 频谱违规与停波罚单：$2.80M</text>

  <!-- Bottom Row Right: Dual-Denominator & Production Checklist -->
  <rect x="734" y="510" width="674" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="754" y="540" fill="#FBBF24" font-size="15" font-weight="800">05 · 双分母基准对账 (R40) 与生产落地核验清单 (Architect Checklist)</text>

  <rect x="754" y="556" width="634" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="770" y="578" fill="#34D399" font-size="12.5" font-weight="800">📊 严格区分两大延迟分母 (Dual-Denominator Reconciliation · 2026-11-13 R40)</text>
  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=204 (DL-01..204) 均值 = 346.0 ms (203/204 = 99.51%)</text>
  <text x="770" y="618" fill="#F8FAFC" font-size="11.5">• 分母 B (行业本体端到端仿真均值 ontology_simulations[])：n=47 (场景 A..AU，范围 5–780ms) 均值 = 295.0 ms</text>
  <text x="770" y="636" fill="#93C5FD" font-size="11">• 本轮新增 Scenario AU 端到端延迟 = 19 ms (4ms 感知 + 5ms DiskANN/光路由 + 5ms CARA/ITU 护栏 + 5ms 上注) · 98/98 单测通过</text>

  <rect x="754" y="658" width="634" height="190" rx="10" fill="#0B192C" stroke="#334155" stroke-width="1"/>
  <text x="770" y="682" fill="#7DD3FC" font-size="13" font-weight="800">🛠️ 售前打单与生产落地 5 步核验清单 (Production Checklist)：</text>
  <text x="770" y="706" fill="#E2E8F0" font-size="11.5">☑ 1. CCSDS 与 CDM 流直通：6,400 星遥测与 18th SDS 交会报文直推 Eventhouse (12:1 压缩，$0/GB 写入税)</text>
  <text x="770" y="730" fill="#E2E8F0" font-size="11.5">☑ 2. Eventhouse KQL H3 波束索引：用 geo_point_to_h3cell() 将相控阵波束与航空 ADS-B/海事 AIS 内存连接</text>
  <text x="770" y="754" fill="#E2E8F0" font-size="11.5">☑ 3. Cosmos SSD DiskANN 5,400万摄动库：地磁暴轨道协方差与射频干扰谱建索引，P99 检索 &lt; 8ms</text>
  <text x="770" y="778" fill="#E2E8F0" font-size="11.5">☑ 4. 极地信关站 ALDO 断网自治：斯瓦尔巴/阿拉斯加部署 SQL on Azure Local 保障海缆中断时本地上注</text>
  <text x="770" y="802" fill="#E2E8F0" font-size="11.5">☑ 5. NASA CARA 与 ITU-R Art.22 护栏 (SOP-047)：72h 零二次碰撞 (Pc &lt;= 1e-6)，赤道 GSO 隔离角 &gt;= 18.0°</text>
  <text x="770" y="830" fill="#6EE7B7" font-size="11" font-weight="700">🔗 关联代码与密封证据：src/data_lab/benchmark_suite.py · tests/test_data_lab.py (98/98) · reports/report.json</text>
