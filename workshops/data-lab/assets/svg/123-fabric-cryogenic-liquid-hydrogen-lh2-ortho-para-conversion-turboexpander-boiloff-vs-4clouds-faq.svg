  <text x="1032" y="310" fill="#FDE68A" font-size="11.5" font-weight="800">• 守护 SLA 风险敞口：        $39,350,000 ($39.35M)</text>

  <rect x="1018" y="338" width="364" height="126" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="1032" y="360" fill="#67E8F9" font-size="12.5" font-weight="900">🏆 第115轮 &amp; 120篇FAQ &amp; 20ms大关 (report.json R115)</text>
  <text x="1032" y="382" fill="#FFFFFF" font-size="12" font-weight="800">• 路由评估矩阵 (n=504)：    503 / 504 (99.80% 准确率!)</text>
  <text x="1032" y="402" fill="#34D399" font-size="11.5" font-weight="700">• 分母 A 路由矩阵算术均值： 157.0 ms (-1.0ms!)</text>
