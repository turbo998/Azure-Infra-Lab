  <rect x="40" y="624" width="1360" height="240" rx="14" fill="#0E192D" stroke="#2563EB" stroke-width="1.5"/>
  <text x="60" y="654" fill="#60A5FA" font-size="14.5" font-weight="800">04 · -253°C 深冷液氢 (LH2) 正仲转化、120,000 RPM 磁悬浮透平与管路预冷三大物理护栏矩阵 (SOP-122 · 20ms Milestone)</text>

  <rect x="60" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="76" y="694" fill="#67E8F9" font-size="13" font-weight="800">① 正仲氢 (o-H2 → p-H2) 量子自旋催化防自沸腾</text>
  <text x="76" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：转化热 703 kJ/kg = 1.58 × 汽化潜热 446 kJ/kg</text>
  <text x="76" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：#09A 床微氮冰晶遮蔽致仲氢跌至 93.8% (9.2%蒸发)</text>
  <text x="76" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：无扰切入 #09B 活化床 + 前级 50K 冷氦 +11.5%</text>
  <text x="76" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：出塔仲氢锁死 99.48%，球罐日蒸发率 0.06%/天</text>
  <text x="76" y="800" fill="#94A3B8" font-size="11">• 品质保障：全面满足 ISO 14687 与商用氢能航空长周期储运</text>

  <rect x="506" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#10B981" stroke-width="1.2"/>
  <text x="522" y="694" fill="#6EE7B7" font-size="13" font-weight="800">② 120,000 RPM 主动磁悬浮透平膨胀机防喘振抑振</text>
  <text x="522" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：背压微升触发叶轮失速与 0.42x 亚同步气动涡动</text>
  <text x="522" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：#14 透平 840Hz 涡动冲至 24.5 μm (&gt;15.0 μm 红线)</text>
  <text x="522" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：可变导叶 IGV +6.8% + 回流 +4.5% + AMB 反相阻尼</text>
  <text x="522" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：转子轴心轨迹压回 3.8 μm &lt;= 15.0 μm，0 触碰</text>
  <text x="522" y="800" fill="#94A3B8" font-size="11">• 管路保护：VJTL 脉冲预冷将两相间歇泉脉动压至 0.42 bar</text>

  <rect x="952" y="670" width="428" height="174" rx="10" fill="#091326" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="968" y="694" fill="#FBBF24" font-size="13" font-weight="800">③ 6.42 kWh/kg 极低比电耗与欧盟 RFNBO 液氢护照</text>
  <text x="968" y="716" fill="#E2E8F0" font-size="11.5">• 能效优化：多级冷箱夹点对齐将液化比电耗压至 6.42 kWh/kg</text>
  <text x="968" y="736" fill="#E2E8F0" font-size="11.5">• 绿色合规：欧盟 RFNBO 逐小时绿电匹配与零 BOG 放空证明</text>
  <text x="968" y="756" fill="#E2E8F0" font-size="11.5">• 海空加注：40,000m³ 液氢运输船与氢动力客机免抽检直充</text>
  <text x="968" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：1GB 免费 SQL 签发 RFNBO 与 ISO 14687 护照</text>
  <text x="968" y="800" fill="#FDE68A" font-size="11" font-weight="700">• 里程碑：R115 · 120篇FAQ · 20ms闭环 · 省 94.4% TCO</text>
