  <text x="1032" y="228" fill="#F8FAFC" font-size="11.5">• Microsoft Fabric 归一化：  $14,200 / 月 (基准最优)</text>
  <rect x="1032" y="234" width="52" height="10" rx="5" fill="#10B981"/>
  <text x="1032" y="258" fill="#CBD5E1" font-size="11.5">• 四云拼装栈归一化：         $252,000 / 月 (贵 17.7x)</text>
  <rect x="1032" y="264" width="320" height="10" rx="5" fill="#EF4444"/>
