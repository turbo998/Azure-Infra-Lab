  <rect x="58" y="48" width="350" height="26" rx="13" fill="url(#cyan123)"/>
  <text x="233" y="66" fill="#040814" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="0.8">🏆 R115 · #120 FAQ &amp; 20ms E2E MILESTONE!</text>
  <text x="424" y="66" fill="#F8FAFC" font-size="16" font-weight="800">-253°C 深冷液氢 (LH2) 正仲氢催化转化防蒸发、120,000 RPM 磁悬浮透平防喘振与管路防间歇泉 20ms 闭环</text>
  <text x="58" y="100" fill="#94A3B8" font-size="12.5">Scenario DR · 14 座 100TPD 液氢基地 (280 台 12万转磁悬浮透平 + 420 级正仲催化床 + 85 座 5,000m³ 球罐) × 990K EPS · 3.28 亿向量 (328M!) · 99.48% 仲氢 &amp; 3.8μm 轴振 · 6.42kWh/kg</text>

  <rect x="1146" y="46" width="236" height="64" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
  <text x="1264" y="68" fill="#6EE7B7" font-size="11.5" font-weight="900" text-anchor="middle">503 / 504 = 99.80% (R115!)</text>
  <text x="1264" y="95" fill="#FFFFFF" font-size="19" font-weight="900" text-anchor="middle">328M Vectors · 20ms</text>

  <!-- Left Column -->
  <rect x="40" y="138" width="430" height="470" rx="14" fill="#131B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · -253°C 深冷液氢三大物理危机与传统死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #09A 正仲催化床微氮冰晶失活与 1.58x 自沸腾炸弹</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• 正氢转仲氢放热 703 kJ/kg，是液氢汽化潜热 (446 kJ/kg) 1.58 倍</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 微量氮冰晶遮蔽 Fe(OH)3 位点，出塔仲氢跌至 93.8% (&lt;98.5%)</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 6.2% 残余正氢入罐后自发缓慢放热，煮沸蒸发 9.2% 液氢库存</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：离线 TCD-GC 需 20min，早已污染整座 5,000m³ 球罐！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="344" fill="#FCA5A5" font-size="12.5" font-weight="800">② #14 120,000 RPM 磁悬浮透平喘振与 VJTL 间歇泉液击</text>
  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• 冷箱背压波动诱发 12万转透平 840Hz 亚同步涡动 (24.5 μm)</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 突破 15.0 μm 磁轴承安全线，逼近保护轴承高速抱轴碎裂</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• 加注真空管路 (VJTL) 预冷泰勒气泡逆流爆裂产生 18.5 bar 液击</text>
  <text x="72" y="424" fill="#F87171" font-size="11" font-weight="700">• 痛点：一旦砸毁 12万转转子或震裂波纹管，停产损失超 $1.1M！</text>

  <rect x="58" y="466" width="394" height="126" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($252.0K/月 vs $14.2K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：990K EPS 拉曼/100kHz 磁轴承/冷箱流月费 $179.8K</text>
  <text x="72" y="528" fill="#E2E8F0" font-size="11.5">• 内存税：328M 全内存 DRAM 向量索引月耗 $38.5K</text>
  <text x="72" y="548" fill="#E2E8F0" font-size="11.5">• 刷新税：Snowflake 60s 滞后 / 20min 离线色谱完全失明</text>
  <text x="72" y="570" fill="#34D399" font-size="11.5" font-weight="700">• Fabric 破局：$0/GB 写入税 + SSD DiskANN 省 92% 内存</text>

