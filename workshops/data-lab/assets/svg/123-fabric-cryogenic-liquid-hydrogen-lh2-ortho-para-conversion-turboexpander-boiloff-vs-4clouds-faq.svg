  <text x="524" y="205" fill="#67E8F9" font-size="12.5" font-weight="800">STEP 1 · Eventhouse KQL 990K EPS 拉曼与磁轴承感知 (5 ms)</text>
  <text x="524" y="225" fill="#F8FAFC" font-size="11.5">• $0/GB 写入税摄入 280 台 12万转透平、420 级催化床与 VJTL 流</text>
  <text x="524" y="244" fill="#CBD5E1" font-size="11">• series_fit_line() 5ms 捕获 #09A 床 S0(0)/S0(1) 仲氢跌至 93.8%</text>
  <text x="524" y="263" fill="#34D399" font-size="11" font-weight="700">• series_fft() 同时锁定 #14 透平 840Hz 亚同步涡动冲至 24.5 μm</text>

  <!-- Step 2 -->
  <rect x="508" y="292" width="454" height="104" rx="10" fill="#132F2B" stroke="#10B981" stroke-width="1.8"/>
  <text x="524" y="313" fill="#6EE7B7" font-size="12.5" font-weight="800">STEP 2 · 6 跳深冷孪生 &amp; 3.28 亿向量 SSD DiskANN 检索 (5 ms)</text>
  <text x="524" y="333" fill="#F8FAFC" font-size="11.5">• 检索 328,000,000 (🏆 R115 &amp; 120篇FAQ!) 正仲催化/喘振/两相流向量</text>
  <text x="524" y="352" fill="#CBD5E1" font-size="11">• 相似度 0.99 (省 92% 内存)：无扰切入 #09B 床 + 50K 冷氦 +11.5%</text>
  <text x="524" y="371" fill="#FDE68A" font-size="11" font-weight="700">• 透平 IGV +6.8% &amp; AMB 反相电磁阻尼 + VJTL 三阶脉冲气体预冷</text>

  <!-- Step 3 -->
  <rect x="508" y="408" width="454" height="90" rx="10" fill="#172554" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="524" y="429" fill="#93C5FD" font-size="12.5" font-weight="800">STEP 3 · Foundry IQ ISO 14687 与防喘振护栏 SOP-122 (5 ms)</text>
  <text x="524" y="449" fill="#F8FAFC" font-size="11.5">• 校验出塔液氢仲氢纯度恢复 99.48% &gt;= 98.50%，日蒸发率 0.06%/d</text>
  <text x="524" y="468" fill="#CBD5E1" font-size="11">• 12万转磁轴承轴振压回 3.8 μm &lt;= 15.0 μm，VJTL 脉动 0.42 bar</text>
  <text x="524" y="485" fill="#34D399" font-size="11" font-weight="700">• 液化综合比电耗锁死 6.42 kWh/kg &lt;= 6.80 kWh/kg (节电 -24.0%)</text>

  <!-- Step 4 -->
  <rect x="508" y="510" width="454" height="84" rx="10" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.4"/>
  <text x="524" y="531" fill="#C4B5FD" font-size="12.5" font-weight="800">STEP 4 · Teams 深冷总监确认 + ALDO 边缘 + RFNBO 护照 (5 ms)</text>
  <text x="524" y="551" fill="#F8FAFC" font-size="11.5">• 防爆区 ALDO 边缘下发低温切床阀、IGV 导叶与 AMB 控制器指令</text>
  <text x="524" y="570" fill="#34D399" font-size="11" font-weight="700">• 1GB 免费 SQL 签发欧盟 RFNBO 与航空液氢护照 (总耗时 20ms!)</text>

