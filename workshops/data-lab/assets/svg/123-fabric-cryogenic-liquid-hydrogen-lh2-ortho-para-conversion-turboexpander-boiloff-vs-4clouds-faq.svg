  <text x="1032" y="518" fill="#E2E8F0" font-size="11">• Azure HPC / Databricks：冷箱多相 CFD &amp; 正仲催化 DFT</text>
  <text x="1032" y="538" fill="#E2E8F0" font-size="11">• Snowflake / SAP：绿电 PPA、液氢船队与航空加注 ERP</text>
  <text x="1032" y="558" fill="#34D399" font-size="11" font-weight="700">• Fabric：OneLake 零拷贝挂载 + 20ms 防爆区实时控制面</text>
  <text x="1032" y="578" fill="#94A3B8" font-size="10.5">• 官方规格引用：118 条 (新增 SPEC-CRYOGENIC-LH2-R115)</text>

