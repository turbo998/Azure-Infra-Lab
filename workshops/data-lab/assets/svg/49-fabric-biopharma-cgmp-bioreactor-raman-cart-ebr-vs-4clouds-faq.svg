  <text x="770" y="802" fill="#E2E8F0" font-size="11.5">☑ 5. ICH Q8、CAR-T CoI 与 21 CFR Part 11 护栏 (SOP-048)：设计空间内调参，DIN 四重校验且温度 &lt; -150°C</text>
  <text x="770" y="830" fill="#6EE7B7" font-size="11" font-weight="700">🔗 关联代码与密封证据：src/data_lab/benchmark_suite.py · tests/test_data_lab.py (100/100) · reports/report.json</text>
