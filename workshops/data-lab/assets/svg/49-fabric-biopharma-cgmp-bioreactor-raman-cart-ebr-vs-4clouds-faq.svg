  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 2,000L 反应器离线 HPLC 抽检滞后 4h 与按测点天价税</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 葡萄糖耗竭诱发高甘露糖 Man5 糖基化漂移，等 4h 化验已晚</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 1,400 波数通道在线拉曼光谱 (680K EPS) 按 Tag 计费月烧 $74K+</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 单罐 2,000L 商业化双抗药液报废直接损失 $4.2M–$5.0M</text>

