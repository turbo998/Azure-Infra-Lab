  <text x="770" y="706" fill="#E2E8F0" font-size="11.5">☑ 1. 在线拉曼 PAT 与液氮流直通：1,400 波数光谱与冷链遥测直推 Eventhouse (12:1 压缩，$0/GB 写入税)</text>
