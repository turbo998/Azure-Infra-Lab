  <text x="518" y="374" fill="#E2E8F0" font-size="11.2">• 核验 SOP-048：补糖后渗透压 298 mOsm/kg 处于 ICH Q8 批准设计空间 (280–320)</text>
  <text x="518" y="391" fill="#FDE68A" font-size="11">• 核验 CoI-DIN-994821 四重签名 100% 匹配且液氮罐温度从未高于 -150°C 红线</text>

