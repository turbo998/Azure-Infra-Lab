  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=208 (DL-01..208) 均值 = 341.0 ms (207/208 = 99.52%)</text>
  <text x="770" y="618" fill="#F8FAFC" font-size="11.5">• 分母 B (行业本体端到端仿真均值 ontology_simulations[])：n=48 (场景 A..AV，范围 5–780ms) 均值 = 289.0 ms</text>
  <text x="770" y="636" fill="#93C5FD" font-size="11">• 本轮新增 Scenario AV 端到端延迟 = 7 ms (1ms 感知 + 2ms DiskANN/eBR + 2ms ICHQ8/Part11 护栏 + 2ms 回写) · 100/100 单测通过</text>

