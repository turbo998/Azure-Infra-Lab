  <rect x="44" y="36" width="1352" height="82" rx="14" fill="#131F38" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="64" y="50" width="236" height="24" rx="12" fill="url(#headerGrad6)"/>
  <text x="182" y="66" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">ARCHITECTURE PILLAR 06 · 2026</text>
  <text x="314" y="68" fill="#F8FAFC" font-size="20" font-weight="800">Rayfin SDK 全栈智能体应用 × 跨工作区 Eventhouse 可观测性 × OneLake IQ Sharing 架构</text>
  <text x="64" y="100" fill="#94A3B8" font-size="12.5">Rayfin SDK/CLI (TS Functions + Secret Store + Private-by-Default) · Single Eventhouse 18-Workspace FinOps RCA · OneLake IQ Sharing RDF · vs Lakeflow RT / Horizon Context / BigQuery GQL / Bedrock GraphRAG</text>

  <!-- Plane 1: Rayfin SDK & Power BI Agentic App Stack -->
  <rect x="44" y="136" width="436" height="450" rx="14" fill="#111C33" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="64" y="154" width="396" height="34" rx="8" fill="#172554"/>
  <text x="262" y="176" fill="#60A5FA" font-size="13.5" font-weight="800" text-anchor="middle">Plane 1 · Rayfin SDK 全栈应用 &amp; 1GB 免费 SQL</text>

  <rect x="64" y="202" width="396" height="86" rx="10" fill="#0F172A" stroke="#2563EB" stroke-width="1.2"/>
  <text x="80" y="224" fill="#93C5FD" font-size="12.5" font-weight="800">1. 开源 Rayfin SDK &amp; CLI (Fabric Apps 生产就绪)</text>
  <text x="80" y="244" fill="#E2E8F0" font-size="11.5">• 新增 TypeScript 后端函数、Secret Store、PostgreSQL/SQL 直连</text>
  <text x="80" y="264" fill="#34D399" font-size="11" font-weight="700">• 默认私有访问 (Private-by-Default) + 免容器托管一键部署</text>

  <rect x="64" y="300" width="396" height="88" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="80" y="322" fill="#34D399" font-size="12.5" font-weight="800">2. Power BI Agentic App Creation + 1GB 免费 SQL</text>
  <text x="80" y="342" fill="#E2E8F0" font-size="11.5">• 从 2000万+ 语义模型用自然语言一键生成带 Write-back 业务应用</text>
  <text x="80" y="360" fill="#E2E8F0" font-size="11.5">• 向 Pro / PPU / Fabric 容量用户免费附赠最高 1GB Fabric SQL</text>
  <text x="80" y="378" fill="#60A5FA" font-size="11" font-weight="700">• 终结“看报表 → 导出 Excel → 切系统手填”的流程断层</text>

  <rect x="64" y="400" width="396" height="92" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <text x="80" y="422" fill="#F97316" font-size="12.5" font-weight="800">3. 对比四大竞对应用开发与语义连接栈</text>
  <text x="80" y="442" fill="#CBD5E1" font-size="11">• vs Databricks Apps + Lakebase (偏向 Python/研发态，缺免费业务 SQL)</text>
  <text x="80" y="460" fill="#CBD5E1" font-size="11">• vs Snowflake Horizon Context (预览期连接器，缺原生 Write-back 应用)</text>
  <text x="80" y="478" fill="#CBD5E1" font-size="11">• vs AWS QuickSight Q + Bedrock (无内置免费 OLTP 回写库)</text>

  <rect x="64" y="514" width="396" height="54" rx="8" fill="#172554"/>
  <text x="80" y="535" fill="#F8FAFC" font-size="11.5" font-weight="700">基准验证 (DL-04, DL-33 &amp; 场景 E)：</text>
  <text x="80" y="553" fill="#34D399" font-size="11">490ms 完成 Rayfin TS 后端函数路由与 1GB Fabric SQL 审计回写</text>

  <!-- Plane 2: Cross-Workspace Eventhouse Observability & FinOps -->
  <rect x="502" y="136" width="436" height="450" rx="14" fill="#111C33" stroke="#A855F7" stroke-width="1.5"/>
  <rect x="522" y="154" width="396" height="34" rx="8" fill="#2E1065"/>
  <text x="720" y="176" fill="#C084FC" font-size="13.5" font-weight="800" text-anchor="middle">Plane 2 · 跨工作区 Eventhouse 可观测与按需弹性</text>

  <rect x="522" y="202" width="396" height="86" rx="10" fill="#0F172A" stroke="#A855F7" stroke-width="1.2"/>
  <text x="538" y="224" fill="#C084FC" font-size="12.5" font-weight="800">1. Workspace Monitoring → 单一 Eventhouse 汇聚</text>
  <text x="538" y="244" fill="#E2E8F0" font-size="11.5">• 18+ 生产工作区遥测、CU 消耗与慢查询统一汇入单一 Eventhouse</text>
  <text x="538" y="264" fill="#34D399" font-size="11" font-weight="700">• Monitor Hub 容量余量 (Capacity Headroom) + Activator 秒级告警</text>

  <rect x="522" y="300" width="396" height="88" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="538" y="322" fill="#38BDF8" font-size="12.5" font-weight="800">2. Operations Agent RCA + Database Agent 联合调优</text>
  <text x="538" y="342" fill="#E2E8F0" font-size="11.5">• Operations Agent 自动定位 114.8% CU 过载元凶 (Q-8841 笛卡尔积)</text>
  <text x="538" y="360" fill="#E2E8F0" font-size="11.5">• Database Agent for SQL 自动注入 DiskANN 向量与复合索引提示</text>
  <text x="538" y="378" fill="#34D399" font-size="11" font-weight="700">• On-Demand Billing 按需突发 (+16 CU) + Zero-Provisioned 零预置</text>

  <rect x="522" y="400" width="396" height="92" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <text x="538" y="422" fill="#FBBF24" font-size="12.5" font-weight="800">3. 对比四大竞对可观测性与弹性计费</text>
  <text x="538" y="442" fill="#CBD5E1" font-size="11">• vs Databricks Lakeflow System Tables GA (仅限流水线表，缺 BI/SQL 统一余量)</text>
  <text x="538" y="460" fill="#CBD5E1" font-size="11">• vs GCP BigQuery Fluid Scaling (缺预授权 RCA 修复智能体)</text>
  <text x="538" y="478" fill="#CBD5E1" font-size="11">• vs AWS Redshift AI-Driven Scaling (单组件扩缩，缺跨湖仓全栈视图)</text>

  <rect x="522" y="514" width="396" height="54" rx="8" fill="#2E1065"/>
  <text x="538" y="535" fill="#F8FAFC" font-size="11.5" font-weight="700">基准验证 (DL-24, DL-34 &amp; 场景 E)：</text>
  <text x="538" y="553" fill="#C084FC" font-size="11">590ms 将 F64 容量负载从 114.8% 压降至 71.2% (-43.6%)，规避 $28.4K 罚金</text>

  <!-- Plane 3: OneLake IQ Sharing RDF & Multimodal Graph Interop -->
  <rect x="960" y="136" width="436" height="450" rx="14" fill="#111C33" stroke="#10B981" stroke-width="1.5"/>
