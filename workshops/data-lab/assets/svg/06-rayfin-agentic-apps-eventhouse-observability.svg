  <text x="1178" y="176" fill="#34D399" font-size="13.5" font-weight="800" text-anchor="middle">Plane 3 · OneLake IQ Sharing &amp; 多模态图谱对标</text>

  <rect x="980" y="202" width="396" height="86" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="996" y="224" fill="#34D399" font-size="12.5" font-weight="800">1. OneLake IQ Sharing 跨组织语义生态网络</text>
  <text x="996" y="244" fill="#E2E8F0" font-size="11.5">• 共享受治理表 + 文件 + Markdown 智能体指令 + RDF 本体</text>
  <text x="996" y="264" fill="#60A5FA" font-size="11" font-weight="700">• EY、S&amp;P Global、TomTom、Financial Fabric、xMentium 首批集成</text>

  <rect x="980" y="300" width="396" height="88" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="996" y="322" fill="#60A5FA" font-size="12.5" font-weight="800">2. Fabric IQ Ontology Graph vs BigQuery GQL / Bedrock GraphRAG</text>
  <text x="996" y="342" fill="#E2E8F0" font-size="11.5">• BigQuery ObjectRefs + GQL 与 Bedrock GraphRAG 聚焦检索侧建图</text>
  <text x="996" y="360" fill="#E2E8F0" font-size="11.5">• Fabric IQ 直接从 2000万+ Power BI 模型升级实体+关系+规则+动作</text>
  <text x="996" y="378" fill="#34D399" font-size="11" font-weight="700">• 联合 Foundry IQ 多模态 RAG (+36% 相关性) 与 Work IQ (-80% Token)</text>

  <rect x="980" y="400" width="396" height="92" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <text x="996" y="422" fill="#F8FAFC" font-size="12.5" font-weight="800">3. 选择性分支 CI/CD 与细粒度 Git 治理 (GA/Preview)</text>
  <text x="996" y="442" fill="#CBD5E1" font-size="11">• Selective Branching + 文件级 Git Commit + Item 级权限隔离</text>
  <text x="996" y="460" fill="#CBD5E1" font-size="11">• Enhanced Catalog Search API 支持跨语义模型表与本体实体检索</text>
  <text x="996" y="478" fill="#CBD5E1" font-size="11">• 主权云全面 GA：SQL on Azure Local + ALDO + Fabric GCC High</text>

  <rect x="980" y="514" width="396" height="54" rx="8" fill="#064E3B"/>
  <text x="996" y="535" fill="#F8FAFC" font-size="11.5" font-weight="700">基准验证 (DL-35 &amp; DL-36)：</text>
  <text x="996" y="553" fill="#34D399" font-size="11">530ms–550ms 完成跨云多模态图谱推理与零预置 FinOps 选型路由</text>

  <!-- Bottom Flow Bar: Scenario E End-to-End 5-Stage Trace -->
  <rect x="44" y="604" width="1352" height="216" rx="14" fill="#111C33" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="64" y="632" fill="#60A5FA" font-size="14" font-weight="800">场景 E 端到端闭环实测轨迹：18 工作区容量尖峰 RCA 与 Rayfin 全栈智能体应用自愈 (`finops_rayfin_observability` · 590ms · 省 $28,400)</text>

