  <text x="78" y="670" fill="#60A5FA" font-size="12" font-weight="800">Stage 1 · 跨区遥测感知 (108ms)</text>
  <text x="78" y="690" fill="#E2E8F0" font-size="11">• 18 个工作区日志汇入单一 Eventhouse</text>
  <text x="78" y="706" fill="#E2E8F0" font-size="11">• Monitor Hub 捕获 F64 容量突增至</text>
  <text x="78" y="724" fill="#E2E8F0" font-size="11">  114.8% (&gt; 95% 限流红线)</text>
  <text x="78" y="740" fill="#E2E8F0" font-size="11">• 锁定 WS-FIN-PROD-07 慢查询 Q-8841</text>
  <text x="78" y="776" fill="#34D399" font-size="11" font-weight="700">KQL 聚合延迟仅 108ms</text>

  <rect x="330" y="648" width="248" height="150" rx="10" fill="#0F172A" stroke="#A855F7" stroke-width="1.2"/>
  <text x="344" y="670" fill="#C084FC" font-size="12" font-weight="800">Stage 2 · 本体与伙伴图谱 (144ms)</text>
  <text x="344" y="690" fill="#E2E8F0" font-size="11">• 穿透 F64 容量 → WS-FIN-PROD-07</text>
  <text x="344" y="706" fill="#E2E8F0" font-size="11">  → OneLake IQ Sharing (S&amp;P RDF)</text>
  <text x="344" y="724" fill="#E2E8F0" font-size="11">  → Rayfin 资金门户与 3 张高管看板</text>
  <text x="344" y="740" fill="#E2E8F0" font-size="11">• 识别 SLA 违约风险敞口 $28,400</text>
  <text x="344" y="776" fill="#C084FC" font-size="11" font-weight="700">6 跳跨工作区影响定位</text>

  <rect x="596" y="648" width="248" height="150" rx="10" fill="#0F172A" stroke="#F97316" stroke-width="1.2"/>
  <text x="610" y="670" fill="#F97316" font-size="12" font-weight="800">Stage 3 · RCA 与弹性寻优 (138ms)</text>
  <text x="610" y="690" fill="#E2E8F0" font-size="11">• Surge Protection 限流 Q-8841 笛卡尔积</text>
  <text x="610" y="706" fill="#E2E8F0" font-size="11">• Database Agent 注入 DiskANN 与复合</text>
  <text x="610" y="724" fill="#E2E8F0" font-size="11">  索引提示，重写低效 SQL</text>
  <text x="610" y="740" fill="#E2E8F0" font-size="11">• 挂载 On-Demand +16 CU 突发缓冲 25m</text>
  <text x="610" y="776" fill="#F97316" font-size="11" font-weight="700">双智能体协同调优方案</text>

  <rect x="862" y="648" width="248" height="150" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="876" y="670" fill="#38BDF8" font-size="12" font-weight="800">Stage 4 · FinOps 护栏核验 (98ms)</text>
  <text x="876" y="690" fill="#E2E8F0" font-size="11">• Foundry IQ 检索《FINOPS-SURGE-SOP-09》</text>
  <text x="876" y="706" fill="#E2E8F0" font-size="11">• 按需突发成本 $48.50 ≤ $250 预批上限</text>
  <text x="876" y="724" fill="#E2E8F0" font-size="11">• 验证 Rayfin Secret Store 与默认私有</text>
  <text x="876" y="740" fill="#E2E8F0" font-size="11">  网络边界 (Private-by-Default)</text>
  <text x="876" y="776" fill="#38BDF8" font-size="11" font-weight="700">合规与成本护栏通过 ✓</text>

  <rect x="1128" y="648" width="248" height="150" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.4"/>
  <text x="1142" y="670" fill="#34D399" font-size="12" font-weight="800">Stage 5 · Rayfin 回写闭环 (102ms)</text>
  <text x="1142" y="690" fill="#E2E8F0" font-size="11">• 预授权自动执行 (`Act automatically`)</text>
  <text x="1142" y="706" fill="#E2E8F0" font-size="11">• 调用 Rayfin TS 函数回写 1GB 免费</text>
  <text x="1142" y="724" fill="#E2E8F0" font-size="11">  Fabric SQL 运维审计表</text>
  <text x="1142" y="740" fill="#E2E8F0" font-size="11">• 容量水位从 114.8% 降至 71.2% (-43.6%)</text>
  <text x="1142" y="776" fill="#34D399" font-size="11" font-weight="800">置信度 0.97 · 规避损失 $28,400</text>
