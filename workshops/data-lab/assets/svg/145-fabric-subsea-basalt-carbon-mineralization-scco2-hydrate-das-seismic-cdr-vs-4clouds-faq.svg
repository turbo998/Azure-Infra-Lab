  <text x="78" y="434" fill="#E2E8F0" font-size="12">• 库仑破裂应力 ΔCFS = Δτ - μ(Δσn - ΔPp) &gt; 0 触发 Mw=1.18 微震</text>
  <text x="78" y="454" fill="#E2E8F0" font-size="12">• 突破 Mw 1.00 交通灯红线，威胁上覆深海沉积物与水合物自封盖层</text>
