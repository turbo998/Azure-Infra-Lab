  <!-- Header -->
  <text x="52" y="64" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">DATA LAB · ROUND 26 ARCHITECTURE &amp; BENCHMARK VISUAL SUMMARY (DL-145..DL-148 · SCENARIO AG)</text>
  <text x="52" y="96" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Enterprise Geospatial, H3 Hexagonal Indexing &amp; 180K EPS Fleet/Grid Geofencing: Fabric vs. 4 Clouds</text>
  <text x="52" y="122" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Eventhouse KQL 32ms H3 Integer Join (1,200x Faster than ST_Contains) · Spark Sedona ($0 Gluten Surcharge) · -79.5% TCO ($7.8K vs $38.1K/mo)</text>

  <rect x="1088" y="46" width="260" height="66" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1218" y="72" text-anchor="middle" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">ROUND 26 SEALED VERDICT</text>
  <text x="1218" y="96" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">143ms · -79.5% TCO · 147/148</text>

  <!-- Left Column: Legacy ST_Contains + Proprietary GIS Silo -->
  <rect x="48" y="144" width="632" height="310" rx="14" fill="#1E111A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="70" y="174" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">❌ Legacy: Proprietary GIS Silo + ST_Contains Polygon Lag ($38,100/mo)</text>

  <rect x="70" y="190" width="588" height="68" rx="8" fill="#2D1622" stroke="#7F1D1D"/>
  <text x="86" y="213" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. O(N × M × V) Floating-Point ST_Contains Polygon Ray-Casting (&gt;42s Lag)</text>
  <text x="86" y="233" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Checking 180K EPS GPS points against 12,000 1,500-vertex polygons triggers 2.16B edge tests/sec.</text>
  <text x="86" y="250" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Metered cloud geofencing APIs or multi-cluster warehouses cost $18,500+/mo on live streams.</text>

  <rect x="70" y="268" width="588" height="78" rx="8" fill="#2D1622" stroke="#7F1D1D"/>
  <text x="86" y="291" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Proprietary GIS Server Per-Core &amp; Viewer Seat Silos ($19,600/mo)</text>
  <text x="86" y="311" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Standalone GIS servers charge heavy seat fees and remain blind to SAP ERP cargo values.</text>
  <text x="86" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Dispatchers cannot tell if a truck entering a wildfire zone carries $1.8M biologics or water.</text>

  <rect x="70" y="356" width="588" height="82" rx="8" fill="#2D1622" stroke="#7F1D1D"/>
  <text x="86" y="379" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Slow Wildfire Plume Rerouting &amp; Uncoordinated Grid Tripping ($8.20M Risk)</text>
  <text x="86" y="399" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 15-minute batch GIS lag traps 340 cold-chain reefer trucks behind closed highway corridors.</text>
  <text x="86" y="418" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exposes $5.4M in biopharma cargo and $2.8M in 16 high-voltage substations ($8.20M total).</text>

