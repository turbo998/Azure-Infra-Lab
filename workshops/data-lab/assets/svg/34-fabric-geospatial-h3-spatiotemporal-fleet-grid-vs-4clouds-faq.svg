  <text x="746" y="233" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• `geo_point_to_h3cell()` converts 180K EPS GPS coordinates to Res-9 H3 integers on ingestion.</text>
  <text x="746" y="250" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Intersects 85,000 trucks &amp; 4,200 substations against wildfire H3 cells in 32ms at $0 GIS tax.</text>

