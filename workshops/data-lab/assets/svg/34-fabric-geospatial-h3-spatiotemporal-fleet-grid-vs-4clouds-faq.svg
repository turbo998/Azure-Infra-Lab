  <text x="746" y="418" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Cuts monthly geospatial TCO by 79.5% ($7,800 vs. $38,100/mo, protecting $8.20M SLA).</text>

