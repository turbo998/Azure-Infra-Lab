  <text x="746" y="311" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Isolates 340 biopharma reefer trucks &amp; 16 substations; computes smoke-free detours (+18m).</text>
  <text x="746" y="330" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Verifies N-1 power flow compliance (0 hospitals dropped) and GSP thermal holdover (37ms).</text>

  <rect x="730" y="356" width="600" height="82" rx="8" fill="#092624" stroke="#059669"/>
