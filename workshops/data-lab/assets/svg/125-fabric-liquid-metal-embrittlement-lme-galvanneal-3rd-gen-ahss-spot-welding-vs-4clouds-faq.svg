  <rect x="508" y="184" width="454" height="96" rx="10" fill="#112A45" stroke="#06B6D4" stroke-width="1.4"/>
  <text x="524" y="205" fill="#67E8F9" font-size="12.5" font-weight="800">STEP 1 · Eventhouse KQL 990K EPS XRD 与动态电阻感知 (4 ms)</text>
  <text x="524" y="225" fill="#F8FAFC" font-size="11.5">• $0/GB 写入税摄入 22 条热镀锌线 XRD 与 6,400 把焊枪 10kHz 流</text>
  <text x="524" y="244" fill="#CBD5E1" font-size="11">• series_fit_line() 4ms 捕获 #08 线镀层含铁跌至 7.2 wt%</text>
  <text x="524" y="263" fill="#34D399" font-size="11" font-weight="700">• 同时从 #214 焊枪第一脉冲捕获 dR/dt 拐点与 1.85mm LME 前兆</text>

  <!-- Step 2 -->
  <rect x="508" y="292" width="454" height="104" rx="10" fill="#132F2B" stroke="#10B981" stroke-width="1.8"/>
  <text x="524" y="313" fill="#6EE7B7" font-size="12.5" font-weight="800">STEP 2 · 6 跳钢车孪生 &amp; 3.36 亿向量 SSD DiskANN 检索 (4 ms)</text>
  <text x="524" y="333" fill="#F8FAFC" font-size="11.5">• 检索 336,000,000 (🏆 125-SVG &amp; 120-Spec!) 内氧化/相场/RSW 向量</text>
  <text x="524" y="352" fill="#CBD5E1" font-size="11">• 相似度 0.99 (省 92% 内存)：退火露点升至 -26.5°C 转内氧化 + GA +7.4%</text>
  <text x="524" y="371" fill="#FDE68A" font-size="11" font-weight="700">• 焊枪注入 35ms 斜坡缓冷脉冲 + 5.4kN (+1.2kN) 锻压延后 140ms 卸荷</text>

  <!-- Step 3 -->
  <rect x="508" y="408" width="454" height="90" rx="10" fill="#172554" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="524" y="429" fill="#93C5FD" font-size="12.5" font-weight="800">STEP 3 · Foundry IQ δ 相与 SEP 1220-2 零裂纹护栏 SOP-124 (4 ms)</text>
  <text x="524" y="449" fill="#F8FAFC" font-size="11.5">• 校验镀层含铁量恢复 10.4 wt% δ-FeZn7 相 (熔点 665°C，粉化 4.2 mg/m²)</text>
  <text x="524" y="468" fill="#CBD5E1" font-size="11">• B 柱焊点 LME 裂纹深度压至 0.00 mm &lt;= 0.10 mm，熔核直径 6.4 mm</text>
  <text x="524" y="485" fill="#34D399" font-size="11" font-weight="700">• OneLake IQ Sharing 零算力打通钢卷逐米相图与 VIN 码焊点谱系</text>

  <!-- Step 4 -->
  <rect x="508" y="510" width="454" height="84" rx="10" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.4"/>
  <text x="524" y="531" fill="#C4B5FD" font-size="12.5" font-weight="800">STEP 4 · Teams 总监确认 + ALDO 边缘 + Catena-X 护照 (4 ms)</text>
  <text x="524" y="551" fill="#F8FAFC" font-size="11.5">• 车间 ALDO 边缘下发湿氮露点阀、GA 感应电源与 MFDC 焊机指令</text>
  <text x="524" y="570" fill="#34D399" font-size="11" font-weight="700">• 1GB 免费 SQL 签发 Catena-X 与欧盟 CBAM 零缺陷护照 (16ms!)</text>

