  <rect x="1000" y="138" width="400" height="470" rx="14" fill="#111C33" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="1020" y="168" fill="#60A5FA" font-size="14.5" font-weight="800">03 · 定量基准与五云零拷贝协同 (R117)</text>

  <rect x="1018" y="184" width="364" height="142" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="1032" y="206" fill="#34D399" font-size="12.5" font-weight="800">月度 TCO 对比 (省 94.4% · 净省 $241.6K/月 &gt;$240K!)</text>
  <text x="1032" y="228" fill="#F8FAFC" font-size="11.5">• Microsoft Fabric 归一化：  $14,400 / 月 (基准最优)</text>
  <rect x="1032" y="234" width="52" height="10" rx="5" fill="#10B981"/>
  <text x="1032" y="258" fill="#CBD5E1" font-size="11.5">• 四云拼装栈归一化：         $256,000 / 月 (贵 17.8x)</text>
  <rect x="1032" y="264" width="320" height="10" rx="5" fill="#EF4444"/>
  <text x="1032" y="290" fill="#93C5FD" font-size="11">• 集团全量专用容量 (58 基地)：$41.5K vs $703.0K/月</text>
  <text x="1032" y="310" fill="#FDE68A" font-size="11.5" font-weight="900">• 守护 SLA 风险敞口：        $40,050,000 (突破 $40M 大关!)</text>

  <rect x="1018" y="338" width="364" height="126" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1032" y="360" fill="#FDE68A" font-size="12.5" font-weight="900">🏆 125-SVG &amp; 120-Spec &amp; 139.0ms均值 (report.json R117)</text>
  <text x="1032" y="382" fill="#FFFFFF" font-size="12" font-weight="800">• 路由评估矩阵 (n=512=2⁹!)：511 / 512 (99.80% 准确率!)</text>
  <text x="1032" y="402" fill="#34D399" font-size="11.5" font-weight="700">• 分母 A 路由矩阵算术均值： 155.0 ms (155ms整数大关!)</text>
  <text x="1032" y="422" fill="#FDE68A" font-size="11.5" font-weight="800">• 分母 B 124大行业本体均值：139.0 ms (正式跌破140ms!)</text>
  <text x="1032" y="442" fill="#CBD5E1" font-size="11">• Python 确定性单测套件：  252 / 252 (100% 通过)</text>

  <rect x="1018" y="476" width="364" height="118" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="1032" y="498" fill="#67E8F9" font-size="12.5" font-weight="800">Better Together 跨云零拷贝黄金分工</text>
  <text x="1032" y="518" fill="#E2E8F0" font-size="11">• Azure HPC / Databricks：DICTRA 扩散 &amp; SYSWELD 点焊 FEM</text>
  <text x="1032" y="538" fill="#E2E8F0" font-size="11">• Snowflake / SAP：主机厂钢卷订单、冲压排产与 VIN 质保 ERP</text>
  <text x="1032" y="558" fill="#34D399" font-size="11" font-weight="700">• Fabric：OneLake IQ 跨企共享 + 16ms 车间实时控制面</text>
  <text x="1032" y="578" fill="#FDE68A" font-size="10.5" font-weight="700">• 官方规格引用：120 条大关! (新增 SPEC-AHSS-LME-R117)</text>

  <!-- Bottom Strip -->
  <rect x="40" y="624" width="1360" height="240" rx="14" fill="#0E192D" stroke="#2563EB" stroke-width="1.5"/>
  <text x="60" y="654" fill="#60A5FA" font-size="14.5" font-weight="800">04 · 第三代超高强汽车钢 (AHSS) 退火内氧化、GA 合金化与点焊防 LME 三大物理护栏矩阵 (SOP-124 · 125-SVG &amp; $40.05M SLA)</text>

  <rect x="60" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="76" y="694" fill="#67E8F9" font-size="13" font-weight="800">① Wagner 选择性外氧化转内氧化露点调控</text>
  <text x="76" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：提高氧势使 O 向内扩散通量大于 Si/Mn 向外通量</text>
  <text x="76" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：#08 线 -42°C 过干致表面 Mn2SiO4 结壳与 Fe=7.2wt%</text>
  <text x="76" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：均热段露点升至 -26.5°C + GA 感应功率 +7.4%</text>
  <text x="76" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：镀层锁死 10.4 wt% δ-FeZn7 相 (熔点 665°C)</text>
  <text x="76" y="800" fill="#94A3B8" font-size="11">• 表面质量：100% 消除漏镀，粉化剥落量仅 4.2 mg/m²</text>

  <rect x="506" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#10B981" stroke-width="1.2"/>
  <text x="522" y="694" fill="#6EE7B7" font-size="13" font-weight="800">② 10kHz 伺服点焊双脉冲缓冷与锻压防 LME 裂纹</text>
  <text x="522" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：液态锌沿受拉应力奥氏体晶界高速渗透脆断</text>
  <text x="522" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：#214 焊枪 dR/dt 拐点预判 1.85mm B 柱 LME 裂纹</text>
  <text x="522" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：35ms 斜坡缓冷脉冲 + 5.4kN 锻压延后 140ms 卸荷</text>
  <text x="522" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：LME 裂纹深度 0.00 mm，熔核直径 6.4 mm</text>
  <text x="522" y="800" fill="#94A3B8" font-size="11">• 安全合规：100% 满足 SEP 1220-2 与 Euro-NCAP 五星碰撞</text>

  <rect x="952" y="670" width="428" height="174" rx="10" fill="#091326" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="968" y="694" fill="#FBBF24" font-size="13" font-weight="800">③ OneLake IQ 跨企钢卷相图与 Catena-X 汽车护照</text>
  <text x="968" y="716" fill="#E2E8F0" font-size="11.5">• 跨企直通：钢厂每米二维 XRD 相图零拷贝共享给主机厂焊枪</text>
  <text x="968" y="736" fill="#E2E8F0" font-size="11.5">• 谱系绑定：钢卷炉批号 → 冲压件 → 白车身 4,800 焊点 → VIN</text>
  <text x="968" y="756" fill="#E2E8F0" font-size="11.5">• 绿色合规：氢基电炉绿钢与欧盟 CBAM / Catena-X PCF 核证</text>
  <text x="968" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：1GB 免费 SQL 签发零裂纹白车身数字护照</text>
  <text x="968" y="800" fill="#FDE68A" font-size="11" font-weight="700">• 里程碑：125-SVG · 120-Spec · 139.0ms均值 · $40.05M SLA</text>
