  <rect width="1440" height="900" fill="url(#bg125)"/>
  <rect x="20" y="18" width="1400" height="864" rx="18" fill="#091326" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <rect x="40" y="34" width="1360" height="88" rx="14" fill="#111F3A" stroke="#F59E0B" stroke-width="2.2"/>
  <rect x="58" y="48" width="356" height="26" rx="13" fill="url(#gold125)"/>
  <text x="236" y="66" fill="#040814" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.6">🏆 R117 · #125 SVG, #120 SPEC, 139.0ms &amp; &gt;$40M SLA!</text>
  <text x="430" y="66" fill="#F8FAFC" font-size="16" font-weight="800">第三代 2.0GPa 超高强汽车钢 (AHSS) 热镀锌 δ 相控制、内氧化露点与点焊防液态金属脆化 (LME) 16ms 闭环</text>
  <text x="58" y="100" fill="#94A3B8" font-size="12.5">Scenario DT · 22 条热镀锌线 + 36 座白车身焊装车间 (480 套在线 XRD/露点 + 6,400 把 10kHz 伺服焊枪) × 990K EPS · 3.36 亿向量 (336M!) · 10.4wt% δ相 &amp; 0.00mm LME 零裂纹</text>

  <rect x="1146" y="46" width="236" height="64" rx="10" fill="#064E3B" stroke="#F59E0B" stroke-width="2"/>
  <text x="1264" y="68" fill="#FDE68A" font-size="11.5" font-weight="900" text-anchor="middle">511 / 512 = 99.80% ($40.05M!)</text>
  <text x="1264" y="95" fill="#FFFFFF" font-size="19" font-weight="900" text-anchor="middle">336M Vectors · 16ms</text>

  <!-- Left Column -->
  <rect x="40" y="138" width="430" height="470" rx="14" fill="#131B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · 2.0GPa 超高强钢三大物理危机与传统死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #08 热镀锌线 Mn2SiO4 表面结壳漏镀与欠合金化</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• Q&amp;P/中锰钢富含 Si/Mn，在 -42°C 过干退火气氛下向外表面富集</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 结成连续 Mn2SiO4 非晶玻璃膜，阻碍锌液润湿与铁锌互扩散</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• GA 镀层含铁量跌至 7.2 wt% (&lt;9.5 wt%)，残留大量 419°C 纯锌 η 相</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：表面游离低熔点纯锌成为下游车厂点焊 LME 开裂毒源！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="344" fill="#FCA5A5" font-size="12.5" font-weight="800">② #214 白车身 B 柱焊点 1.85mm 液态金属脆化 (LME) 裂纹</text>
  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• 980°C 点焊瞬间表面锌层融化，叠加冷却收缩与电极卸荷拉应力</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 液态锌沿高温奥氏体晶界高速楔入劈裂，形成 1.85mm 贯穿裂纹</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• 远超 SEP 1220-2 0.10mm 红线，导致 B 柱碰撞吸能暴跌 -42%</text>
  <text x="72" y="424" fill="#F87171" font-size="11" font-weight="700">• 痛点：离线金相切片滞后 6h，320 台隐患白车身面临批量返工！</text>

  <rect x="58" y="466" width="394" height="126" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($256.0K/月 vs $14.4K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：990K EPS 在线 XRD/露点/10kHz 点焊流月费 $183.0K</text>
  <text x="72" y="528" fill="#E2E8F0" font-size="11.5">• 内存税：336M 全内存 DRAM 向量索引月耗 $39.5K</text>
  <text x="72" y="548" fill="#E2E8F0" font-size="11.5">• 割裂税：钢厂与车厂数据孤岛，焊枪无法按米前馈适配来料</text>
  <text x="72" y="570" fill="#34D399" font-size="11.5" font-weight="700">• Fabric 破局：$0/GB 写入税 + SSD DiskANN + OneLake IQ 共享</text>

