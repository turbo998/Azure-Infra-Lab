  <rect width="1440" height="900" fill="url(#bg117)"/>
  <rect x="20" y="18" width="1400" height="864" rx="18" fill="#091326" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <rect x="40" y="34" width="1360" height="88" rx="14" fill="#111F3A" stroke="#10B981" stroke-width="1.8"/>
  <rect x="58" y="48" width="290" height="26" rx="13" fill="url(#gold117)"/>
  <text x="203" y="66" fill="#040814" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="0.8">R109 · 480-SCENARIO &amp; -94.1% TCO!</text>
  <text x="364" y="66" fill="#F8FAFC" font-size="16" font-weight="800">烧结钕铁硼 (Nd2Fe14B) 120级逆流串级萃取、3.1μm 气流磨微氧防爆与重稀土 (Dy/Tb) 晶界扩散 (GBD) 32ms 闭环</text>
  <text x="58" y="100" fill="#94A3B8" font-size="12.5">Scenario DL · 22 座稀土永磁基地 (480 条 120级萃取线 + 640 台超音速气流磨 + 520 座 GBD 扩散炉) × 980K EPS · 3.04 亿向量 (304M!) · 1,940ppmw 微氧 &amp; 28.4kOe 心部矫顽力 · 省 68.5% 重稀土</text>

  <rect x="1156" y="46" width="226" height="64" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="1269" y="68" fill="#A7F3D0" font-size="11.5" font-weight="700" text-anchor="middle">R109 · 480 CASES &amp; 147.0ms MEAN!</text>
  <text x="1269" y="95" fill="#FFFFFF" font-size="19" font-weight="900" text-anchor="middle">304M Vectors · 32ms</text>

  <!-- Left Column: Physical Crisis vs 4-Cloud Bottlenecks -->
  <rect x="40" y="138" width="430" height="470" rx="14" fill="#131B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · 烧结钕铁硼三大物理危机与传统云死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #14 超音速氮气气流磨痕量漏氧与富钕相氧化</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• 旋转阀微漏使粉体氧含量冲至 3,450 ppmw (&gt;2,600 上限)</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• D10&lt;1.35μm 超细粉升至 11.4%，富钕晶界相氧化成死相 Nd2O3</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 烧结无液相致密化(&lt;7.50g/cm³)，微磁因子 α 崩塌，Hcj 跌 3.8 kOe</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：若氧含量 &lt;1,200 ppmw 卸料瞬间又会发生粉尘爆燃！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="344" fill="#FCA5A5" font-size="12.5" font-weight="800">② #08 晶界扩散炉 (GBD) +14°C 过温与体相截胡</text>
  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• 第3温区漂移至 914°C (&gt;900°C)，体扩散系数 D_bulk 暴增 +58%</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 昂贵金属铽 (Tb) 钻入表层晶粒体相，表层剩磁 Br 跌至 13.72 kGs</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• 3.5mm 心部缺铽无核壳，心部 Hcj 跌至 21.4 kOe (&lt;27.0 kOe 50EH)</text>
  <text x="72" y="424" fill="#F87171" font-size="11" font-weight="700">• 痛点：800V 电机与人形机器人 180°C 发生不可逆高温退磁！</text>

  <rect x="58" y="466" width="394" height="126" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($240.5K/月 vs $14.1K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：980K EPS XRF/激光粒度/氧氮仪流月费高达 $170.2K</text>
  <text x="72" y="528" fill="#E2E8F0" font-size="11.5">• 内存税：304M 全内存 DRAM 向量索引月耗 $35.5K</text>
  <text x="72" y="548" fill="#E2E8F0" font-size="11.5">• 刷新税：Snowflake 60s 滞后 / 4h 离线化验错失毫秒级调阀窗口</text>
  <text x="72" y="570" fill="#34D399" font-size="11.5" font-weight="700">• Fabric 破局：$0/GB 写入税 + SSD DiskANN 省 92% 内存</text>

  <!-- Center Column: Fabric 32ms Closed-Loop Pipeline -->
  <rect x="488" y="138" width="494" height="470" rx="14" fill="#0D1F33" stroke="#10B981" stroke-width="2"/>
  <text x="508" y="168" fill="#34D399" font-size="14.5" font-weight="800">02 · Microsoft Fabric 32ms 烧结钕铁硼与 GBD 闭环流水线</text>

  <!-- Step 1 -->
  <rect x="508" y="184" width="454" height="96" rx="10" fill="#112A45" stroke="#06B6D4" stroke-width="1.4"/>
  <text x="524" y="205" fill="#67E8F9" font-size="12.5" font-weight="800">STEP 1 · Eventhouse KQL 980K EPS 痕量氧与 GBD 感知 (8 ms)</text>
  <text x="524" y="225" fill="#F8FAFC" font-size="11.5">• $0/GB 写入税摄入 480 条萃取 XRF、640 台气流磨与 520 座 GBD 炉流</text>
  <text x="524" y="244" fill="#CBD5E1" font-size="11">• series_fit_line() 8ms 锁定 #14 磨粉氧 3,450 ppmw &amp; D10 细尾 11.4%</text>
  <text x="524" y="263" fill="#34D399" font-size="11" font-weight="700">• 同时捕获 #08 号 GBD 炉第 3 区漂移至 914°C (心部 Hcj 跌至 21.4 kOe)</text>

  <!-- Step 2 -->
  <rect x="508" y="292" width="454" height="104" rx="10" fill="#132F2B" stroke="#10B981" stroke-width="1.8"/>
  <text x="524" y="313" fill="#6EE7B7" font-size="12.5" font-weight="800">STEP 2 · 6 跳永磁孪生 &amp; 3.04 亿向量 SSD DiskANN 检索 (8 ms)</text>
  <text x="524" y="333" fill="#F8FAFC" font-size="11.5">• 检索 304,000,000 (480场景大关!) 逆流萃取、涡流分级与 GBD 扩散向量</text>
  <text x="524" y="352" fill="#CBD5E1" font-size="11">• 相似度 0.99 (省 92% 内存)：分级轮 -270rpm (3,980rpm 切掉超细粉)</text>
  <text x="524" y="371" fill="#FDE68A" font-size="11" font-weight="700">• 5N 氮气吹扫 +18kPa &amp; 微氧阀 -34% + GBD 第3区 -6.4% (896°C) + 492°C回火</text>

  <!-- Step 3 -->
  <rect x="508" y="408" width="454" height="90" rx="10" fill="#172554" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="524" y="429" fill="#93C5FD" font-size="12.5" font-weight="800">STEP 3 · Foundry IQ 核壳微磁与防自燃物理护栏 SOP-116 (8 ms)</text>
  <text x="524" y="449" fill="#F8FAFC" font-size="11.5">• 校验粉体总氧压回 1,940 ppmw ∈ [1,800, 2,400] (D50=3.08μm, Span=1.06)</text>
  <text x="524" y="468" fill="#CBD5E1" font-size="11">• 18.5nm (Nd,Tb)2Fe14B 核壳均匀包覆：心部 Hcj 恢复 28.4 kOe (&gt;=27.0)</text>
  <text x="524" y="485" fill="#34D399" font-size="11" font-weight="700">• 剩磁 Br=14.38 kGs · 180°C 不可逆磁损 0.62% (&lt;=1.50%) · 省 68.5% 金属铽</text>

  <!-- Step 4 -->
  <rect x="508" y="510" width="454" height="84" rx="10" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.4"/>
  <text x="524" y="531" fill="#C4B5FD" font-size="12.5" font-weight="800">STEP 4 · Teams 总冶金师确认 + ALDO 边缘 + EU CRMA 护照 (8 ms)</text>
  <text x="524" y="551" fill="#F8FAFC" font-size="11.5">• 车间 ALDO 边缘下发 OPC-UA/Modbus 气流磨微氧阀与 GBD 温场指令</text>
  <text x="524" y="570" fill="#34D399" font-size="11" font-weight="700">• 1GB 免费 SQL 签发 EU CRMA 稀土溯源与重稀土减量 -68.5% 护照 (32ms!)</text>

  <!-- Right Column: Quantitative Benchmarks & Coexistence -->
  <rect x="1000" y="138" width="400" height="470" rx="14" fill="#111C33" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="1020" y="168" fill="#60A5FA" font-size="14.5" font-weight="800">03 · 定量基准与五云零拷贝协同 (R109)</text>

  <rect x="1018" y="184" width="364" height="142" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="1032" y="206" fill="#34D399" font-size="12.5" font-weight="800">月度 TCO 对比 (省 94.1% · 净省 $226.4K/月!)</text>
  <text x="1032" y="228" fill="#F8FAFC" font-size="11.5">• Microsoft Fabric 归一化：  $14,100 / 月 (基准最优)</text>
  <rect x="1032" y="234" width="52" height="10" rx="5" fill="#10B981"/>
  <text x="1032" y="258" fill="#CBD5E1" font-size="11.5">• 四云拼装栈归一化：         $240,500 / 月 (贵 17.1x)</text>
  <rect x="1032" y="264" width="320" height="10" rx="5" fill="#EF4444"/>
  <text x="1032" y="290" fill="#93C5FD" font-size="11">• 集团全量专用容量 (22 基地)：$39.1K vs $659.8K/月</text>
  <text x="1032" y="310" fill="#FDE68A" font-size="11.5" font-weight="800">• 守护 SLA 风险敞口：        $37,250,000 (&gt;$37M 新高!)</text>

  <rect x="1018" y="338" width="364" height="126" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="1032" y="360" fill="#67E8F9" font-size="12.5" font-weight="800">双分母延迟基准 (sealed report.json R109)</text>
  <text x="1032" y="382" fill="#F8FAFC" font-size="11.5">• 路由评估矩阵 (n=480 里程碑!)：479 / 480 (99.79%)</text>
  <text x="1032" y="402" fill="#34D399" font-size="11.5" font-weight="700">• 分母 A 路由矩阵算术均值：     163.0 ms (-1.0ms!)</text>
  <text x="1032" y="422" fill="#34D399" font-size="11.5" font-weight="700">• 分母 B 116大行业本体均值：    147.0 ms (-1.0ms!)</text>
  <text x="1032" y="442" fill="#CBD5E1" font-size="11">• Python 确定性单测套件：      236 / 236 (100% 通过)</text>

  <rect x="1018" y="476" width="364" height="118" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1032" y="498" fill="#FBBF24" font-size="12.5" font-weight="800">Better Together 跨云零拷贝黄金分工</text>
  <text x="1032" y="518" fill="#E2E8F0" font-size="11">• Azure HPC / Databricks：相场微磁学 &amp; LLG 反磁化仿真</text>
  <text x="1032" y="538" fill="#E2E8F0" font-size="11">• Snowflake / SAP：稀土矿配额、镨钕/铽套保与电机 ERP</text>
  <text x="1032" y="558" fill="#34D399" font-size="11" font-weight="700">• Fabric：OneLake 零拷贝挂载 + 32ms GBD 实时控制面</text>
  <text x="1032" y="578" fill="#94A3B8" font-size="10.5">• 官方规格引用：112 条 (新增 SPEC-RARE-EARTH-MAGNET-R109)</text>

  <!-- Bottom Full-Width Architecture & Physics Strip -->
  <rect x="40" y="624" width="1360" height="240" rx="14" fill="#0E192D" stroke="#2563EB" stroke-width="1.5"/>
  <text x="60" y="654" fill="#60A5FA" font-size="14.5" font-weight="800">04 · 烧结钕铁硼微磁学形核与重稀土晶界扩散 (GBD) 物理护栏矩阵 (SOP-116 · 480-Scenario Milestone)</text>

  <rect x="60" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="76" y="694" fill="#67E8F9" font-size="13" font-weight="800">① 120 级逆流串级萃取 (Nd/Pr/Dy/Tb 分离)</text>
  <text x="76" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：镧系分离系数 β_Pr/Nd = 1.48，Kremser 级联平衡</text>
  <text x="76" y="736" fill="#E2E8F0" font-size="11.5">• 实时感知：Eventhouse 8ms 融合 480 条线在线 XRF 与酸度 pH</text>
  <text x="76" y="756" fill="#E2E8F0" font-size="11.5">• 向量匹配：检索有机相皂化度与洗涤段流比等温线</text>
  <text x="76" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：3N5 镨钕与 4N 镝铽纯度稳定 99.98%，0 串级混料</text>
  <text x="76" y="800" fill="#94A3B8" font-size="11">• 环保合规：萃余液草酸与氨氮闭环回收率 &gt;= 98.6%</text>

  <rect x="506" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#10B981" stroke-width="1.2"/>
  <text x="522" y="694" fill="#6EE7B7" font-size="13" font-weight="800">② 超音速氮气气流磨 (D50=3.08μm) 微氧钝化闭环</text>
  <text x="522" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：Kronmüller 公式 Hcj = α·HA - Neff·Js/μ0</text>
  <text x="522" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：粉氧 3,450 ppmw 耗尽富钕液相；&lt;1,200 ppmw 卸料爆燃</text>
  <text x="522" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：分级轮 -270rpm (3,980rpm) + 5N 氮吹扫 + 微氧阀 -34%</text>
  <text x="522" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：粉氧锁死 1,940 ppmw ∈ [1,800, 2,400]，烧结密度 7.62g/cm³</text>
  <text x="522" y="800" fill="#94A3B8" font-size="11">• 粒度跨度：Span = (D90-D10)/D50 = 1.06 &lt;= 1.15 单畴细粉</text>

  <rect x="952" y="670" width="428" height="174" rx="10" fill="#091326" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="968" y="694" fill="#FBBF24" font-size="13" font-weight="800">③ 重稀土 TbF3 晶界扩散 (GBD) 18.5nm 核壳控制</text>
  <text x="968" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：晶界扩散 Q_gb=115 kJ/mol vs 体扩散 Q_bulk=265 kJ/mol</text>
  <text x="968" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：914°C 过温引发体扩散截胡，3.5mm 心部 Hcj 跌至 21.4 kOe</text>
  <text x="968" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：第3区 -6.4% 锁死 896°C + 一级回火 492°C 润湿晶界</text>
  <text x="968" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：心部 Hcj=28.4 kOe · Br=14.38 kGs · 180°C 磁损 0.62%</text>
  <text x="968" y="800" fill="#FDE68A" font-size="11" font-weight="700">• EU CRMA 护照：重稀土 Dy/Tb 用量削减 -68.5% · 32ms 端到端闭环</text>
</svg>
