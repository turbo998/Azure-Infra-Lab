<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg44" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050D1A"/>
      <stop offset="50%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent44" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="fabricBar44" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="url(#bg44)"/>
  <rect x="24" y="20" width="1392" height="860" rx="20" fill="#0B1528" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <rect x="44" y="38" width="1352" height="86" rx="14" fill="#13223E" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="64" y="52" width="236" height="26" rx="13" fill="url(#accent44)"/>
  <text x="182" y="70" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">DATA LAB · ROUND 36 · SEMICONDUCTOR</text>
  <text x="316" y="70" fill="#F8FAFC" font-size="17.5" font-weight="800">半导体 2nm EUV 良率、800K EPS SECS/GEM 遥测、STDF 晶圆图空间检索与 CoWoS 封装溯源选型 FAQ</text>
  <text x="64" y="102" fill="#94A3B8" font-size="12.5">Microsoft Fabric (Eventhouse 1ms FDC + Cosmos SSD DiskANN 2ms 晶圆图匹配 + ALDO 洁净室边缘) vs AWS EDA / Databricks / Snowflake / GCP</text>
  <rect x="1168" y="50" width="208" height="60" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="1272" y="72" fill="#34D399" font-size="11.5" font-weight="700" text-anchor="middle">Scenario AQ · 2nm 晶圆厂闭环</text>
  <text x="1272" y="96" fill="#F8FAFC" font-size="17" font-weight="800" text-anchor="middle">5ms · 省 83.9% TCO</text>

  <!-- Row 1 Left: 3 Pain Points vs First-Principles Breakthroughs -->
  <rect x="44" y="140" width="664" height="250" rx="14" fill="#101E36" stroke="#1E293B" stroke-width="1.5"/>
  <text x="64" y="168" fill="#22D3EE" font-size="14" font-weight="800">01 · 第一性原理：先进制程三大印钞机黑洞 vs Fabric 5ms 腔室级止损机理</text>

  <rect x="64" y="182" width="624" height="60" rx="8" fill="#172554" stroke="#06B6D4" stroke-width="1"/>
  <text x="78" y="202" fill="#67E8F9" font-size="12" font-weight="800">① Eventhouse KQL 800K EPS SECS/GEM 腔室 FDC (1ms 捕获微电弧 · $0/GB 写入税)</text>
  <text x="78" y="220" fill="#E2E8F0" font-size="11">• 传统痛点：一片 2nm 晶圆价值 $26,000，传统 YMS 需 T+12h 跑批才发现良率暴跌，导致后续 14 批 350 片连环报废</text>
  <text x="78" y="235" fill="#34D399" font-size="11" font-weight="700">• Fabric 破局：1ms 捕获刻蚀腔室射频打火与 EUV +1.4nm 套刻漂移，当场拦截排队中的 350 片晶圆</text>

  <rect x="64" y="250" width="624" height="60" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
  <text x="78" y="270" fill="#93C5FD" font-size="12" font-weight="800">② Cosmos SSD DiskANN 2,400 万晶圆图匹配 (2ms 寻根 · 省 92% 内存) + CoWoS GDBN 降级</text>
  <text x="78" y="288" fill="#E2E8F0" font-size="11">• 传统痛点：一颗隐性漏电裸片混入 CoWoS 贴装，就会毁掉整块价值 $42,000 的 AI 芯片 + 8 颗 HBM3e 内存模组</text>
  <text x="78" y="303" fill="#34D399" font-size="11" font-weight="700">• Fabric 破局：2ms 旋转不变向量锁定卡盘氦气泄漏 (相似度 0.98)，并按邻域 GDBN 剔除 68 颗高危裸片</text>

  <rect x="64" y="318" width="624" height="58" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="78" y="338" fill="#6EE7B7" font-size="12" font-weight="800">③ SEMI E187 洁净室断网边缘 (ALDO) + EAR 3E001 / OIP 代工厂配方双盲隔离</text>
  <text x="78" y="356" fill="#E2E8F0" font-size="11">• OneLake IQ Sharing 向 Fabless 客户零拷贝共享 STDF 良率，同时 Purview CLS 硬性屏蔽代工厂私有腔室配方</text>

  <!-- Row 1 Right: Decision Tree & Coexistence -->
  <rect x="728" y="140" width="668" height="250" rx="14" fill="#101E36" stroke="#1E293B" stroke-width="1.5"/>
  <text x="748" y="168" fill="#60A5FA" font-size="14" font-weight="800">02 · 五大平台选型决策树与“前端 HPC 仿真 × 晶圆良率闭环”共存</text>

  <rect x="748" y="182" width="304" height="92" rx="8" fill="#172554" stroke="#10B981" stroke-width="1.2"/>
  <text x="762" y="202" fill="#34D399" font-size="12" font-weight="800">✅ 首选 Microsoft Fabric (省 83.9% TCO)</text>
  <text x="762" y="220" fill="#E2E8F0" font-size="11">• 800K EPS SECS/GEM 腔室 FDC 与 R2R APC</text>
  <text x="762" y="236" fill="#E2E8F0" font-size="11">• STDF 二进制 Gluten 解析与 SSD DiskANN 晶圆图</text>
  <text x="762" y="252" fill="#6EE7B7" font-size="11" font-weight="700">• CoWoS ECID 谱系 + ALDO 洁净室断网边缘</text>

  <rect x="1068" y="182" width="308" height="92" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1082" y="202" fill="#FBBF24" font-size="12" font-weight="800">🤝 零拷贝共存 (HPC EDA / Databricks GPU)</text>
  <text x="1082" y="220" fill="#E2E8F0" font-size="11">• 50,000 核 RTL/STA 时序仿真 → AWS Batch / HPC</text>
  <text x="1082" y="236" fill="#E2E8F0" font-size="11">• 计算光刻 ILT/OPC 与 SEM 视觉 → Databricks GPU</text>
  <text x="1082" y="252" fill="#FDE68A" font-size="11" font-weight="700">• GDSII 版图热点与 ONNX 模型回挂 OneLake</text>

  <rect x="748" y="284" width="628" height="92" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
  <text x="764" y="304" fill="#93C5FD" font-size="12" font-weight="800">🛡️ Foundry IQ 半导体工艺窗口与出口管制硬护栏 (SEMICON-2NM-EUV-STDF-COWOS-SOP-043)</text>
  <text x="764" y="324" fill="#E2E8F0" font-size="11">1. Run-to-Run APC 工艺窗口护栏：自动前馈套刻修正量严禁超出 ±2.0nm 物理安全边界，超限强制转交 PE 审批</text>
  <text x="764" y="342" fill="#E2E8F0" font-size="11">2. EAR 3E001 &amp; Foundry OIP 双盲护栏：对外共享给 Fabless 客户的良率表 100% 剥离 EUV 剂量、气体流量与腔室 ID</text>
  <text x="764" y="360" fill="#34D399" font-size="11" font-weight="700">3. CoWoS KGD 零容忍门禁：任何邻域漏电 Z-Score &gt; 3.5σ 的边缘裸片强制电子墨水降级 (E-Map Ink-Out)</text>

  <!-- Row 2: Scenario AQ 5ms Closed-Loop Pipeline -->
  <rect x="44" y="406" width="1352" height="206" rx="14" fill="#101E36" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="64" y="434" fill="#67E8F9" font-size="14" font-weight="800">03 · Scenario AQ 实测仿真：1,800 台机台 × 800K EPS 2nm EUV 套刻补偿、350 片晶圆止损与 CoWoS 拦截 5ms 闭环</text>

  <rect x="64" y="450" width="312" height="142" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="80" y="472" fill="#22D3EE" font-size="12" font-weight="800">Step 1 · Eventhouse 800K EPS 感知 (1ms)</text>
  <text x="80" y="492" fill="#E2E8F0" font-size="11">• $0/GB 写入税摄入 1,800 台机台 SECS/GEM 流</text>
  <text x="80" y="510" fill="#E2E8F0" font-size="11">• 1ms 捕获 Etch-Chamber-B3 射频微电弧打火</text>
  <text x="80" y="528" fill="#E2E8F0" font-size="11">• 同步检出 High-NA EUV-09 套刻漂移 +1.4nm</text>
  <text x="80" y="548" fill="#34D399" font-size="11" font-weight="700">✓ 首片抽检晶圆外环良率骤降 -16.4% 即刻告警</text>

  <rect x="396" y="450" width="322" height="142" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="412" y="472" fill="#60A5FA" font-size="12" font-weight="800">Step 2 · SSD DiskANN 晶圆图与谱系 (2ms)</text>
  <text x="412" y="492" fill="#E2E8F0" font-size="11">• 2,400 万晶圆图中 2ms 匹配 ESC 氦气泄漏 (0.98)</text>
  <text x="412" y="510" fill="#E2E8F0" font-size="11">• 14 个排队批次 (350 片 2nm 晶圆) 切往备用腔室</text>
  <text x="412" y="528" fill="#E2E8F0" font-size="11">• 生成 EUV-09 前馈套刻补偿指令 (-1.3nm)</text>
  <text x="412" y="548" fill="#34D399" font-size="11" font-weight="700">✓ GDBN 算法筛出 68 颗 CoWoS 高危隐性坏片</text>

  <rect x="738" y="450" width="312" height="142" rx="10" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="754" y="472" fill="#C4B5FD" font-size="12" font-weight="800">Step 3 · Foundry IQ APC 与保密门控 (1ms)</text>
  <text x="754" y="492" fill="#E2E8F0" font-size="11">• 核验 SEMICON-2NM-EUV-STDF-COWOS-SOP-043</text>
  <text x="754" y="510" fill="#E2E8F0" font-size="11">• 确认 -1.3nm 修正处于 ±2.0nm 安全窗口内</text>
  <text x="754" y="528" fill="#E2E8F0" font-size="11">• Fabless 客户通知 100% 剥离代工厂私有配方</text>
  <text x="754" y="548" fill="#34D399" font-size="11" font-weight="700">✓ 符合 SEMI E187 洁净室与 EAR 3E001 合规</text>

  <rect x="1070" y="450" width="306" height="142" rx="10" fill="#172554" stroke="#10B981" stroke-width="1.5"/>
  <text x="1086" y="472" fill="#34D399" font-size="12" font-weight="800">Step 4 · Teams 联签与 MES/OSAT 锁定 (1ms)</text>
  <text x="1086" y="492" fill="#F8FAFC" font-size="11">• 良率总监与厂长 Teams 联签 Confirm</text>
  <text x="1086" y="510" fill="#F8FAFC" font-size="11">• MES 挂起 Etch-B3 清洗 + 下发 EUV R2R 补偿</text>
  <text x="1086" y="528" fill="#F8FAFC" font-size="11">• OSAT 电子 Map 降级 68 颗裸片 + ALDO 审计</text>
  <text x="1086" y="548" fill="#6EE7B7" font-size="11" font-weight="800">✓ 5ms 闭环 · 守护 $11.70M 2nm 良率与 CoWoS SLA</text>

  <!-- Row 3: TCO Bars & Quantitative KPIs -->
  <rect x="44" y="628" width="820" height="232" rx="14" fill="#101E36" stroke="#1E293B" stroke-width="1.5"/>
  <text x="64" y="656" fill="#60A5FA" font-size="14" font-weight="800">04 · 300mm 晶圆厂良率平台月度 TCO 对比 (800K EPS FDC × 2,400 万晶圆图 × 900 席位)</text>

  <text x="64" y="684" fill="#F8FAFC" font-size="12" font-weight="700">Microsoft Fabric (Eventhouse $0 写入税 + Gluten STDF + SSD DiskANN + DirectLake $0 席位)</text>
  <rect x="64" y="692" width="124" height="16" rx="8" fill="url(#fabricBar44)"/>
  <text x="198" y="705" fill="#34D399" font-size="12.5" font-weight="800">$7,700 / 月 (基准最优 · 立省 83.9% / 年省 $481.2K)</text>

  <text x="64" y="728" fill="#CBD5E1" font-size="11.5">Databricks (常驻流式 DLT DBU + 内存向量索引 + SQL Serverless BI)</text>
  <rect x="64" y="735" width="618" height="12" rx="6" fill="#475569"/>
  <text x="692" y="746" fill="#F97316" font-size="11.5" font-weight="700">$39,400 / 月</text>

  <text x="64" y="768" fill="#CBD5E1" font-size="11.5">AWS (IoT SiteWise 按测点计费 + EMR STDF + OpenSearch 内存向量 + QuickSight)</text>
  <rect x="64" y="775" width="644" height="12" rx="6" fill="#475569"/>
  <text x="718" y="786" fill="#FBBF24" font-size="11.5" font-weight="700">$41,200 / 月</text>

  <text x="64" y="808" fill="#CBD5E1" font-size="11.5">传统拼装栈 (专有 Historian + 商业 YMS 按片抽成 + 全内存向量库 + 900 席位 BI)</text>
  <rect x="64" y="815" width="712" height="12" rx="6" fill="#64748B"/>
  <text x="784" y="826" fill="#EF4444" font-size="11.5" font-weight="700">$47,800 / 月</text>

  <!-- Right KPI Summary Card -->
  <rect x="884" y="628" width="512" height="232" rx="14" fill="#13223E" stroke="#10B981" stroke-width="1.5"/>
  <text x="904" y="656" fill="#34D399" font-size="14" font-weight="800">05 · Round 36 架构师核心量化战果速览</text>

  <rect x="904" y="672" width="228" height="76" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="1018" y="696" fill="#67E8F9" font-size="11" font-weight="700" text-anchor="middle">FDC 电弧感知与晶圆图检索</text>
  <text x="1018" y="722" fill="#F8FAFC" font-size="19" font-weight="800" text-anchor="middle">1ms FDC · 2ms Map</text>
  <text x="1018" y="740" fill="#34D399" font-size="10" text-anchor="middle">挽救 350 片 2nm 晶圆 + 68 套 CoWoS</text>

  <rect x="1148" y="672" width="228" height="76" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="1262" y="696" fill="#6EE7B7" font-size="11" font-weight="700" text-anchor="middle">半导体良率平台月度 TCO</text>
  <text x="1262" y="722" fill="#34D399" font-size="19" font-weight="800" text-anchor="middle">-83.9% ($40.1K/mo)</text>
  <text x="1262" y="740" fill="#94A3B8" font-size="10" text-anchor="middle">$7,700 vs $47,800 · 省 92% 内存</text>

  <rect x="904" y="762" width="472" height="80" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="920" y="784" fill="#60A5FA" font-size="12" font-weight="800">评测基准更新 (Sealed Benchmark DL-01..DL-188 · n=43 Ontologies)</text>
  <text x="920" y="804" fill="#E2E8F0" font-size="11">• 路由准确率：187 / 188 (99.47%) · 90 / 90 Python 单元测试 100% 通过</text>
  <text x="920" y="822" fill="#34D399" font-size="11" font-weight="700">• 双分母均值：n=188 矩阵均值 366.0ms | n=43 本体均值 320.0ms (Scenario AQ = 5ms)</text>
</svg>
