  <text x="86" y="399" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Store managers on the floor cannot check 40 desktop BI reports or manually key markdowns.</text>
  <text x="86" y="418" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Rain-slowed organic dairy &amp; produce spoil before price changes reach Electronic Shelf Labels.</text>

