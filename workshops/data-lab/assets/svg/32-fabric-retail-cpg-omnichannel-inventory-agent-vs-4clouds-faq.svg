  <text x="86" y="233" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Shoppers buy online for store pickup at 16:00, but shelves were emptied hours ago.</text>
  <text x="86" y="250" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Unrecorded shrinkage and POS batch lag create Phantom Inventory across 4,800 stores.</text>

  <rect x="70" y="268" width="588" height="78" rx="8" fill="#2D1622" stroke="#7F1D1D"/>
  <text x="86" y="291" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 6–9 Months Hand-Coding 200+ ARTS / NRF Retail Schema Tables ($14,800/mo)</text>
  <text x="86" y="311" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Generic cloud warehouses lack managed site-transaction, SKU hierarchy &amp; ATP pipelines.</text>
  <text x="86" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Engineering teams spend months reconciling D365, Salesforce, and GA4 schemas.</text>

