  <text x="52" y="96" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Retail &amp; CPG Omnichannel ATP, Phantom Stock &amp; Store Agents: Fabric RDS vs. 4 Clouds</text>
  <text x="52" y="122" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">200+ Managed Retail Tables (RDS) · 40ms Eventhouse KQL Store POS/RFID · 0.48% BOPIS Cancel Rate · -78.3% Omnichannel TCO ($7.9K vs $36.4K/mo)</text>

