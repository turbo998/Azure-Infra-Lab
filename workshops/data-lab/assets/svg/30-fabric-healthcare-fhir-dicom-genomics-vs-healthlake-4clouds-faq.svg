  <rect x="70" y="190" width="588" height="68" rx="8" fill="#2D1622" stroke="#7F1D1D"/>
  <text x="86" y="213" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 11.7x Proprietary FHIR Storage Markup &amp; Hourly Query Tax ($23,400/mo)</text>
  <text x="86" y="233" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• AWS HealthLake charges $270/TB/mo ($0.27/GB) + per-hour query compute vs. $23/TB in OneLake.</text>
  <text x="86" y="250" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• FHIR (HealthLake), DICOM (HealthImaging), and VCF (HealthOmics) sit in 3 disconnected silos.</text>

  <rect x="70" y="268" width="588" height="78" rx="8" fill="#2D1622" stroke="#7F1D1D"/>
