  <text x="86" y="311" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Unnesting 140+ polymorphic FHIR R4 resources and 400+ binary DICOM tags via sample notebooks breaks.</text>
  <text x="86" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• ICD-only queries miss 169 eligible NSCLC patients whose biomarkers live in CT scans &amp; pathology PDFs.</text>

  <rect x="70" y="356" width="588" height="82" rx="8" fill="#2D1622" stroke="#7F1D1D"/>
  <text x="86" y="379" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Per-Character NLP De-ID Bills &amp; 5.5-Month Phase-III Trial Recruitment Delay</text>
  <text x="86" y="399" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• External NLP de-identification APIs charge per character and risk breaking survival date intervals.</text>
  <text x="86" y="418" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Slow cross-site chart reviews risk $6.80M in Phase-III oncology trial milestone &amp; patent window loss.</text>

