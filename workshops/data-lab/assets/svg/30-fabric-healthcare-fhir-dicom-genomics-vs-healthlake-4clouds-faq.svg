  <text x="52" y="96" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Healthcare Multimodal Lakehouse: Fabric HDS (FHIR/DICOM/OMOP) vs. HealthLake / Healthcare API</text>
