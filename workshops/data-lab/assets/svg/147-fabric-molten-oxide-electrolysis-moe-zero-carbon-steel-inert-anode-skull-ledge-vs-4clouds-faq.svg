  <text x="178" y="69" fill="#0B0705" font-size="12.5" font-weight="900" text-anchor="middle">R139 · SCENARIO EP · 147.SVG</text>
  <text x="312" y="69" fill="#F8FAFC" font-size="18.5" font-weight="800">零碳熔融氧化物电解炼钢 (MOE 1,600°C 铁矿石直炼纯铁水+纯氧, 无焦炭/无氢) × 五云选型架构图</text>
  <text x="60" y="96" fill="#D6D3D1" font-size="13">Zero-Carbon Molten Oxide Electrolysis (MOE) · Cr-Fe Inert-Anode MgCr2O4 Spinel Passivation, Frozen Sidewall Skull-Ledge Guard &amp; 424M DiskANN</text>
  <text x="60" y="116" fill="#FDE68A" font-size="12.5" font-weight="700">🏆 历史性突破 600 场景整数大关 (599/600=99.83%, 均值 137.5ms) · 144=12² 篇双语 FAQ (288 Docs!) · 本体均值跌破 125ms (124.5ms!) · 省 95.2% TCO 历史新纪录!</text>

