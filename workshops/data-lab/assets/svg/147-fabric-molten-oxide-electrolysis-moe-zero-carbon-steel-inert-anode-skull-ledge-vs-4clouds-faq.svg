  <text x="64" y="756" fill="#E2E8F0" font-size="12.5">1. 离线熔渣热力学归 HPC/Databricks，在线 52ms 护槽归 Fabric：将 FactSage 五元氧化物液相线与 3D MHD 凝固槽帮求解留在 Azure HPC / Databricks GPU，</text>
