  <text x="64" y="196" fill="#A8A29E" font-size="12">16 MOE Plants · 480 320kA Cells · 5,760 Anode Shunts · 1,920 Skull Sensors</text>

  <rect x="62" y="212" width="384" height="142" rx="10" fill="#1C100C" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="78" y="236" fill="#FDA4AF" font-size="13.5" font-weight="800">⚠️ 痛点 1：铬铁惰性阳极 MgCr2O4 尖晶石钝化膜过钝化击穿</text>
  <text x="78" y="258" fill="#E2E8F0" font-size="12">• 金属阳极靠表面自愈合 MgCr2O4/Cr2O3 尖晶石膜耐受 1,600°C 纯氧</text>
  <text x="78" y="278" fill="#E2E8F0" font-size="12">• Anode-07 偏流冲至 1.28 A/cm² (+185mV) 或炉渣 MgO 活度不足</text>
  <text x="78" y="298" fill="#E2E8F0" font-size="12">• 引发过钝化高速溶蚀 (&gt;8.5 mm/yr)，烧毁 $450K 阳极束并污染铁水</text>
  <text x="78" y="320" fill="#FB7185" font-size="11.5" font-weight="700">❌ 人工插钎与 Snowflake 60s 最小延迟无法拦截秒级偏流过钝化</text>

  <rect x="62" y="368" width="384" height="142" rx="10" fill="#1C100C" stroke="#F59E0B" stroke-width="1.2"/>
