  <text x="78" y="414" fill="#E2E8F0" font-size="12">• 无耐火砖可抗 1,600°C 熔融氧化物炉渣，必须靠水冷壁冻结 8.5–12cm 渣壳</text>
  <text x="78" y="434" fill="#E2E8F0" font-size="12">• 局部焦耳热 I²R 暴增使 MOE-Cell-24 第 3 区槽帮减薄至 4.8 cm (&lt;7.5cm)</text>
  <text x="78" y="454" fill="#E2E8F0" font-size="12">• 几分钟内即可引发 1,600°C 铁水/熔渣侧壁穿槽灾难 (损失 $47.75M)</text>
  <text x="78" y="476" fill="#FBBF24" font-size="11.5" font-weight="700">❌ AWS SiteWise 995K EPS 按属性计费高达 $209,260/月</text>

