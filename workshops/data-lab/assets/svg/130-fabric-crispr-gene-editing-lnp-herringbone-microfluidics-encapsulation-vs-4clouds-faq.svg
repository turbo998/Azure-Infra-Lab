  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• 穿透肝窦内皮窗孔要求 LNP 粒径精准受控在 65-80nm (PDI &lt;= 0.12)</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 第 14-19 支流道脂质挂壁使 FRR 跌至 2.42:1，混合慢至 6.8ms (&gt;2.5ms)</text>
