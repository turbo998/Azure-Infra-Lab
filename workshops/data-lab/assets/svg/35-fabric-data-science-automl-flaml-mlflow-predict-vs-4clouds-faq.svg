  <text x="86" y="233" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 85%+ of enterprise ML (churn, credit risk, demand) is batch/micro-batch over tables.</text>
  <text x="86" y="250" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Keeping 24/7 HTTPS inference endpoints &amp; online feature stores alive wastes $24K+/mo.</text>

