  <text x="1010" y="345" fill="#E2E8F0" font-size="12">• Indexing 556,000,000 store shelf photos, deduction PDFs, and</text>
  <text x="1010" y="364" fill="#E2E8F0" font-size="12">  trade contracts in RAM-only HNSW clusters costs $70,000/mo</text>
