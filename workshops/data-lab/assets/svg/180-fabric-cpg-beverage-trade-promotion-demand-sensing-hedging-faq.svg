  <text x="46" y="54" fill="#FFFFFF" font-size="22" font-weight="800">🥤 R172 · CPG &amp; Beverage Trade Promotion (TPO), POS Demand Sensing &amp; Commodity Hedging (Sub-20ms 19ms E2E &amp; 180th SVG!)</text>
  <text x="46" y="81" fill="#E0F2FE" font-size="13.5" font-weight="600">Scenario FW (DL-729..DL-732): 240,000 Retail Doors + 4,800 SKUs · 995K EPS Retailer EDI 852 POS &amp; Commodity Tick Stream + 556M Planogram/Deduction Vectors · 19ms (&lt;20ms!) E2E · 121.0/108.0ms Exact Means · &gt;$59M SLA!</text>
