  <text x="1327" y="58" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="800">19ms (&lt;20ms!) E2E</text>
  <text x="1327" y="79" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">180th SVG · 121.0/108.0ms</text>

  <!-- Left Column: Enterprise Pain Points & 4-Step 19ms Loop -->
  <rect x="24" y="124" width="930" height="500" rx="14" fill="url(#fabricBoxGrad180)" stroke="#0EA5E9" stroke-width="1.8" filter="url(#shadow180)"/>
  <text x="44" y="156" fill="#38BDF8" font-size="17" font-weight="800">🏗️ Microsoft Fabric Unified CPG Trade Promotion (TPO), POS Demand Sensing &amp; Hedging Loop (19ms Sub-20ms E2E)</text>
  <text x="44" y="177" fill="#94A3B8" font-size="12.5">OneLake Zero-Copy Retailer Clean Room (Walmart Luminate / Circana / NielsenIQ + SAP TPM) + 995K EPS POS &amp; Commodity Stream ($0 Copy Tax)</text>

  <!-- Step 1 -->
  <rect x="44" y="192" width="890" height="94" rx="10" fill="#0B192C" stroke="#0284C7" stroke-width="1.4"/>
  <rect x="56" y="204" width="92" height="26" rx="6" fill="#0284C7"/>
  <text x="102" y="222" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 1 · 5ms</text>
  <text x="162" y="221" fill="#F8FAFC" font-size="14.5" font-weight="700">Eventhouse KQL + Activator: 5ms Heatwave POS Velocity Surge &amp; Negative-ROI Promo Sense ($0/GB Tax)</text>
  <text x="56" y="245" fill="#CBD5E1" font-size="12.5">• Ingests 995,000 EPS store-level EDI 852 / API scan data across 240,000 retail doors, hyper-local weather, and ICE/CBOT sugar/aluminum ticks.</text>
  <text x="56" y="266" fill="#38BDF8" font-size="12.5" font-weight="600">• Eliminates $132,000/mo in retail syndicated data copy &amp; stream taxes; isolates +290% beverage velocity surge &amp; 140 negative-ROI promos in 5ms.</text>

  <!-- Step 2 -->
  <rect x="44" y="298" width="890" height="94" rx="10" fill="#0B192C" stroke="#10B981" stroke-width="1.4"/>
  <rect x="56" y="310" width="92" height="26" rx="6" fill="#059669"/>
  <text x="102" y="328" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 2 · 5ms</text>
  <text x="162" y="327" fill="#F8FAFC" font-size="14.5" font-weight="700">Cosmos DB SSD DiskANN (556M Planogram/Deduction Vectors) + FLAML In-Lake PREDICT TPO &amp; Hedge</text>
  <text x="56" y="351" fill="#CBD5E1" font-size="12.5">• Searches 556,000,000 shelf planogram photos, retailer bill-back invoices &amp; promo elasticity vectors via SSD DiskANN (-92% RAM at $3,040/mo vs $70,000/mo DRAM).</text>
  <text x="56" y="372" fill="#34D399" font-size="12.5" font-weight="600">• Reallocates $18.5M trade spend (+16.4% promo ROI lift), cuts forecast MAPE from 28%→8.4%, and prices 45-day sugar/aluminum futures hedges in 5ms.</text>

  <!-- Step 3 -->
  <rect x="44" y="404" width="890" height="94" rx="10" fill="#0B192C" stroke="#F59E0B" stroke-width="1.4"/>
  <rect x="56" y="416" width="92" height="26" rx="6" fill="#D97706"/>
  <text x="102" y="434" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 3 · 4ms</text>
  <text x="162" y="433" fill="#F8FAFC" font-size="14.5" font-weight="700">Foundry IQ Invalid Bill-Back Deduction Interdiction, Robinson-Patman &amp; Hedge VaR Gate (SOP-179 · 4ms!)</text>
  <text x="56" y="457" fill="#CBD5E1" font-size="12.5">• Validates CPG-BEVERAGE-TPO-DEMAND-SENSING-HEDGING-SOP-179: cross-checks retailer chargebacks against store end-cap photo proof-of-performance,</text>
  <text x="56" y="478" fill="#FBBF24" font-size="12.5" font-weight="600">• Blocks 62 invalid/duplicate retailer deductions (+$3.15M recovered), verifies Robinson-Patman proportionality, and enforces KAM OBO RLS in 4ms.</text>

  <!-- Step 4 -->
