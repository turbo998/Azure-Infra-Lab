  <text x="56" y="563" fill="#CBD5E1" font-size="12.5">• Updates SAP S/4HANA TPM accrual ledgers, reroutes 1,800 Direct-Store-Delivery (DSD) beverage trucks, and syncs bottling-plant ALDO edge in 5ms.</text>
  <text x="56" y="584" fill="#C4B5FD" font-size="12.5" font-weight="600">• Total E2E: 5ms + 5ms + 4ms + 5ms = 19ms (&lt;20ms!) Sub-20ms Loop! Protects $59.30M (&gt;$59M!) SLA &amp; saves -$344,800/mo (-95.9% TCO).</text>

