  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• sCO2 主压缩机工作在 30.98°C / 7.38 MPa 临界点高密似液区</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 入口冷却温度波动 1°C 即可引发流体密度剧变 35% 与声速阶跃</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• 喘振裕度跌破 6.5% 诱发叶轮旋转失速与布雷顿发电机组跳机</text>
