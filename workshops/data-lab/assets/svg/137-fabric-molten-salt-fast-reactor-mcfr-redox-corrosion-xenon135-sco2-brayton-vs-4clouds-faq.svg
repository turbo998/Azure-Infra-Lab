  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #07 回路裂变氧化 (U4+/U3+=148) 与碲致晶间开裂</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• 核裂变净释放游离卤素离子，使燃料盐 U4+/U3+ 飙至 148 (&gt;65 上限)</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 强氧化性熔盐加速溶出 Hastelloy-N 换热管保护性铬元素 (&gt;38μm/yr)</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 裂变产物游离碲 (Te⁰) 渗入合金晶界诱发灾难性脆性应力开裂</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：每周冷冻取样送热室 ICP-MS 滞后 7 天，管束面临穿孔！</text>

