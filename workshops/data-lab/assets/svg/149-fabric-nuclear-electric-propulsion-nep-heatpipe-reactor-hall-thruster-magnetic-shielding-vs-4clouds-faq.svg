  <!-- Header -->
  <rect x="44" y="36" width="1352" height="94" rx="14" fill="#0B1530" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="60" y="50" width="236" height="28" rx="6" fill="url(#accent149)"/>
  <text x="178" y="69" fill="#040814" font-size="12.5" font-weight="900" text-anchor="middle">🏆 R141 · SCENARIO ER · 149.SVG</text>
  <text x="312" y="69" fill="#F8FAFC" font-size="18.5" font-weight="800">兆瓦级深空核电推进 (1.5MWe 碱金属热管快堆 + 100kW 磁屏蔽嵌套霍尔推力器 Isp 4,180s) × 五云选型架构图</text>
  <text x="60" y="96" fill="#94A3B8" font-size="13">Megawatt Nuclear Electric Propulsion (NEP) · 21.8kHz Hall Breathing-Mode Damping, Mo-Re Sodium Heat-Pipe Dry-Out Guard &amp; 432M DiskANN</text>
  <text x="60" y="116" fill="#38BDF8" font-size="12.5" font-weight="700">🏆 历史性 300 项单测三百大关 (300/300!) · 99.84% (607/608!) 准确率新高 · 50ms 整数闭环大关 · 144=12² 项官方规范 · 省 95.3% TCO 新高 ($287.2K/月!)</text>

  <rect x="1158" y="48" width="222" height="70" rx="10" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
  <text x="1269" y="70" fill="#6EE7B7" font-size="12" font-weight="800" text-anchor="middle">50ms E2E · 432M DiskANN</text>
  <text x="1269" y="92" fill="#F8FAFC" font-size="18" font-weight="900" text-anchor="middle">-$287.2K/mo (-95.3%!)</text>
  <text x="1269" y="110" fill="#FDE68A" font-size="11.5" font-weight="700" text-anchor="middle">300/300 Tests · 99.84% · $48.45M</text>

  <!-- Left Column: 1.5MWe NEP & 3 Failure Modes -->
  <rect x="44" y="146" width="420" height="540" rx="14" fill="url(#card149)" stroke="#1E3A8A" stroke-width="1.5"/>
  <text x="64" y="176" fill="#38BDF8" font-size="15.5" font-weight="800">① 1.5MWe 核电推进物理机制与三大生死线</text>
  <text x="64" y="196" fill="#94A3B8" font-size="12">12 NEP Complexes · 144 Fission Cores · 576 100kW Thrusters · 2,304 Heat Pipes</text>

  <rect x="62" y="212" width="384" height="142" rx="10" fill="#101935" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="78" y="236" fill="#FDA4AF" font-size="13.5" font-weight="800">⚠️ 痛点 1：100kW 霍尔推力器 21.8kHz 呼吸模振荡与壁蚀穿</text>
  <text x="78" y="258" fill="#E2E8F0" font-size="12">• 通道内中性原子与电子周期性雪崩引发 21.8 kHz 呼吸模放电振荡</text>
  <text x="78" y="278" fill="#E2E8F0" font-size="12">• Thruster-B04 振荡飙至 52.4% RMS (&gt;12% 红线)，等离子体透镜畸变</text>
  <text x="78" y="298" fill="#E2E8F0" font-size="12">• 600eV 高能离子轰击氮化硼 (BN) 陶瓷壁，寿命暴跌 85% ($48.45M)</text>
  <text x="78" y="320" fill="#FB7185" font-size="11.5" font-weight="700">❌ 深空测控光速延迟与 Snowflake 60s 最小滞后无法实时抑振</text>

  <rect x="62" y="368" width="384" height="142" rx="10" fill="#101935" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="78" y="392" fill="#FDE68A" font-size="13.5" font-weight="800">⚠️ 痛点 2：1,150K 钼铼 (Mo-Re) 钠热管毛细夹带干涸</text>
  <text x="78" y="414" fill="#E2E8F0" font-size="12">• 推力爬升时高速逆向钠蒸汽流撕裂丝网毛细芯回流液膜</text>
  <text x="78" y="434" fill="#E2E8F0" font-size="12">• HeatPipe-Na-19 毛细夹带裕度跌至 1.06 (&lt;1.25 干涸阈值)</text>
  <text x="78" y="454" fill="#E2E8F0" font-size="12">• 几秒内触发蒸发段干涸与氮化铀 (UN) 燃料包壳 +145K 过热</text>
  <text x="78" y="476" fill="#FBBF24" font-size="11.5" font-weight="700">❌ AWS IoT/Kinesis 995K EPS 按属性计费高达 $212,100/月</text>

  <rect x="62" y="524" width="384" height="146" rx="10" fill="#101935" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="78" y="548" fill="#7DD3FC" font-size="13.5" font-weight="800">⚠️ 痛点 3：4.32 亿 PIC-MCC 磁屏蔽向量全内存 DRAM 税</text>
  <text x="78" y="570" fill="#E2E8F0" font-size="12">• 需实时匹配 432,000,000 条 2D-3V PIC-MCC 掠射磁力线与热管向量</text>
  <text x="78" y="590" fill="#E2E8F0" font-size="12">• 全内存向量集群高达 $51,280/月；Fabric SSD DiskANN 仅 $2,480/月</text>
  <text x="78" y="610" fill="#E2E8F0" font-size="12">• 竞对拼接栈月总成本首次突破三十万美元 ($301.4K/月 vs $14.2K/月)</text>
  <text x="78" y="632" fill="#34D399" font-size="11.5" font-weight="700">✅ 4,180 s 超高比冲 (省 90% 推进剂) · 0.02 mm/kh 零蚀穿磁屏蔽</text>

  <!-- Center Column: Fabric 50ms 4-Step Closed Loop -->
  <rect x="482" y="146" width="496" height="540" rx="14" fill="url(#card149)" stroke="#10B981" stroke-width="1.8"/>
  <text x="502" y="176" fill="#6EE7B7" font-size="15.5" font-weight="800">② Microsoft Fabric 端到端 50ms 核电推进闭环</text>
  <text x="502" y="196" fill="#94A3B8" font-size="12">Eventhouse 12ms + 432M SSD DiskANN 13ms + Foundry IQ 12ms + ALDO 13ms</text>

  <!-- Step 1 -->
  <rect x="500" y="212" width="460" height="106" rx="10" fill="#0B1E38" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="516" y="234" fill="#38BDF8" font-size="13" font-weight="800">Step 1 · Eventhouse KQL 995K EPS 呼吸模 FFT 与热管感知 (12 ms)</text>
  <text x="516" y="254" fill="#E2E8F0" font-size="11.8">• $0/GB 写入税汇聚 576 台推力器 100kHz PPU 电流、法拉第探针与 2,304 路热管流</text>
  <text x="516" y="274" fill="#E2E8F0" font-size="11.8">• series_fit_line() + series_fft() 12ms 锁定 Thruster-B04 与 HeatPipe-19</text>
  <text x="516" y="294" fill="#6EE7B7" font-size="11.8" font-weight="700">• 精准捕获：21.8 kHz 呼吸模飙至 52.4% RMS &amp; 热管毛细裕度跌至 1.06</text>

  <!-- Step 2 -->
  <rect x="500" y="330" width="460" height="106" rx="10" fill="#0B1E38" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="516" y="352" fill="#C4B5FD" font-size="13" font-weight="800">Step 2 · Fabric IQ 6 跳图谱 + 4.32 亿向量 SSD DiskANN 匹配 (13 ms)</text>
  <text x="516" y="372" fill="#E2E8F0" font-size="11.8">• OneLake 零拷贝挂载 Azure HPC 2D-3V PIC-MCC 磁屏蔽与热管韦伯极限向量</text>
  <text x="516" y="392" fill="#E2E8F0" font-size="11.8">• Cosmos DB SSD DiskANN 检索 432,000,000 向量 (0.99 相似, 省 92% 内存仅 $2,480/月)</text>
  <text x="516" y="412" fill="#DDD6FE" font-size="11.8" font-weight="700">• 命中配方：外修调磁屏蔽线圈 +6.8% + 阳极流 -4.2% + BeO 控制鼓 -1.8°</text>

  <!-- Step 3 -->
  <rect x="500" y="448" width="460" height="106" rx="10" fill="#0B1E38" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="516" y="470" fill="#FDE68A" font-size="13" font-weight="800">Step 3 · Foundry IQ 零蚀穿磁屏蔽与热管安全护栏 SOP-148 (12 ms)</text>
  <text x="516" y="490" fill="#E2E8F0" font-size="11.8">• 校验《NUCLEAR-ELECTRIC-PROPULSION-NEP-HALL-HEATPIPE-SOP-148》硬性红线</text>
  <text x="516" y="510" fill="#E2E8F0" font-size="11.8">• 21.8 kHz 呼吸模振幅压回 6.8% &lt;= 12.0% RMS (BN 壁蚀穿率 0.02 mm/kh)</text>
  <text x="516" y="530" fill="#FCD34D" font-size="11.8" font-weight="700">• 钠热管毛细裕度恢复至 1.42 &gt;= 1.25，比冲锁在 4,180 s (64.5% 效率)</text>

  <!-- Step 4 -->
  <rect x="500" y="566" width="460" height="104" rx="10" fill="#0B1E38" stroke="#10B981" stroke-width="1.2"/>
  <text x="516" y="588" fill="#6EE7B7" font-size="13" font-weight="800">Step 4 · Teams 飞行主任审批 + ALDO 星载边缘 + NPS 护照 (13 ms)</text>
  <text x="516" y="608" fill="#E2E8F0" font-size="11.8">• SQL on Azure Local (ALDO) 抗辐射边缘驱动 PPU 磁屏蔽线圈、工质阀与控制鼓</text>
  <text x="516" y="628" fill="#E2E8F0" font-size="11.8">• Fabric SDS 签发 4,180s 比冲与联合国 UN NPS 核安全护照写入 1GB Free SQL</text>
  <text x="516" y="648" fill="#34D399" font-size="11.8" font-weight="700">• 端到端 50 ms 整数大关！月省 $287.2K (-95.3% 新高!)，守护 $48.45M SLA</text>

