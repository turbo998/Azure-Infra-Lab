  <text x="1018" y="324" fill="#E2E8F0" font-size="11.2">• 机翼气动与尾流涡耗散 RANS CFD → CycleCloud / AWS Batch</text>
  <text x="1018" y="342" fill="#E2E8F0" font-size="11.2">• 静止卫星红外尾迹云 CV 与延误 GNN 训练 → Databricks GPU</text>
  <text x="1018" y="360" fill="#93C5FD" font-size="11" font-weight="700">• 尾流衰减曲线与气象网格通过 OneLake Shortcut 零拷贝回挂</text>

  <rect x="1004" y="386" width="388" height="90" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1018" y="408" fill="#FBBF24" font-size="12.5" font-weight="800">⚠️ 竞对局限与避坑指南 (Anti-Patterns)</text>
  <text x="1018" y="428" fill="#E2E8F0" font-size="11.2">• 严禁在不校核高空抖振裕度 (&lt;1.3g) 下让重型机盲目爬升避尾迹</text>
  <text x="1018" y="446" fill="#E2E8F0" font-size="11.2">• 严禁突破 ICAO Doc 4444 终端区 3.0NM 最小雷达安全间隔底线</text>
  <text x="1018" y="464" fill="#FDE68A" font-size="11" font-weight="700">• 严禁将 910K EPS 全球 ADS-B 流写入按属性计费的 IoT SiteWise</text>

