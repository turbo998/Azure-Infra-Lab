  <text x="1018" y="220" fill="#E2E8F0" font-size="11.2">• 910K EPS 天基 ADS-B 与 Mode-S 风温 H3 ($0/GB 写入税)</text>
  <text x="1018" y="238" fill="#E2E8F0" font-size="11.2">• 6,800万 TBS 尾流/尾迹 SSD DiskANN + SDS SAF 碳账本</text>
  <text x="1018" y="256" fill="#6EE7B7" font-size="11" font-weight="700">• ALDO 塔台/AOC 断网自治 + 2,400 人 $0 DirectLake 看数</text>

  <rect x="1004" y="282" width="388" height="94" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
