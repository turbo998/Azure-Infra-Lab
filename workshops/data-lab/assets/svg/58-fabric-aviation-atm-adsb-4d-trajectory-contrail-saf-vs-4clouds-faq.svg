  <text x="68" y="683" fill="#94A3B8" font-size="11.5">内部全量: $130,000/月 · 500人归一化: $57,700/月 (常驻 Streaming DBU + 内存向量节点 + BI 消耗)</text>

  <rect x="52" y="706" width="644" height="58" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="68" y="730" fill="#F8FAFC" font-size="13" font-weight="700">AWS 拼接栈 (Kinesis + SiteWise + OpenSearch + QuickSight)</text>
  <text x="68" y="751" fill="#94A3B8" font-size="11.5">内部全量: $161,400/月 · 500人归一化: $71,600/月 (按分片/属性计费 + 内存向量 + 碳软件)</text>

  <rect x="52" y="774" width="644" height="74" rx="10" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="68" y="798" fill="#7DD3FC" font-size="12.5" font-weight="800">💡 $16.60M 风险敞口保护拆解 (Scenario BE · 50轮里程碑收益)：</text>
  <text x="68" y="818" fill="#E2E8F0" font-size="11.5">• RECAT-TBS 恢复 42架/h 吞吐防 6 机备降与 EU261：$7.40M · 34 机变高砍 78% 尾迹：$4.80M</text>
  <text x="68" y="836" fill="#6EE7B7" font-size="11.5" font-weight="700">• 欧盟 ReFuelEU 6.2% SAF 逐航班核销与零 Tankering 合规：$4.40M</text>

  <!-- Bottom Row Right: Dual-Denominator & Production Checklist -->
  <rect x="734" y="510" width="674" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="754" y="540" fill="#FBBF24" font-size="15" font-weight="800">05 · 双分母基准对账 (R50 里程碑) 与生产落地核验清单 (Checklist)</text>

  <rect x="754" y="556" width="634" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="770" y="578" fill="#34D399" font-size="12.5" font-weight="800">📊 严格区分两大延迟分母 (Dual-Denominator Reconciliation · 2026-11-14 R50)</text>
  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=244 (DL-01..244) 均值 = 296.5 ms (243/244 = 99.59%)</text>
  <text x="770" y="618" fill="#F8FAFC" font-size="11.5">• 分母 B (行业本体端到端仿真均值 ontology_simulations[])：n=57 (场景 A..BE，范围 5–780ms) 均值 = 249.0 ms</text>
  <text x="770" y="636" fill="#93C5FD" font-size="11">• 本轮新增 Scenario BE 端到端延迟 = 25 ms (6ms 感知 + 7ms DiskANN/孪生 + 6ms ICAO/SAF 护栏 + 6ms 回写) · 118/118 单测通过</text>

  <rect x="754" y="658" width="634" height="190" rx="10" fill="#0B192C" stroke="#334155" stroke-width="1"/>
  <text x="770" y="682" fill="#7DD3FC" font-size="13" font-weight="800">🛠️ 售前打单与生产落地 5 步核验清单 (Production Checklist)：</text>
  <text x="770" y="706" fill="#E2E8F0" font-size="11.5">☑ 1. 天基 ADS-B 与 Mode-S 流直通：910K EPS 遥测直推 Eventhouse H3 ($0/GB 写入税)</text>
  <text x="770" y="730" fill="#E2E8F0" font-size="11.5">☑ 2. Cosmos SSD DiskANN 6,800万尾流/尾迹库：TBS 间隔与 ISSR 网格建索引 (P99 &lt; 7ms)</text>
  <text x="770" y="754" fill="#E2E8F0" font-size="11.5">☑ 3. 航班-扇区-跑道-SAF动态孪生：在 Digital Twin Builder 关联全重、AMAN 与油单</text>
  <text x="770" y="778" fill="#E2E8F0" font-size="11.5">☑ 4. 塔台与 AOC 边缘 ALDO 自治：部署 SQL Server on Azure Local 保障断网期本地签派</text>
  <text x="770" y="802" fill="#E2E8F0" font-size="11.5">☑ 5. ICAO 4444 与抖振护栏 (SOP-057)：RVSM &gt;= 1,000ft，间隔 &gt;= 3.0NM，抖振 &gt;= 1.3g</text>
  <text x="770" y="830" fill="#6EE7B7" font-size="11" font-weight="700">🔗 关联代码与密封证据：src/data_lab/benchmark_suite.py · tests/test_data_lab.py (118/118) · reports/report.json</text>
