  <!-- Header Banner -->
  <rect x="32" y="24" width="1376" height="92" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="48" y="42" width="186" height="28" rx="6" fill="url(#hdrGrad58)"/>
  <text x="141" y="61" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">DATA LAB · ROUND 50 FAQ</text>
  <text x="250" y="62" fill="#F8FAFC" font-size="18.2" font-weight="800">全球空管 ATM 与航司 AOC (910K EPS 四维航迹、动态尾流 TBS、尾迹云规避与 SAF) 选型：Fabric vs 四大云</text>
  <text x="48" y="94" fill="#94A3B8" font-size="12.5">42,000 架在飞航班 + 38 座枢纽机场 · Eventhouse H3 (6ms) + SSD DiskANN 6,800万尾流/尾迹匹配 (7ms) + SDS SAF 账本 + ALDO 塔台边缘 · 25ms 闭环省 87.3% TCO</text>
  <rect x="1204" y="38" width="186" height="64" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1297" y="62" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BE · 243/244 (99.59%)</text>
  <text x="1297" y="86" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">25ms · 省 87.3% TCO</text>

  <!-- Left Column: First-Principles Pain Points -->
  <rect x="32" y="132" width="436" height="360" rx="14" fill="#111C33" stroke="#F43F5E" stroke-width="1.4"/>
  <text x="52" y="162" fill="#FDA4AF" font-size="15" font-weight="800">01 · 传统空管 ATM 与航司签派三大致命痛点 ($161.4K/月)</text>

  <rect x="48" y="178" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 强顶风下固定距离尾流间隔致跑道吞吐腰斩与百机盘旋</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 46 节强顶风拉长固定距离着陆时间，跑道吞吐从 44 跌至 28 架/h</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 68 架进港航班空中画圈烧油，6 架宽体机燃油告急备降外场</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 单次枢纽大面积备降与欧盟 EU261 赔偿直接损失 $7.40M</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="302" fill="#FB7185" font-size="13" font-weight="700">② 盲穿高空冰过饱和区 (ISSR) 拉出强温室凝结尾迹云</text>
  <text x="62" y="322" fill="#E2E8F0" font-size="11.5">• 持久尾迹卷云占航空总气候变暖强迫 50%+，传统签派完全失明</text>
  <text x="62" y="340" fill="#E2E8F0" font-size="11.5">• 缺乏毫秒级 6,800万条 ISSR 三维冰湿度与高空抖振包线匹配</text>
  <text x="62" y="358" fill="#FCA5A5" font-size="11" font-weight="700">✗ 910K EPS 全球 ADS-B 流与全内存向量节点月烧 $122.6K</text>

  <rect x="48" y="382" width="404" height="94" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="404" fill="#FB7185" font-size="13" font-weight="700">③ 欧盟 ReFuelEU SAF 航油账本割裂与塔台断网失联</text>
  <text x="62" y="424" fill="#E2E8F0" font-size="11.5">• 强制 6% SAF 掺混与防超载带油 (Tankering) 缺乏逐航班核销</text>
  <text x="62" y="442" fill="#E2E8F0" font-size="11.5">• 枢纽机场塔台与 AOC 运控中心在光纤闪断时无法靠纯公有云运行</text>
  <text x="62" y="460" fill="#FCA5A5" font-size="11" font-weight="700">✗ 欧盟非 CO2 气候附加费与 SAF 补贴作废风险达 $9.20M</text>

  <!-- Center Column: Fabric 25ms Closed-Loop Architecture -->
  <rect x="486" y="132" width="484" height="360" rx="14" fill="#0F2238" stroke="#10B981" stroke-width="1.8"/>
  <text x="506" y="162" fill="#6EE7B7" font-size="15" font-weight="800">02 · Microsoft Fabric 空-地-气-碳 25ms 自愈闭环</text>

  <rect x="504" y="178" width="448" height="68" rx="9" fill="#0B192C" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="518" y="199" fill="#38BDF8" font-size="12.5" font-weight="800">Step 1 (6ms) · Eventhouse KQL H3 910K EPS 风廓线与冰云感知</text>
  <text x="518" y="218" fill="#E2E8F0" font-size="11.2">• $0/GB 写入税反演终端区 46 节强顶风廓线与 68 架进港航班堆积</text>
  <text x="518" y="235" fill="#93C5FD" font-size="11">• 同步锁定北大西洋 H3 Res-6 内 34 架宽体机闯入 RHi=118% 冰过饱和层</text>

  <rect x="504" y="254" width="448" height="72" rx="9" fill="#0B192C" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="518" y="275" fill="#C4B5FD" font-size="12.5" font-weight="800">Step 2 (7ms) · SSD DiskANN 6,800万 TBS 尾流与避尾迹变高匹配</text>
  <text x="518" y="294" fill="#E2E8F0" font-size="11.2">• 检索 6,800万向量 (0.99 相似，省92%内存)：RECAT-TBS 缩距至 3.6NM 恢复 42架/h</text>
  <text x="518" y="312" fill="#DDD6FE" font-size="11">• 规划 34 架跨洋航班 +2,000ft 升至 FL380 消除 78.4% 尾迹云 (+0.06% 油耗)</text>

  <rect x="504" y="334" width="448" height="68" rx="9" fill="#0B192C" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="518" y="355" fill="#FDE68A" font-size="12.5" font-weight="800">Step 3 (6ms) · Foundry IQ ICAO 4444 间隔与 1.3g 抖振护栏</text>
  <text x="518" y="374" fill="#E2E8F0" font-size="11.2">• 核验 SOP-057：RVSM &gt;= 1,000ft &amp; 雷达 3.6NM &gt;= 3.0NM + 抖振裕度 1.42g &gt;= 1.30g</text>
  <text x="518" y="391" fill="#FDE68A" font-size="11">• 确认欧盟 ReFuelEU 批次 SAF 掺混率 6.2% &gt;= 6.0% 且零违规超载带油</text>

  <rect x="504" y="410" width="448" height="68" rx="9" fill="#064E3B" stroke="#10B981" stroke-width="1.4"/>
  <text x="518" y="431" fill="#6EE7B7" font-size="12.5" font-weight="800">Step 4 (6ms) · ALDO 塔台/AOC 边缘 CPDLC 变高、TBS 排序与签证</text>
  <text x="518" y="450" fill="#F8FAFC" font-size="11.2">• 总签派长 Teams 联签 Confirm → ALDO 下发 CPDLC 变高、AMAN 排序与 SAF 核销</text>
  <text x="518" y="467" fill="#A7F3D0" font-size="11" font-weight="700">✓ 端到端 25ms 自愈 (50轮里程碑) · 守护 $16.60M 防备降、尾迹减碳与 SAF SLA</text>

