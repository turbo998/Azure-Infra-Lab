  <text x="80" y="950" class="metric-val">521.0 ms · 63/64 (98.44%)</text>
  <text x="80" y="972" class="box-muted">DL-01..DL-64 (R4 n=60: 526.5ms · R3 n=56: 532.0ms)</text>

  <rect x="434" y="900" width="365" height="86" rx="8" fill="#0F172A" stroke="#334155"/>
