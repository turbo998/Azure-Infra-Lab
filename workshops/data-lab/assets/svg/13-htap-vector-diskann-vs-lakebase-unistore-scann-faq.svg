  <!-- Row 3: Lakehouse Sync & Replication Cost -->
  <line x1="64" y1="722" x2="1536" y2="722" stroke="#1E293B" stroke-width="1"/>
  <text x="78" y="706" class="tbl-cell" font-weight="700">Lakehouse Sync &amp; Cost</text>
  <text x="310" y="706" class="tbl-cell" fill="#6EE7B7">Auto OneLake Delta Mirroring ($0 CU)</text>
