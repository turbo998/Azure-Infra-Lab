  <text x="78" y="668" class="tbl-cell" font-weight="700">Vector Index Architecture</text>
  <text x="310" y="668" class="tbl-cell" fill="#6EE7B7">SSD-Backed DiskANN (Vamana+PQ, -92% RAM)</text>
