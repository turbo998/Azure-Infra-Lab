  <!-- Background -->
  <rect width="1600" height="1040" fill="url(#bgGrad)"/>
  <rect x="24" y="20" width="1552" height="1000" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <rect x="44" y="36" width="210" height="24" rx="12" fill="url(#accentGrad)"/>
  <text x="149" y="52" text-anchor="middle" class="badge">DATA LAB · ROUND 5 HTAP &amp; VECTOR</text>
  <text x="270" y="53" class="subtitle">2026-11-09 BJT · Operational HTAP, Agent State &amp; Vector Indexing Selection Guide (FAQ Visual Summary)</text>
  <text x="44" y="88" class="title">Fabric SQL DB &amp; Cosmos DB DiskANN vs. Databricks Lakebase vs. Snowflake Unistore vs. AlloyDB ScaNN vs. Aurora</text>
  <text x="44" y="112" class="subtitle">Core Finding: SSD-backed DiskANN (Vamana + Product Quantization) cuts vector RAM by ~92% ($2,240/mo vs $10,880/mo HNSW model) with $0 OneLake Delta Mirroring &amp; 1GB Free Agentic App SQL</text>

  <!-- Top Left: Traditional RAM-Bound HNSW + Separate CDC vs Fabric SSD DiskANN + Auto OneLake Mirroring -->
  <rect x="44" y="130" width="750" height="390" rx="12" fill="url(#cardFabric)" stroke="#0284C7" stroke-width="1.5"/>
  <text x="64" y="158" class="sec-title">1. First-Principles Mechanics: RAM-Bound HNSW (pgvector) vs. SSD-Backed DiskANN + OneLake Zero-ETL</text>

  <!-- Left sub-box: RAM-Bound HNSW Pain -->
  <rect x="64" y="172" width="340" height="156" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.2"/>
  <text x="80" y="194" class="box-title" fill="#FCA5A5">⛔ Legacy RAM-Bound HNSW (pgvector / Standard PG)</text>
  <text x="80" y="214" class="box-sub">• Full 1536-dim vectors + HNSW graph must fit in RAM</text>
  <text x="80" y="233" class="box-sub">• 120M vectors require ~640 GB+ memory-optimized nodes</text>
  <text x="80" y="252" class="box-sub">• OLTP writes trigger costly HNSW graph re-balancing</text>
  <text x="80" y="271" class="box-sub">• Separate CDC ETL required to sync OLTP to Lakehouse</text>
  <text x="80" y="294" class="box-muted" fill="#FCA5A5">Modeled 120M-Vector + 35K TPS Cluster: $10,880/mo [synthetic]</text>
  <text x="80" y="312" class="box-muted">Official Ref: Aurora pgvector / HNSW memory sizing</text>

  <!-- Right sub-box: Fabric SSD DiskANN + OneLake Mirroring -->
  <rect x="424" y="172" width="350" height="156" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="440" y="194" class="box-title" fill="#6EE7B7">✅ Fabric SQL DB + Cosmos DB in Fabric (DiskANN GA)</text>
  <text x="440" y="214" class="box-sub">• Product Quantization (PQ) compressed codes in RAM (~8%)</text>
  <text x="440" y="233" class="box-sub">• Full Vamana graph + raw vectors on NVMe SSD (1-2 hops)</text>
  <text x="440" y="252" class="box-sub">• Auto-mirrored to OneLake Delta at $0 replication compute</text>
  <text x="440" y="271" class="box-sub">• Power BI Agentic App includes 1GB Free Fabric SQL DB</text>
  <text x="440" y="294" class="box-muted" fill="#6EE7B7">Modeled 120M-Vector + 35K TPS HTAP: $2,240/mo (-79.4%) [synthetic]</text>
  <text x="440" y="312" class="box-muted">Official Ref: learn.microsoft.com/fabric/database/cosmos-db</text>

  <!-- Scenario L Closed-Loop Pipeline inside Left Box -->
  <rect x="64" y="340" width="710" height="164" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="80" y="362" class="box-title" fill="#38BDF8">Scenario L Closed-Loop Simulation: Global Wealth MiFID-II Suitability HTAP (450ms Modeled E2E)</text>
  <text x="80" y="384" class="box-sub">1. Order State OLTP: Fabric SQL DB processes 35,000 TPS intraday trade orders &amp; auto-mirrors to OneLake Delta ($0 CU)</text>
  <text x="80" y="404" class="box-sub">2. Vector RAG Grounding: Cosmos DB in Fabric DiskANN searches 120M SEC/MiFID-II suitability embeddings in 16ms (92% RAM saved)</text>
  <text x="80" y="424" class="box-sub">3. Intraday VaR + Ontology: DirectLake (18ms) + Fabric IQ Rule (SingleIssuer &gt; 15% AND VaR99 &gt; 4.2%) flags 418 portfolios</text>
  <text x="80" y="444" class="box-sub">4. Governed Write-Back: Power BI Agentic App (1GB Free Fabric SQL + Rayfin Desk) rebalances $68.5M notional; blocks leveraged ETFs</text>
  <text x="80" y="468" class="prov-txt">[synthetic_scenario_model] Modeled E2E = 450ms · Confidence = 0.98 (Act automatically) · Modeled Exposure Protected = $1,950,000</text>
  <text x="80" y="488" class="prov-txt">[not_measured] Live multi-cloud 35K TPS + 120M-vector physical cluster hardware benchmark not executed (no paid cloud clusters run)</text>

  <!-- Top Right: Architect Selection Decision Tree -->
  <rect x="814" y="130" width="742" height="390" rx="12" fill="url(#cardComp)" stroke="#6366F1" stroke-width="1.5"/>
  <text x="834" y="158" class="sec-title" fill="#A5B4FC">2. Operational HTAP, Vector Search &amp; Agent State Selection Decision Tree</text>

  <!-- Decision Step 1 -->
  <rect x="834" y="174" width="702" height="60" rx="8" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2"/>
  <text x="850" y="196" class="box-title">Q1: Need BI Agentic Write-Back + 100M+ Vector RAG + Zero-ETL Lakehouse under Unified Capacity?</text>
  <text x="850" y="218" class="box-sub" fill="#6EE7B7">➔ YES: Select Microsoft Fabric Database Hub (Fabric SQL DB + Cosmos DB DiskANN + 1GB Free Agentic App SQL + $0 OneLake Mirroring)</text>

  <!-- Decision Step 2 -->
  <rect x="834" y="246" width="702" height="60" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="850" y="268" class="box-title">Q2: Need Serverless Postgres with Instant Copy-on-Write Dev Branching for Spark/ML Agents?</text>
  <text x="850" y="290" class="box-sub" fill="#38BDF8">➔ YES: Select Databricks Lakebase (Neon Postgres engine + Unity Catalog Delta sync; pair with OneLake Shortcuts for BI)</text>

  <!-- Decision Step 3 -->
  <rect x="834" y="318" width="702" height="60" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="850" y="340" class="box-title">Q3: Need Lightweight Row-Locked App State 100% Inside Existing Snowflake Credits or Postgres pg_lake?</text>
  <text x="850" y="362" class="box-sub" fill="#FCD34D">➔ YES: Select Snowflake Unistore Hybrid Tables (&lt;5K TPS app metadata) or Snowflake Postgres (pg_lake Iceberg federation)</text>

  <!-- Decision Step 4 -->
  <rect x="834" y="390" width="702" height="60" rx="8" fill="#0F172A" stroke="#EC4899" stroke-width="1.2"/>
  <text x="850" y="412" class="box-title">Q4: Deep GCP Vertex AI / PostgreSQL Analytical Acceleration or AWS Multi-Region Active-Active SQL?</text>
  <text x="850" y="434" class="box-sub" fill="#F472B6">➔ YES: Select GCP AlloyDB + ScaNN (PostgreSQL vector + columnar engine) or AWS Aurora PostgreSQL pgvector / Aurora DSQL</text>

  <!-- Decision Step 5: Better Together -->
  <rect x="834" y="460" width="702" height="46" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="850" y="480" class="box-title" fill="#6EE7B7">Better Together Coexistence: Keep Lakebase / AlloyDB / Aurora for App Microservices + Mirror/Shortcut to OneLake</text>
  <text x="850" y="497" class="box-muted">Zero-copy Delta/Iceberg into Fabric IQ Ontology + Power BI DirectLake ($0 F64 viewer seats) without migrating core OLTP apps</text>

  <!-- Middle Section: 5-Cloud HTAP & Vector Database Comparison Matrix -->
  <rect x="44" y="536" width="1512" height="310" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
