  <!-- Row 5: Modeled 120M-Vector + 35K TPS TCO -->
  <line x1="64" y1="798" x2="1536" y2="798" stroke="#1E293B" stroke-width="1"/>
  <text x="78" y="782" class="tbl-cell" font-weight="700">120M Vector + HTAP TCO</text>
  <text x="310" y="782" class="tbl-cell" fill="#6EE7B7">$2,240/mo (SSD DiskANN + $0 Mirror)</text>
  <text x="595" y="782" class="tbl-cell">$6,450/mo (Lakebase + Mosaic Vector)</text>
  <text x="860" y="782" class="tbl-cell">$7,820/mo (Hybrid Table + Cortex Credits)</text>
  <text x="1125" y="782" class="tbl-cell">$5,940/mo (AlloyDB ScaNN + BQ Sync)</text>
  <text x="1350" y="782" class="tbl-cell">$10,880/mo (RAM-Heavy HNSW r6g/r7g)</text>

  <!-- Row 6: Sweet Spot -->
  <text x="78" y="822" class="tbl-cell" font-weight="700">Primary Architect Fit</text>
  <text x="310" y="822" class="tbl-cell" fill="#38BDF8">Unified BI Write-Back + Massive DiskANN</text>
  <text x="595" y="822" class="tbl-cell">Instant PG Dev Branching + Spark Agents</text>
  <text x="860" y="822" class="tbl-cell">In-Warehouse App State (&lt;5K TPS)</text>
  <text x="1125" y="822" class="tbl-cell">GCP-Native Postgres Hybrid Vector</text>
  <text x="1350" y="822" class="tbl-cell">AWS Microservices OLTP + pgvector</text>

  <!-- Bottom KPI & Dual-Denominator Provenance Strip -->
  <rect x="44" y="862" width="1512" height="140" rx="12" fill="#0B192C" stroke="#10B981" stroke-width="1.5"/>
  <text x="64" y="888" class="sec-title" fill="#34D399">4. Sealed Benchmark KPIs &amp; Explicitly Separated Modeled Latency Denominators (report_id: data-lab-fabric-vs-4clouds-2026-11-09-r5)</text>

