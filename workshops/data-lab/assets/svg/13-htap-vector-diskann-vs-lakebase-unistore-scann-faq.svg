  <text x="1350" y="706" class="tbl-cell">Aurora Zero-ETL -&gt; Redshift / S3 Tables</text>

  <!-- Row 4: BI & Agentic Write-Back -->
  <line x1="64" y1="760" x2="1536" y2="760" stroke="#1E293B" stroke-width="1"/>
