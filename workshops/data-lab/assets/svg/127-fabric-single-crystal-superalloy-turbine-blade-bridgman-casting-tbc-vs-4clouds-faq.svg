  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($259.8K/月 vs $14.4K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：990K EPS 凝固高温计/24区热电偶/电子束流月费 $186.2K</text>
