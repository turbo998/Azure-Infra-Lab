  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• γ&apos; 全溶温度 (1,314°C) 与初熔温度 (1,324°C) 窗口不足 10°C</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 升温过快冲至 1,325.2°C 导致枝晶间局部融化产生 1.45vol% 微孔</text>
