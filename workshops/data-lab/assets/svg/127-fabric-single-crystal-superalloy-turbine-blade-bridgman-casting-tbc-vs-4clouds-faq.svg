  <text x="241" y="66" fill="#050914" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.6">🏆 R119 · 256=2^8 TESTS, 520 CASES &amp; -94.5% TCO!</text>
  <text x="440" y="66" fill="#F8FAFC" font-size="16" font-weight="800">航空发动机单晶高温合金涡轮叶片 (CMSX-4/Rene N5) 定向凝固防雀斑、固溶防初熔与 EB-PVD 涂层 12ms 闭环</text>
