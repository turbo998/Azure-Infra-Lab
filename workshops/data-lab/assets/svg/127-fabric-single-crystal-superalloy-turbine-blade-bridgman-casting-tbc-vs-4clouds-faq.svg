  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · 单晶涡轮叶片三大物理危机与传统死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #19 LMC 炉缘板变截面 Ra=2.85 雀斑链与杂晶危机</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• 含 3-6wt% 铼(Re)单晶糊状区排出的富 Al/Ti 液相密度更轻</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 缘板区热梯度跌至 42°C/cm，枝晶间距粗化至 460μm，Ra=2.85 &gt; 1.0</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 热溶质浮力烟羽冲断枝晶形成等轴晶雀斑链，缘板角部滋生杂晶</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：18h 脱壳酸洗才发现雀斑，整炉含铼叶片报废损失 &gt;$336K！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
