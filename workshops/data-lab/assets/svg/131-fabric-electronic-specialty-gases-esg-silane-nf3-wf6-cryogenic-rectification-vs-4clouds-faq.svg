  <text x="1032" y="310" fill="#FDE68A" font-size="11.5" font-weight="800">• 守护 SLA 风险敞口：        $42,150,000 (🏆 &gt;$42M 大关!)</text>

  <rect x="1018" y="338" width="364" height="126" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1032" y="360" fill="#FDE68A" font-size="12.5" font-weight="900">🏆 跌破150ms矩阵均值 &amp; n=130 &amp; 4ms (R123)</text>
  <text x="1032" y="382" fill="#FFFFFF" font-size="12" font-weight="800">• 路由评估矩阵 (n=536)：    535 / 536 (99.81% 历史最高)</text>
  <text x="1032" y="402" fill="#34D399" font-size="11.5" font-weight="700">• 分母 A 路由矩阵算术均值： 149.0 ms (🏆 正式跌破 150ms!)</text>
  <text x="1032" y="422" fill="#FDE68A" font-size="11.5" font-weight="800">• 分母 B 130大行业本体均值：133.0 ms (🏆 n=130 整数大关!)</text>
  <text x="1032" y="442" fill="#CBD5E1" font-size="11">• Python 确定性单测套件：  264 / 264 (100% 通过)</text>

  <rect x="1018" y="476" width="364" height="118" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="1032" y="498" fill="#67E8F9" font-size="12.5" font-weight="800">Better Together 跨云零拷贝黄金分工</text>
  <text x="1032" y="518" fill="#E2E8F0" font-size="11">• Azure HPC / Databricks：GCMC 沸石吸附 &amp; 深冷精馏塔 CFD</text>
  <text x="1032" y="538" fill="#E2E8F0" font-size="11">• Snowflake / SAP：18万只 316L EP 钢瓶、ISO 管束车与 BSGS ERP</text>
  <text x="1032" y="558" fill="#34D399" font-size="11" font-weight="700">• Fabric：OneLake 零拷贝挂载 + 4ms 防爆车间实时控制面</text>
  <text x="1032" y="578" fill="#94A3B8" font-size="10.5">• 官方规格引用：126 条 (新增 SPEC-ELECTRONIC-SPECIALTY-GASES-R123)</text>

  <!-- Bottom Strip -->
  <rect x="40" y="624" width="1360" height="240" rx="14" fill="#0E192D" stroke="#2563EB" stroke-width="1.5"/>
  <text x="60" y="654" fill="#60A5FA" font-size="14.5" font-weight="800">04 · 6N5 超高纯电子特气 (SiH4/NF3/WF6) 三大物理护栏矩阵 (SOP-130 · 149.0ms &lt;150ms Mean, n=130 &amp; 4ms &lt;5ms E2E Milestone)</text>

  <rect x="60" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="76" y="694" fill="#67E8F9" font-size="13" font-weight="800">① -112°C 硅烷深冷精馏与 0.12ppb 硅氧烷拦截</text>
  <text x="76" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：Peng-Robinson 非理想 VLE 与低温 5A 分子筛协同截留</text>
  <text x="76" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：#08 塔再沸微扰预判硅氧烷冲上 8.40 ppb (&gt;1.00 ppb)</text>
  <text x="76" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：回流比提至 7.4 + 无扰切入 #08B -80°C 再生分子筛</text>
  <text x="76" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：硅氧烷与水分锁死 0.12 ppb &lt;= 1.00 ppb</text>
  <text x="76" y="800" fill="#94A3B8" font-size="11">• 外延良率：全面满足 2nm GAA 选择性 SiGe 外延零氧化缺陷</text>

  <rect x="506" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#10B981" stroke-width="1.2"/>
  <text x="522" y="694" fill="#6EE7B7" font-size="13" font-weight="800">② NF3 电解槽去极化防爆与同沸点 CF4 择形脱除</text>
  <text x="522" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：利用极性差异 (4.5Å 极性 NF3 vs 4.7Å 非极性 CF4) 择形分离</text>
  <text x="522" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：#22 槽过电位 +0.38V 致 CF4=185ppmv、阳极 H2=2.85%</text>
  <text x="522" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：电流密度 -8.5% + 补液态无水 HF + 改性 5A 沸石精脱</text>
  <text x="522" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：CF4 压至 4.2 ppmv，阳极室 H2 0.18 vol%</text>
  <text x="522" y="800" fill="#94A3B8" font-size="11">• 本质安全：彻底消除氟氢混合爆炸风险，纯度达 99.99995%</text>

  <rect x="952" y="670" width="428" height="174" rx="10" fill="#091326" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="968" y="694" fill="#FBBF24" font-size="13" font-weight="800">③ SEMI C3 6N5 证书与 99.96% 高 GWP 零逃逸护照</text>
  <text x="968" y="716" fill="#E2E8F0" font-size="11.5">• 温室减排：NF3/WF6 充装吹扫尾气深冷捕集回收率达 99.96%</text>
  <text x="968" y="736" fill="#E2E8F0" font-size="11.5">• 钢瓶基因库：180,000 只 316L EP 钢瓶内壁钝化与充装履历互锁</text>
  <text x="968" y="756" fill="#E2E8F0" font-size="11.5">• 秒级 e-CoA：在线 CRDS/PDHID 谱图直签晶圆厂 BSGS 准入单</text>
  <text x="968" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：1GB 免费 SQL 签发 SEMI C3 与 IPCC 零逃逸护照</text>
  <text x="968" y="800" fill="#FDE68A" font-size="11" font-weight="700">• 里程碑：149.0ms均值 · 130大本体 · 4ms闭环 · 360M向量</text>
