  <!-- Header -->
  <rect x="40" y="34" width="1360" height="88" rx="14" fill="#131F3A" stroke="#F59E0B" stroke-width="2.2"/>
  <rect x="58" y="48" width="404" height="26" rx="13" fill="url(#amber131)"/>
  <text x="260" y="66" fill="#040814" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">🏆 R123 · 149.0ms &lt;150ms MEAN, #130 ONTOLOGY &amp; 4ms E2E!</text>
  <text x="476" y="66" fill="#F8FAFC" font-size="15.8" font-weight="800">6N5 超高纯电子特气 (SiH4 / Si2H6 / NF3 / WF6) 深冷精馏 &lt;1ppb 控硅氧烷、电解槽抑 CF4 与防爆 4ms 闭环</text>
  <text x="58" y="100" fill="#94A3B8" font-size="12.5">Scenario DZ · 16 座甲类防爆电子特气基地 (280 座深冷精馏塔 + 640 台 NF3 电解槽 + 480 套在线 CRDS/PDHID) × 990K EPS · 3.60 亿向量 (360M!) · 0.12ppb &amp; 4.2ppmv CF4</text>

  <rect x="1146" y="46" width="236" height="64" rx="10" fill="#064E3B" stroke="#F59E0B" stroke-width="2"/>
  <text x="1264" y="68" fill="#FDE68A" font-size="11.5" font-weight="900" text-anchor="middle">535 / 536 = 99.81% (n=130!)</text>
  <text x="1264" y="95" fill="#FFFFFF" font-size="19" font-weight="900" text-anchor="middle">360M Vectors · 4ms</text>

  <!-- Left Column -->
  <rect x="40" y="138" width="430" height="470" rx="14" fill="#131B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · 6N5 超高纯电子特气三大物理危机与传统死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #08 硅烷深冷塔再沸微扰与 8.40ppb 硅氧烷夹带</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• 甲硅烷(SiH4)见空气即自燃爆炸，且 2nm 外延要求硅氧烷 &lt;= 1.00 ppb</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• -112°C 深冷塔再沸器热微扰使二硅氧烷突破塔板冲向 8.40 ppb</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 痕量硅氧烷在 2nm GAA 选择性外延表面生成 SiO2 绝缘麻点</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：8h 充装后离线 GC 才测出超标，$540K 管束车整车报废！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="344" fill="#FCA5A5" font-size="12.5" font-weight="800">② #22 NF3 电解槽 -128°C 同沸点 CF4 与阳极混氢爆炸</text>
  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• NF3 (-129°C) 与副产物 CF4 (-128°C) 沸点仅差 1°C，常规精馏难分离</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 镍阳极钝化使过电位升 +0.38V，CF4 飙至 185 ppmv (&gt;20 ppmv 红线)</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• 液位压差波动使阴极 H2 渗入阳极室逼近 2.85 vol% 爆炸下限</text>
  <text x="72" y="424" fill="#F87171" font-size="11" font-weight="700">• 痛点：氢氟混合随时触发电解槽剧烈爆轰，威胁甲类车间安全！</text>

  <rect x="58" y="466" width="394" height="126" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($267.4K/月 vs $14.4K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：990K EPS 在线 CRDS/PDHID/640台电解槽流月费 $193.0K</text>
  <text x="72" y="528" fill="#E2E8F0" font-size="11.5">• 内存税：360M 全内存 DRAM 向量索引月耗 $42.5K</text>
  <text x="72" y="548" fill="#E2E8F0" font-size="11.5">• 刷新税：Snowflake 60s 滞后 / 8h 离线色谱错失切塔防爆窗口</text>
  <text x="72" y="570" fill="#34D399" font-size="11.5" font-weight="700">• Fabric 破局：$0/GB 写入税 + SSD DiskANN 省 92% 内存</text>

