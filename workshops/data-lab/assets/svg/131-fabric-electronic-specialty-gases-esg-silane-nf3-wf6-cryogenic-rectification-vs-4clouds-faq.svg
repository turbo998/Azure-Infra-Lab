  <rect x="488" y="138" width="494" height="470" rx="14" fill="#0D1F33" stroke="#F59E0B" stroke-width="2.2"/>
  <text x="508" y="168" fill="#FDE68A" font-size="14.5" font-weight="800">02 · Microsoft Fabric 4ms (&lt;5ms!) 闭环 (360M &amp; n=130!)</text>

  <!-- Step 1 -->
  <rect x="508" y="184" width="454" height="96" rx="10" fill="#112A45" stroke="#06B6D4" stroke-width="1.4"/>
  <text x="524" y="205" fill="#67E8F9" font-size="12.5" font-weight="800">STEP 1 · Eventhouse KQL 990K EPS 衰荡光谱与压差感知 (1 ms)</text>
  <text x="524" y="225" fill="#F8FAFC" font-size="11.5">• $0/GB 写入税摄入 280 座深冷精馏塔、640 台电解槽与 480 套 CRDS</text>
  <text x="524" y="244" fill="#CBD5E1" font-size="11">• series_fit_line() 1ms 捕获 #08 塔硅氧烷抬头冲向 8.40 ppb</text>
  <text x="524" y="263" fill="#34D399" font-size="11" font-weight="700">• 同时识别 #22 电解槽过电位 +0.38V、CF4=185ppmv 与 H2=2.85%</text>

  <!-- Step 2 -->
  <rect x="508" y="292" width="454" height="104" rx="10" fill="#132F2B" stroke="#10B981" stroke-width="1.8"/>
  <text x="524" y="313" fill="#6EE7B7" font-size="12.5" font-weight="800">STEP 2 · 6 跳特气孪生 &amp; 3.60 亿向量 SSD DiskANN 检索 (1 ms)</text>
  <text x="524" y="333" fill="#F8FAFC" font-size="11.5">• 检索 360,000,000 (🏆 跌破150ms均值 &amp; n=130!) 精馏/吸附/电解向量</text>
  <text x="524" y="352" fill="#CBD5E1" font-size="11">• 相似度 0.99 (省 92% 内存)：回流比提至 7.4 + 切 #08B -80°C 分子筛</text>
  <text x="524" y="371" fill="#FDE68A" font-size="11" font-weight="700">• 电解槽电流密度下调 -8.5% + 补加液态无水 HF + 5A 择形分子筛</text>

  <!-- Step 3 -->
  <rect x="508" y="408" width="454" height="90" rx="10" fill="#172554" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="524" y="429" fill="#93C5FD" font-size="12.5" font-weight="800">STEP 3 · Foundry IQ 6N5 纯度与防爆护栏 SOP-130 (1 ms)</text>
  <text x="524" y="449" fill="#F8FAFC" font-size="11.5">• 校验硅烷中硅氧烷与水分锁死 0.12 ppb &lt;= 1.00 ppb (99.99995% 6N5)</text>
  <text x="524" y="468" fill="#CBD5E1" font-size="11">• NF3 中 CF4 压至 4.2 ppmv &lt;= 20.0 ppmv，阳极室 H2 0.18 vol%</text>
  <text x="524" y="485" fill="#34D399" font-size="11" font-weight="700">• 高 GWP 吹扫尾气深冷捕集回收率达 99.96%，零温室气体逃逸</text>

  <!-- Step 4 -->
  <rect x="508" y="510" width="454" height="84" rx="10" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.4"/>
  <text x="524" y="531" fill="#C4B5FD" font-size="12.5" font-weight="800">STEP 4 · Teams 特气副总裁确认 + ALDO 边缘 + 6N5 护照 (1 ms)</text>
  <text x="524" y="551" fill="#F8FAFC" font-size="11.5">• 防爆车间 ALDO 边缘下发深冷切塔阀、无水 HF 泵与整流器指令</text>
  <text x="524" y="570" fill="#34D399" font-size="11" font-weight="700">• 1GB 免费 SQL 签发 SEMI C3 6N5 e-CoA 护照 (总耗时 4ms &lt;5ms!)</text>

