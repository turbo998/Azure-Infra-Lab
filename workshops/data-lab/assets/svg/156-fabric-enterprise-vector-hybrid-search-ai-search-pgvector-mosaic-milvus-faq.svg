  <text x="54" y="94" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22.5" font-weight="800">Enterprise Vector &amp; Hybrid Search Selection FAQ: Azure AI Search + SSD DiskANN vs. pgvector vs. Mosaic vs. Milvus</text>
