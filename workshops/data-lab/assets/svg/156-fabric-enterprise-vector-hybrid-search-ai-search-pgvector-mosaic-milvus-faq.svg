  <text x="58" y="188" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. Three Production Traps of Standalone Full-DRAM Vector DBs</text>
  <text x="58" y="210" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">First-Principles Analysis: DRAM HNSW Cost Explosion, Filtered-Recall Collapse &amp; Dual-Write ACL Drift</text>

  <!-- Anti-Pattern Box -->
  <rect x="58" y="224" width="706" height="142" rx="10" fill="#2A1215" stroke="#EF4444" stroke-width="1.2"/>
  <text x="76" y="248" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">⛔ Legacy Anti-Patterns: Full-DRAM HNSW Cluster + Pure Dense Search + Dual-Write Sync</text>
  <text x="76" y="272" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• DRAM HNSW Memory Explosion: 460M 1536-d vectors in RAM HNSW require ~3.2 TB DRAM ($54,600/mo cluster bill)</text>
  <text x="76" y="294" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exact SKU &amp; Filtered-Recall Collapse: Pure vector search confuses part codes (`AX908` vs `AX901`) &amp; breaks under strict SQL filters</text>
  <text x="76" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Dual-Write &amp; ACL Desync: Copying rows from SQL/OneLake to external Milvus/Qdrant leaks deleted/revoked docs before sync</text>
  <text x="76" y="340" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• Result: $314.7K/mo stitched DRAM vector + streaming + BI seat TCO across 10,000 enterprise users</text>

