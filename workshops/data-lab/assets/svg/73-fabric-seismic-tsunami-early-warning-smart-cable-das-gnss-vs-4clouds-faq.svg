  <text x="80" y="686" fill="#F8FAFC" font-size="11.5">1. $0/GB 写入税 + 15ms KQL FIR/FFT 拾取：920K EPS 海底 DAS</text>
  <text x="80" y="704" fill="#94A3B8" font-size="11">   与 100Hz 强震流直入 Eventhouse，消除 Mw 8.4 大震震级饱和</text>
  <text x="80" y="728" fill="#F8FAFC" font-size="11.5">2. 1.28 亿向量 SSD DiskANN 16ms 检索：3D 格林函数与 MOST</text>
  <text x="80" y="746" fill="#94A3B8" font-size="11">   海啸爬高图驻留 NVMe SSD，省 92% 内存，免 15 分钟超算等待</text>
  <text x="80" y="770" fill="#F8FAFC" font-size="11.5">3. ALDO 抗毁断网边缘 + F64 $0 读者税：骨干光缆震断仍本地</text>
  <text x="80" y="788" fill="#94A3B8" font-size="11">   急停高铁与 EUV，1,950 名预报员/应急指挥官 $0 Viewer 许可费</text>
  <text x="80" y="818" fill="#34D399" font-size="12" font-weight="800">✓ 月度标准化 TCO：$10,600/月 vs 竞对 $107,100/月（立省 90.1%！）</text>

  <rect x="502" y="638" width="430" height="204" rx="10" fill="#132642" stroke="#64748B" stroke-width="1"/>
  <text x="518" y="662" fill="#93C5FD" font-size="13" font-weight="800">🤝 四大云竞对定位与 OneLake 零拷贝共存边界</text>
  <text x="518" y="688" fill="#E2E8F0" font-size="11.5">• Databricks GPU ($107.1K/mo)：适合 SPECFEM3D 三维地壳</text>
  <text x="518" y="706" fill="#94A3B8" font-size="11">  全波形反演与 SeisLM 训练，格林函数库零拷贝写回 OneLake</text>
  <text x="518" y="730" fill="#E2E8F0" font-size="11.5">• Snowflake ($111.0K/mo)：适合市政建筑抗震设防档案与应急</text>
  <text x="518" y="748" fill="#94A3B8" font-size="11">  物资台账，60s Dynamic Tables 无法拦截 14.8s 后的 S 波</text>
  <text x="518" y="772" fill="#E2E8F0" font-size="11.5">• AWS Kinesis/Timestream ($105.6K/mo)：920K EPS 按 GB 写入</text>
  <text x="518" y="790" fill="#94A3B8" font-size="11">  与 1.28 亿 OpenSearch 全内存向量 OCU 账单高昂</text>
  <text x="518" y="818" fill="#E2E8F0" font-size="11.5">• GCP BigQuery ($106.5K/mo)：缺震区断网边缘与毫秒级生命线联锁</text>

  <rect x="950" y="638" width="424" height="204" rx="10" fill="#092E26" stroke="#10B981" stroke-width="1.4"/>
  <text x="966" y="662" fill="#6EE7B7" font-size="13" font-weight="800">📈 Scenario BT 密封基准验证（DL-301..DL-304）</text>
  <text x="966" y="688" fill="#F8FAFC" font-size="12" font-weight="700">• 评测矩阵得分：303 / 304 (99.67%) · 148/148 单测通过</text>
  <text x="966" y="712" fill="#F8FAFC" font-size="11.5">• 提前预警窗口：S 波到达前抢出黄金 14.8 秒 (PGA = 0.62g)</text>
  <text x="966" y="734" fill="#F8FAFC" font-size="11.5">• 海啸爬高反演：16ms 输出 6.4m 最大爬高淹没图 (+2.8m 水压)</text>
  <text x="966" y="756" fill="#F8FAFC" font-size="11.5">• 生命线联锁保护：28 列高铁制动 + 42 台 EUV 挂起 + 180 燃气站</text>
  <text x="966" y="778" fill="#F8FAFC" font-size="11.5">• 零误报安全门禁：6 座 DAS + 8 座井下 + 3 座 GNSS 同步核验</text>
  <text x="966" y="812" fill="#34D399" font-size="13" font-weight="800">🛡️ 守护 $21,850,000 高铁、晶圆厂、燃气与海啸防灾 SLA</text>
