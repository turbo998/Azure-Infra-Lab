  <rect x="60" y="54" width="218" height="28" rx="6" fill="url(#accent73)"/>
  <text x="169" y="73" fill="#FFFFFF" font-size="11.8" font-weight="800" text-anchor="middle">2026-11-14 · R65 · 128M VECTORS</text>
  <text x="294" y="72" fill="#F8FAFC" font-size="16.2" font-weight="800">Microsoft Fabric 地震与海啸秒级预警（EEW）、海底 SMART 光缆 DAS、高频 GNSS 与生命线联动 vs 四大云选型一图流</text>
  <text x="60" y="104" fill="#94A3B8" font-size="12.5">18 条海底 SMART 光缆 + 14,000 座强震仪 + 3,800 座 RTK-GNSS × 920K EPS · Eventhouse 15ms + SSD DiskANN 16ms 1.28 亿格林函数 + ALDO = 63ms 闭环 · 省 90.1% TCO</text>
  <rect x="1182" y="50" width="196" height="58" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1280" y="72" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BT · 1.28 亿向量</text>
  <text x="1280" y="96" fill="#F8FAFC" font-size="18" font-weight="800" text-anchor="middle">63ms · 省 90.1% TCO</text>

  <!-- Left Column: Pain Points -->
  <rect x="44" y="140" width="430" height="440" rx="14" fill="#111C33" stroke="#EF4444" stroke-width="1.3"/>
  <text x="64" y="170" fill="#FCA5A5" font-size="15" font-weight="800">❌ 传统 15–30s 汇集台网与公有云拼接栈三大痛点</text>

  <rect x="64" y="188" width="390" height="114" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="212" fill="#FECACA" font-size="13" font-weight="700">1. 15–30s 传统台网滞后与 Mw 8.4 大震“震级饱和”</text>
  <text x="80" y="234" fill="#CBD5E1" font-size="11.5">• 传统陆基台网仅看前 3s P 波振幅，将 Mw 8.4 巨震低估为 7.2 级</text>
  <text x="80" y="254" fill="#CBD5E1" font-size="11.5">• 15–30s 汇聚滞后直接错失距离震中 68km 都市圈黄金 14.8s 窗口</text>
  <text x="80" y="274" fill="#FCA5A5" font-size="11.5" font-weight="700">• S 波先于指令到达，导致 350km/h 高铁、EUV 光刻机与燃气网受损</text>

  <rect x="64" y="316" width="390" height="114" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="340" fill="#FECACA" font-size="13" font-weight="700">2. 920K EPS 海底 DAS 应变与 100Hz 波形流按 GB 写入税</text>
  <text x="80" y="362" fill="#CBD5E1" font-size="11.5">• 18 条 SMART 光缆 DAS + 1.4 万井下强震仪 + GNSS = 920K EPS</text>
  <text x="80" y="382" fill="#CBD5E1" font-size="11.5">• 公有云时序库按 GB 双重收费，且强震震断城际光缆会导致云端失联</text>
  <text x="80" y="402" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅波形流摄入与小波滤波即月烧 $47,800/月 (Normalized)</text>

  <rect x="64" y="444" width="390" height="120" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="468" fill="#FECACA" font-size="13" font-weight="700">3. 1.28 亿条 3D 格林函数与海啸爬高向量全内存硬件税</text>
  <text x="80" y="490" fill="#CBD5E1" font-size="11.5">• 实时求解浅水方程需 15 分钟 (海啸已上岸)，必须检索 1.28 亿条</text>
  <text x="80" y="510" fill="#CBD5E1" font-size="11.5">  (128M) 预计算 3D 黏弹性格林函数与 MOST 海啸爬高向量 (5.6TB RAM)</text>
  <text x="80" y="532" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅全内存向量集群月费即达 $40,500/月，总拼接栈高达 $107,100/月</text>

  <!-- Center/Right Column: Fabric 63ms Closed Loop -->
  <rect x="492" y="140" width="904" height="440" rx="14" fill="#0F223D" stroke="#10B981" stroke-width="1.5"/>
  <text x="514" y="170" fill="#6EE7B7" font-size="15.5" font-weight="800">✅ Microsoft Fabric 海底光缆 P 波预警、1.28 亿格林函数海啸反演与生命线 63ms 闭环（省 90.1% TCO · $10,600/月）</text>

  <!-- Step 1 -->
  <rect x="514" y="188" width="860" height="84" rx="10" fill="#132D50" stroke="#38BDF8" stroke-width="1.2"/>
  <rect x="528" y="202" width="108" height="24" rx="5" fill="#0284C7"/>
  <text x="582" y="218" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 1 · 15 ms</text>
  <text x="648" y="218" fill="#F8FAFC" font-size="13.5" font-weight="800">Eventhouse KQL FIR/FFT/H3 920K EPS 海底 DAS 纵波 P 波拾取与水压分离（$0/GB 写入税）</text>
  <text x="528" y="242" fill="#BAE6FD" font-size="11.5">• 实时摄入 18 条 SMART 光缆 DAS、1.4 万座 100Hz 井下强震仪与 3,800 座 10Hz RTK-GNSS 流，series_fir() 滤除洋流噪声</text>
  <text x="528" y="260" fill="#34D399" font-size="11.5" font-weight="700">• 15ms 完成 P 波初动拾取 (STA/LTA &gt; 8.5)，锁定外海 68km Mw 8.4 逆冲巨震 (210km 破裂不饱和) 与 +2.8m 海底水压抬升</text>

  <!-- Step 2 -->
  <rect x="514" y="282" width="860" height="90" rx="10" fill="#132D50" stroke="#818CF8" stroke-width="1.2"/>
  <rect x="528" y="296" width="108" height="24" rx="5" fill="#4F46E5"/>
  <text x="582" y="312" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 2 · 16 ms</text>
  <text x="648" y="312" fill="#F8FAFC" font-size="13.5" font-weight="800">Fabric IQ 6 跳生命线孪生 × Cosmos SSD DiskANN 1.28 亿向量（128M）检索（省 92% 内存）</text>
  <text x="528" y="336" fill="#E0E7FF" font-size="11.5">• 16ms 在 NVMe SSD 上检索 1.28 亿条 3D 弹性动力学格林函数、MOST 海啸爬高与基础设施脆性向量 (0.99 相似)</text>
  <text x="528" y="356" fill="#34D399" font-size="11.5" font-weight="700">• 预测沿海 PGA = 0.62g (抢出黄金 14.8s 窗口) 及海啸最大爬高 6.4m · 生成 28 列高铁制动、42 台 EUV 挂起与 180 座燃气阀关闭单</text>

  <!-- Step 3 -->
  <rect x="514" y="382" width="860" height="88" rx="10" fill="#132D50" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="528" y="396" width="108" height="24" rx="5" fill="#D97706"/>
  <text x="582" y="412" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 3 · 16 ms</text>
  <text x="648" y="412" fill="#F8FAFC" font-size="13.5" font-weight="800">Foundry IQ 多台站（&gt;=4 座）物理波速包络零误报护栏（SOP-072）</text>
  <text x="528" y="436" fill="#FEF3C7" font-size="11.5">• 强制校核 6 座海底 DAS 通道 + 8 座井下强震台 + 3 座 RTK-GNSS 站沿 6.5km/s P 波传播锥同步触发，剔除施工/雷击假信号</text>
  <text x="528" y="454" fill="#34D399" font-size="11.5" font-weight="700">• 确认误报率 &lt; 0.0001%，完全符合国家地震烈度速报、高铁地震监控系统与晶圆厂防震停机安全规程</text>

  <!-- Step 4 -->
  <rect x="514" y="480" width="860" height="84" rx="10" fill="#132D50" stroke="#10B981" stroke-width="1.2"/>
  <rect x="528" y="494" width="108" height="24" rx="5" fill="#059669"/>
  <text x="582" y="510" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 4 · 16 ms</text>
  <text x="648" y="510" fill="#F8FAFC" font-size="13.5" font-weight="800">首席地震官 Teams 联签 + ALDO 变电站/晶圆厂断网边缘下发 + 3GPP 小区广播</text>
  <text x="528" y="534" fill="#D1FAE5" font-size="11.5">• 首席地震官在 Teams 联签 Confirm，驱动变电站/晶圆厂 SQL Server on Azure Local (ALDO) 提前 14.8 秒完成联锁急停</text>
  <text x="528" y="552" fill="#6EE7B7" font-size="11.5" font-weight="700">• 端到端 63ms 保住 28 列高铁、42 台 EUV 光刻机与沿海居民安全，月省 $96,500 (-90.1% TCO)，守护 $21.85M SLA</text>

  <!-- Bottom Row: 5-Cloud Matrix & Quantitative KPIs -->
  <rect x="44" y="596" width="1352" height="264" rx="14" fill="#0E1B31" stroke="#334155" stroke-width="1.2"/>
  <text x="64" y="624" fill="#F8FAFC" font-size="14.5" font-weight="800">📊 五大云平台地震海啸预警、1.28 亿格林函数检索与生命线边缘联动对比矩阵（n=304 路由均值 242.0ms · n=72 本体均值 205.0ms）</text>

  <rect x="64" y="638" width="420" height="204" rx="10" fill="#132642" stroke="#10B981" stroke-width="1.2"/>
