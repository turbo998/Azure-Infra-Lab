  <text x="1018" y="342" fill="#E2E8F0" font-size="11.2">• Isaac Gym / MuJoCo 万倍并行强化学习训练 → GPU 集群</text>
  <text x="1018" y="360" fill="#93C5FD" font-size="11" font-weight="700">• 打捞出的 1,600 段 .mcap 难例通过 OneLake Shortcut 零拷贝供给</text>

  <rect x="1004" y="386" width="388" height="90" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1018" y="408" fill="#FBBF24" font-size="12.5" font-weight="800">⚠️ 竞对局限与避坑指南 (Anti-Patterns)</text>
  <text x="1018" y="428" fill="#E2E8F0" font-size="11.2">• 严禁跳过 ISO/TS 15066 (&lt;140N) 校验直接下发神经网络动作</text>
  <text x="1018" y="446" fill="#E2E8F0" font-size="11.2">• 严禁盲目上传 18,000 台机器人全量无异常 RGB-D 视频流</text>
  <text x="1018" y="464" fill="#FDE68A" font-size="11" font-weight="700">• 严禁将 38 自由度高频关节流写入按属性计费的 IoT SiteWise</text>

