  <text x="68" y="751" fill="#94A3B8" font-size="11.5">内部全量: $178,500/月 · 500人归一化: $77,600/月 (按关节属性计费 + 内存向量 + 1,900人BI席位)</text>

  <rect x="52" y="774" width="644" height="74" rx="10" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="68" y="798" fill="#7DD3FC" font-size="12.5" font-weight="800">💡 $17.65M 风险敞口保护拆解 (Scenario BH · 60本体里程碑定量收益)：</text>
  <text x="68" y="818" fill="#E2E8F0" font-size="11.5">• 420 台机器人导纳热修防总装线停产：$7.60M · 0.7% 难例打捞与减速器保护：$6.15M</text>
  <text x="68" y="836" fill="#6EE7B7" font-size="11.5" font-weight="700">• 100% 满足 ISO 10218-2 / ISO/TS 15066 接触力 (&lt;140N) 与双足 ZMP 安全合规：$3.90M</text>

  <!-- Bottom Row Right: Dual-Denominator & Production Checklist -->
  <rect x="734" y="510" width="674" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="754" y="540" fill="#FBBF24" font-size="15" font-weight="800">05 · 双分母基准对账 (R53 · n=60 里程碑) 与生产落地核验清单</text>

  <rect x="754" y="556" width="634" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="770" y="578" fill="#34D399" font-size="12.5" font-weight="800">📊 严格区分两大延迟分母 (Dual-Denominator Reconciliation · 2026-11-14 R53)</text>
  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=256 (DL-01..256) 均值 = 283.5 ms (255/256 = 99.61%)</text>
  <text x="770" y="618" fill="#F8FAFC" font-size="11.5">• 分母 B (行业本体端到端仿真均值 ontology_simulations[])：n=60 (场景 A..BH，范围 5–780ms) 均值 = 238.0 ms</text>
  <text x="770" y="636" fill="#93C5FD" font-size="11">• 本轮新增 Scenario BH 端到端延迟 = 61 ms (15ms 感知 + 16ms DiskANN/孪生 + 15ms ISO 15066 护栏 + 15ms 回写) · 124/124 单测通过</text>

  <rect x="754" y="658" width="634" height="190" rx="10" fill="#0B192C" stroke="#334155" stroke-width="1"/>
  <text x="770" y="682" fill="#7DD3FC" font-size="13" font-weight="800">🛠️ 售前打单与生产落地 5 步核验清单 (Production Checklist)：</text>
  <text x="770" y="706" fill="#E2E8F0" font-size="11.5">☑ 1. 全身力控与触觉流直通：890K EPS 遥测直推 Eventhouse ($0/GB 写入税)</text>
  <text x="770" y="730" fill="#E2E8F0" font-size="11.5">☑ 2. Cosmos SSD DiskANN 8,000万轨迹库：视触觉 Episode 与导纳参数建索引 (&lt; 16ms)</text>
  <text x="770" y="754" fill="#E2E8F0" font-size="11.5">☑ 3. 机器人-灵巧手-工位-技能孪生：在 Digital Twin Builder 绑定 URDF/MJCF</text>
  <text x="770" y="778" fill="#E2E8F0" font-size="11.5">☑ 4. 24 座工厂 ALDO 断网自治：部署 SQL Server on Azure Local 保障车间闭环</text>
  <text x="770" y="802" fill="#E2E8F0" font-size="11.5">☑ 5. 人机协作安全护栏 (SOP-060)：接触力 &lt; 140N，双足 ZMP 稳定裕度 &gt;= 3.5cm</text>
  <text x="770" y="830" fill="#6EE7B7" font-size="11" font-weight="700">🔗 关联代码与密封证据：src/data_lab/benchmark_suite.py · tests/test_data_lab.py (124/124) · reports/report.json</text>
