  <rect x="1204" y="38" width="186" height="64" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1297" y="62" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BH · 255/256 (99.61%)</text>
  <text x="1297" y="86" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">61ms · 省 87.9% TCO</text>

  <!-- Left Column: First-Principles Pain Points -->
  <rect x="32" y="132" width="436" height="360" rx="14" fill="#111C33" stroke="#F43F5E" stroke-width="1.4"/>
  <text x="52" y="162" fill="#FDA4AF" font-size="15" font-weight="800">01 · 传统具身智能车队与机器人云三大痛点 ($178.5K/月)</text>

  <rect x="48" y="178" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① Sim-to-Real 摩擦衰减引发 185Hz 力控颤振与产线停摆</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 硅胶指尖磨损 -18% 遇上硬质高压线束，盲插超时率飙至 14.6%</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 传统 T+1 离线回放无法实时修正腕部柔顺导纳矩阵 (Kp/Kd)</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 420 台总装线机器人集体卡死导致整车线停产损失 $7.60M</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="302" fill="#FB7185" font-size="13" font-weight="700">② 8,000 万段视触觉向量与 PB 级 .mcap 盲传成本爆炸</text>
  <text x="62" y="322" fill="#E2E8F0" font-size="11.5">• 18,000 台机器人 38 关节力矩与 1,200 点触觉流高达 890K EPS</text>
  <text x="62" y="340" fill="#E2E8F0" font-size="11.5">• 盲目上传 99.3% 平顺视频挤爆带宽，全内存向量库极度昂贵</text>
  <text x="62" y="358" fill="#FCA5A5" font-size="11" font-weight="700">✗ 按属性计费 IoT 与全内存多模态向量节点月烧 $136.1K</text>

  <rect x="48" y="382" width="404" height="94" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="404" fill="#FB7185" font-size="13" font-weight="700">③ ISO/TS 15066 人机协作碰撞安全与无网车间断网风险</text>
  <text x="62" y="424" fill="#E2E8F0" font-size="11.5">• 端到端 VLA 策略若突破 140N 接触力或 ZMP 失稳将伤人毁机</text>
  <text x="62" y="442" fill="#E2E8F0" font-size="11.5">• 制造车间内网隔离，纯云端控制面在断网时无法下发力控补丁</text>
  <text x="62" y="460" fill="#FCA5A5" font-size="11" font-weight="700">✗ 谐波减速器打齿报废与人机安全合规敞口高达 $10.05M</text>

