  <text x="518" y="218" fill="#E2E8F0" font-size="11.2">• $0/GB 写入税执行 series_outliers() 捕获 420 台机器人 185Hz 腕部颤振</text>
  <text x="518" y="235" fill="#93C5FD" font-size="11">• 同步锁定硅胶指尖切向滑移率 &gt;12% 与摩擦系数衰减 -18%</text>

  <rect x="504" y="254" width="448" height="72" rx="9" fill="#0B192C" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="518" y="275" fill="#C4B5FD" font-size="12.5" font-weight="800">Step 2 (16ms) · SSD DiskANN 8,000万视触觉匹配与难例打捞</text>
  <text x="518" y="294" fill="#E2E8F0" font-size="11.2">• 检索 8,000万 Episode 向量 (0.99 相似，省92%内存)：刚度 -24% + 握力 +3.8N</text>
  <text x="518" y="312" fill="#DDD6FE" font-size="11">• 定向截取 1,600 段 8s .mcap 难例入湖 (过滤 99.3% 无效平顺视频)</text>

  <rect x="504" y="334" width="448" height="68" rx="9" fill="#0B192C" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="518" y="355" fill="#FDE68A" font-size="12.5" font-weight="800">Step 3 (15ms) · Foundry IQ ISO 10218-2 / ISO/TS 15066 护栏</text>
  <text x="518" y="374" fill="#E2E8F0" font-size="11.2">• 核验 SOP-060：准静态接触力 92.0N &lt; 140.0N 人机协作上限</text>
  <text x="518" y="391" fill="#FDE68A" font-size="11">• 确认双足零力矩点 ZMP 稳定裕度 4.8cm &gt;= 3.5cm 且关节温度 &lt; 72°C</text>

  <rect x="504" y="410" width="448" height="68" rx="9" fill="#064E3B" stroke="#10B981" stroke-width="1.4"/>
  <text x="518" y="431" fill="#6EE7B7" font-size="12.5" font-weight="800">Step 4 (15ms) · ALDO 车间边缘导纳热补丁与 GPU 飞轮推送</text>
  <text x="518" y="450" fill="#F8FAFC" font-size="11.2">• 具身车队总监 Teams 联签 Confirm → ALDO 下发补丁并挂载 .mcap 至 GPU</text>
  <text x="518" y="467" fill="#A7F3D0" font-size="11" font-weight="700">✓ 端到端 61ms 自愈 · 守护 $17.65M 产线防停摆、减速器与安全合规 SLA</text>

