  <text x="141" y="61" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">DATA LAB · ROUND 53 FAQ</text>
  <text x="250" y="62" fill="#F8FAFC" font-size="18.2" font-weight="800">具身智能与人形机器人规模化车队 (890K EPS 视触觉流、VLA导纳校准与.mcap打捞) 选型：Fabric vs 四大云</text>
