  <text x="1018" y="220" fill="#E2E8F0" font-size="11.2">• 890K EPS 38 关节力矩、六维力与触觉流 ($0/GB 写入税)</text>
  <text x="1018" y="238" fill="#E2E8F0" font-size="11.2">• 8,000万视触觉 SSD DiskANN + 机器人-工位-技能孪生</text>
  <text x="1018" y="256" fill="#6EE7B7" font-size="11" font-weight="700">• 24 座工厂 ALDO 断网自治 + 1,900 人 $0 DirectLake 看数</text>

  <rect x="1004" y="282" width="388" height="94" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
