  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• 柠檬酸钠螯合不足导致铁氰根空位率升至 0.11 (&gt;0.02)</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 干燥后残余间隙晶格水飙升至 1,850 ppm (&gt;350 ppm 红线)</text>
