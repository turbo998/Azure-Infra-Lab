  <text x="394" y="66" fill="#F8FAFC" font-size="16" font-weight="800">钠离子电池 (Na-Ion) 普鲁士白正极除晶格水、生物质硬碳 1,350°C 纳米闭孔与 -40°C 防析钠枝晶 28ms 闭环</text>
