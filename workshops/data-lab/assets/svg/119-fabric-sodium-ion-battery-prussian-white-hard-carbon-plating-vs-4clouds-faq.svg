  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• 升温过快 (+8.5°C/min) 导致纳米闭孔从 1.85nm 塌至 1.12nm</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• Gibbs-Thomson 限域效应迫使 0.05V 平台填充点跌破 0.00V</text>
