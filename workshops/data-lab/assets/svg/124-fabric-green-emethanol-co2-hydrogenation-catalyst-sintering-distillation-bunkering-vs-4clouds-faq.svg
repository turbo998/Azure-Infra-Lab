  <rect x="1018" y="338" width="364" height="126" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1032" y="360" fill="#FDE68A" font-size="12.5" font-weight="900">🏆 250单测 &amp; 18ms闭环 &amp; 140.0ms均值 (report.json R116)</text>
  <text x="1032" y="382" fill="#FFFFFF" font-size="12" font-weight="800">• 路由评估矩阵 (n=508)：    507 / 508 (99.80% 准确率!)</text>
  <text x="1032" y="402" fill="#34D399" font-size="11.5" font-weight="700">• 分母 A 路由矩阵算术均值： 156.0 ms (-1.0ms!)</text>
  <text x="1032" y="422" fill="#FDE68A" font-size="11.5" font-weight="800">• 分母 B 123大行业本体均值：140.0 ms (140ms整数大关!)</text>
  <text x="1032" y="442" fill="#FFFFFF" font-size="11.5" font-weight="800">• Python 确定性单测套件：  250 / 250 (四分之一千大关!)</text>

  <rect x="1018" y="476" width="364" height="118" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="1032" y="498" fill="#67E8F9" font-size="12.5" font-weight="800">Better Together 跨云零拷贝黄金分工</text>
  <text x="1032" y="518" fill="#E2E8F0" font-size="11">• Azure HPC / Databricks：Cu/ZnO 界面 DFT &amp; 多管反应器 CFD</text>
  <text x="1032" y="538" fill="#E2E8F0" font-size="11">• Snowflake / SAP：绿电 PPA、生物碳源与远洋船东长协 ERP</text>
  <text x="1032" y="558" fill="#34D399" font-size="11" font-weight="700">• Fabric：OneLake 零拷贝挂载 + 18ms 防爆区实时控制面</text>
  <text x="1032" y="578" fill="#94A3B8" font-size="10.5">• 官方规格引用：119 条 (新增 SPEC-GREEN-EMETHANOL-R116)</text>

