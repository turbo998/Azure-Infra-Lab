  <text x="233" y="66" fill="#040814" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="0.8">🏆 R116 · 250 TESTS, 18ms E2E &amp; 140.0ms MEAN!</text>
  <text x="424" y="66" fill="#F8FAFC" font-size="16" font-weight="800">绿色电制甲醇 (e-Methanol) CO2 加氢催化剂防烧结、双效精馏热夹点与远洋船 FuelEU 加注 18ms 闭环</text>
  <text x="58" y="100" fill="#94A3B8" font-size="12.5">Scenario DS · 20 座百万吨级基地 (320 台 70bar CO2 加氢反应器 + 480 座双效精馏塔 + 240 套加注撬) × 990K EPS · 3.32 亿向量 (332M!) · 251.8°C 零烧结 &amp; 285ppmw 精醇 · 碳减排 -91.8%</text>

  <rect x="1146" y="46" width="236" height="64" rx="10" fill="#064E3B" stroke="#F59E0B" stroke-width="2"/>
  <text x="1264" y="68" fill="#FDE68A" font-size="11.5" font-weight="900" text-anchor="middle">250/250 Tests · 140.0ms Mean</text>
  <text x="1264" y="95" fill="#FFFFFF" font-size="19" font-weight="900" text-anchor="middle">332M Vectors · 18ms</text>

  <!-- Left Column -->
  <rect x="40" y="138" width="430" height="470" rx="14" fill="#131B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · 绿色电制甲醇三大物理危机与传统死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #12 CO2 加氢反应器 35wt% 副产水与纳米铜水热烧结</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• CO2+3H2→CH3OH+H2O 伴生 35.8wt% 高水汽，铜塔曼温度仅 254°C</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 风电波动使水氢分压比 P_H2O/P_H2 飙至 0.38，热点冲上 284.5°C</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 诱发 Cu-OH 水热奥斯特瓦尔德熟化，7.2nm 铜晶粒粗化至 22nm</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：传统 30min 在线 GC 滞后，直接报废 $4.8M 整炉催化剂！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="344" fill="#FCA5A5" font-size="12.5" font-weight="800">② #06 双效加压精馏塔杂醇油翻转与 1,420ppmw 水分穿透</text>
  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• 高含水粗甲醇负荷波动引起水-醇-异丁醇非理想共沸夹点偏移</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 塔顶精甲醇含水量飙升至 1,420 ppmw (&gt;1,000 ppmw IMPCA 红线)</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• 再沸器外购蒸汽耗激增 +28.4%，侧线杂醇油倒灌污染成品罐</text>
  <text x="72" y="424" fill="#F87171" font-size="11" font-weight="700">• 痛点：24,000 TEU 远洋班轮拒收离岸加注，触发高额船期索赔！</text>

  <rect x="58" y="466" width="394" height="126" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($254.0K/月 vs $14.3K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：990K EPS 万点 FBG/FT-NIR/加注流月费 $181.4K</text>
  <text x="72" y="528" fill="#E2E8F0" font-size="11.5">• 内存税：332M 全内存 DRAM 向量索引月耗 $39.0K</text>
  <text x="72" y="548" fill="#E2E8F0" font-size="11.5">• 刷新税：Snowflake 60s 滞后 / 30min 在线色谱完全失明</text>
  <text x="72" y="570" fill="#34D399" font-size="11.5" font-weight="700">• Fabric 破局：$0/GB 写入税 + SSD DiskANN 省 92% 内存</text>

