  <text x="522" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：35.8wt% 高水粗醇与异丁醇杂醇油挥发度翻转</text>
  <text x="522" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：#06 加压塔顶精甲醇含水冲至 1,420 ppmw 超标</text>
  <text x="522" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：回流比 +6.2% + 第14块板杂醇油侧线采出 +12.0%</text>
  <text x="522" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：水分锁死 285 ppmw &lt;= 1,000，纯度 99.94 wt%</text>
  <text x="522" y="800" fill="#94A3B8" font-size="11">• 节能降耗：反应热耦合使精馏外购蒸汽消耗直降 -22.4%</text>

  <rect x="952" y="670" width="428" height="174" rx="10" fill="#091326" stroke="#F59E0B" stroke-width="1.2"/>
