  <rect x="40" y="624" width="1360" height="240" rx="14" fill="#0E192D" stroke="#2563EB" stroke-width="1.5"/>
  <text x="60" y="654" fill="#60A5FA" font-size="14.5" font-weight="800">04 · 绿色电制甲醇 (e-Methanol) 催化剂防烧结、双效精馏与航运加注三大物理护栏矩阵 (SOP-123 · 18ms &amp; 250-Test Milestone)</text>

  <rect x="60" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="76" y="694" fill="#67E8F9" font-size="13" font-weight="800">① Cu/ZnO/Al2O3 水热奥斯特瓦尔德熟化防失活</text>
  <text x="76" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：d(R³)/dt ∝ (P_H2O/P_H2)^m · exp(-E_sinter/RT)</text>
  <text x="76" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：#12 反应器 284.5°C 热点 &amp; 水氢比 0.38 烧结前兆</text>
  <text x="76" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：汽包 -0.24MPa + 循环机 +9.5% + 1.8% CO 补注</text>
  <text x="76" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：热点压回 251.8°C，水氢比 0.14，Cu 锁死 7.4nm</text>
  <text x="76" y="800" fill="#94A3B8" font-size="11">• 资产保护：100% 避免 $4.8M 整炉纳米铜催化剂水热粗化报废</text>

  <rect x="506" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#10B981" stroke-width="1.2"/>
