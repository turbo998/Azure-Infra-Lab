  <text x="524" y="333" fill="#F8FAFC" font-size="11.5">• 检索 332,000,000 (🏆 250单测&amp;18ms!) 加氢动力学/熟化/NRTL 向量</text>
  <text x="524" y="352" fill="#CBD5E1" font-size="11">• 相似度 0.99 (省 92% 内存)：汽包压力 -0.24 MPa + 循环机 +9.5%</text>
  <text x="524" y="371" fill="#FDE68A" font-size="11" font-weight="700">• 补注 1.8 mol% CO 抑水护 ZnO + 加压塔回流 +6.2% &amp; 杂醇侧线 +12%</text>

  <!-- Step 3 -->
  <rect x="508" y="408" width="454" height="90" rx="10" fill="#172554" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="524" y="429" fill="#93C5FD" font-size="12.5" font-weight="800">STEP 3 · Foundry IQ 防熟化与 IMPCA 纯度护栏 SOP-123 (5 ms)</text>
  <text x="524" y="449" fill="#F8FAFC" font-size="11.5">• 校验床层热点压回 251.8°C &lt;= 270.0°C，水氢比 0.14 (Cu 锁死 7.4nm)</text>
  <text x="524" y="468" fill="#CBD5E1" font-size="11">• 塔顶精醇水分降至 285 ppmw &lt;= 1,000 ppmw，纯度 99.94 wt%</text>
  <text x="524" y="485" fill="#34D399" font-size="11" font-weight="700">• 双效精馏节汽 -22.4%，全生命周期碳减排达 -91.8% (7.7 gCO2e/MJ)</text>

  <!-- Step 4 -->
  <rect x="508" y="510" width="454" height="84" rx="10" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.4"/>
  <text x="524" y="531" fill="#C4B5FD" font-size="12.5" font-weight="800">STEP 4 · Teams 总工确认 + ALDO 边缘 + FuelEU e-BDN (4 ms)</text>
  <text x="524" y="551" fill="#F8FAFC" font-size="11.5">• 防爆区 ALDO 边缘下发汽包调节阀、压缩机转速与侧线采出指令</text>
  <text x="524" y="570" fill="#34D399" font-size="11" font-weight="700">• 1GB 免费 SQL 签发 FuelEU Maritime e-BDN 交接单 (18ms &lt;20ms!)</text>

