  <text x="74" y="224" fill="#E2E8F0" font-size="11.5">• 550nm 宽带隙钙钛矿弯月面共聚焦 + 电容规毫秒级压降流</text>
  <text x="74" y="242" fill="#E2E8F0" font-size="11.5">• 捕获 #11线 闪蒸压降放缓 -18.4% 偏离 2.5s LaMer 爆发成核窗</text>
