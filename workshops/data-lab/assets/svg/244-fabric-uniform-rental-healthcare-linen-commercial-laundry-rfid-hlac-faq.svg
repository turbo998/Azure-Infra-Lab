  <text x="166" y="204" fill="#F8FAFC" font-size="15" font-weight="800">Eventhouse KQL 1,110K (1.11M 三连一!) EPS RFID 龙门/隧道洗流 + OneLake 零拷贝 ($0/GB 流税 &amp; $0 复制税)</text>
  <text x="58" y="230" fill="#CBD5E1" font-size="12.5">• 实时流：18亿件工服/手术布草 UHF RFID 笼车拱门批量扫描 + 连续隧道洗衣机 (CBW) 12仓水温/pH/PAA 泵流 + 2.2万车线手持签收</text>
  <text x="58" y="251" fill="#CBD5E1" font-size="12.5">• 零拷贝镜像：ABS / Alliant 纺织租赁 ERP、Salesforce CRM 与 SAP S/4HANA 客户账单表 (立省 $190,800/月)</text>
  <text x="58" y="274" fill="#34D399" font-size="12.5" font-weight="700">✓ 4ms 精准锁定 815 个医院手术室急单补货、客户月台当场未归还工服索赔与车线顺路合单波次</text>

