  <text x="58" y="515" fill="#CBD5E1" font-size="12.5">• 门禁 2 &amp; 3 (NFPA 2112 阻燃工服寿命 + EPA 污水 pH 6.0-9.0)：水洗超限或破损油污阻燃服强制报废补新；超标高碱废水锁死排污阀</text>
