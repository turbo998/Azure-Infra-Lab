  <text x="46" y="76" fill="#FFFFFF" font-size="22" font-weight="800">全球商用织物洗涤、企业工服租赁 (Uniform Rental)、医用布草灭菌与设施服务选型 · RFID &amp; HLAC Laundry</text>
