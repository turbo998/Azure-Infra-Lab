  <text x="72" y="246" fill="#e2e8f0" font-size="11.5">• 飞越新南大西洋异常区 (SAA) 时 50-200MeV 质子轰击 HBM3e 与 3nm FinFET</text>
  <text x="72" y="264" fill="#e2e8f0" font-size="11.5">• 寄生 p-n-p-n 晶闸管触发单粒子锁定 (SEL)，Vddq 电流激增 +14.6% (25ms 烧毁)</text>
  <text x="72" y="282" fill="#fca5a5" font-size="11.5" font-weight="600">• 过境事后回放 (90min) 或 60s 流表无法在 11ms 内执行微轨限流与权重热洗刷</text>

  <rect x="58" y="312" width="394" height="96" rx="8" fill="#1e1b2e" stroke="#fb923c" stroke-width="1"/>
