  <text x="56" y="116" fill="#34d399" font-size="12.5" font-weight="700">995K EPS $0/GB Tax · 444M SSD DiskANN (-92% RAM) · 47ms E2E · 122.0ms Exact Integer Ontology Mean (n=151) · 135.0ms Exact Integer Matrix Mean (619/620 = 99.84%)</text>

