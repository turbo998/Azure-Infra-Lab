  <text x="72" y="352" fill="#e2e8f0" font-size="11.5">• 面朝 3K (-270°C) 宇宙深空的碳复合散热翼进入地影时太阳热流骤降为 0</text>
  <text x="72" y="370" fill="#e2e8f0" font-size="11.5">• 冷凝段跌至 -74.2°C 逼近无水液氨凝固点 (-77.7°C)，冻结堵塞回液毛细芯</text>
  <text x="72" y="388" fill="#fdba74" font-size="11.5" font-weight="600">• 出影算力满载爆发时蒸发器瞬间干涸超温，且大气湍流致 100Gbps 激光丢包</text>

