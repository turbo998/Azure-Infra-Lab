  <text x="166" y="204" fill="#F8FAFC" font-size="15" font-weight="800">Eventhouse KQL 1,105K (1.105M) EPS 机坪视觉/行李/eGSE 流 + OneLake 零拷贝 ($0/GB 流税 &amp; $0 复制税)</text>
  <text x="58" y="230" fill="#CBD5E1" font-size="12.5">• 实时流：机坪摄像头 A-CDM 过站节点视觉识别 + SITA Type-B BSM/BPM 行李与 RFID 扫描 + 电动特种车 (eGSE) 遥测 + 除冰车传感器</text>
  <text x="58" y="251" fill="#CBD5E1" font-size="12.5">• 零拷贝镜像：SITA / Amadeus Altea 离港控制 (DCS)、WorldTracer 行李库与 SAP S/4HANA 航司结算表 (立省 $189,600/月)</text>
