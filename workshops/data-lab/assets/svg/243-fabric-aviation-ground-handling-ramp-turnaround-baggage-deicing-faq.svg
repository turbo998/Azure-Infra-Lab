  <text x="58" y="381" fill="#CBD5E1" font-size="12.5">• NVMe SSD DiskANN 量化索引将内存占用降低 -92% ($4,320/月 vs 精确 $105,000/月 6.85TB DRAM，仅向量硬件即净省 $100,680/月!)</text>
