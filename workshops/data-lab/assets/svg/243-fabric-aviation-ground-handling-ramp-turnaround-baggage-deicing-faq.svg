  <text x="58" y="494" fill="#CBD5E1" font-size="12.5">• 门禁 1 (ICAO 附件18 / IATA DGR 危险品与重心包线)：严查危险品九大类货舱隔离矩阵与零燃油重心 (ZFW CG) 包线，防擦尾与混装</text>
  <text x="58" y="515" fill="#CBD5E1" font-size="12.5">• 门禁 2 &amp; 3 (ICAO 附件17 人袋同机 PPBM + 除冰保持时间 HOT)：减客未登机强制锁舱门卸行李；除冰液超时前强制触发二次除冰</text>
