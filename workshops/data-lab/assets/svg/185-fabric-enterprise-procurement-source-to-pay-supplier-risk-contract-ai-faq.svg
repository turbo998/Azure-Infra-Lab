  <text x="1010" y="451" fill="#E2E8F0" font-size="12">• Parsing 1M+ PDF MSAs via per-page OCR and external MDM</text>
  <text x="1010" y="470" fill="#E2E8F0" font-size="12">  tools wastes $83.0K/mo while leaving $24.5M in volume</text>
  <text x="1010" y="488" fill="#FCA5A5" font-size="12" font-weight="600">  rebates and $4.25M in Maverick over-billing unrecovered.</text>

  <rect x="994" y="512" width="442" height="96" rx="10" fill="#180A0C" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1010" y="535" fill="#FCA5A5" font-size="13.5" font-weight="700">4. Per-User BI Seats for 14,600 Buyers &amp; AP ($77.8K/mo)</text>
  <text x="1010" y="557" fill="#E2E8F0" font-size="12">• Licensing BI seats for 14,600 category managers, buyers,</text>
  <text x="1010" y="576" fill="#E2E8F0" font-size="12">  and AP controllers costs $77.8K/mo vs $0 Power BI Viewer +</text>
  <text x="1010" y="594" fill="#FCA5A5" font-size="12" font-weight="600">  Excel Direct Lake Should-Costing on Fabric F64+.</text>

