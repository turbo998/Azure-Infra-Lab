  <text x="994" y="177" fill="#F87171" font-size="12.5">$368.6K/mo TCO · 3%–6% Maverick Spend &amp; Unclaimed Rebates</text>

  <rect x="994" y="194" width="442" height="94" rx="10" fill="#180A0C" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1010" y="217" fill="#FCA5A5" font-size="13.5" font-weight="700">1. Spend-Volume SaaS &amp; Multi-ERP Copy Taxes ($135.8K/mo)</text>
  <text x="1010" y="239" fill="#E2E8F0" font-size="12">• Paying %-of-spend SaaS fees and replicating 18 ERP instances</text>
  <text x="1010" y="258" fill="#E2E8F0" font-size="12">  plus Ariba/Coupa costs $135.8K/mo and only updates</text>
  <text x="1010" y="276" fill="#FCA5A5" font-size="12" font-weight="600">  spend cubes quarterly—missing live supplier insolvencies.</text>

  <rect x="994" y="300" width="442" height="94" rx="10" fill="#180A0C" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1010" y="323" fill="#FCA5A5" font-size="13.5" font-weight="700">2. 4.36TB DRAM Vector Cluster ($72.0K/mo Exact vs $3,140/mo)</text>
  <text x="1010" y="345" fill="#E2E8F0" font-size="12">• Indexing 576,000,000 (24²M!) MSA clauses, UNSPSC categories,</text>
  <text x="1010" y="364" fill="#E2E8F0" font-size="12">  and invoices in RAM-only HNSW clusters costs $72,000/mo exact</text>
  <text x="1010" y="382" fill="#FCA5A5" font-size="12" font-weight="600">  vs $3,140/mo on Cosmos DB SSD DiskANN (-92% RAM).</text>

  <rect x="994" y="406" width="442" height="94" rx="10" fill="#180A0C" stroke="#DC2626" stroke-width="1.2"/>
