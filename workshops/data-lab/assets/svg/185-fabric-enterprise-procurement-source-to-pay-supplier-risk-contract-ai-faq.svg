  <!-- Header Banner -->
  <rect x="24" y="18" width="1432" height="92" rx="14" fill="url(#headerGrad185)" filter="url(#shadow185)"/>
  <text x="46" y="54" fill="#FFFFFF" font-size="20.5" font-weight="800">📦 R177 · Enterprise Procurement (S2P), Multi-ERP Spend Cube &amp; Contract AI (300th Scenario · 576M=24²M Vectors · &gt;$61M SLA!)</text>
  <text x="46" y="81" fill="#E0F2FE" font-size="13.5" font-weight="600">Scenario GB (DL-749..DL-752): 68,000 Suppliers · 995K EPS Ariba/Coupa/SAP &amp; D&amp;B Risk Stream + 576M (24²M!) MSA/UNSPSC Vectors · 17ms E2E · 299/300 (99.67%) · $61.05M SLA!</text>
  <rect x="1216" y="34" width="222" height="58" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="1327" y="58" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="800">300 Scenarios · 17ms E2E</text>
  <text x="1327" y="79" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">576M (24²M) · $61.05M SLA</text>

  <!-- Left Column: Enterprise Pain Points & 4-Step 17ms Loop -->
  <rect x="24" y="124" width="930" height="500" rx="14" fill="url(#fabricBoxGrad185)" stroke="#0EA5E9" stroke-width="1.8" filter="url(#shadow185)"/>
  <text x="44" y="156" fill="#38BDF8" font-size="17" font-weight="800">🏗️ Microsoft Fabric Unified Source-to-Pay (S2P), Multi-ERP Spend Cube &amp; Contract AI Loop (17ms E2E)</text>
  <text x="44" y="177" fill="#94A3B8" font-size="12.5">OneLake Zero-Copy (SAP Ariba + Coupa + 18 SAP S/4HANA ERPs) + Eventhouse KQL (995K EPS D&amp;B / LME / ASN) + 576M SSD DiskANN</text>

  <!-- Step 1 -->
  <rect x="44" y="192" width="890" height="94" rx="10" fill="#0B192C" stroke="#0284C7" stroke-width="1.4"/>
  <rect x="56" y="204" width="92" height="26" rx="6" fill="#0284C7"/>
  <text x="102" y="222" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 1 · 4ms</text>
  <text x="162" y="221" fill="#F8FAFC" font-size="14.5" font-weight="700">Eventhouse KQL + OneLake Zero-Copy: 4ms N-Tier Supplier Insolvency &amp; Index Price Sense ($0 Tax!)</text>
  <text x="56" y="245" fill="#CBD5E1" font-size="12.5">• Ingests 995,000 EPS global POs/invoices, D&amp;B credit downgrades, LME/Platts commodity indices &amp; EDI 856 ASNs across 68,000 suppliers.</text>
  <text x="56" y="266" fill="#38BDF8" font-size="12.5" font-weight="600">• Eliminates $135,800/mo in Spend SaaS &amp; ERP copy taxes; isolates 19 disruption-risk suppliers ($38.0M open POs) in 4ms.</text>

  <!-- Step 2 -->
  <rect x="44" y="298" width="890" height="94" rx="10" fill="#0B192C" stroke="#10B981" stroke-width="1.4"/>
  <rect x="56" y="310" width="92" height="26" rx="6" fill="#059669"/>
  <text x="102" y="328" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 2 · 4ms</text>
  <text x="162" y="327" fill="#F8FAFC" font-size="14.5" font-weight="700">Cosmos DB SSD DiskANN (576M = 24²M MSA/UNSPSC Vectors) + In-Lake ai.extract Spend Cube (4ms!)</text>
  <text x="56" y="351" fill="#CBD5E1" font-size="12.5">• Searches 576,000,000 MSA pricing formulas, UNSPSC 4-tier categories &amp; invoices via SSD DiskANN ($3,140/mo vs $72,000/mo exact DRAM).</text>
  <text x="56" y="372" fill="#34D399" font-size="12.5" font-weight="600">• Unlocks $24.5M in consolidated volume rebates &amp; cross-plant price parity while reallocating POs to pre-qualified dual-source vendors in 4ms.</text>

  <!-- Step 3 -->
  <rect x="44" y="404" width="890" height="94" rx="10" fill="#0B192C" stroke="#F59E0B" stroke-width="1.4"/>
  <rect x="56" y="416" width="92" height="26" rx="6" fill="#D97706"/>
  <text x="102" y="434" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 3 · 4ms</text>
  <text x="162" y="433" fill="#F8FAFC" font-size="14.5" font-weight="700">Foundry IQ SOX 3-Way Match, Anti-Split-PO &amp; EU CSDDD Supply-Chain Gate (SOP-184 · 4ms!)</text>
  <text x="56" y="457" fill="#CBD5E1" font-size="12.5">• Validates ENTERPRISE-PROCUREMENT-S2P-SPEND-CUBE-SOP-184: enforces PO-GR-Invoice 3-way match, EU CSDDD/UFLPA due diligence &amp; MSA price caps,</text>
  <text x="56" y="478" fill="#FBBF24" font-size="12.5" font-weight="600">• Blocks 94 off-contract Maverick / split-PO invoices pre-payment (+$4.25M saved) and enforces Category OBO RLS across 14,600 users in 4ms.</text>

  <!-- Step 4 -->
  <rect x="44" y="510" width="890" height="98" rx="10" fill="#0B192C" stroke="#8B5CF6" stroke-width="1.4"/>
  <rect x="56" y="522" width="92" height="26" rx="6" fill="#7C3AED"/>
  <text x="102" y="540" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 4 · 5ms</text>
  <text x="162" y="539" fill="#F8FAFC" font-size="14.5" font-weight="700">Teams Chief Procurement Officer Card + SAP Source-List Split, Excel Direct Lake &amp; 1GB SQL Commit (5ms)</text>
  <text x="56" y="563" fill="#CBD5E1" font-size="12.5">• Updates SAP S/4HANA source lists, refreshes Excel Direct Lake Should-Cost models for 14,600 buyers, and commits to 1GB Free SQL in 5ms.</text>
  <text x="56" y="584" fill="#C4B5FD" font-size="12.5" font-weight="600">• Total E2E: 4ms + 4ms + 4ms + 5ms = 17ms Loop! Protects $61.05M (&gt;$61M!) SLA &amp; saves -$353,800/mo (-96.0% TCO).</text>

  <!-- Right Column: Competitor Stitched Anti-Patterns -->
