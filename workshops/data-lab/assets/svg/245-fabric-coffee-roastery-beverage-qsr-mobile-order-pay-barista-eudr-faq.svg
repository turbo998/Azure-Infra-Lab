  <text x="58" y="381" fill="#CBD5E1" font-size="12.5">• NVMe SSD DiskANN 量化索引将内存占用削减 -92% ($4,360/月 vs $106,200/月 6.95TB DRAM，仅向量硬件单月净省 $101,840/月!)</text>
