  <text x="58" y="230" fill="#CBD5E1" font-size="12.5">• 实时流：1.40亿会员 App 手机点单 (MOP) 与到店围栏 + 3.8万店 KDS 出杯扫码 + 得来速地感线圈 + Mastrena 咖啡机萃取压力/水温流</text>
  <text x="58" y="251" fill="#CBD5E1" font-size="12.5">• 零拷贝镜像：Oracle Simphony / 云端 POS、Salesforce 会员画像与 SAP S/4HANA 烘焙/门店库存 (立省精确 $192,000/月!)</text>
