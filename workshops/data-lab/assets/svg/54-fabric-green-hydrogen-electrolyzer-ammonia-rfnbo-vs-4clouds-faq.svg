  <text x="141" y="61" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">DATA LAB · ROUND 46 FAQ</text>
  <text x="250" y="62" fill="#F8FAFC" font-size="18.2" font-weight="800">绿氢 20 GW 电解槽 (760K EPS 防氧中氢爆炸)、柔性合成氨与欧盟 RFNBO 绿电溯源选型：Fabric vs 四大云</text>
  <text x="48" y="94" fill="#94A3B8" font-size="12.5">12 座风光氢氨基地 (4,800 台电解槽 + 24 套合成氨) · Eventhouse KQL (14ms) + SSD DiskANN 5,000万极化/热力学匹配 (15ms) + SDS RFNBO 账本 + ALDO 边缘 · 57ms 闭环省 86.5% TCO</text>
