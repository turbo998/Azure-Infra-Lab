  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=228 (DL-01..228) 均值 = 316.0 ms (227/228 = 99.56%)</text>
