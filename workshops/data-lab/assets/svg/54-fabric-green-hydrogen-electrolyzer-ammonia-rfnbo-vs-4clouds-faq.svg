  <text x="770" y="636" fill="#93C5FD" font-size="11">• 本轮新增 Scenario BA 端到端延迟 = 57 ms (14ms 感知 + 15ms DiskANN/孪生 + 14ms ISO22734/RFNBO 护栏 + 14ms 回写) · 110/110 单测通过</text>

