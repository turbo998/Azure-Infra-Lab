  <text x="1297" y="86" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">57ms · 省 86.5% TCO</text>

  <!-- Left Column: First-Principles Pain Points -->
  <rect x="32" y="132" width="436" height="360" rx="14" fill="#111C33" stroke="#F43F5E" stroke-width="1.4"/>
  <text x="52" y="162" fill="#FDA4AF" font-size="15" font-weight="800">01 · 传统风光氢氨一体化三大致命痛点 ($142.2K/月)</text>

  <rect x="48" y="178" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 风光骤降致低负荷电解槽“氧中氢 (HTO)”穿膜爆轰</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 云团遮挡致风光 8 分钟暴跌 -62%，电解槽落入 &lt;20% 低电流区</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 氢气透过隔膜串入氧气侧逼近 1.60% vol 联锁线 (4.0% 爆炸下限)</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 单台槽体穿膜爆炸或全厂 SIS 紧急泄压停机直接损失 $5.80M</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="302" fill="#FB7185" font-size="13" font-weight="700">② 上游波动制氢撞击下游刚性哈伯法 (Haber-Bosch) 合成氨</text>
  <text x="62" y="322" fill="#E2E8F0" font-size="11.5">• 450°C / 200bar 合成氨塔进气骤降导致床层温降超过 15°C/h</text>
  <text x="62" y="340" fill="#E2E8F0" font-size="11.5">• 价值 $5.20M 的铁基/钌基催化剂因剧烈热应力粉化永久报废</text>
  <text x="62" y="358" fill="#FCA5A5" font-size="11" font-weight="700">✗ 4,800 台槽百万小室电压测点按 Tag 收费月烧 $62,800+</text>

  <rect x="48" y="382" width="404" height="94" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="404" fill="#FB7185" font-size="13" font-weight="700">③ 欧盟 RFNBO 与美国 45V ($3/kg) 逐小时绿电审计作废</text>
  <text x="62" y="424" fill="#E2E8F0" font-size="11.5">• 法规强制要求每小时制氢电量 100% 匹配同小时直连绿电 PPA</text>
  <text x="62" y="442" fill="#E2E8F0" font-size="11.5">• 为保化工负荷误买高碳网电 (680 gCO2/kWh) 致整批绿氨失格</text>
  <text x="62" y="460" fill="#FCA5A5" font-size="11" font-weight="700">✗ 丧失欧盟 RFNBO 免关税溢价与美国 $3.00/kgH2 顶格补贴</text>

