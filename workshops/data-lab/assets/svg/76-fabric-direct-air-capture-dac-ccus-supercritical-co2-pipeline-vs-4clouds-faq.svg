  <text x="518" y="688" fill="#E2E8F0" font-size="11.5">• Databricks GPU ($113.5K/mo)：适合新型 MOF/固态胺量子化学</text>
  <text x="518" y="706" fill="#94A3B8" font-size="11">  筛选与千年矿化模拟，等温线与羽流参数零拷贝写回 OneLake</text>
  <text x="518" y="730" fill="#E2E8F0" font-size="11.5">• Snowflake ($117.6K/mo)：适合 Puro.earth 碳登记簿与 45Q</text>
  <text x="518" y="748" fill="#94A3B8" font-size="11">  税务台账，60s Dynamic Tables 无法拦截管道两相空化</text>
  <text x="518" y="772" fill="#E2E8F0" font-size="11.5">• AWS SiteWise ($111.8K/mo)：890K EPS 按点写入与 1.40 亿</text>
  <text x="518" y="790" fill="#94A3B8" font-size="11">  OpenSearch 全内存向量 OCU 账单高昂</text>
  <text x="518" y="818" fill="#E2E8F0" font-size="11.5">• GCP BigQuery ($112.7K/mo)：缺戈壁井场断网边缘与内置 45Q 表</text>

  <rect x="950" y="638" width="424" height="204" rx="10" fill="#092E26" stroke="#10B981" stroke-width="1.4"/>
  <text x="966" y="662" fill="#6EE7B7" font-size="13" font-weight="800">📈 Scenario BW 密封基准验证（75 本体 &amp; 199.0ms 里程碑 · DL-313..316）</text>
  <text x="966" y="688" fill="#F8FAFC" font-size="12" font-weight="700">• 评测矩阵得分：315 / 316 (99.68%) · 154/154 单测通过</text>
  <text x="966" y="712" fill="#F8FAFC" font-size="11.5">• 管网防蚀防空化：水分压回 12 ppmv (&lt;50) + 管压 9.85 MPa 单相</text>
  <text x="966" y="734" fill="#F8FAFC" font-size="11.5">• EPA Class VI 护栏：分流 140t/h 锁井底压力 81.4% (&lt;=85% 破裂线)</text>
  <text x="966" y="756" fill="#F8FAFC" font-size="11.5">• 固态胺防氧化：秒关 TVSA #112 微漏氧阀，保住吸附剂寿命</text>
  <text x="966" y="778" fill="#F8FAFC" font-size="11.5">• 净碳移除效率：91.8% 净移除，符合 IRS 45Q ($180/t) 与 CORC</text>
  <text x="966" y="812" fill="#34D399" font-size="13" font-weight="800">🛡️ 守护 $22,900,000 45Q 抵税、CDR 长协与管网封存 SLA</text>
