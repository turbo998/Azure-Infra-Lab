  <text x="80" y="686" fill="#F8FAFC" font-size="11.5">1. $0/GB 写入税 + 12ms KQL 相变/微震感知：890K EPS 激光水分</text>
  <text x="80" y="704" fill="#94A3B8" font-size="11">   与井下 DAS 直入 Eventhouse，瞬間拦截碳酸穿孔与两相空化</text>
  <text x="80" y="728" fill="#F8FAFC" font-size="11.5">2. 1.40 亿向量 SSD DiskANN 13ms 检索：TOUGHREACT 多相羽流</text>
