  <text x="514" y="170" fill="#6EE7B7" font-size="15.5" font-weight="800">✅ Microsoft Fabric 直接空气捕集 DAC、超临界管网防酸蚀与深井封存 51ms 闭环（省 90.4% TCO · $10,900/月）</text>

  <!-- Step 1 -->
  <rect x="514" y="188" width="860" height="84" rx="10" fill="#132D50" stroke="#38BDF8" stroke-width="1.2"/>
  <rect x="528" y="202" width="108" height="24" rx="5" fill="#0284C7"/>
  <text x="582" y="218" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 1 · 12 ms</text>
  <text x="648" y="218" fill="#F8FAFC" font-size="13.5" font-weight="800">Eventhouse KQL 890K EPS 管道 TDLAS 激光水分、TVSA 质谱与井下 DAS 微震感知（$0/GB 写入税）</text>
  <text x="528" y="242" fill="#BAE6FD" font-size="11.5">• 实时摄入 14 座枢纽 2,800 组 DAC、12,000km 超临界管网与 96 口 Class VI 井流，series_fit_line() 追踪水分与相变裕度</text>
  <text x="528" y="260" fill="#34D399" font-size="11.5" font-weight="700">• 12ms 锁定 4# 脱水撬后水分飙至 142ppmv (&gt;50ppmv 红线)、B段管压跌至 7.62MPa、Well-19 -1.1级微震及 TVSA #112 微漏氧</text>

  <!-- Step 2 -->
  <rect x="514" y="282" width="860" height="90" rx="10" fill="#132D50" stroke="#818CF8" stroke-width="1.2"/>
  <rect x="528" y="296" width="108" height="24" rx="5" fill="#4F46E5"/>
  <text x="582" y="312" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 2 · 13 ms</text>
  <text x="648" y="312" fill="#F8FAFC" font-size="13.5" font-weight="800">Fabric IQ 6 跳碳封存孪生 × Cosmos SSD DiskANN 1.40 亿向量（140M）检索（省 92% 内存）</text>
  <text x="528" y="336" fill="#E0E7FF" font-size="11.5">• 13ms 在 NVMe SSD 上检索 1.40 亿条 Span-Wagner 相包络、分子筛穿透与 TOUGHREACT 多相羽流向量 (0.99 相似)</text>
  <text x="528" y="356" fill="#34D399" font-size="11.5" font-weight="700">• 秒切备用分子筛 4B (压水至 12ppmv 零酸蚀) + 提管压至 9.85MPa + 分流 140t/h 至邻井 #21..24 + 隔离 TVSA #112 护固态胺</text>

  <!-- Step 3 -->
  <rect x="514" y="382" width="860" height="88" rx="10" fill="#132D50" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="528" y="396" width="108" height="24" rx="5" fill="#D97706"/>
  <text x="582" y="412" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 3 · 13 ms</text>
  <text x="648" y="412" fill="#F8FAFC" font-size="13.5" font-weight="800">Foundry IQ EPA Class VI 井底破裂压力（&lt;=85.0%）与 US 45Q / Puro.earth 护栏（SOP-075）</text>
  <text x="528" y="436" fill="#FEF3C7" font-size="11.5">• 强制校核分流后 Inj-Well-19 井底孔隙水压 = 81.4% 地层破裂压力 (&lt;= 85.0% EPA Class VI 安全红线)，盖层零泄漏</text>
  <text x="528" y="454" fill="#34D399" font-size="11.5" font-weight="700">• 扣除风光储绿电与蒸汽能耗后净碳移除率 = 91.8%，100% 满足美国税法 45Q ($180/t) 与 Puro.earth 千年期 CORC</text>

  <!-- Step 4 -->
  <rect x="514" y="480" width="860" height="84" rx="10" fill="#132D50" stroke="#10B981" stroke-width="1.2"/>
  <rect x="528" y="494" width="108" height="24" rx="5" fill="#059669"/>
  <text x="582" y="510" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 4 · 13 ms</text>
  <text x="648" y="510" fill="#F8FAFC" font-size="13.5" font-weight="800">封存总工 Teams 联签 + ALDO 戈壁井场断网边缘下发 + OneLake IQ CDR 权证签发</text>
  <text x="528" y="534" fill="#D1FAE5" font-size="11.5">• 封存总工在 Teams 联签 Confirm，驱动戈壁井场 SQL Server on Azure Local (ALDO) 下发干燥塔/增压泵/井口节流阀指令</text>
  <text x="528" y="552" fill="#6EE7B7" font-size="11.5" font-weight="700">• 端到端 51ms 保住超临界管网与 EPA Class VI 注入井安全，月省 $102,600 (-90.4% TCO)，守护 $22.90M SLA</text>

