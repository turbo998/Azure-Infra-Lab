  <text x="169" y="73" fill="#FFFFFF" font-size="11.8" font-weight="800" text-anchor="middle">2026-11-14 · R68 · 75 ONTOLOGIES</text>
  <text x="294" y="72" fill="#F8FAFC" font-size="16.2" font-weight="800">Microsoft Fabric 直接空气捕集（DAC）、超临界 CO₂ 密相干线管网与深部咸水层碳封存（CCUS / 45Q）vs 四大云选型一图流</text>
  <text x="60" y="104" fill="#94A3B8" font-size="12.5">14 座百万吨 CCUS 枢纽 · 2,800 组 DAC 吸附箱 + 12,000km 管网 + 96 口 Class VI 井 × 890K EPS · Eventhouse 12ms + SSD DiskANN 13ms 1.40 亿向量 + ALDO = 51ms · 省 90.4% TCO</text>
  <rect x="1182" y="50" width="196" height="58" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1280" y="72" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BW · 1.40 亿向量</text>
  <text x="1280" y="96" fill="#F8FAFC" font-size="18" font-weight="800" text-anchor="middle">51ms · 省 90.4% TCO</text>

  <!-- Left Column: Pain Points -->
  <rect x="44" y="140" width="430" height="440" rx="14" fill="#111C33" stroke="#EF4444" stroke-width="1.3"/>
  <text x="64" y="170" fill="#FCA5A5" font-size="15" font-weight="800">❌ 传统 15 分钟 SCADA 轮询与公有云拼接栈三大痛点</text>

  <rect x="64" y="188" width="390" height="114" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="212" fill="#FECACA" font-size="13" font-weight="700">1. 15m 轮询对超临界 CO₂ 两相空化与碳酸腐蚀穿孔失明</text>
  <text x="80" y="234" fill="#CBD5E1" font-size="11.5">• 脱水塔穿透令水分突破 142ppmv (&gt;50ppmv 红线)，酸蚀速率暴增 100 倍</text>
  <text x="80" y="254" fill="#CBD5E1" font-size="11.5">• 管压跌近 7.38MPa 临界点引发两相闪蒸空化，几分钟打烂增压泵叶轮</text>
  <text x="80" y="274" fill="#FCA5A5" font-size="11.5" font-weight="700">• 井底超压诱发微震面临 EPA Class VI 停产令，损失 $180/吨 45Q 补贴</text>

  <rect x="64" y="316" width="390" height="114" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="340" fill="#FECACA" font-size="13" font-weight="700">2. 890K EPS 激光水分、TVSA 质谱与井下 DAS 写入税</text>
  <text x="80" y="362" fill="#CBD5E1" font-size="11.5">• 2,800 组 DAC 解吸质谱 + 管网 TDLAS + 96 口井 DAS = 890K EPS</text>
  <text x="80" y="382" fill="#CBD5E1" font-size="11.5">• 公有云 IoT 按属性点/按 GB 双重收费，戈壁沙尘暴断网易致井口失控</text>
  <text x="80" y="402" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅遥测流摄入与微震定位即月烧 $50,500/月 (Normalized)</text>

  <rect x="64" y="444" width="390" height="120" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="468" fill="#FECACA" font-size="13" font-weight="700">3. 1.40 亿条 TOUGHREACT 羽流与盖层应力全内存硬件税</text>
  <text x="80" y="490" fill="#CBD5E1" font-size="11.5">• 1.40 亿条 (140M) TOUGHREACT 多相反应运移羽流、Span-Wagner</text>
  <text x="80" y="510" fill="#CBD5E1" font-size="11.5">  相包络与盖层莫尔-库仑应力向量若常驻全内存需 6.2TB DRAM</text>
  <text x="80" y="532" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅全内存向量集群月费即达 $43,600/月，总拼接栈高达 $113,500/月</text>

