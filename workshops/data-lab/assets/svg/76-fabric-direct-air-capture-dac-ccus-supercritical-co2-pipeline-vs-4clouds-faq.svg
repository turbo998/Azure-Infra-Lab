  <text x="80" y="770" fill="#F8FAFC" font-size="11.5">3. ALDO 戈壁井场边缘 + SDS CDR 账本 + F64 $0 读者税：断网</text>
  <text x="80" y="788" fill="#94A3B8" font-size="11">   不超压不闪蒸，2,100 名工艺/地质/MRV 审计师 $0 Viewer 费</text>
  <text x="80" y="818" fill="#34D399" font-size="12" font-weight="800">✓ 月度标准化 TCO：$10,900/月 vs 竞对 $113,500/月（月省 $102.6K！）</text>

  <rect x="502" y="638" width="430" height="204" rx="10" fill="#132642" stroke="#64748B" stroke-width="1"/>
