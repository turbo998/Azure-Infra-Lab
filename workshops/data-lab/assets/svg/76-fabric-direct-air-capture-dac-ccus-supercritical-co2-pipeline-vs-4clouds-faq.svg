  <rect x="44" y="596" width="1352" height="264" rx="14" fill="#0E1B31" stroke="#334155" stroke-width="1.2"/>
  <text x="64" y="624" fill="#F8FAFC" font-size="14.5" font-weight="800">📊 五大云平台直接空气捕集 DAC、1.40 亿向量检索与 45Q/CDR 签证对比矩阵（n=316 路由均值 233.5ms · n=75 本体均值 199.0ms 破 200ms！）</text>

