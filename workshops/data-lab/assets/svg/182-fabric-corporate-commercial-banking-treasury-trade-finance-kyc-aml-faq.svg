  <text x="44" y="156" fill="#38BDF8" font-size="17" font-weight="800">🏗️ Microsoft Fabric Unified Transaction Banking, UCP 600 Trade AI &amp; 10-Hop pKYC Loop (18ms E2E)</text>
  <text x="44" y="177" fill="#94A3B8" font-size="12.5">Eventhouse KQL (995K EPS ISO 20022 + AIS) + Fabric Graph (ISO GQL 10-Hop UBO) + In-Lake ai.extract &amp; 564M SSD DiskANN ($0/GB Tax)</text>

