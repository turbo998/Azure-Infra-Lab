  <text x="46" y="54" fill="#FFFFFF" font-size="21" font-weight="800">🏦 R174 · Corporate &amp; Commercial Banking ISO 20022 Treasury, UCP 600 Trade Finance AI &amp; pKYC/AML ($60.00M SLA Milestone!)</text>
  <text x="46" y="81" fill="#E0F2FE" font-size="13.5" font-weight="600">Scenario FY (DL-737..DL-740): 380,000 Corporate Clients · 995K EPS ISO 20022 &amp; Maritime AIS Stream + 564M UCP 600/B/L Vectors · 18ms (5+4+4+5) E2E · 14,000 Users · $60.00M Exact SLA!</text>
