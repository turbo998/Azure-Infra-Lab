  <rect x="56" y="204" width="92" height="26" rx="6" fill="#0284C7"/>
  <text x="102" y="222" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 1 · 5ms</text>
  <text x="162" y="221" fill="#F8FAFC" font-size="14.5" font-weight="700">Eventhouse KQL + Fabric Graph (ISO GQL): 5ms 10-Hop Offshore UBO &amp; AIS-Dark Vessel Sense ($0 Tax)</text>
  <text x="56" y="245" fill="#CBD5E1" font-size="12.5">• Ingests 995,000 EPS SWIFT ISO 20022 (pacs.008/camt.053) corporate wires and global vessel AIS transponders across 380,000 corporate clients.</text>
  <text x="56" y="266" fill="#38BDF8" font-size="12.5" font-weight="600">• Eliminates $133,500/mo in standalone graph &amp; stream taxes; traverses 10-hop BVI/Cayman UBO shells &amp; flags 2 AIS-dark cargo vessels in 5ms.</text>

