  <text x="56" y="351" fill="#CBD5E1" font-size="12.5">• Extracts 120+ fields from MT700 L/Cs, ocean Bills of Lading &amp; commercial invoices and searches 564M vectors via SSD DiskANN ($3,080/mo vs $70.8K DRAM).</text>
  <text x="56" y="372" fill="#34D399" font-size="12.5" font-weight="600">• Cuts L/C checking from 48 hours to 4ms (99.6% discrepancy recall), catching duplicate pledged B/Ls and +340% copper over-invoicing (TBML).</text>

