  <rect width="1440" height="900" fill="url(#bg71)"/>
  <rect x="24" y="20" width="1392" height="860" rx="18" fill="#0B1629" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="38" width="1352" height="86" rx="12" fill="#10223D" stroke="#06B6D4" stroke-width="1.2"/>
  <rect x="60" y="54" width="218" height="28" rx="6" fill="url(#accent71)"/>
  <text x="169" y="73" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">2026-11-14 · R63 · 70 ONTOLOGIES</text>
  <text x="294" y="72" fill="#F8FAFC" font-size="16.2" font-weight="800">Microsoft Fabric 特高压输电网广域相量（WAMS/PMU）、次同步谐振（SSR）与动态增容（DLR）vs 四大云选型一图流</text>
  <text x="60" y="104" fill="#94A3B8" font-size="12.5">4,800 座变电站 · 18,000 台 120Hz PMU + 9,200 台主变 DGA × 960K EPS · Eventhouse 17ms + Cosmos SSD DiskANN 18ms 1.20 亿向量 + ALDO = 71ms 闭环 · 省 89.9% TCO</text>
  <rect x="1182" y="50" width="196" height="58" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1280" y="72" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BR · 1.20 亿向量</text>
  <text x="1280" y="96" fill="#F8FAFC" font-size="18" font-weight="800" text-anchor="middle">71ms · 省 89.9% TCO</text>

  <!-- Left Column: Pain Points -->
  <rect x="44" y="140" width="430" height="440" rx="14" fill="#111C33" stroke="#EF4444" stroke-width="1.3"/>
  <text x="64" y="170" fill="#FCA5A5" font-size="15" font-weight="800">❌ 传统 2–4 秒 SCADA 与公有云拼接栈三大痛点</text>

  <rect x="64" y="188" width="390" height="114" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="212" fill="#FECACA" font-size="13" font-weight="700">1. 2–4 秒 SCADA 轮询对 26.4Hz 次同步谐振（SSR）失明</text>
  <text x="80" y="234" fill="#CBD5E1" font-size="11.5">• 传统 SCADA 采样率仅 0.25–0.5Hz，完全看不见 10–45Hz 次同步谐振</text>
  <text x="80" y="254" fill="#CBD5E1" font-size="11.5">• 风光基地串补送出激发 26.4Hz 负阻尼 (-3.8%) 时，1.5s 即可扭断汽轮机轴</text>
  <text x="80" y="274" fill="#FCA5A5" font-size="11.5" font-weight="700">• 静态保守输电限额迫使大面积切负荷，750kV 主变乙炔燃弧失察</text>

  <rect x="64" y="316" width="390" height="114" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="340" fill="#FECACA" font-size="13" font-weight="700">2. 960K EPS 120Hz PMU 相量流按 GB 写入天价账单</text>
  <text x="80" y="362" fill="#CBD5E1" font-size="11.5">• 18,000 台 IEEE C37.118 PMU (120Hz) + 光纤测温 + 主变 DGA = 960K EPS</text>
  <text x="80" y="382" fill="#CBD5E1" font-size="11.5">• 公有云时序库按条/按 GB 收取写入附加费，且缺乏库内高速矢量 FFT</text>
  <text x="80" y="402" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅相量流摄入与频谱计算即月烧 $45,800/月 (Normalized)</text>

  <rect x="64" y="444" width="390" height="120" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="468" fill="#FECACA" font-size="13" font-weight="700">3. 1.20 亿条 N-2 暂态稳定与杜瓦尔三角向量全内存硬件税</text>
  <text x="80" y="490" fill="#CBD5E1" font-size="11.5">• 1.20 亿条 (120M) PSS®E/EMT 暂态故障波形、FACTS POD 阻尼参数</text>
  <text x="80" y="510" fill="#CBD5E1" font-size="11.5">  与主变油色谱杜瓦尔三角向量若常驻全内存 HNSW 需 5.2TB DRAM</text>
  <text x="80" y="532" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅全内存向量集群月费即达 $38,800/月，总拼接栈高达 $103,000/月</text>

  <!-- Center/Right Column: Fabric 71ms Closed Loop -->
  <rect x="492" y="140" width="904" height="440" rx="14" fill="#0F223D" stroke="#10B981" stroke-width="1.5"/>
  <text x="514" y="170" fill="#6EE7B7" font-size="15.5" font-weight="800">✅ Microsoft Fabric 特高压 WAMS/PMU、SSR 阻尼与动态增容 71ms 自治闭环（省 89.9% TCO · $10,400/月）</text>

  <!-- Step 1 -->
  <rect x="514" y="188" width="860" height="84" rx="10" fill="#132D50" stroke="#38BDF8" stroke-width="1.2"/>
  <rect x="528" y="202" width="108" height="24" rx="5" fill="#0284C7"/>
  <text x="582" y="218" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 1 · 17 ms</text>
  <text x="648" y="218" fill="#F8FAFC" font-size="13.5" font-weight="800">Eventhouse KQL FFT/H3 960K EPS 120Hz 相量与油色谱感知（$0/GB 写入税 · 12:1 压缩）</text>
  <text x="528" y="242" fill="#BAE6FD" font-size="11.5">• 实时摄入 18,000 台 PMU、导线光纤测温 (DTS) 与 9,200 台主变 DGA 流，库内 series_fft() 毫秒级解耦振荡模态</text>
  <text x="528" y="260" fill="#34D399" font-size="11.5" font-weight="700">• 17ms 锁定 #3 串补走廊 26.4Hz 次同步谐振 (阻尼比 -3.8%)、48.6° 功角差及 750kV 主变 T-04 乙炔骤升至 14.2 ppm</text>

  <!-- Step 2 -->
  <rect x="514" y="282" width="860" height="90" rx="10" fill="#132D50" stroke="#818CF8" stroke-width="1.2"/>
  <rect x="528" y="296" width="108" height="24" rx="5" fill="#4F46E5"/>
  <text x="582" y="312" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 2 · 18 ms</text>
  <text x="648" y="312" fill="#F8FAFC" font-size="13.5" font-weight="800">Fabric IQ 6 跳电网数字孪生 × Cosmos SSD DiskANN 1.20 亿向量（120M）检索（省 92% 内存）</text>
  <text x="528" y="336" fill="#E0E7FF" font-size="11.5">• 18ms 在 NVMe SSD 上检索 1.20 亿条 EMT 暂态模态、STATCOM 附加阻尼 (POD)、IEEE 738 动态增容与杜瓦尔三角向量 (0.99 相似)</text>
  <text x="528" y="356" fill="#34D399" font-size="11.5" font-weight="700">• 注入 STATCOM 反相次同步阻尼 (阻尼比转正 +14.2%) + 趁 8.4m/s 横风启用邻线 DLR 动态增容 +24% (+680MW) 隔离高危主变 T-04</text>

  <!-- Step 3 -->
  <rect x="514" y="382" width="860" height="88" rx="10" fill="#132D50" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="528" y="396" width="108" height="24" rx="5" fill="#D97706"/>
  <text x="582" y="412" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 3 · 18 ms</text>
  <text x="648" y="412" fill="#F8FAFC" font-size="13.5" font-weight="800">Foundry IQ IEEE Std 738 导线退火红线（&lt;85.0°C）与 NERC CIP 护栏（SOP-070）</text>
  <text x="528" y="436" fill="#FEF3C7" font-size="11.5">• 强制校核转移 +680MW 潮流后，受端双回线最高运行温度 78.5°C (&lt; 85.0°C 铝线退火上限)，对地激光净空余量 &gt;= +2.4 m</text>
  <text x="528" y="454" fill="#34D399" font-size="11.5" font-weight="700">• 确认联络线功角稳定裕度充足，且控制指令 100% 符合 NERC CIP-005/007 变电站电子安全边界签名规范</text>

  <!-- Step 4 -->
  <rect x="514" y="480" width="860" height="84" rx="10" fill="#132D50" stroke="#10B981" stroke-width="1.2"/>
  <rect x="528" y="494" width="108" height="24" rx="5" fill="#059669"/>
  <text x="582" y="510" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 4 · 18 ms</text>
  <text x="648" y="510" fill="#F8FAFC" font-size="13.5" font-weight="800">国调/网调值班长 Teams 联签 + ALDO 变电站边缘下发 + 1GB 免费 Fabric SQL 审计落盘</text>
  <text x="528" y="534" fill="#D1FAE5" font-size="11.5">• 总调值班主任在 Teams 联签 Confirm，驱动变电站内 SQL Server on Azure Local (ALDO) 下发 IEC 61850 GOOSE/MMS 阻尼与备自投指令</text>
  <text x="528" y="552" fill="#6EE7B7" font-size="11.5" font-weight="700">• 端到端 71ms 完成 SSR 谐振平抑、+680MW 动态增容与主变防爆隔离，月省 $92,600 (-89.9% TCO)，守护 $21.15M 电网安全 SLA</text>

  <!-- Bottom Row: 5-Cloud Matrix & Quantitative KPIs -->
  <rect x="44" y="596" width="1352" height="264" rx="14" fill="#0E1B31" stroke="#334155" stroke-width="1.2"/>
  <text x="64" y="624" fill="#F8FAFC" font-size="14.5" font-weight="800">📊 五大云平台特高压电网 WAMS/PMU、1.20 亿向量检索与动态增容对比矩阵（n=296 路由均值 248.0ms · n=70 本体均值 209.0ms）</text>

  <rect x="64" y="638" width="420" height="204" rx="10" fill="#132642" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="80" y="662" fill="#67E8F9" font-size="13" font-weight="800">🏆 Microsoft Fabric 必赢三大铁律</text>
  <text x="80" y="686" fill="#F8FAFC" font-size="11.5">1. $0/GB 写入税 + 17ms KQL series_fft()：960K EPS 120Hz 相量</text>
  <text x="80" y="704" fill="#94A3B8" font-size="11">   直入 Eventhouse，毫秒级锁定 26.4Hz 次同步谐振与功角失稳</text>
  <text x="80" y="728" fill="#F8FAFC" font-size="11.5">2. 1.20 亿向量 SSD DiskANN 18ms 检索：EMT 暂态模态、POD 阻尼</text>
  <text x="80" y="746" fill="#94A3B8" font-size="11">   与杜瓦尔三角向量驻留本地 NVMe SSD，省去 92% DRAM 硬件税</text>
  <text x="80" y="770" fill="#F8FAFC" font-size="11.5">3. ALDO 变电站断网边缘 + F64 $0 读者税：符合 NERC CIP 隔离，</text>
  <text x="80" y="788" fill="#94A3B8" font-size="11">   1,850 名调度/保护/方式专工 DirectLake 秒级看数 $0 Viewer 许可费</text>
  <text x="80" y="818" fill="#34D399" font-size="12" font-weight="800">✓ 月度标准化 TCO：$10,400/月 vs 竞对 $103,000/月（立省 89.9%）</text>

  <rect x="502" y="638" width="430" height="204" rx="10" fill="#132642" stroke="#64748B" stroke-width="1"/>
  <text x="518" y="662" fill="#93C5FD" font-size="13" font-weight="800">🤝 四大云竞对定位与 OneLake 零拷贝共存边界</text>
  <text x="518" y="688" fill="#E2E8F0" font-size="11.5">• Databricks GPU ($103.0K/mo)：适合全网万节点离线电磁暂态 (EMT)</text>
  <text x="518" y="706" fill="#94A3B8" font-size="11">  N-2 扫描与 PINN 训练，1.20 亿暂态指纹零拷贝写回 OneLake</text>
  <text x="518" y="730" fill="#E2E8F0" font-size="11.5">• Snowflake Energy ($106.8K/mo)：适合电力现货市场 (LMP) 出清结算</text>
  <text x="518" y="748" fill="#94A3B8" font-size="11">  与输电权 (FTR) 财务归档，OneLake $0 算力镜像对齐</text>
  <text x="518" y="772" fill="#E2E8F0" font-size="11.5">• AWS SiteWise/Timestream ($101.4K/mo)：960K EPS 写入与 1.20 亿</text>
  <text x="518" y="790" fill="#94A3B8" font-size="11">  OpenSearch 全内存向量 OCU 账单高昂</text>
  <text x="518" y="818" fill="#E2E8F0" font-size="11.5">• GCP BigQuery ($102.2K/mo)：缺变电站 NERC CIP 物理隔离 SQL 边缘</text>

  <rect x="950" y="638" width="424" height="204" rx="10" fill="#092E26" stroke="#10B981" stroke-width="1.4"/>
  <text x="966" y="662" fill="#6EE7B7" font-size="13" font-weight="800">📈 Scenario BR 密封基准验证（70 本体里程碑 · DL-293..296）</text>
  <text x="966" y="688" fill="#F8FAFC" font-size="12" font-weight="700">• 评测矩阵得分：295 / 296 (99.66%) · 144/144 单测通过</text>
  <text x="966" y="712" fill="#F8FAFC" font-size="11.5">• 次同步谐振平抑：26.4Hz 阻尼比 -3.8% → +14.2% (防扭振裂轴)</text>
  <text x="966" y="734" fill="#F8FAFC" font-size="11.5">• 动态增容转移：IEEE 738 DLR 提升 +24% (+680MW 零弃风切负荷)</text>
  <text x="966" y="756" fill="#F8FAFC" font-size="11.5">• 导线热安全裕度：最高线温 78.5°C (&lt; 85.0°C 红线，净空 +2.4m)</text>
  <text x="966" y="778" fill="#F8FAFC" font-size="11.5">• 主变防爆隔离：无缝旁路乙炔 14.2ppm 的 750kV 主变 T-04</text>
  <text x="966" y="812" fill="#34D399" font-size="13" font-weight="800">🛡️ 守护 $21,150,000 防大停电、主变防爆与 NERC CIP SLA</text>
</svg>
