  <rect x="44" y="596" width="1352" height="264" rx="14" fill="#0E1B31" stroke="#334155" stroke-width="1.2"/>
  <text x="64" y="624" fill="#F8FAFC" font-size="14.5" font-weight="800">📊 五大云平台自动化超级港口、1.16 亿向量检索与海铁联运选型对比矩阵（n=292 路由均值 251.0ms · n=69 本体均值 211.0ms）</text>

  <rect x="64" y="638" width="420" height="204" rx="10" fill="#132642" stroke="#14B8A6" stroke-width="1.2"/>
  <text x="80" y="662" fill="#5EEAD4" font-size="13" font-weight="800">🏆 Microsoft Fabric 必赢三大铁律</text>
  <text x="80" y="686" fill="#F8FAFC" font-size="11.5">1. $0/GB 写入税 + 2ms KQL H3/FFT：940K EPS 岸桥/AGV/冷链</text>
  <text x="80" y="704" fill="#94A3B8" font-size="11">   流直入 Eventhouse，厘米级 H3 车道碰撞比多边形快 1,200 倍</text>
  <text x="80" y="728" fill="#F8FAFC" font-size="11.5">2. 1.16 亿向量 SSD DiskANN 2ms 检索：BAPLIE 配载、岸桥防摇</text>
  <text x="80" y="746" fill="#94A3B8" font-size="11">   与 MAPF 路径驻留本地 NVMe SSD，省去 92% DRAM 硬件税</text>
  <text x="80" y="770" fill="#F8FAFC" font-size="11.5">3. ALDO 码头 1ms 边缘 + F64 $0 读者税：外网闪断岸桥不趴窝，</text>
  <text x="80" y="788" fill="#94A3B8" font-size="11">   1,800 名调度/配载/关务员 DirectLake 秒级看数 $0 Viewer 许可费</text>
  <text x="80" y="818" fill="#34D399" font-size="12" font-weight="800">✓ 月度标准化 TCO：$10,300/月 vs 竞对 $100,000/月（立省 89.7%）</text>

  <rect x="502" y="638" width="430" height="204" rx="10" fill="#132642" stroke="#64748B" stroke-width="1"/>
  <text x="518" y="662" fill="#93C5FD" font-size="13" font-weight="800">🤝 四大云竞对定位与 OneLake 零拷贝共存边界</text>
  <text x="518" y="688" fill="#E2E8F0" font-size="11.5">• Databricks GPU ($100.0K/mo)：适合多智能体强化学习 (MARL)</text>
  <text x="518" y="706" fill="#94A3B8" font-size="11">  与 3D 激光点云离线训练，模型权重零拷贝写回 OneLake</text>
  <text x="518" y="730" fill="#E2E8F0" font-size="11.5">• Snowflake ($103.8K/mo)：适合航运联盟 EDI 舱单 (BAPLIE/COPARN)</text>
  <text x="518" y="748" fill="#94A3B8" font-size="11">  跨企共享与港口财务并表，OneLake $0 算力镜像对齐</text>
  <text x="518" y="772" fill="#E2E8F0" font-size="11.5">• AWS SiteWise ($98.6K/mo)：940K EPS 按属性点写入与 1.16 亿</text>
  <text x="518" y="790" fill="#94A3B8" font-size="11">  OpenSearch 全内存向量 OCU 账单高昂</text>
  <text x="518" y="818" fill="#E2E8F0" font-size="11.5">• GCP BigQuery GIS ($99.4K/mo)：缺码头 1ms 断网 PLC/AGV 边缘</text>

  <rect x="950" y="638" width="424" height="204" rx="10" fill="#092E26" stroke="#10B981" stroke-width="1.4"/>
  <text x="966" y="662" fill="#6EE7B7" font-size="13" font-weight="800">📈 Scenario BQ 密封基准验证（DL-289..DL-292）</text>
  <text x="966" y="688" fill="#F8FAFC" font-size="12" font-weight="700">• 评测矩阵得分：291 / 292 (99.66%) · 142/142 单测通过</text>
  <text x="966" y="712" fill="#F8FAFC" font-size="11.5">• 岸桥防摇效率：STS-14 摆幅 ±380mm → ±42mm (保 42.8 GMPH)</text>
  <text x="966" y="734" fill="#F8FAFC" font-size="11.5">• 海铁联运直装：48 台 AGV 解死锁直装班列，0 次堆场二次翻箱</text>
  <text x="966" y="756" fill="#F8FAFC" font-size="11.5">• 船舶稳性护栏：IMO GM = 2.85 m (&gt;= 2.20 m 底线，SOLAS 合规)</text>
  <text x="966" y="778" fill="#F8FAFC" font-size="11.5">• 冷链不断电保护：4.2MW 移动储能车保 180 个冷链箱 (-22.4°C)</text>
  <text x="966" y="812" fill="#34D399" font-size="13" font-weight="800">🛡️ 守护 $20,800,000 巨轮船期、冷链与海铁联运 SLA</text>
