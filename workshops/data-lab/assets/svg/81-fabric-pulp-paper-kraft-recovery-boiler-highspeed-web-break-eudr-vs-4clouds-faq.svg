  <!-- Header Banner -->
  <rect x="40" y="34" width="1360" height="86" rx="14" fill="#0C2924" stroke="#10B981" stroke-width="1.5"/>
  <rect x="58" y="48" width="320" height="26" rx="13" fill="url(#accent81)"/>
  <text x="218" y="66" fill="#051311" font-size="11.2" font-weight="800" text-anchor="middle" letter-spacing="0.6">DATA LAB · 2026-11-14 R73 · 80-ONTOLOGY &amp; 160M MILESTONE</text>
  <text x="392" y="66" fill="#F8FAFC" font-size="16" font-weight="800">现代制浆造纸、碱回收炉（BLRB）防爆炸、2,000m/min 高速纸机防断纸与欧盟 EUDR 选型 FAQ</text>
  <text x="58" y="98" fill="#6EE7B7" font-size="12.5">Microsoft Fabric (Eventhouse KQL 890K EPS 7ms 声纹/断纸感知 + Cosmos SSD DiskANN 8ms 1.60亿 NIR/QCS匹配 + SDS + ALDO 车间边缘) vs 四大云</text>
  <rect x="1156" y="46" width="224" height="60" rx="10" fill="#062E22" stroke="#10B981" stroke-width="1.5"/>
  <text x="1268" y="68" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario CB · 32 基地 + 96 高速纸机</text>
  <text x="1268" y="94" fill="#FFFFFF" font-size="17.5" font-weight="800" text-anchor="middle">31ms 闭环 · 省 90.9% TCO</text>

  <!-- Row 1 Left: Pain Points vs First-Principles Breakthrough -->
  <rect x="40" y="136" width="668" height="248" rx="14" fill="#0B221E" stroke="#134E4A" stroke-width="1.5"/>
  <text x="60" y="164" fill="#34D399" font-size="14" font-weight="800">01 · 第一性原理痛点拆解：为什么 30s 扫描架与 10m 历史库拦不住 33.3m/s 断纸与碱炉爆炸？</text>

  <rect x="60" y="178" width="628" height="60" rx="8" fill="#2A1215" stroke="#EF4444" stroke-width="1.2"/>
  <text x="76" y="198" fill="#FCA5A5" font-size="12" font-weight="800">❌ 传统架构痛点：QCS 横扫 30s 盲区 + 1.5s 湿部断纸 + 850°C 熔融盐遇水爆炸 (`$125.3K/月`)</text>
  <text x="76" y="216" fill="#FECACA" font-size="11">• 纸页以 33.3m/s 狂奔，QCS 探头横扫一趟需 30s；边缘水分 +1.4% 引发 18Hz 剥离颤振，1.5s 拉断纸幅损失 $45K</text>
  <text x="76" y="231" fill="#FECACA" font-size="11">• 碱回收炉底积存 400 吨 850°C 熔融盐，水冷壁微渗若未秒级察觉滴入熔池将引发毁灭性物理爆炸；无坐标木片致海关扣货</text>

  <rect x="60" y="248" width="628" height="60" rx="8" fill="#062E22" stroke="#10B981" stroke-width="1.2"/>
  <text x="76" y="268" fill="#6EE7B7" font-size="12" font-weight="800">✅ Fabric 破局：7ms KQL 声纹/颤振感知 + 8ms 1.60 亿向量检索 + ALDO 车间边缘 (`$11.4K/月`)</text>
  <text x="76" y="286" fill="#D1FAE5" font-size="11">• Eventhouse KQL $0/GB 写入税摄入 890K EPS 流，series_fft() 7ms 锁定 18Hz 剥离颤振与 4.2kHz 省煤器微渗声纹</text>
  <text x="76" y="301" fill="#D1FAE5" font-size="11">• Cosmos SSD DiskANN 8ms 检索 1.60 亿条 NIR 光谱与 400 区稀释水向量：调稀释水 -6.5% + 速差 +0.18% 实现 0 断纸</text>

  <rect x="60" y="316" width="628" height="54" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="76" y="335" fill="#93C5FD" font-size="11.5" font-weight="800">🤝 互补共存 (Better Together)：流浆箱三维纤维湍流 CFD 仿真 vs 31ms 实时防断纸闭环</text>
  <text x="76" y="353" fill="#E2E8F0" font-size="11">• Fluent 纤维取向 CFD 与桉树基因育种归 Databricks/HPC；10m 母卷分切套裁归 Snowflake/SAP；31ms 闭环归 Fabric</text>

  <!-- Row 1 Right: 31ms 4-Step Closed Loop -->
  <rect x="728" y="136" width="672" height="248" rx="14" fill="#0B221E" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="748" y="164" fill="#38BDF8" font-size="14" font-weight="800">02 · Scenario CB：31ms 高速纸机防断纸、碱炉微渗隔离与欧盟 EUDR 闭环 (`DL-333..336`)</text>

  <rect x="748" y="178" width="310" height="90" rx="8" fill="#071916" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="762" y="198" fill="#38BDF8" font-size="12" font-weight="800">① Eventhouse KQL 流式感知 (7 ms)</text>
  <text x="762" y="216" fill="#E2E8F0" font-size="10.5">• 890K EPS 25kHz 炉壁声学 + 全幅红外水分 + 张力</text>
  <text x="762" y="232" fill="#E2E8F0" font-size="10.5">• 检出 PM-08 #312..328 区水分 +1.4% 与 18Hz 颤振</text>
  <text x="762" y="248" fill="#34D399" font-size="10.5" font-weight="700">• 同步捕获 3# 碱炉省煤器 4.2kHz 微渗 (+0.18 kg/s)</text>

  <rect x="1070" y="178" width="310" height="90" rx="8" fill="#071916" stroke="#A855F7" stroke-width="1.2"/>
  <text x="1084" y="198" fill="#C084FC" font-size="12" font-weight="800">② 1.60 亿向量 SSD DiskANN 寻优 (8 ms)</text>
  <text x="1084" y="216" fill="#E2E8F0" font-size="10.5">• 检索 1.60 亿条 NIR 卡帕光谱、400 区 QCS 与声纹向量</text>
  <text x="1084" y="232" fill="#E2E8F0" font-size="10.5">• 稀释水阀 -6.5% + 蒸汽箱 +4.2°C + 压榨速差 +0.18%</text>
  <text x="1084" y="248" fill="#C084FC" font-size="10.5" font-weight="700">• 隔离 3# 碱炉上部省煤器回路 + 锁定 480t 异常木片</text>

  <rect x="748" y="278" width="310" height="92" rx="8" fill="#071916" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="762" y="298" fill="#FBBF24" font-size="12" font-weight="800">③ Foundry IQ BLRBAC 与 EUDR 门禁 (8 ms)</text>
  <text x="762" y="316" fill="#E2E8F0" font-size="10.5">• 校核《PULP-PAPER-BLRBAC-QCS-EUDR-SOP-080》</text>
  <text x="762" y="332" fill="#E2E8F0" font-size="10.5">• 横幅水分 2σ = 0.14% &lt;= 0.20%，严禁炉膛吹灰喷水</text>
  <text x="762" y="348" fill="#FBBF24" font-size="10.5" font-weight="700">• 冻结 480t 无 6 位小数坐标木片，100% 切 FSC 桉木</text>

  <rect x="1070" y="278" width="310" height="92" rx="8" fill="#062E22" stroke="#10B981" stroke-width="1.2"/>
  <text x="1084" y="298" fill="#34D399" font-size="12" font-weight="800">④ 总工联签 + ALDO 车间边缘闭环 (8 ms)</text>
  <text x="1084" y="316" fill="#E2E8F0" font-size="10.5">• 造纸总工 Teams 联签 Confirm (0.99)</text>
  <text x="1084" y="332" fill="#E2E8F0" font-size="10.5">• ALDO 边缘经 OPC-UA/Profinet 直驱稀释水阀与传动</text>
  <text x="1084" y="348" fill="#6EE7B7" font-size="10.5" font-weight="700">• 0 高速断纸 · 0 碱炉爆炸 · 守护 $24.65M 产线 SLA</text>

