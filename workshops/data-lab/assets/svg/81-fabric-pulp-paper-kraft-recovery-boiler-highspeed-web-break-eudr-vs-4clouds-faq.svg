  <rect x="748" y="536" width="632" height="98" rx="8" fill="#071916" stroke="#134E4A" stroke-width="1.2"/>
  <text x="764" y="556" fill="#6EE7B7" font-size="11.5" font-weight="800">🔍 严格双分母与数据溯源披露 (80-Ontology &amp; 189.0ms Milestone · reports/report.json)</text>
  <text x="764" y="575" fill="#E2E8F0" font-size="11">• 分母 A（全量路由矩阵）：n = 336 场景 (DL-01..DL-336)，通过率 335 / 336 (99.70%)，算术均值 = 221.0 ms (R72 n=332 为 223.5 ms)</text>
  <text x="764" y="593" fill="#E2E8F0" font-size="11">• 分母 B（行业本体闭环）：n = 80 仿真 (Scenario A..CB)，端到端算术均值 = 189.0 ms (R72 n=79 为 191.0 ms；Scenario CB = 31 ms)</text>
  <text x="764" y="611" fill="#34D399" font-size="11" font-weight="700">• 本地实测：164 / 164 Python 单元测试 100% 通过 (measured_local_harness) · 76 条官方规格链接核验</text>

