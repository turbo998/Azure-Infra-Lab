  <text x="748" y="502" fill="#CBD5E1" font-size="11.5">传统拼装栈 (890K EPS 按点位 IoT $83.8K + 108节点内存向量 $25.8K + 独立 ESG/BI $15.7K) — $125,300 / mo</text>
