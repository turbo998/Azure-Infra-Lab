  <rect x="60" y="596" width="628" height="38" rx="6" fill="#062E22" stroke="#10B981" stroke-width="1"/>
  <text x="74" y="620" fill="#6EE7B7" font-size="11.5" font-weight="800">32 座林浆纸基地（96 条高速纸机）月度 TCO：Fabric $11,400/月 vs 传统栈 $125,300/月（直降 90.9%）</text>

  <!-- Row 2 Right: TCO Inflection & Dual-Denominator Governance -->
  <rect x="728" y="400" width="672" height="250" rx="14" fill="#0B221E" stroke="#134E4A" stroke-width="1.5"/>
  <text x="748" y="428" fill="#34D399" font-size="14" font-weight="800">04 · 月度 TCO 拆解（省 $113,900/月）与 80 本体 &amp; 1.60 亿向量里程碑治理</text>

  <text x="748" y="456" fill="#F8FAFC" font-size="12" font-weight="700">Microsoft Fabric (F64 共享容量 + 1.60 亿 SSD DiskANN + SDS + ALDO) — $11,400 / mo</text>
  <rect x="748" y="464" width="112" height="16" rx="8" fill="#10B981"/>
