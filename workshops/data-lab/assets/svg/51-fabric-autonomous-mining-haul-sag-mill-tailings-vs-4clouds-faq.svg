    <linearGradient id="hdrGrad51" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284C7"/>
