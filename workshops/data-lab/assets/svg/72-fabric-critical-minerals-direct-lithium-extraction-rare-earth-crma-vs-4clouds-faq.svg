  <rect x="44" y="596" width="1352" height="264" rx="14" fill="#0E1B31" stroke="#334155" stroke-width="1.2"/>
  <text x="64" y="624" fill="#F8FAFC" font-size="14.5" font-weight="800">📊 五大云平台关键矿产、1.24 亿向量检索与欧盟 CRMA 溯源对比矩阵（n=300 路由均值 245.0ms · n=71 本体均值 207.0ms）</text>

  <rect x="64" y="638" width="420" height="204" rx="10" fill="#132642" stroke="#10B981" stroke-width="1.2"/>
  <text x="80" y="662" fill="#6EE7B7" font-size="13" font-weight="800">🏆 Microsoft Fabric 必赢三大铁律（省 90.0% 里程碑）</text>
  <text x="80" y="686" fill="#F8FAFC" font-size="11.5">1. $0/GB 写入税 + 16ms KQL 斜率感知：840K EPS LIBS/ICP-OES</text>
  <text x="80" y="704" fill="#94A3B8" font-size="11">   直入 Eventhouse，提前 22 分钟拦截硼镁穿漏与稀土乳化</text>
  <text x="80" y="728" fill="#F8FAFC" font-size="11.5">2. 1.24 亿向量 SSD DiskANN 17ms 检索：Thomas 穿透曲线、SX</text>
  <text x="80" y="746" fill="#94A3B8" font-size="11">   分配比与水文向量驻留 NVMe SSD，省去 92% DRAM 硬件税</text>
  <text x="80" y="770" fill="#F8FAFC" font-size="11.5">3. ALDO 4,200m 高原边缘 + SDS CRMA 护照 + F64 $0 读者税：</text>
  <text x="80" y="788" fill="#94A3B8" font-size="11">   断网不乱切塔，1,900 名冶金/ESG 工程师 $0 Viewer 许可费</text>
  <text x="80" y="818" fill="#34D399" font-size="12" font-weight="800">✓ 月度标准化 TCO：$10,500/月 vs 竞对 $105,000/月（立省 90.0%！）</text>

  <rect x="502" y="638" width="430" height="204" rx="10" fill="#132642" stroke="#64748B" stroke-width="1"/>
