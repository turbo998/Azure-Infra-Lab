  <text x="518" y="688" fill="#E2E8F0" font-size="11.5">• Databricks GPU ($105.0K/mo)：适合新型锂离子筛与稀土萃取剂</text>
  <text x="518" y="706" fill="#94A3B8" font-size="11">  DFT/GROMACS 分子动力学筛选，等温线参数零拷贝写回 OneLake</text>
  <text x="518" y="730" fill="#E2E8F0" font-size="11.5">• Snowflake ($108.9K/mo)：适合 LME 碳酸锂期货套保与正极厂</text>
  <text x="518" y="748" fill="#94A3B8" font-size="11">  长协财务结算，通过 OneLake $0 算力镜像对齐</text>
  <text x="518" y="772" fill="#E2E8F0" font-size="11.5">• AWS SiteWise ($103.6K/mo)：840K EPS 按点写入与 1.24 亿</text>
  <text x="518" y="790" fill="#94A3B8" font-size="11">  OpenSearch 全内存向量 OCU 账单高昂</text>
  <text x="518" y="818" fill="#E2E8F0" font-size="11.5">• GCP BigQuery ($104.4K/mo)：缺高原断网 DCS 边缘与内置 CRMA 表</text>

  <rect x="950" y="638" width="424" height="204" rx="10" fill="#092E26" stroke="#10B981" stroke-width="1.4"/>
  <text x="966" y="662" fill="#6EE7B7" font-size="13" font-weight="800">📈 Scenario BS 密封基准验证（300 场景里程碑 · DL-297..300）</text>
  <text x="966" y="688" fill="#F8FAFC" font-size="12" font-weight="700">• 评测矩阵得分：299 / 300 (99.67%) · 146/146 单测通过</text>
  <text x="966" y="712" fill="#F8FAFC" font-size="11.5">• 电池级纯度保卫：成品硼压至 2.1 ppm (&lt; 5.0 ppm，保 320 吨 Li2CO3)</text>
  <text x="966" y="734" fill="#F8FAFC" font-size="11.5">• 锂综合回收率：SMB 步进优化拉升回收率至 93.4% + 稀土零乳化</text>
  <text x="966" y="756" fill="#F8FAFC" font-size="11.5">• 盐湖生态护栏：尾卤回注率 98.6% (&gt;= 95.0% 红线，湿地降深 0mm)</text>
  <text x="966" y="778" fill="#F8FAFC" font-size="11.5">• 国际合规护照：欧盟 CRMA / IRA 30D 护照 (3.8 tCO2e/t LCE)</text>
  <text x="966" y="812" fill="#34D399" font-size="13" font-weight="800">🛡️ 守护 $21,500,000 电池级碳酸锂、稀土与 CRMA 通关 SLA</text>
