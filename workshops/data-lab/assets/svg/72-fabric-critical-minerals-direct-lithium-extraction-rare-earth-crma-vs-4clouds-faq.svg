  <rect x="60" y="54" width="218" height="28" rx="6" fill="url(#accent72)"/>
  <text x="169" y="73" fill="#FFFFFF" font-size="11.8" font-weight="800" text-anchor="middle">2026-11-14 · R64 · 300 SCENARIOS</text>
  <text x="294" y="72" fill="#F8FAFC" font-size="16.2" font-weight="800">Microsoft Fabric 关键矿产、盐湖直接提锂（DLE）、稀土串级萃取与欧盟 CRMA 溯源 vs 四大云选型一图流</text>
  <text x="60" y="104" fill="#94A3B8" font-size="12.5">24 座盐湖/稀土基地 · 1,200 根 DLE 吸附塔 + 480 条稀土 SX 线 × 840K EPS · Eventhouse 16ms + Cosmos SSD DiskANN 17ms 1.24 亿向量 + ALDO = 67ms 闭环 · 省 90.0% TCO</text>
  <rect x="1182" y="50" width="196" height="58" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1280" y="72" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BS · 1.24 亿向量</text>
  <text x="1280" y="96" fill="#F8FAFC" font-size="18" font-weight="800" text-anchor="middle">67ms · 省 90.0% TCO</text>

  <!-- Left Column: Pain Points -->
  <rect x="44" y="140" width="430" height="440" rx="14" fill="#111C33" stroke="#EF4444" stroke-width="1.3"/>
  <text x="64" y="170" fill="#FCA5A5" font-size="15" font-weight="800">❌ 传统 8 小时离线化验与公有云拼接栈三大痛点</text>

  <rect x="64" y="188" width="390" height="114" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="212" fill="#FECACA" font-size="13" font-weight="700">1. 8 小时离线 ICP 化验对 DLE 硼穿漏与稀土乳化失明</text>
  <text x="80" y="234" fill="#CBD5E1" font-size="11.5">• 直接提锂 (DLE) 4h 成盐，但离线化验滞后 6–8 小时</text>
  <text x="80" y="254" fill="#CBD5E1" font-size="11.5">• Train-B 硼杂质突破 18.4ppm (&gt;5ppm 电池级红线) 时未及时切塔</text>
  <text x="80" y="274" fill="#FCA5A5" font-size="11.5" font-weight="700">• 导致 320 吨电池级碳酸锂降级报废，42 级镝铽萃取槽乳化跑料</text>

  <rect x="64" y="316" width="390" height="114" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="340" fill="#FECACA" font-size="13" font-weight="700">2. 840K EPS 在线 LIBS 光谱与回注井水文流按点写入税</text>
  <text x="80" y="362" fill="#CBD5E1" font-size="11.5">• 1,200 根吸附塔 LIBS/拉曼 + 480 条 SX pH/Eh + 回注井 = 840K EPS</text>
  <text x="80" y="382" fill="#CBD5E1" font-size="11.5">• 公有云 IoT 按属性点/按 GB 双重收费，高原卫星链路闪断易失控</text>
  <text x="80" y="402" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅光谱流摄入与曲线重算即月烧 $46,800/月 (Normalized)</text>

  <rect x="64" y="444" width="390" height="120" rx="10" fill="#1E1B2E" stroke="#F87171" stroke-width="1"/>
  <text x="80" y="468" fill="#FECACA" font-size="13" font-weight="700">3. 1.24 亿条洗脱穿透与萃取平衡向量全内存硬件税</text>
  <text x="80" y="490" fill="#CBD5E1" font-size="11.5">• 1.24 亿条 (124M) Thomas 吸附穿透曲线、120 级稀土分配比</text>
  <text x="80" y="510" fill="#CBD5E1" font-size="11.5">  与 FEFLOW 盐湖地下水回注向量若常驻全内存需 5.4TB DRAM</text>
  <text x="80" y="532" fill="#FCA5A5" font-size="11.5" font-weight="700">• 仅全内存向量集群月费即达 $39,600/月，总拼接栈高达 $105,000/月</text>

  <!-- Center/Right Column: Fabric 67ms Closed Loop -->
  <rect x="492" y="140" width="904" height="440" rx="14" fill="#0F223D" stroke="#10B981" stroke-width="1.5"/>
  <text x="514" y="170" fill="#6EE7B7" font-size="15.5" font-weight="800">✅ Microsoft Fabric 盐湖提锂 DLE、稀土萃取与欧盟 CRMA 护照 67ms 自治闭环（省 90.0% TCO · $10,500/月）</text>

  <!-- Step 1 -->
  <rect x="514" y="188" width="860" height="84" rx="10" fill="#132D50" stroke="#38BDF8" stroke-width="1.2"/>
  <rect x="528" y="202" width="108" height="24" rx="5" fill="#0284C7"/>
  <text x="582" y="218" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 1 · 16 ms</text>
  <text x="648" y="218" fill="#F8FAFC" font-size="13.5" font-weight="800">Eventhouse KQL 840K EPS 在线 LIBS 光谱、吸附压差与水文感知（$0/GB 写入税 · 12:1 压缩）</text>
  <text x="528" y="242" fill="#BAE6FD" font-size="11.5">• 实时摄入 1,200 根 DLE 吸附塔、480 条稀土 SX 线与盐湖回注井流，series_fit_line() 追踪洗脱曲线二阶导数</text>
  <text x="528" y="260" fill="#34D399" font-size="11.5" font-weight="700">• 16ms 提前 22 分钟锁定 Train-B 硼杂质穿漏拐点 (预测 18.4ppm &gt; 5ppm 红线) 及第 42 级镝铽萃取槽界面乳化苗头</text>

  <!-- Step 2 -->
  <rect x="514" y="282" width="860" height="90" rx="10" fill="#132D50" stroke="#818CF8" stroke-width="1.2"/>
  <rect x="528" y="296" width="108" height="24" rx="5" fill="#4F46E5"/>
  <text x="582" y="312" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 2 · 17 ms</text>
  <text x="648" y="312" fill="#F8FAFC" font-size="13.5" font-weight="800">Fabric IQ 6 跳湿法冶金孪生 × Cosmos SSD DiskANN 1.24 亿向量（124M）检索（省 92% 内存）</text>
  <text x="528" y="336" fill="#E0E7FF" font-size="11.5">• 17ms 在 NVMe SSD 上检索 1.24 亿条 Thomas 动态洗脱穿透曲线、稀土多组分分配平衡与 FEFLOW 地下水向量 (0.99 相似)</text>
  <text x="528" y="356" fill="#34D399" font-size="11.5" font-weight="700">• 提前切换 SMB 旋转阀 + 二级除硼回流比上调 +18% (将成品硼压至 2.1ppm) + 微调第 42 级萃取槽盐酸酸度 +0.08 mol/L 消乳化</text>

  <!-- Step 3 -->
  <rect x="514" y="382" width="860" height="88" rx="10" fill="#132D50" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="528" y="396" width="108" height="24" rx="5" fill="#D97706"/>
  <text x="582" y="412" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 3 · 17 ms</text>
  <text x="648" y="412" fill="#F8FAFC" font-size="13.5" font-weight="800">Foundry IQ 盐湖尾卤回注率（&gt;=95.0%）与欧盟 CRMA / IRA 30D 护栏（SOP-071）</text>
  <text x="528" y="436" fill="#FEF3C7" font-size="11.5">• 强制校核 18 口尾卤回注井总回注率 = 98.6% (&gt;= 95.0% 安第斯湿地生态红线)，边缘火烈鸟保护区地下水位降深 0.0 mm</text>
  <text x="528" y="454" fill="#34D399" font-size="11.5" font-weight="700">• 确认单吨碳酸锂碳足迹 3.8 tCO2e/t LCE，100% 满足欧盟《关键原材料法案》(CRMA) 与美国 IRA 30D 原产地溯源</text>

  <!-- Step 4 -->
  <rect x="514" y="480" width="860" height="84" rx="10" fill="#132D50" stroke="#10B981" stroke-width="1.2"/>
  <rect x="528" y="494" width="108" height="24" rx="5" fill="#059669"/>
  <text x="582" y="510" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">Step 4 · 17 ms</text>
  <text x="648" y="510" fill="#F8FAFC" font-size="13.5" font-weight="800">冶金厂长 Teams 联签 + ALDO 4,200m 高原边缘下发 + OneLake IQ 矿产护照落盘</text>
  <text x="528" y="534" fill="#D1FAE5" font-size="11.5">• 冶金厂长在 Teams 联签 Confirm，驱动海拔 4,200 米盐湖 SQL Server on Azure Local (ALDO) 下发旋转阀/计量泵 DCS 指令</text>
  <text x="528" y="552" fill="#6EE7B7" font-size="11.5" font-weight="700">• 端到端 67ms 保住 320 吨 99.5% 电池级碳酸锂与高纯氧化镝，月省 $94,500 (-90.0% TCO 里程碑)，守护 $21.50M SLA</text>

