  <text x="522" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：1.8-2.4μJ 脉冲动态调制 + 液晶 SLM 球差实时校正</text>
  <text x="522" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：切缝损耗仅 16.5 μm，12 片/锭剥离零碎裂</text>
  <text x="522" y="800" fill="#94A3B8" font-size="11">• 极限散热：热导率高达 2,210 W/m·K，压降 2kW GPU 结温 -28°C</text>

  <rect x="952" y="670" width="428" height="174" rx="10" fill="#091326" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="968" y="694" fill="#FBBF24" font-size="13" font-weight="800">③ AI 超导热基板证书与 98.8% 钯膜绿氢护照</text>
  <text x="968" y="716" fill="#E2E8F0" font-size="11.5">• 氢气闭环：7N 超纯氢气经钯银合金膜在线纯化回用率达 98.8%</text>
