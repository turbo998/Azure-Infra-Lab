  <text x="524" y="333" fill="#F8FAFC" font-size="11.5">• 检索 364,000,000 (🏆 540场景 &amp; 省94.7% TCO!) 谐振腔/台阶流/激光向量</text>
  <text x="524" y="352" fill="#CBD5E1" font-size="11">• 相似度 0.99 (省 92% 内存)：腔压下调 -14 Torr 展宽等离子体鞘层</text>
  <text x="524" y="371" fill="#FDE68A" font-size="11" font-weight="700">• CH4 调至 4.1% + 注入 0.15% O2 优先刻蚀 sp² + SLM 相位图补偿</text>

