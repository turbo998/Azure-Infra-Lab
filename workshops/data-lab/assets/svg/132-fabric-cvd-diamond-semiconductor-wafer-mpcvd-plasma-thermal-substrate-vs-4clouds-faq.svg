  <text x="1032" y="310" fill="#FDE68A" font-size="11.5" font-weight="800">• 守护 SLA 风险敞口：        $42,500,000 ($42.50M)</text>

  <rect x="1018" y="338" width="364" height="126" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1032" y="360" fill="#FDE68A" font-size="12.5" font-weight="900">🏆 540场景 &amp; 省94.7% TCO &amp; 2ms (report.json R124)</text>
  <text x="1032" y="382" fill="#FFFFFF" font-size="12" font-weight="800">• 路由评估矩阵 (n=540!)：   539 / 540 (99.81% · 540场景大关!)</text>
