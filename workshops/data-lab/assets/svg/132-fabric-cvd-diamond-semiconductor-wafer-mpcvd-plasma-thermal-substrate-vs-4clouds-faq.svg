  <text x="524" y="205" fill="#67E8F9" font-size="12.5" font-weight="800">STEP 1 · Eventhouse KQL 990K EPS 光谱与温差感知 (0.5 ms)</text>
  <text x="524" y="225" fill="#F8FAFC" font-size="11.5">• $0/GB 写入税摄入 1,200 台 MPCVD OES、双色测温与 320 台飞秒激光</text>
  <text x="524" y="244" fill="#CBD5E1" font-size="11">• series_fit_line() 0.5ms 捕获 #118 腔边缘温差 +78°C 与 C2/Hα=0.48</text>
  <text x="524" y="263" fill="#34D399" font-size="11" font-weight="700">• 同时识别剥离工位双折射残余应力峰值与焦点球差偏移</text>

  <!-- Step 2 -->
  <rect x="508" y="292" width="454" height="104" rx="10" fill="#132F2B" stroke="#10B981" stroke-width="1.8"/>
