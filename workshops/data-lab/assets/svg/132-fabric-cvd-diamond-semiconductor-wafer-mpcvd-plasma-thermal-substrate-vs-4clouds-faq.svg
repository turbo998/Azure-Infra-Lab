  <text x="1032" y="558" fill="#34D399" font-size="11" font-weight="700">• Fabric：OneLake 零拷贝挂载 + 2ms 外延车间实时控制面</text>
  <text x="1032" y="578" fill="#94A3B8" font-size="10.5">• 官方规格引用：127 条 (新增 SPEC-CVD-DIAMOND-MPCVD-R124)</text>

