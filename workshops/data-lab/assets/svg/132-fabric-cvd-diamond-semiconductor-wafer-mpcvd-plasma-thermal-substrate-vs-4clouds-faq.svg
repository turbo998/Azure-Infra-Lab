  <text x="524" y="449" fill="#F8FAFC" font-size="11.5">• 校验籽晶径向温差压至 +6.2°C &lt;= 15.0°C，C2/Hα 锁死 0.18 &lt;= 0.25</text>
  <text x="524" y="468" fill="#CBD5E1" font-size="11">• 拉曼 1,332 cm⁻¹ FWHM 达 1.68 cm⁻¹，热导率 2,210 W/m·K</text>
  <text x="524" y="485" fill="#34D399" font-size="11" font-weight="700">• 飞秒激光切缝损耗压至 16.5 μm (0 裂片)，钯膜氢气回用率 98.8%</text>

  <!-- Step 4 -->
  <rect x="508" y="510" width="454" height="84" rx="10" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.4"/>
  <text x="524" y="531" fill="#C4B5FD" font-size="12.5" font-weight="800">STEP 4 · Teams 外延总监确认 + ALDO 边缘 + 散热护照 (0.5 ms)</text>
  <text x="524" y="551" fill="#F8FAFC" font-size="11.5">• 车间 ALDO 边缘下发节流蝶阀、固态微波源与飞秒激光 SLM 指令</text>
  <text x="524" y="570" fill="#34D399" font-size="11" font-weight="700">• 1GB 免费 SQL 签发 2,210 W/m·K 超导热护照 (总耗时 2ms 极速纪录!)</text>

