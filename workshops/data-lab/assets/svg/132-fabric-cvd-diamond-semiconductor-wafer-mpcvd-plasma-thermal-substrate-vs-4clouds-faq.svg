  <text x="256" y="66" fill="#030712" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">🏆 R124 · 540 CASES, -94.7% TCO RECORD &amp; 2ms E2E!</text>
  <text x="468" y="66" fill="#F8FAFC" font-size="15.8" font-weight="800">MPCVD 单晶金刚石晶圆与 2,210 W/m·K 超导热基板等离子体光谱 (OES) 防多晶与飞秒激光剥离 2ms 闭环</text>
  <text x="58" y="100" fill="#94A3B8" font-size="12.5">Scenario EA · 14 座 MPCVD 金刚石与激光基地 (1,200 台 MPCVD 反应炉 + 480 套原位 OES/测温 + 320 台飞秒 LLO) × 990K EPS · 3.64 亿向量 · 1.68cm⁻¹ &amp; 2,210 W/m·K</text>

  <rect x="1146" y="46" width="236" height="64" rx="10" fill="#064E3B" stroke="#F59E0B" stroke-width="2"/>
  <text x="1264" y="68" fill="#FDE68A" font-size="11.5" font-weight="900" text-anchor="middle">539 / 540 = 99.81% (-94.7%!)</text>
  <text x="1264" y="95" fill="#FFFFFF" font-size="19" font-weight="900" text-anchor="middle">364M Vectors · 2ms</text>

  <!-- Left Column -->
  <rect x="40" y="138" width="430" height="470" rx="14" fill="#131B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · 单晶金刚石外延与激光剥离三大危机与死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #118 MPCVD 腔籽晶凸出尖端放电与 +78°C 多晶寄生</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• 第 160h 厚膜生长时籽晶棱角高出凹槽，引发微波电场尖端集中</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 边缘温度飙至 1,185°C (温差 +78°C &gt; 15°C)，C2/Hα 比冲上 0.48</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 边缘爆发多晶包裹与非相干孪晶界，热导率腰斩至 1,180 W/m·K</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：200h 停炉出腔才测拉曼，$180K 单晶金刚石整炉报废！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="344" fill="#FCA5A5" font-size="12.5" font-weight="800">② 飞秒激光内部改质剥离 (LLO) 应力解理炸裂</text>
  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• 聚焦地下 500μm 生成纳米 sp² 石墨牺牲层，体积膨胀约 50%</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• 孪晶残余双折射应力使横向微裂纹偏折向 (111) 解理面</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• 剥离瞬间引发整片 100mm 金刚石晶圆脆性贯通碎裂</text>
  <text x="72" y="424" fill="#F87171" font-size="11" font-weight="700">• 痛点：缺乏双折射应力场实时调制 SLM 相位，切片良率极低！</text>

  <rect x="58" y="466" width="394" height="126" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($269.3K/月 vs $14.4K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：990K EPS 1,200台 OES/高温计/拉曼流月费 $194.8K</text>
  <text x="72" y="528" fill="#E2E8F0" font-size="11.5">• 内存税：364M 全内存 DRAM 向量索引月耗 $43.0K</text>
  <text x="72" y="548" fill="#E2E8F0" font-size="11.5">• 刷新税：Snowflake 60s 滞后 / 200h 离线检测错失抑多晶窗口</text>
  <text x="72" y="570" fill="#34D399" font-size="11.5" font-weight="700">• Fabric 破局：$0/GB 写入税 + SSD DiskANN 省 92% 内存</text>

