  <rect x="40" y="624" width="1360" height="240" rx="14" fill="#0E192D" stroke="#2563EB" stroke-width="1.5"/>
  <text x="60" y="654" fill="#60A5FA" font-size="14.5" font-weight="800">04 · MPCVD 单晶金刚石晶圆与 2,210 W/m·K 超导热基板三大物理护栏矩阵 (SOP-131 · 540 Cases, -94.7% TCO &amp; 2ms E2E Milestone)</text>

  <rect x="60" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="76" y="694" fill="#67E8F9" font-size="13" font-weight="800">① 等离子体鞘层展宽与微量氧抑多晶寄生</text>
  <text x="76" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：降低腔压使 λ_e ∝ 1/P 展宽鞘层，OH· 300x 优先刻蚀 sp²</text>
  <text x="76" y="736" fill="#E2E8F0" font-size="11.5">• 异常拦截：#118 腔第 160h 边缘升温 +78°C，C2/Hα 冲上 0.48</text>
  <text x="76" y="756" fill="#E2E8F0" font-size="11.5">• 边缘微调：腔压 -14 Torr + CH4 调至 4.1% + 注入 0.15% O2</text>
  <text x="76" y="778" fill="#34D399" font-size="11.5" font-weight="700">• 闭环成效：径向温差压至 +6.2°C &lt;= 15.0°C，C2/Hα=0.18</text>
  <text x="76" y="800" fill="#94A3B8" font-size="11">• 晶体质量：拉曼 1,332 cm⁻¹ FWHM 达 1.68 cm⁻¹，零多晶孪晶</text>

  <rect x="506" y="670" width="426" height="174" rx="10" fill="#091326" stroke="#10B981" stroke-width="1.2"/>
  <text x="522" y="694" fill="#6EE7B7" font-size="13" font-weight="800">② 飞秒激光内部改质剥离 (LLO) 应力球差补偿</text>
  <text x="522" y="716" fill="#E2E8F0" font-size="11.5">• 物理机理：地下 500μm 多光子电离形成 sp² 牺牲层沿 (100) 剥离</text>
