  <text x="1018" y="220" fill="#E2E8F0" font-size="11.2">• 640K EPS 水听器 TDOA 定漏 + 水锤抑制 ($0/GB 写入税)</text>
  <text x="1018" y="238" fill="#E2E8F0" font-size="11.2">• 4,600万声纹/EPANET 瞬变 SSD DiskANN + 3,200-DMA 孪生</text>
  <text x="1018" y="256" fill="#6EE7B7" font-size="11" font-weight="700">• ALDO 水厂/地下泵房断网自治 + 1,800 人 $0 DirectLake 看数</text>

  <rect x="1004" y="282" width="388" height="94" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="1018" y="304" fill="#60A5FA" font-size="12.5" font-weight="800">🤝 Better Together：CycleCloud HPC + DBX GPU</text>
  <text x="1018" y="324" fill="#E2E8F0" font-size="11.2">• 全城三维台风浅水方程 (2D/3D CFD) 内涝模拟 → CycleCloud / AWS</text>
  <text x="1018" y="342" fill="#E2E8F0" font-size="11.2">• 排水管网 CCTV 爬行机器人裂缝/树根 CV 训练 → Databricks GPU</text>
  <text x="1018" y="360" fill="#93C5FD" font-size="11" font-weight="700">• 淹没风险栅格与 ONNX 缺陷模型通过 OneLake 零拷贝回挂</text>

  <rect x="1004" y="386" width="388" height="90" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1018" y="408" fill="#FBBF24" font-size="12.5" font-weight="800">⚠️ 竞对局限与避坑指南 (Anti-Patterns)</text>
  <text x="1018" y="428" fill="#E2E8F0" font-size="11.2">• 严禁在调低减压阀 PRV 时使管网高点余压跌破 20.0 psi (防负压倒流)</text>
  <text x="1018" y="446" fill="#E2E8F0" font-size="11.2">• 严禁依赖 60s 批处理表捕捉 1,200 m/s 传播的儒可夫斯基水锤波</text>
  <text x="1018" y="464" fill="#FDE68A" font-size="11" font-weight="700">• 严禁将国家关键基础设施 (CII) 水厂联锁完全暴露于公网云端</text>

  <!-- Bottom Row Left: Quantitative TCO Comparison -->
  <rect x="32" y="510" width="684" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="52" y="540" fill="#38BDF8" font-size="15" font-weight="800">04 · 定量 TCO 对比 (68,000km 管网 · 3,200 个 DMA · 640K EPS · 1,800 用户)</text>

  <rect x="52" y="558" width="644" height="68" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
