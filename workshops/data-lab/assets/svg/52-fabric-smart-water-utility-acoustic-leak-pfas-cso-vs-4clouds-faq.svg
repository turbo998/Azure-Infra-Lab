  <!-- Header Banner -->
  <rect x="32" y="24" width="1376" height="92" rx="14" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.5"/>
  <rect x="48" y="42" width="186" height="28" rx="6" fill="url(#hdrGrad52)"/>
  <text x="141" y="61" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">DATA LAB · ROUND 44 FAQ</text>
  <text x="250" y="62" fill="#F8FAFC" font-size="18.5" font-weight="800">智慧水务与地下生命线 (68,000km 管网 640K EPS 声学检漏)、EPA PFAS 与暴雨 CSO 选型：Fabric vs 四大云</text>
  <text x="48" y="94" fill="#94A3B8" font-size="12.5">3,200 个 DMA 管网 + 48 座水厂 · Eventhouse KQL TDOA 互相关 (6ms, ±0.8m 定漏) + SSD DiskANN 4,600万声纹/水力匹配 (6ms) + ALDO 水厂边缘 · 24ms 闭环省 86.1% TCO</text>
  <rect x="1204" y="38" width="186" height="64" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1297" y="62" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario AY · 219/220 (99.55%)</text>
  <text x="1297" y="86" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">24ms · 省 86.1% TCO</text>

  <!-- Left Column: First-Principles Pain Points -->
  <rect x="32" y="132" width="436" height="360" rx="14" fill="#111C33" stroke="#F43F5E" stroke-width="1.4"/>
  <text x="52" y="162" fill="#FDA4AF" font-size="15" font-weight="800">01 · 传统水务源-厂-网-河三大痛点 ($133.8K/月)</text>

  <rect x="48" y="178" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 暗漏拖成 DN1200 主干管水锤爆管塌陷 &amp; 24% 产销差</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 15分钟 SCADA 轮询抓不到 465Hz 暗漏声波与 1,200m/s 水锤波</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 夜间泵阀启停引发 +4.8bar 水锤冲击暗漏点导致主干道塌陷</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 单次主干管爆管抢修与停水索赔超 $3.80M，年漏损数千万吨</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="302" fill="#FB7185" font-size="13" font-weight="700">② 3,200 个 DMA 640K EPS 水听器与瞬变压力按点天价税</text>
  <text x="62" y="322" fill="#E2E8F0" font-size="11.5">• 10kHz 水听器、200Hz 瞬变压力与水质测点按 Tag 月烧 $62K+</text>
  <text x="62" y="340" fill="#E2E8F0" font-size="11.5">• 离线 EPANET 水力模拟需 15 分钟，来不及在线实时削峰抑制水锤</text>
  <text x="62" y="358" fill="#FCA5A5" font-size="11" font-weight="700">✗ 路面地铁/重车震动噪声导致传统阈值告警误报率高达 40%+</text>

  <rect x="48" y="382" width="404" height="94" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="404" fill="#FB7185" font-size="13" font-weight="700">③ EPA PFAS &lt;4.0 ppt 饮用水新规与暴雨 CSO 污水溢流</text>
  <text x="62" y="424" fill="#E2E8F0" font-size="11.5">• 原水 PFOA 突升至 6.8 ppt 时未及时切换再生活性炭塔致出厂超标</text>
  <text x="62" y="442" fill="#E2E8F0" font-size="11.5">• 特大暴雨期深隧截流堰与泵站脱节导致雨污混合水直排河道</text>
  <text x="62" y="460" fill="#FCA5A5" font-size="11" font-weight="700">✗ 单次违反 EPA 饮用水与 CSO 零溢流法令面临 $4.5M+ 重罚</text>

  <!-- Center Column: Fabric 24ms Closed-Loop Architecture -->
  <rect x="486" y="132" width="484" height="360" rx="14" fill="#0F2238" stroke="#10B981" stroke-width="1.8"/>
  <text x="506" y="162" fill="#6EE7B7" font-size="15" font-weight="800">02 · Microsoft Fabric 源-厂-网-河 24ms 自愈闭环</text>

  <rect x="504" y="178" width="448" height="68" rx="9" fill="#0B192C" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="518" y="199" fill="#38BDF8" font-size="12.5" font-weight="800">Step 1 (6ms) · Eventhouse KQL 640K EPS 双水听器 TDOA 互相关</text>
  <text x="518" y="218" fill="#E2E8F0" font-size="11.2">• $0/GB 写入税由 Δt=14.2ms 算得 DMA-108 暗漏距上游 184.2m (±0.8m)</text>
  <text x="518" y="235" fill="#93C5FD" font-size="11">• 同步捕获 +4.8bar 关阀水锤浪涌、二水厂 PFOA 6.8ppt 与深隧 91% 液位</text>

  <rect x="504" y="254" width="448" height="72" rx="9" fill="#0B192C" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="518" y="275" fill="#C4B5FD" font-size="12.5" font-weight="800">Step 2 (6ms) · SSD DiskANN 4,600万声纹/EPANET 匹配与三联调度</text>
  <text x="518" y="294" fill="#E2E8F0" font-size="11.2">• 检索 4,600万条爆管声谱与水力方案 (0.99 相似，省92%内存)，确认胶圈微裂</text>
  <text x="518" y="312" fill="#DDD6FE" font-size="11">• PRV-108A 柔性降压 -1.4bar + 切再生炭塔 GAC-04 + 升起 CSO 充气堰蓄水 4.2万m³</text>

  <rect x="504" y="334" width="448" height="68" rx="9" fill="#0B192C" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="518" y="355" fill="#FDE68A" font-size="12.5" font-weight="800">Step 3 (6ms) · Foundry IQ EPA SDWA 防倒流与 PFAS 护栏</text>
  <text x="518" y="374" fill="#E2E8F0" font-size="11.2">• 核验 SOP-051：降压后儿童医院高点余压 34.2 psi &gt;= 20.0 psi 防负压倒流红线</text>
  <text x="518" y="391" fill="#FDE68A" font-size="11">• 确认切换活性炭塔后出厂 PFOA 降至 0.8 ppt &lt; 4.0 ppt 且河道 CSO 溢流 = 0 m³</text>

  <rect x="504" y="410" width="448" height="68" rx="9" fill="#064E3B" stroke="#10B981" stroke-width="1.4"/>
  <text x="518" y="431" fill="#6EE7B7" font-size="12.5" font-weight="800">Step 4 (6ms) · ALDO 水厂/泵站边缘调压、切塔与 SAP 听音开挖</text>
  <text x="518" y="450" fill="#F8FAFC" font-size="11.2">• 水务总调度长 Teams 联签 Confirm → ALDO 下发 PRV、GAC 与 CSO 充气堰指令</text>
  <text x="518" y="467" fill="#A7F3D0" font-size="11" font-weight="700">✓ 端到端 24ms 自愈 · 守护 $14.50M 防爆管塌陷、降 NRW 漏损与 EPA 合规 SLA</text>

  <!-- Right Column: Better Together & Decision Matrix -->
  <rect x="988" y="132" width="420" height="360" rx="14" fill="#111C33" stroke="#38BDF8" stroke-width="1.4"/>
