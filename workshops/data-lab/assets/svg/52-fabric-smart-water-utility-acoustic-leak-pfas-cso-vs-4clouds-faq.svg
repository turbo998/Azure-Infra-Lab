  <text x="600" y="596" fill="#34D399" font-size="15" font-weight="800" text-anchor="middle">省 86.1% TCO</text>

  <rect x="52" y="638" width="644" height="58" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="68" y="662" fill="#F8FAFC" font-size="13" font-weight="700">Databricks + 第三方水务 Historian + 内存 Vector Search</text>
  <text x="68" y="683" fill="#94A3B8" font-size="11.5">内部全量: $108,000/月 · 500人归一化: $48,800/月 (常驻 Streaming DBU + 内存向量节点 + BI 消耗)</text>

  <rect x="52" y="706" width="644" height="58" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="68" y="730" fill="#F8FAFC" font-size="13" font-weight="700">AWS 拼接栈 (IoT SiteWise + Kinesis + OpenSearch + QuickSight)</text>
  <text x="68" y="751" fill="#94A3B8" font-size="11.5">内部全量: $133,800/月 · 500人归一化: $60,400/月 (按属性/分片计费 + 内存向量 + BI 席位)</text>

  <rect x="52" y="774" width="644" height="74" rx="10" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="68" y="798" fill="#7DD3FC" font-size="12.5" font-weight="800">💡 $14.50M 风险敞口保护拆解 (Scenario AY 定量收益)：</text>
  <text x="68" y="818" fill="#E2E8F0" font-size="11.5">• 提前 6h 拦截 DN1200 主干管爆管塌陷：$6.40M · 全网调压降低产销差 NRW 节水 4,200万吨：$3.60M</text>
  <text x="68" y="836" fill="#6EE7B7" font-size="11.5" font-weight="700">• 切换再生炭塔将 PFOA 压至 0.8ppt (&lt;4.0ppt) 并深隧蓄水 4.2万m³ 规避 EPA 罚单：$4.50M</text>

  <!-- Bottom Row Right: Dual-Denominator & Production Checklist -->
  <rect x="734" y="510" width="674" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="754" y="540" fill="#FBBF24" font-size="15" font-weight="800">05 · 双分母基准对账 (R44) 与生产落地核验清单 (Architect Checklist)</text>

  <rect x="754" y="556" width="634" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="770" y="578" fill="#34D399" font-size="12.5" font-weight="800">📊 严格区分两大延迟分母 (Dual-Denominator Reconciliation · 2026-11-13 R44)</text>
  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=220 (DL-01..220) 均值 = 326.0 ms (219/220 = 99.55%)</text>
  <text x="770" y="618" fill="#F8FAFC" font-size="11.5">• 分母 B (行业本体端到端仿真均值 ontology_simulations[])：n=51 (场景 A..AY，范围 5–780ms) 均值 = 274.0 ms</text>
  <text x="770" y="636" fill="#93C5FD" font-size="11">• 本轮新增 Scenario AY 端到端延迟 = 24 ms (6ms 感知 + 6ms DiskANN/DMA + 6ms EPA SDWA 护栏 + 6ms 回写) · 106/106 单测通过</text>

  <rect x="754" y="658" width="634" height="190" rx="10" fill="#0B192C" stroke="#334155" stroke-width="1"/>
  <text x="770" y="682" fill="#7DD3FC" font-size="13" font-weight="800">🛠️ 售前打单与生产落地 5 步核验清单 (Production Checklist)：</text>
  <text x="770" y="706" fill="#E2E8F0" font-size="11.5">☑ 1. 水听器与瞬变压力流直通：640K EPS 遥测直推 Eventhouse (12:1 压缩，$0/GB 写入税)</text>
  <text x="770" y="730" fill="#E2E8F0" font-size="11.5">☑ 2. Cosmos SSD DiskANN 4,600万声纹/水力库：暗漏声谱与 EPANET 瞬变建索引 (P99 &lt; 10ms)</text>
  <text x="770" y="754" fill="#E2E8F0" font-size="11.5">☑ 3. 3,200-DMA 产销差统一本体：在 Digital Twin Builder 关联 GIS 管网、PRV 与 AMI 夜间流量</text>
  <text x="770" y="778" fill="#E2E8F0" font-size="11.5">☑ 4. 水厂/地下泵站 ALDO 断网自治：部署 SQL Server on Azure Local 保障台风断网期本地闭环</text>
  <text x="770" y="802" fill="#E2E8F0" font-size="11.5">☑ 5. EPA SDWA 正压与 PFAS 护栏 (SOP-051)：高点余压 &gt;= 20.0 psi 防倒流，出厂 PFAS &lt; 4.0 ppt</text>
  <text x="770" y="830" fill="#6EE7B7" font-size="11" font-weight="700">🔗 关联代码与密封证据：src/data_lab/benchmark_suite.py · tests/test_data_lab.py (106/106) · reports/report.json</text>
