  <!-- Bottom Row Right: Dual-Denominator & Production Checklist -->
  <rect x="734" y="510" width="674" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="754" y="540" fill="#FBBF24" font-size="15" font-weight="800">05 · 双分母基准对账 (R38) 与生产落地核验清单 (Architect Checklist)</text>

  <rect x="754" y="556" width="634" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="770" y="578" fill="#34D399" font-size="12.5" font-weight="800">📊 严格区分两大延迟分母 (Dual-Denominator Reconciliation · 2026-11-12 R38)</text>
  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=196 (DL-01..196) 均值 = 356.0 ms (195/196 = 99.49%)</text>
  <text x="770" y="618" fill="#F8FAFC" font-size="11.5">• 分母 B (行业本体端到端仿真均值 ontology_simulations[])：n=45 (场景 A..AS，范围 5–780ms) 均值 = 307.0 ms</text>
  <text x="770" y="636" fill="#93C5FD" font-size="11">• 本轮新增 Scenario AS 端到端延迟 = 43 ms (10ms 感知 + 11ms OSDU/DiskANN + 11ms RP53/ClassVI 护栏 + 11ms 回写) · 94/94 单测通过</text>

  <rect x="754" y="658" width="634" height="190" rx="10" fill="#0B192C" stroke="#334155" stroke-width="1"/>
  <text x="770" y="682" fill="#7DD3FC" font-size="13" font-weight="800">🛠️ 售前打单与生产落地 5 步核验清单 (Production Checklist)：</text>
  <text x="770" y="706" fill="#E2E8F0" font-size="11.5">☑ 1. WITSML v2.1 / PRODML 实时流：井场泥浆脉冲与 DAS 光纤直推 Eventhouse (12:1 压缩，$0/GB 写入税)</text>
  <text x="770" y="730" fill="#E2E8F0" font-size="11.5">☑ 2. ADME (OSDU) 零拷贝挂载：通过 OneLake Shortcut 零拷贝读取井筒轨迹、LAS 测井曲线与地震断层网格</text>
  <text x="770" y="754" fill="#E2E8F0" font-size="11.5">☑ 3. Cosmos SSD DiskANN 测井向量库：3,200 万段邻井 50m 窗口多变量曲线建索引，P99 检索 &lt; 15ms</text>
  <text x="770" y="778" fill="#E2E8F0" font-size="11.5">☑ 4. 海上平台 ALDO 断网自治：部署 SQL Server on Azure Local 保障 VSAT 卫星中断期间本地节流回压</text>
  <text x="770" y="802" fill="#E2E8F0" font-size="11.5">☑ 5. API RP 53 / OGMP 2.0 / EPA Class VI 护栏 (SOP-045)：套管鞋留足 0.25 ppg 裕度，CCUS 压力 &lt; 90% 破裂极限</text>
  <text x="770" y="830" fill="#6EE7B7" font-size="11" font-weight="700">🔗 关联代码与密封证据：src/data_lab/benchmark_suite.py · tests/test_data_lab.py (94/94) · reports/report.json</text>
