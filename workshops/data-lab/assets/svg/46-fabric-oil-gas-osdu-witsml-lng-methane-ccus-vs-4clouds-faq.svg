  <text x="141" y="61" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">DATA LAB · ROUND 38 FAQ</text>
  <text x="250" y="62" fill="#F8FAFC" font-size="19" font-weight="800">能源油气 OSDU 随钻 WITSML、LNG 管网光纤测漏与 CCUS 碳封存湖仓选型：Fabric vs 四大云</text>
