  <text x="68" y="751" fill="#94A3B8" font-size="11.5">内部全量: $109,200/月 · 500人归一化: $50,400/月 (按 Tag 与流量双重计费 + 跨库复制 + BI 席位费)</text>

  <rect x="52" y="774" width="644" height="74" rx="10" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="68" y="798" fill="#7DD3FC" font-size="12.5" font-weight="800">💡 $12.40M 风险敞口保护拆解 (Scenario AS 定量收益)：</text>
  <text x="68" y="818" fill="#E2E8F0" font-size="11.5">• 避免 DW-Perdido-09 深水井涌停钻 6 天与卡钻侧钻：$5.80M · 保住 17 万方欧洲 LNG 船货免遭甲烷超标拒收：$3.90M</text>
