  <!-- Left Column: First-Principles Pain Points -->
  <rect x="32" y="132" width="436" height="360" rx="14" fill="#111C33" stroke="#F43F5E" stroke-width="1.4"/>
  <text x="52" y="162" fill="#FDA4AF" font-size="15" font-weight="800">01 · 传统油气与低碳三大痛点 ($109.2K/月 · 45min 延迟)</text>

  <rect x="48" y="178" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 深水随钻 WITSML 与 OSDU 地震/LAS 孤岛盲钻</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 盐下高压层井涌 (+14.5 bbl 溢流) 需 20–45min 人工查邻井曲线</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 泥浆过重压漏套管鞋、过轻引发井涌，深水停钻日损 $850,000</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ OSDU 科学沙盒与井控 Historian、SAP JVA 财务完全割裂</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="302" fill="#FB7185" font-size="13" font-weight="700">② 28,000km 管网 DAS 声学光纤 600K EPS 按测点/GB 税</text>
  <text x="62" y="322" fill="#E2E8F0" font-size="11.5">• 传统 Historian 按 Tag 计费 + 云流按 GB 计费月烧 $65,000+</text>
  <text x="62" y="340" fill="#E2E8F0" font-size="11.5">• 法兰针孔甲烷泄漏 (0.42 kg/hr) 漏检导致欧洲 LNG 买方拒收</text>
  <text x="62" y="358" fill="#FCA5A5" font-size="11" font-weight="700">✗ 无法自动生成 UN OGMP 2.0 Level 5 实测甲烷强度证书</text>

  <rect x="48" y="382" width="404" height="94" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="404" fill="#FB7185" font-size="13" font-weight="700">③ CCUS 超临界 CO2 封存盖层微震与 45Q 抵免失效</text>
  <text x="62" y="424" fill="#E2E8F0" font-size="11.5">• 注入压力逼近页岩盖层破裂梯度 90% 缺乏毫秒级闭环降压</text>
  <text x="62" y="442" fill="#E2E8F0" font-size="11.5">• 一旦断层活化泄漏将丧失 $85/吨 IRC 45Q 税收抵免与 ETS 配额</text>
  <text x="62" y="460" fill="#FCA5A5" font-size="11" font-weight="700">✗ 季度手工 Excel 汇总无法满足 EPA Class VI 实时监管</text>

  <!-- Center Column: Fabric 43ms Closed-Loop Architecture -->
  <rect x="486" y="132" width="484" height="360" rx="14" fill="#0F2238" stroke="#10B981" stroke-width="1.8"/>
  <text x="506" y="162" fill="#6EE7B7" font-size="15" font-weight="800">02 · Microsoft Fabric + ADME (OSDU) 43ms 闭环架构</text>

  <rect x="504" y="178" width="448" height="68" rx="9" fill="#0B192C" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="518" y="199" fill="#38BDF8" font-size="12.5" font-weight="800">Step 1 (10ms) · Eventhouse KQL 600K EPS 井涌与 DAS 声学感知</text>
  <text x="518" y="218" fill="#E2E8F0" font-size="11.2">• $0/GB 写入税 (12:1 压缩) 捕获 DW-Perdido-09 4,890m +14.5 bbl 溢流 (+680 psi)</text>
  <text x="518" y="235" fill="#93C5FD" font-size="11">• 18kHz DAS 光纤锁定 CS-Permian-14 下游 142.8km 处 0.42 kg/hr 甲烷针孔泄漏</text>

  <rect x="504" y="254" width="448" height="72" rx="9" fill="#0B192C" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="518" y="275" fill="#C4B5FD" font-size="12.5" font-weight="800">Step 2 (11ms) · ADME (OSDU) 零拷贝 + SSD DiskANN 3,200万测井匹配</text>
  <text x="518" y="294" fill="#E2E8F0" font-size="11.2">• 512维随钻 GR/电阻率/声波向量匹配邻井 DW-Perdido-04 (0.98 相似，省 92% 内存)</text>
  <text x="518" y="312" fill="#DDD6FE" font-size="11">• 算出精准压井泥浆密度 +0.4 ppg (13.2→13.6 ppg) + 隔离 BV-14B + CCUS 降压 -12 bar</text>

  <rect x="504" y="334" width="448" height="68" rx="9" fill="#0B192C" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="518" y="355" fill="#FDE68A" font-size="12.5" font-weight="800">Step 3 (11ms) · Foundry IQ API RP 53 / OGMP 2.0 / Class VI 护栏</text>
  <text x="518" y="374" fill="#E2E8F0" font-size="11.2">• 核验 SOP-045：ECD 13.85 ppg 低于套管鞋破裂梯度 14.10 ppg (留足 0.25 ppg 裕度)</text>
  <text x="518" y="391" fill="#FDE68A" font-size="11">• CCUS-Sleipner-04 井底压力降至盖层破裂极限 81.5% (&lt; 90.0% 法定红线)</text>

  <rect x="504" y="410" width="448" height="68" rx="9" fill="#064E3B" stroke="#10B981" stroke-width="1.4"/>
  <text x="518" y="431" fill="#6EE7B7" font-size="12.5" font-weight="800">Step 4 (11ms) · ALDO 海上平台节流回压 + 管网关阀 + SAP JVA 锁库</text>
