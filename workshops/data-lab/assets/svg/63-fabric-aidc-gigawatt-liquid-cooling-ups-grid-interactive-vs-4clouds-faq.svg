  <rect width="1440" height="900" fill="url(#bgGrad63)"/>

  <!-- Header Banner -->
  <rect x="32" y="24" width="1376" height="92" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="48" y="42" width="186" height="28" rx="6" fill="url(#hdrGrad63)"/>
  <text x="141" y="61" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">DATA LAB · ROUND 55 FAQ</text>
  <text x="250" y="62" fill="#F8FAFC" font-size="18.2" font-weight="800">吉瓦级 AI 智算中心 (1.2GW AIDC 10万卡液冷 940K EPS 功率方波平抑与防干涸) 选型：Fabric vs 四大云</text>
  <text x="48" y="94" fill="#94A3B8" font-size="12.5">10 万张液冷 GPU + 2,400 台 CDU + 8.8 万 BBU · Eventhouse (12ms) + SSD DiskANN 8,800万 CFD/BBU匹配 (13ms) + 电算热孪生 + ALDO 边缘 · 49ms 闭环省 88.3% TCO</text>
  <rect x="1204" y="38" width="186" height="64" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1297" y="62" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario BJ · 263/264 (99.62%)</text>
  <text x="1297" y="86" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">49ms · 省 88.3% TCO</text>

  <!-- Left Column: First-Principles Pain Points -->
  <rect x="32" y="132" width="436" height="360" rx="14" fill="#111C33" stroke="#F43F5E" stroke-width="1.4"/>
  <text x="52" y="162" fill="#FDA4AF" font-size="15" font-weight="800">01 · 传统吉瓦级 AIDC 液冷与供配电三大痛点 ($191.5K/月)</text>

  <rect x="48" y="178" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 万卡同步 AllReduce 引发 +340MW 功率方波震跳电网</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 3.2 万张 GPU 在矩阵计算与通信间毫秒切换，爬坡率达 162MW/s</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 传统 30s SNMP 轮询 DCIM 完全看不见亚秒级功率冲击波</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 500kV 变电站振荡甩负荷与万卡训练崩溃单次损失 $8.80M</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="302" fill="#FB7185" font-size="13" font-weight="700">② 140kW 机柜冷板“微通道沸腾干涸” 800ms 热失控掉卡</text>
  <text x="62" y="322" fill="#E2E8F0" font-size="11.5">• 分液歧管微泡淤积致压差升 +28kPa，GPU 结温瞬间冲向 105°C</text>
  <text x="62" y="340" fill="#E2E8F0" font-size="11.5">• 缺乏 8,800万条机柜 CFD 热阻与 BBU 脉冲放电向量毫秒联动</text>
  <text x="62" y="358" fill="#FCA5A5" font-size="11" font-weight="700">✗ 940K EPS IT/OT 遥测与全内存向量节点月烧 $144.4K</text>

  <rect x="48" y="382" width="404" height="94" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="404" fill="#FB7185" font-size="13" font-weight="700">③ ASHRAE 露点结露烧毁 NVLink 与机电室断网失控风险</text>
  <text x="62" y="424" fill="#E2E8F0" font-size="11.5">• 若盲目下调 CDU 水温低于机房露点 +2.0°C 将结露滴水短路烧板</text>
  <text x="62" y="442" fill="#E2E8F0" font-size="11.5">• 外网中断时纯云端控制面无法协调 BBU、冷机与柴油发电机黑启动</text>
  <text x="62" y="460" fill="#FCA5A5" font-size="11" font-weight="700">✗ 硬件烧卡报废与并网谐波合规风险敞口高达 $9.55M</text>

  <!-- Center Column: Fabric 49ms Closed-Loop Architecture -->
  <rect x="486" y="132" width="484" height="360" rx="14" fill="#0F2238" stroke="#10B981" stroke-width="1.8"/>
  <text x="506" y="162" fill="#6EE7B7" font-size="15" font-weight="800">02 · Microsoft Fabric 电算热一体 49ms 自愈闭环</text>

  <rect x="504" y="178" width="448" height="68" rx="9" fill="#0B192C" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="518" y="199" fill="#38BDF8" font-size="12.5" font-weight="800">Step 1 (12ms) · Eventhouse KQL 940K EPS 功率阶跃与压差感知</text>
  <text x="518" y="218" fill="#E2E8F0" font-size="11.2">• $0/GB 写入税执行 series_fit_line() 锁定 +340MW (162MW/s) 功率阶跃</text>
  <text x="518" y="235" fill="#93C5FD" font-size="11">• 同步捕获 Hall-C 18 台 140kW 机柜压差 +28kPa 与结温 94.2°C 异动</text>

  <rect x="504" y="254" width="448" height="72" rx="9" fill="#0B192C" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="518" y="275" fill="#C4B5FD" font-size="12.5" font-weight="800">Step 2 (13ms) · SSD DiskANN 8,800万 CFD/BBU匹配与错峰</text>
  <text x="518" y="294" fill="#E2E8F0" font-size="11.2">• 检索 8,800万向量 (0.99 相似，省92%内存)：BBU/超容瞬放 280MW 脉冲</text>
  <text x="518" y="312" fill="#DDD6FE" font-size="11">• CDU 变频泵提速 +18% 排泡降温 + 注入 +120μs AllReduce 相位抖动</text>

  <rect x="504" y="334" width="448" height="68" rx="9" fill="#0B192C" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="518" y="355" fill="#FDE68A" font-size="12.5" font-weight="800">Step 3 (12ms) · Foundry IQ ASHRAE 防凝露与 IEEE 1547 护栏</text>
  <text x="518" y="374" fill="#E2E8F0" font-size="11.2">• 核验 SOP-062：供液温度 24.5°C &gt; 露点 18.2°C + 2.0°C (20.2°C 底线)</text>
  <text x="518" y="391" fill="#FDE68A" font-size="11">• 确认 GPU 结温回落至 74.6°C &lt; 85.0°C 且并网谐波 THD = 1.8% &lt; 3.0%</text>

  <rect x="504" y="410" width="448" height="68" rx="9" fill="#064E3B" stroke="#10B981" stroke-width="1.4"/>
  <text x="518" y="431" fill="#6EE7B7" font-size="12.5" font-weight="800">Step 4 (12ms) · ALDO 机电边缘 BBU 削峰、CDU 提速与错峰下发</text>
  <text x="518" y="450" fill="#F8FAFC" font-size="11.2">• AIDC 总工 Teams 联签 Confirm → ALDO 下发 BBU/CDU/Slurm 协同指令</text>
  <text x="518" y="467" fill="#A7F3D0" font-size="11" font-weight="700">✓ 端到端 49ms 自愈 · 守护 $18.35M 并网稳定、万卡训练与防凝露安全 SLA</text>

  <!-- Right Column: Better Together & Decision Matrix -->
  <rect x="988" y="132" width="420" height="360" rx="14" fill="#111C33" stroke="#38BDF8" stroke-width="1.4"/>
  <text x="1008" y="162" fill="#7DD3FC" font-size="15" font-weight="800">03 · 五云分工边界与 Better Together 共存</text>

  <rect x="1004" y="178" width="388" height="94" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="1018" y="200" fill="#34D399" font-size="12.5" font-weight="800">🏆 首选 Microsoft Fabric (Eventhouse + DiskANN + ALDO)</text>
  <text x="1018" y="220" fill="#E2E8F0" font-size="11.2">• 940K EPS 10万卡 OpenBMC、CDU 与 BBU 流 ($0/GB 写入税)</text>
  <text x="1018" y="238" fill="#E2E8F0" font-size="11.2">• 8,800万 CFD/BBU SSD DiskANN + 作业-GPU-冷板-变流器孪生</text>
  <text x="1018" y="256" fill="#6EE7B7" font-size="11" font-weight="700">• ALDO 机电室断网自治 + 1,500 人 $0 DirectLake 看数</text>

  <rect x="1004" y="282" width="388" height="94" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="1018" y="304" fill="#60A5FA" font-size="12.5" font-weight="800">🤝 Better Together：CycleCloud HPC + Databricks</text>
  <text x="1018" y="324" fill="#E2E8F0" font-size="11.2">• 三维机房热流场与冷却塔微气候 (OpenFOAM CFD) → CycleCloud</text>
  <text x="1018" y="342" fill="#E2E8F0" font-size="11.2">• 历史万卡 NCCL 通信慢节点离线归因 → Databricks Spark</text>
  <text x="1018" y="360" fill="#93C5FD" font-size="11" font-weight="700">• 机柜热阻矩阵与慢节点特征通过 OneLake Shortcut 零拷贝回挂</text>

  <rect x="1004" y="386" width="388" height="90" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1018" y="408" fill="#FBBF24" font-size="12.5" font-weight="800">⚠️ 竞对局限与避坑指南 (Anti-Patterns)</text>
  <text x="1018" y="428" fill="#E2E8F0" font-size="11.2">• 严禁下发低于机房露点 +2.0°C 的供液温度引发结露烧卡</text>
  <text x="1018" y="446" fill="#E2E8F0" font-size="11.2">• 严禁靠 30s SNMP 轮询或 60s 动态表应对 40ms 功率阶跃</text>
  <text x="1018" y="464" fill="#FDE68A" font-size="11" font-weight="700">• 严禁将 10 万卡与 8.8 万 BBU 高频流写入按属性计费的 SiteWise</text>

  <!-- Bottom Row Left: Quantitative TCO Comparison -->
  <rect x="32" y="510" width="684" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="52" y="540" fill="#38BDF8" font-size="15" font-weight="800">04 · 定量 TCO 对比 (1.2 GW AIDC 10万卡液冷集群 · 940K EPS · 1,500 用户)</text>

  <rect x="52" y="558" width="644" height="68" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="68" y="582" fill="#6EE7B7" font-size="13.5" font-weight="800">🏆 Microsoft Fabric (F64 + Eventhouse + SSD DiskANN + Twin + ALDO)</text>
  <text x="68" y="606" fill="#E2E8F0" font-size="12">内部全量: $22,400/月 · 500人归一化: $9,600/月 ($0/GB 写入税 + SSD DiskANN 省92%内存 + $0 Viewer)</text>
  <rect x="520" y="570" width="160" height="42" rx="8" fill="#022C22"/>
  <text x="600" y="596" fill="#34D399" font-size="15" font-weight="800" text-anchor="middle">省 88.3% TCO</text>

  <rect x="52" y="638" width="644" height="58" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="68" y="662" fill="#F8FAFC" font-size="13" font-weight="700">Databricks + 第三方 DCIM 时序库 + 内存 Vector Search</text>
  <text x="68" y="683" fill="#94A3B8" font-size="11.5">内部全量: $152,800/月 · 500人归一化: $65,500/月 (常驻 Streaming DBU + 内存向量节点 + BI 消耗)</text>

  <rect x="52" y="706" width="644" height="58" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="68" y="730" fill="#F8FAFC" font-size="13" font-weight="700">AWS 拼接栈 (IoT SiteWise + Timestream + OpenSearch + QuickSight)</text>
  <text x="68" y="751" fill="#94A3B8" font-size="11.5">内部全量: $191,500/月 · 500人归一化: $82,100/月 (按属性计费 + 内存向量 + 1,500人BI席位)</text>

  <rect x="52" y="774" width="644" height="74" rx="10" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="68" y="798" fill="#7DD3FC" font-size="12.5" font-weight="800">💡 $18.35M 风险敞口保护拆解 (Scenario BJ 定量收益)：</text>
  <text x="68" y="818" fill="#E2E8F0" font-size="11.5">• 280MW BBU 削峰防 500kV 甩负荷与训练崩溃：$8.80M · 18柜排泡与调频收益：$5.65M</text>
  <text x="68" y="836" fill="#6EE7B7" font-size="11.5" font-weight="700">• 100% 满足 ASHRAE 防凝露 (供液&gt;露点+2°C) 与 IEEE 1547 (THD&lt;3%)：$3.90M</text>

  <!-- Bottom Row Right: Dual-Denominator & Production Checklist -->
  <rect x="734" y="510" width="674" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="754" y="540" fill="#FBBF24" font-size="15" font-weight="800">05 · 双分母基准对账 (R55) 与生产落地核验清单 (Architect Checklist)</text>

  <rect x="754" y="556" width="634" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="770" y="578" fill="#34D399" font-size="12.5" font-weight="800">📊 严格区分两大延迟分母 (Dual-Denominator Reconciliation · 2026-11-14 R55)</text>
  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=264 (DL-01..264) 均值 = 275.5 ms (263/264 = 99.62%)</text>
  <text x="770" y="618" fill="#F8FAFC" font-size="11.5">• 分母 B (行业本体端到端仿真均值 ontology_simulations[])：n=62 (场景 A..BJ，范围 5–780ms) 均值 = 232.0 ms</text>
  <text x="770" y="636" fill="#93C5FD" font-size="11">• 本轮新增 Scenario BJ 端到端延迟 = 49 ms (12ms 感知 + 13ms DiskANN/孪生 + 12ms ASHRAE 护栏 + 12ms 回写) · 128/128 单测通过</text>

  <rect x="754" y="658" width="634" height="190" rx="10" fill="#0B192C" stroke="#334155" stroke-width="1"/>
  <text x="770" y="682" fill="#7DD3FC" font-size="13" font-weight="800">🛠️ 售前打单与生产落地 5 步核验清单 (Production Checklist)：</text>
  <text x="770" y="706" fill="#E2E8F0" font-size="11.5">☑ 1. OpenBMC 与 CDU/BBU 流直通：940K EPS 遥测直推 Eventhouse ($0/GB 写入税)</text>
  <text x="770" y="730" fill="#E2E8F0" font-size="11.5">☑ 2. Cosmos SSD DiskANN 8,800万 CFD/BBU库：热阻矩阵与脉冲特征建索引 (&lt; 13ms)</text>
  <text x="770" y="754" fill="#E2E8F0" font-size="11.5">☑ 3. 作业-GPU-冷板-CDU-变流器孪生：在 Digital Twin Builder 打通电算热拓扑</text>
  <text x="770" y="778" fill="#E2E8F0" font-size="11.5">☑ 4. 机电控制室 ALDO 断网自治：部署 SQL Server on Azure Local 保障微网闭环</text>
  <text x="770" y="802" fill="#E2E8F0" font-size="11.5">☑ 5. 防凝露与并网护栏 (SOP-062)：供液 &gt; 露点+2°C，Tj &lt; 85°C，THD &lt; 3.0%</text>
  <text x="770" y="830" fill="#6EE7B7" font-size="11" font-weight="700">🔗 关联代码与密封证据：src/data_lab/benchmark_suite.py · tests/test_data_lab.py (128/128) · reports/report.json</text>
</svg>
