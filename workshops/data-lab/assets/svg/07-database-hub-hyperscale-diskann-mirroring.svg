  <text x="80" y="222" fill="#F8FAFC" font-size="11">• 最大 192 vCore 计算弹性 + 高密度池 (50 DBs/Pool) + 自动暂停</text>
  <text x="80" y="238" fill="#CBD5E1" font-size="11">• SSD 原生 DiskANN 向量索引：较 HNSW 内存降 10× · 19ms P99</text>
  <text x="80" y="252" fill="#34D399" font-size="10.5" font-weight="700">• 单条 T-SQL 融合事务 ACID + VECTOR_SEARCH() + 行级 RLS</text>

