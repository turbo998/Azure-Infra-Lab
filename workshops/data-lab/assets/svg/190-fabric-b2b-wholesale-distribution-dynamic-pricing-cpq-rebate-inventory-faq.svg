  <text x="56" y="457" fill="#CBD5E1" font-size="12.5">• Validates B2B-DISTRIBUTION-DYNAMIC-CPQ-REBATE-SOP-189: blocks rep quotes with net Pocket Margin &lt;11.5% after freight &amp; 90-day terms,</text>
  <text x="56" y="478" fill="#FBBF24" font-size="12.5" font-weight="600">• Interdicts 145 below-floor quotes (+$5.80M saved), verifies franchise territory rules, and enforces Cost CLS across 15,600 users in 4ms.</text>

