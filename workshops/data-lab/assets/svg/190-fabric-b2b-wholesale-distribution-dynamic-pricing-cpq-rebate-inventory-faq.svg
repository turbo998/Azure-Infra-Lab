  <text x="44" y="156" fill="#38BDF8" font-size="17" font-weight="800">🏗️ Microsoft Fabric Unified B2B Dynamic CPQ, 596M BOM Cross-Ref &amp; Ship-and-Debit Loop (16ms = 4²ms E2E)</text>
  <text x="44" y="177" fill="#94A3B8" font-size="12.5">OneLake Zero-Copy (SAP S/4HANA + Epicor + Salesforce/D365 CPQ) + Eventhouse KQL (995K EPS EDI 840/850/844) + 596M SSD DiskANN</text>

