  <text x="56" y="351" fill="#CBD5E1" font-size="12.5">• Searches 596,000,000 manufacturer datasheets, pin-to-pin substitutes &amp; quotes via SSD DiskANN ($3,240/mo vs $74,000/mo exact DRAM).</text>
  <text x="56" y="372" fill="#34D399" font-size="12.5" font-weight="600">• Quotes 2,000-line BOMs in 4ms (+22.5% win rate, +3.4pp Pocket Margin) and recovers $16.4M in supplier Ship-and-Debit SPA rebates.</text>

