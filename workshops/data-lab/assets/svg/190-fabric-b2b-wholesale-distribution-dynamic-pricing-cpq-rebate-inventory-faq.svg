  <text x="46" y="54" fill="#FFFFFF" font-size="20" font-weight="800">🏭 R182 · B2B Wholesale Distribution 1.5M-SKU Dynamic CPQ, BOM Cross-Ref &amp; SPA Rebates (190th SVG · 320 Scenarios · 224.0ms Exact!)</text>
  <text x="46" y="81" fill="#E0F2FE" font-size="13.5" font-weight="600">Scenario GG (DL-769..DL-772): 1.5M SKUs + 180 DCs · 995K EPS EDI 840/850/844 Stream + 596M Datasheet/Quote Vectors · 16ms (4²ms) E2E · 70th FAQ · $62.80M SLA!</text>
