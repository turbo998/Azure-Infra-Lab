  <rect x="56" y="204" width="92" height="26" rx="6" fill="#0284C7"/>
  <text x="102" y="222" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">STEP 1 · 4ms</text>
  <text x="162" y="221" fill="#F8FAFC" font-size="14.5" font-weight="700">Eventhouse KQL + OneLake Zero-Copy: 4ms Pocket-Margin Waterfall &amp; Backorder Sense ($0/GB Tax!)</text>
  <text x="56" y="245" fill="#CBD5E1" font-size="12.5">• Ingests 995,000 EPS EDI 840 RFQs, 850 POs, 844 Ship-and-Debit claims &amp; 180-DC ATP inventory across 1.5M active SKUs.</text>
  <text x="56" y="266" fill="#38BDF8" font-size="12.5" font-weight="600">• Eliminates $139,500/mo in Pricing SaaS &amp; copy taxes; flags 300 backordered BOM lines &amp; computes 5-tier Pocket Margin in 4ms.</text>

  <!-- Step 2 -->
  <rect x="44" y="298" width="890" height="94" rx="10" fill="#0B192C" stroke="#10B981" stroke-width="1.4"/>
