  <text x="60" y="168" fill="#F87171" font-size="14.5" font-weight="800">01 · 100h 铁-空气可逆生锈储能三大危机与死穴</text>

  <rect x="58" y="184" width="394" height="126" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="206" fill="#FCA5A5" font-size="12.5" font-weight="800">① #88 模组第 72h 充电寄生析氢副反应 (HER 14.8%)</text>
  <text x="72" y="226" fill="#F8FAFC" font-size="11.5">• 铁还原电位 (-0.877V) 比析氢电位 (-0.828V) 负 49mV，天然易冒氢</text>
  <text x="72" y="246" fill="#CBD5E1" font-size="11">• 高 SoC 孔内浓差极化与 Bi2S3 耗竭致电位滑向 -1.18V vs Hg/HgO</text>
  <text x="72" y="266" fill="#CBD5E1" font-size="11">• 寄生 HER 法拉第损耗飙至 14.8% (&gt;2.5% 红线)，顶空 H2 逼近 LEL</text>
  <text x="72" y="286" fill="#F87171" font-size="11" font-weight="700">• 痛点：每日人工滴定滞后 24h，触发氢气联锁停机丧失保供容量！</text>

  <rect x="58" y="322" width="394" height="132" rx="10" fill="#1F1224" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="344" fill="#FCA5A5" font-size="12.5" font-weight="800">② PTFE 气体扩散空气电极三相界面 (TPB) 渗液淹水</text>
  <text x="72" y="364" fill="#F8FAFC" font-size="11.5">• 长期充放电中碳酸盐微晶与表面张力下降劣化 PTFE 疏水接触角</text>
  <text x="72" y="384" fill="#CBD5E1" font-size="11">• KOH 碱性电解液突破毛细势垒向气侧渗漏 (Electrolyte Weeping)</text>
  <text x="72" y="404" fill="#CBD5E1" font-size="11">• 氧气扩散纳米通道被液体淹死，电池极化内阻暴增 8 倍</text>
  <text x="72" y="424" fill="#F87171" font-size="11" font-weight="700">• 痛点：缺乏 Young-Laplace 毛细背压动态闭环，电极寿命腰斩！</text>

  <rect x="58" y="466" width="394" height="126" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="72" y="488" fill="#FBBF24" font-size="12.5" font-weight="800">③ 四云拼装栈的三重税负 ($273.1K/月 vs $14.4K/月)</text>
  <text x="72" y="508" fill="#E2E8F0" font-size="11.5">• 写入税：990K EPS 3,600台 EIS/电位/H2/压差流月费 $198.1K</text>
