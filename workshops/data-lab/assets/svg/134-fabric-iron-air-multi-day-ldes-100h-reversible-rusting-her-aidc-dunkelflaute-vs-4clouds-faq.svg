  <text x="261" y="66" fill="#030712" font-size="10.8" font-weight="900" text-anchor="middle" letter-spacing="0.4">🏆 R126 · 270 TESTS · 131.0ms ONTOLOGY MEAN · &gt;$43M SLA!</text>
  <text x="478" y="66" fill="#F8FAFC" font-size="15.5" font-weight="800">100 小时铁-空气长时储能 (LDES) 可逆除锈抑寄生析氢 (HER)、空气电极防淹水与极夜保供 65ms 闭环</text>
