  <rect width="1440" height="900" fill="url(#bgGrad50)"/>

  <!-- Header Banner -->
  <rect x="32" y="24" width="1376" height="92" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="48" y="42" width="186" height="28" rx="6" fill="url(#hdrGrad50)"/>
  <text x="141" y="61" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">DATA LAB · ROUND 42 FAQ</text>
  <text x="250" y="62" fill="#F8FAFC" font-size="18.5" font-weight="800">高速铁路与城轨 (18,000 组列车 780K EPS 轴箱/弓网)、移动闭塞与钢轨探伤选型：Fabric vs 四大云</text>
  <text x="48" y="94" fill="#94A3B8" font-size="12.5">18,000 组动车组 + 45,000km 线路 · Eventhouse KQL FFT 780K EPS (11ms) + SSD DiskANN 5,800万伤损匹配 (11ms) + ALDO 轨旁/动车段边缘 · 44ms 闭环省 85.7% TCO</text>
  <rect x="1204" y="38" width="186" height="64" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1297" y="62" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Scenario AW · 211/212 (99.53%)</text>
  <text x="1297" y="86" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">44ms · 省 85.7% TCO</text>

  <!-- Left Column: First-Principles Pain Points -->
  <rect x="32" y="132" width="436" height="360" rx="14" fill="#111C33" stroke="#F43F5E" stroke-width="1.4"/>
  <text x="52" y="162" fill="#FDA4AF" font-size="15" font-weight="800">01 · 传统铁路四电孤岛三大痛点 ($126.1K/月 · 事后报警)</text>

  <rect x="48" y="178" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 轨旁红外热轴 (THDS) 滞后 72h 与 780K EPS 按测点税</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 轴承外圈微剥离先发 1,420Hz 包络谐波，72h 后才发热超 90°C</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 等红外热轴报警时已被迫正线紧急停车清客，按 Tag 计费月烧 $76K+</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 缺乏车地实时 FFT 频谱解调，无法带病降速安全驶回动车段</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="302" fill="#FB7185" font-size="13" font-weight="700">② 25kV 接触网硬点燃弧塌网与 48h 超声探伤人工回放</text>
  <text x="62" y="322" fill="#E2E8F0" font-size="11.5">• 车辆弓网告警与供电接触网支柱台账割裂，漏检 K642+810 硬点</text>
  <text x="62" y="340" fill="#E2E8F0" font-size="11.5">• 185ms 高能紫外电弧反复冲击极易熔断银铜接触线导致断电塌网</text>
  <text x="62" y="358" fill="#FCA5A5" font-size="11" font-weight="700">✗ 探伤车 PB 级超声波 B 显图像靠人工回放需 48h，错过天窗期</text>

  <rect x="48" y="382" width="404" height="94" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
  <text x="62" y="404" fill="#FB7185" font-size="13" font-weight="700">③ 3 分钟移动闭塞多米诺急刹与电分相无电区趴窝风险</text>
  <text x="62" y="424" fill="#E2E8F0" font-size="11.5">• 前车临时降速若不协同后方 14 列追踪列车将触发连环紧急制动</text>
  <text x="62" y="442" fill="#E2E8F0" font-size="11.5">• 若错误在电分相无电区 (Neutral Section) 降速低于 160km/h 即趴窝</text>
  <text x="62" y="460" fill="#FCA5A5" font-size="11" font-weight="700">✗ 缺乏符合 EN 50126 SIL-4 安全包络的全线运行图实时级联推演</text>

  <!-- Center Column: Fabric 44ms Closed-Loop Architecture -->
  <rect x="486" y="132" width="484" height="360" rx="14" fill="#0F2238" stroke="#10B981" stroke-width="1.8"/>
  <text x="506" y="162" fill="#6EE7B7" font-size="15" font-weight="800">02 · Microsoft Fabric 四电合一数字孪生 44ms 闭环架构</text>

  <rect x="504" y="178" width="448" height="68" rx="9" fill="#0B192C" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="518" y="199" fill="#38BDF8" font-size="12.5" font-weight="800">Step 1 (11ms) · Eventhouse KQL 780K EPS 轴承 FFT 与紫外燃弧感知</text>
  <text x="518" y="218" fill="#E2E8F0" font-size="11.2">• $0/GB 写入税运行 series_fft() 提取 G804 3车2位 1,420Hz 谐波 (+19.2dB)</text>
  <text x="518" y="235" fill="#93C5FD" font-size="11">• 轴温仅 48°C 提前 72h 预警，并结合应答器锁定 K642+810 支柱 185ms 燃弧</text>

  <rect x="504" y="254" width="448" height="72" rx="9" fill="#0B192C" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="518" y="275" fill="#C4B5FD" font-size="12.5" font-weight="800">Step 2 (11ms) · SSD DiskANN 5,800万伤损匹配与 14 列车绿波调图</text>
  <text x="518" y="294" fill="#E2E8F0" font-size="11.2">• 5,800万声纹/超声 B 显检索 (0.99 相似，省92%内存)，确认 0.6mm 剥离余寿 1,800km</text>
  <text x="518" y="312" fill="#DDD6FE" font-size="11">• 推演 K640-K645 限速 200km/h + 后方 14 列车微降速 -12km/h 消除急刹波</text>

  <rect x="504" y="334" width="448" height="68" rx="9" fill="#0B192C" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="518" y="355" fill="#FDE68A" font-size="12.5" font-weight="800">Step 3 (11ms) · Foundry IQ EN 50126 SIL-4 与防停分相区护栏</text>
  <text x="518" y="374" fill="#E2E8F0" font-size="11.2">• 核验 SOP-049：确认通过 K643+200 电分相无电区速度 200 &gt;= 160km/h 红线</text>
  <text x="518" y="391" fill="#FDE68A" font-size="11">• K642+810 接触网硬点检修工单强制锁死在 00:30–04:00 停电接地天窗期</text>

  <rect x="504" y="410" width="448" height="68" rx="9" fill="#064E3B" stroke="#10B981" stroke-width="1.4"/>
  <text x="518" y="431" fill="#6EE7B7" font-size="12.5" font-weight="800">Step 4 (11ms) · ALDO 轨旁 CTC/RBC 限速下发与虹桥动车段派单</text>
  <text x="518" y="450" fill="#F8FAFC" font-size="11.2">• 总调度长 OCC Teams 联签 Confirm → ALDO 下发限速并预约动车段 3 号库换轮</text>
  <text x="518" y="467" fill="#A7F3D0" font-size="11" font-weight="700">✓ 端到端 44ms 自愈 (0 列正线清客) · 守护 $13.80M 防切轴、防塌网与准点 SLA</text>

  <!-- Right Column: Better Together & Decision Matrix -->
  <rect x="988" y="132" width="420" height="360" rx="14" fill="#111C33" stroke="#38BDF8" stroke-width="1.4"/>
  <text x="1008" y="162" fill="#7DD3FC" font-size="15" font-weight="800">03 · 五云分工边界与 Better Together 共存</text>

  <rect x="1004" y="178" width="388" height="94" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="1018" y="200" fill="#34D399" font-size="12.5" font-weight="800">🏆 首选 Microsoft Fabric (Eventhouse FFT + DiskANN)</text>
  <text x="1018" y="220" fill="#E2E8F0" font-size="11.2">• 780K EPS 轴箱振动 series_fft() + 弓网 6C ($0/GB 写入税)</text>
  <text x="1018" y="238" fill="#E2E8F0" font-size="11.2">• 5,800万声纹/超声 B 显 SSD DiskANN 检索 + 四电 K+m 对齐</text>
  <text x="1018" y="256" fill="#6EE7B7" font-size="11" font-weight="700">• ALDO 动车段/轨旁专网自治 + 1,900 人 $0 DirectLake 看数</text>

  <rect x="1004" y="282" width="388" height="94" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="1018" y="304" fill="#60A5FA" font-size="12.5" font-weight="800">🤝 Better Together：CycleCloud HPC + DBX GPU</text>
  <text x="1018" y="324" fill="#E2E8F0" font-size="11.2">• 350km/h 车头气动噪声与隧道音爆 CFD → CycleCloud / AWS Batch</text>
  <text x="1018" y="342" fill="#E2E8F0" font-size="11.2">• 4K 高速轨面巡检视频扣件缺失 CV 训练 → Databricks GPU</text>
  <text x="1018" y="360" fill="#93C5FD" font-size="11" font-weight="700">• 气动网格结果与 ONNX 视觉模型通过 OneLake 零拷贝回挂</text>

  <rect x="1004" y="386" width="388" height="90" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1018" y="408" fill="#FBBF24" font-size="12.5" font-weight="800">⚠️ 竞对局限与避坑指南 (Anti-Patterns)</text>
  <text x="1018" y="428" fill="#E2E8F0" font-size="11.2">• 严禁只靠事后升温的红外热轴 (THDS) 应对高速轴承疲劳剥离</text>
  <text x="1018" y="446" fill="#E2E8F0" font-size="11.2">• 严禁在未核验电分相无电区位置前向列车下发低速限速指令</text>
  <text x="1018" y="464" fill="#FDE68A" font-size="11" font-weight="700">• 严禁绕过轨旁 SIL-4 无线闭塞中心 (RBC) 直接向车载 ATP 写指令</text>

  <!-- Bottom Row Left: Quantitative TCO Comparison -->
  <rect x="32" y="510" width="684" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="52" y="540" fill="#38BDF8" font-size="15" font-weight="800">04 · 定量 TCO 对比 (18,000 组列车 + 45,000km 线路 · 780K EPS · 1,900 用户)</text>

  <rect x="52" y="558" width="644" height="68" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="68" y="582" fill="#6EE7B7" font-size="13.5" font-weight="800">🏆 Microsoft Fabric (F64 + Eventhouse FFT + SSD DiskANN + Twin + ALDO)</text>
  <text x="68" y="606" fill="#E2E8F0" font-size="12">内部全量: $18,000/月 · 500人归一化: $8,200/月 ($0/GB 写入税 + SSD DiskANN 省92%内存 + $0 Viewer)</text>
  <rect x="520" y="570" width="160" height="42" rx="8" fill="#022C22"/>
  <text x="600" y="596" fill="#34D399" font-size="15" font-weight="800" text-anchor="middle">省 85.7% TCO</text>

  <rect x="52" y="638" width="644" height="58" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="68" y="662" fill="#F8FAFC" font-size="13" font-weight="700">Databricks + 第三方时序库 + 内存 Vector Search</text>
  <text x="68" y="683" fill="#94A3B8" font-size="11.5">内部全量: $102,000/月 · 500人归一化: $46,500/月 (常驻 Streaming DBU + 内存向量节点 + BI 消耗)</text>

  <rect x="52" y="706" width="644" height="58" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="68" y="730" fill="#F8FAFC" font-size="13" font-weight="700">AWS 拼接栈 (IoT SiteWise + Kinesis + OpenSearch + QuickSight)</text>
  <text x="68" y="751" fill="#94A3B8" font-size="11.5">内部全量: $126,100/月 · 500人归一化: $57,500/月 (按属性/分片计费 + 内存向量 + BI 席位)</text>

  <rect x="52" y="774" width="644" height="74" rx="10" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="68" y="798" fill="#7DD3FC" font-size="12.5" font-weight="800">💡 $13.80M 风险敞口保护拆解 (Scenario AW 定量收益)：</text>
  <text x="68" y="818" fill="#E2E8F0" font-size="11.5">• 提前 72h 拦截轴箱剥离避免正线清客与切轴：$6.90M · 消除 K642+810 硬点防 25kV 接触网塌网：$4.10M</text>
  <text x="68" y="836" fill="#6EE7B7" font-size="11.5" font-weight="700">• 后方 14 列动车组移动闭塞绿波带微降速 (-12km/h) 消除急刹波保准点：$2.80M</text>

  <!-- Bottom Row Right: Dual-Denominator & Production Checklist -->
  <rect x="734" y="510" width="674" height="358" rx="14" fill="#111C33" stroke="#1E293B" stroke-width="1.5"/>
  <text x="754" y="540" fill="#FBBF24" font-size="15" font-weight="800">05 · 双分母基准对账 (R42) 与生产落地核验清单 (Architect Checklist)</text>

  <rect x="754" y="556" width="634" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="770" y="578" fill="#34D399" font-size="12.5" font-weight="800">📊 严格区分两大延迟分母 (Dual-Denominator Reconciliation · 2026-11-13 R42)</text>
  <text x="770" y="598" fill="#F8FAFC" font-size="11.5">• 分母 A (路由评估矩阵均值 scenario_evaluation.avg_latency_ms)：n=212 (DL-01..212) 均值 = 336.0 ms (211/212 = 99.53%)</text>
  <text x="770" y="618" fill="#F8FAFC" font-size="11.5">• 分母 B (行业本体端到端仿真均值 ontology_simulations[])：n=49 (场景 A..AW，范围 5–780ms) 均值 = 284.0 ms</text>
  <text x="770" y="636" fill="#93C5FD" font-size="11">• 本轮新增 Scenario AW 端到端延迟 = 44 ms (11ms 感知 + 11ms DiskANN/调图 + 11ms SIL4/分相护栏 + 11ms 回写) · 102/102 单测通过</text>

  <rect x="754" y="658" width="634" height="190" rx="10" fill="#0B192C" stroke="#334155" stroke-width="1"/>
  <text x="770" y="682" fill="#7DD3FC" font-size="13" font-weight="800">🛠️ 售前打单与生产落地 5 步核验清单 (Production Checklist)：</text>
  <text x="770" y="706" fill="#E2E8F0" font-size="11.5">☑ 1. 车载 5G-R 与 6C 流直通：18,000 列车轴箱振动与弓网紫外流直推 Eventhouse (12:1 压缩，$0/GB 写入税)</text>
  <text x="770" y="730" fill="#E2E8F0" font-size="11.5">☑ 2. Eventhouse series_fft() 与 5,800万伤损库：提取 BPFO 谐波并检索 SSD DiskANN 超声 B 显库 (P99 &lt; 12ms)</text>
  <text x="770" y="754" fill="#E2E8F0" font-size="11.5">☑ 3. 四电里程桩号 (K+m) 本体与 SAP EAM：对齐应答器、接触网支柱与焊缝台账，自动回写动车段换轮工单</text>
  <text x="770" y="778" fill="#E2E8F0" font-size="11.5">☑ 4. 动车段与轨旁中继站 ALDO 断网自治：部署 SQL Server on Azure Local 保障铁路专网隔离期本地闭环</text>
  <text x="770" y="802" fill="#E2E8F0" font-size="11.5">☑ 5. EN 50126 SIL-4 与防停分相区护栏 (SOP-049)：过电分相速度 &gt;= 160km/h，接触网检修锁死 00:30 停电天窗</text>
  <text x="770" y="830" fill="#6EE7B7" font-size="11" font-weight="700">🔗 关联代码与密封证据：src/data_lab/benchmark_suite.py · tests/test_data_lab.py (102/102) · reports/report.json</text>
</svg>
