  <text x="1082" y="202" fill="#FB923C" font-size="12" font-weight="800">🤝 零拷贝共存 (Foundry/DBX GPU + FleetWise)</text>
  <text x="1082" y="220" fill="#E2E8F0" font-size="11">• 万卡 VLA 世界模型与 3DGS 训练 → GPU 集群</text>
  <text x="1082" y="236" fill="#E2E8F0" font-size="11">• 车端已装 FleetWise Agent → S3 Shortcut ($0)</text>
  <text x="1082" y="252" fill="#FDE68A" font-size="11" font-weight="700">• 外部 UBI 车险精算净室 → Iceberg XTable</text>

  <rect x="748" y="284" width="628" height="92" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
  <text x="764" y="304" fill="#93C5FD" font-size="12" font-weight="800">🛡️ Foundry IQ 联合国 UNECE R155/R156 与测绘隐私硬护栏 (AUTO-SDV-ADAS-CORNERCASE-UNECE-R155-SOP-044)</text>
  <text x="764" y="324" fill="#E2E8F0" font-size="11">1. UNECE R156 型式认证与刷写安全：校验 RXSWIN 法规版本号，且严禁在非 P 档或电池 SoC &lt; 30% 时激活 OTA</text>
  <text x="764" y="342" fill="#E2E8F0" font-size="11">2. UNECE R155 车载 VSOC 防注入：实时核验 OTA 补丁包硬件 HSM 签名与车载 CAN 总线网关消息认证码 (SecOC)</text>
  <text x="764" y="360" fill="#34D399" font-size="11" font-weight="700">3. 测绘与个人隐私合规：入湖 .mcap 视频 100% 完成车外人脸/车牌模糊化与敏感地理围栏脱敏</text>

