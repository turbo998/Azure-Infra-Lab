  <text x="920" y="804" fill="#E2E8F0" font-size="11">• 路由准确率：191 / 192 (99.48%) · 92 / 92 Python 单元测试 100% 通过</text>
  <text x="920" y="822" fill="#34D399" font-size="11" font-weight="700">• 双分母均值：n=192 矩阵均值 361.0ms | n=44 本体均值 313.0ms (Scenario AR = 12ms)</text>
