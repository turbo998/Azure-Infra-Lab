  <text x="762" y="202" fill="#34D399" font-size="12" font-weight="800">✅ 首选 Microsoft Fabric (省 84.3% TCO)</text>
  <text x="762" y="220" fill="#E2E8F0" font-size="11">• 950K EPS CAN-FD 遥测与影子模式触发流</text>
  <text x="762" y="236" fill="#E2E8F0" font-size="11">• 6,500 万多模态 Clip SSD DiskANN 长尾挖掘</text>
  <text x="762" y="252" fill="#6EE7B7" font-size="11" font-weight="700">• SAP 整车 BOM 质量溯源与 R155/R156 合规</text>

