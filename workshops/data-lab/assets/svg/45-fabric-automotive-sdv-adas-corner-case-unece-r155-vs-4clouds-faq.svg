  <text x="1086" y="492" fill="#F8FAFC" font-size="11">• 智驾 VP 与安全官 Teams 联签 Confirm</text>
  <text x="1086" y="510" fill="#F8FAFC" font-size="11">• 熔断 43.8 万辆车推送 + 下发 4.2 万辆热补丁</text>
  <text x="1086" y="528" fill="#F8FAFC" font-size="11">• OneLake 零拷贝启动 GPU 重训 + 1GB SQL</text>
  <text x="1086" y="548" fill="#6EE7B7" font-size="11" font-weight="800">✓ 12ms 闭环 · 守护 $12.05M 防召回与合规 SLA</text>

