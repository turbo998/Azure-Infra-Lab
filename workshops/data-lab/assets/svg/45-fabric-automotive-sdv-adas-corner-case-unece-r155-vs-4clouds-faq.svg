  <rect x="44" y="38" width="1352" height="86" rx="14" fill="#13223E" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="64" y="52" width="236" height="26" rx="13" fill="url(#accent45)"/>
  <text x="182" y="70" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">DATA LAB · ROUND 37 · AUTO SDV &amp; ADAS</text>
  <text x="316" y="70" fill="#F8FAFC" font-size="17.5" font-weight="800">智能驾驶 (L3/L4 ADAS)、SDV 950K EPS 车云遥测、6,500 万长尾场景挖掘与 UNECE R155/R156 选型 FAQ</text>
  <text x="64" y="102" fill="#94A3B8" font-size="12.5">Microsoft Fabric (Eventhouse 3ms H3 触发流 + Cosmos SSD DiskANN 3ms 场景打捞 + OneLake 飞轮) vs AWS FleetWise / Databricks / Snowflake / GCP</text>
  <rect x="1168" y="50" width="208" height="60" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="1272" y="72" fill="#34D399" font-size="11.5" font-weight="700" text-anchor="middle">Scenario AR · 120 万车队闭环</text>
  <text x="1272" y="96" fill="#F8FAFC" font-size="17" font-weight="800" text-anchor="middle">12ms · 省 84.3% TCO</text>

  <!-- Row 1 Left: 3 Pain Points vs First-Principles Breakthroughs -->
  <rect x="44" y="140" width="664" height="250" rx="14" fill="#101E36" stroke="#1E293B" stroke-width="1.5"/>
  <text x="64" y="168" fill="#60A5FA" font-size="14" font-weight="800">01 · 第一性原理：智驾量产三大生死劫 vs Fabric 12ms 数据飞轮机理</text>

  <rect x="64" y="182" width="624" height="60" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1"/>
  <text x="78" y="202" fill="#93C5FD" font-size="12" font-weight="800">① Eventhouse KQL 950K EPS 影子模式与 H3 道路热力图 (3ms 捕获幽灵刹车 · $0/信号税)</text>
  <text x="78" y="220" fill="#E2E8F0" font-size="11">• 传统痛点：按解码信号条数收费的车云服务月烧 $18.6K，且新固件幽灵刹车需 T+7 天售后汇总才发现</text>
  <text x="78" y="235" fill="#34D399" font-size="11" font-weight="700">• Fabric 破局：3ms 比对“视觉急刹 vs 激光雷达空旷”，锁定 v5.4.2 湿滑隧道口幽灵刹车激增 42x (380 起)</text>

  <rect x="64" y="250" width="624" height="60" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1"/>
  <text x="78" y="270" fill="#67E8F9" font-size="12" font-weight="800">② Cosmos SSD DiskANN 6,500 万多模态 Clip 秒级打捞 (3ms 召回 · 省 92% 内存)</text>
  <text x="78" y="288" fill="#E2E8F0" font-size="11">• 传统痛点：6,500 万段 768 维视频切片放在全内存向量库需 600GB+ RAM ($15.4K/月)，且复制 .mcap 极慢</text>
  <text x="78" y="303" fill="#34D399" font-size="11" font-weight="700">• Fabric 破局：NVMe SSD DiskANN 3ms 捞出 1,280 段“LED 积水眩光”切片，OneLake 零拷贝直供 GPU 重训</text>

  <rect x="64" y="318" width="624" height="58" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="78" y="338" fill="#6EE7B7" font-size="12" font-weight="800">③ Fabric IQ 穿透 SAP 整车 BOM 批次 + UNECE R155/R156 (RXSWIN) 合规 OTA 熔断</text>
  <text x="78" y="356" fill="#E2E8F0" font-size="11">• 3ms 锁定受影响的 #C92-Sunny 摄像头镀膜批次 (4.2 万辆车)，核验 P 档与 SoC≥30% 安全下发雷达融合补丁</text>

