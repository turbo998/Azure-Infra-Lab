  <text x="412" y="492" fill="#E2E8F0" font-size="11">• SSD DiskANN 3ms 召回 1,280 段积水眩光切片</text>
  <text x="412" y="510" fill="#E2E8F0" font-size="11">• 穿透 SAP BOM 锁定 #C92-Sunny 镜头镀膜批次</text>
  <text x="412" y="528" fill="#E2E8F0" font-size="11">• 精准圈定受影响的 42,000 辆车 (免全网盲退)</text>
  <text x="412" y="548" fill="#34D399" font-size="11" font-weight="700">✓ 生成隧道内强制 4D 毫米波交叉确认热补丁</text>

  <rect x="738" y="450" width="312" height="142" rx="10" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="754" y="472" fill="#C4B5FD" font-size="12" font-weight="800">Step 3 · Foundry IQ R155/R156 门控 (3ms)</text>
  <text x="754" y="492" fill="#E2E8F0" font-size="11">• 核验 AUTO-SDV-ADAS-CORNERCASE-SOP-044</text>
  <text x="754" y="510" fill="#E2E8F0" font-size="11">• 确认 RXSWIN 认证有效且 HSM 签名通过</text>
  <text x="754" y="528" fill="#E2E8F0" font-size="11">• 强制限定 Gear==PARK &amp; SoC≥30% 静默刷写</text>
  <text x="754" y="548" fill="#34D399" font-size="11" font-weight="700">✓ 1,280 段训练切片 100% 完成车牌/人脸脱敏</text>

  <rect x="1070" y="450" width="306" height="142" rx="10" fill="#172554" stroke="#10B981" stroke-width="1.5"/>
