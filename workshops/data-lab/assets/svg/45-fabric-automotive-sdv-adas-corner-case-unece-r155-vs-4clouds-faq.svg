  <text x="1018" y="740" fill="#34D399" font-size="10" text-anchor="middle">召回 1,280 段眩光样本 · 修复 4.2 万辆车</text>

  <rect x="1148" y="672" width="228" height="76" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
