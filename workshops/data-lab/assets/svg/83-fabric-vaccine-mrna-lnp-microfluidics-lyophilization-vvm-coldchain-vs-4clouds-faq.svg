  <rect x="74" y="274" width="86" height="40" rx="8" fill="#1E3A8A"/>
  <text x="117" y="292" fill="#93C5FD" font-size="11" font-weight="800" text-anchor="middle">STEP 2</text>
  <text x="117" y="307" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">6 ms</text>
  <text x="176" y="284" fill="#F8FAFC" font-size="13" font-weight="800">Fabric IQ 6 跳疫苗孪生 × Cosmos DB 1.68 亿向量 (168M) SSD DiskANN 检索 (省 92% 内存)</text>
  <text x="176" y="304" fill="#CBD5E1" font-size="11.5">• 检索 1.68 亿条微流控雷诺数混合流场、冻干板层传质阻力曲线与旋瓶微气泡 vs 玻璃脱片轨迹 (0.99 相似，仅 $1,950/月 vs $32.6K/月)</text>
  <text x="176" y="320" fill="#60A5FA" font-size="11.5" font-weight="700">• 生成乙醇背压 +14mbar 补偿、Lyo-12 板层 -2.5°C / 85mTorr 回调，并过滤 98.4% 假阳性微气泡 (误剔率 4.8% → 0.18%)</text>

