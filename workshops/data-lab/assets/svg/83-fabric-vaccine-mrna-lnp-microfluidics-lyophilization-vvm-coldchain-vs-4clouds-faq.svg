  <text x="117" y="229" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">5 ms</text>
  <text x="176" y="206" fill="#F8FAFC" font-size="13" font-weight="800">Eventhouse KQL 940K EPS 在线 DLS 粒径、皮拉尼/电容规真空压差与 600瓶/分灯检流感知 ($0/GB 写入税)</text>
  <text x="176" y="226" fill="#CBD5E1" font-size="11.5">• 640 套微流控混合器 + 180 台冻干机 + 1,200 条高速灯检线实时入湖；免除每月 $87.2K 按属性/按 GB 工业云写入税</text>
  <text x="176" y="242" fill="#22D3EE" font-size="11.5" font-weight="700">• series_fit_line() 5ms 锁定：LNP-Mixer-18 乙醇流道 42Hz 气蚀 (粒径升至 96nm) + Lyo-12 第 4 层制品逼近 -32.4°C 共晶融化线</text>

