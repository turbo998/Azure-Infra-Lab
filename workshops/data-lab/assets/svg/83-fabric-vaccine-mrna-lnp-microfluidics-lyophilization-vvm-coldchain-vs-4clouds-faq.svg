  <text x="196" y="68" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">ROUND 75 · 75-ROUND MILESTONE! (-91.1% TCO)</text>
  <text x="350" y="68" fill="#F8FAFC" font-size="16" font-weight="800">疫苗无菌灌装、mRNA 脂质纳米粒 (LNP) 微流控包封、冻干防塌陷与 WHO VVM 冷链 1.68 亿向量选型</text>
