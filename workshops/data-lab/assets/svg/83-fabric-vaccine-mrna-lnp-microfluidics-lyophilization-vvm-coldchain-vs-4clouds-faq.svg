  <text x="176" y="382" fill="#CBD5E1" font-size="11.5">• 强制核验《VACCINE-MRNA-LNP-LYO-VVM-ANNEX1-SOP-082》：确认 LNP 粒径回归 79.4nm (PDI=0.068 &lt;= 0.10，包封率 96.4%)</text>
  <text x="176" y="398" fill="#C084FC" font-size="11.5" font-weight="700">• 确认冻干制品降至 -34.8°C &lt;= -32.0°C (Tg')、激光顶空氧 &lt;= 0.5% (100% CCIT)，且 120 万剂冷链 WHO VVM 剩余寿命达 89.2%</text>

