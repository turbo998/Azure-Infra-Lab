  <text x="62" y="322" fill="#E2E8F0" font-size="11.5">• 研发 LIMS 与生产 Historian 割裂，温室高产菌进大罐遭遇溶氧梯度</text>
  <text x="62" y="340" fill="#E2E8F0" font-size="11.5">• 缺乏 7,200万条代谢通量平衡 (FBA) 与 LC-MS 质谱向量实时关联</text>
