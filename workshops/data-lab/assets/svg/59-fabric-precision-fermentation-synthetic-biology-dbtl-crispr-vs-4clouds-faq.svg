  <text x="62" y="200" fill="#FB7185" font-size="13" font-weight="700">① 补糖过快触发“溢流代谢 (Crabtree)”产乙酸毒死工程菌</text>
  <text x="62" y="220" fill="#E2E8F0" font-size="11.5">• 比生长速率越过 μ_crit (0.22h⁻¹) 致呼吸商飙至 RQ=1.28 疯狂产酸</text>
  <text x="62" y="238" fill="#E2E8F0" font-size="11.5">• 离线 HPLC 数小时滞后，发现乙酸积累时质粒已丢失、蛋白归零</text>
  <text x="62" y="256" fill="#FCA5A5" font-size="11" font-weight="700">✗ 12 批 200,000L 重组胶原蛋白工业罐倒罐直接损失 $7.80M</text>

  <rect x="48" y="280" width="404" height="92" rx="10" fill="#1E1B2E" stroke="#F43F5E" stroke-width="1"/>
