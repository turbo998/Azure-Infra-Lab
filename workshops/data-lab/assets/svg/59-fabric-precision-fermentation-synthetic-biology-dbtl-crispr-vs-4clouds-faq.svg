  <text x="62" y="424" fill="#E2E8F0" font-size="11.5">• AI 自动生成引物若未拦截受控毒素/病原同源序列将触发重罚</text>
  <text x="62" y="442" fill="#E2E8F0" font-size="11.5">• 工业无菌发酵车间在外部断网时无法依靠纯云端控制面调节补料</text>
