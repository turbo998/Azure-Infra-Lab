  <text x="213" y="66" fill="#060B19" font-size="11.2" font-weight="800" text-anchor="middle" letter-spacing="0.6">DATA LAB · 2026-11-14 R72 · 80-SVG &amp; 75-SPEC MILESTONE</text>
  <text x="382" y="66" fill="#F8FAFC" font-size="16" font-weight="800">主权养老金负债驱动投资（LDI）、国债回购防挤兑与长寿/基建现金流匹配选型 FAQ</text>
