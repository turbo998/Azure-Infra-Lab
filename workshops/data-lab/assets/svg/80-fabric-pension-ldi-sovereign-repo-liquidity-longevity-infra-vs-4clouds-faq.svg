  <text x="1268" y="94" fill="#FFFFFF" font-size="17.5" font-weight="800" text-anchor="middle">35ms 闭环 · 省 90.8% TCO</text>

  <!-- Row 1 Left: Pain Points vs First-Principles Breakthrough -->
  <rect x="40" y="136" width="668" height="248" rx="14" fill="#0E1D38" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="60" y="164" fill="#FACC15" font-size="14" font-weight="800">01 · 第一性原理痛点拆解：为什么 T+1 精算批处理防不住“2022 英国国债式”LDI 死亡螺旋？</text>

  <rect x="60" y="178" width="628" height="60" rx="8" fill="#2A1215" stroke="#EF4444" stroke-width="1.2"/>
  <text x="76" y="198" fill="#FCA5A5" font-size="12" font-weight="800">❌ 传统架构痛点：T+1 精算盲区 + T+3 货基赎回滞后 + 被迫抛售 30Y 长债死亡螺旋 (`$122.8K/月`)</text>
  <text x="76" y="216" fill="#FECACA" font-size="11">• 30Y 国债收益率盘中跳升 +65 bps 触发 LCH 14:00 $2.40B 现金追保；T+1 报表看不见跨专户闲置短债</text>
  <text x="76" y="231" fill="#FECACA" font-size="11">• 被迫在枯竭市场抛售长债换现 → 砸盘致收益率再飙升 +40 bps → 触发更大追保，单次斩仓滑点损失超 $12.9M</text>

  <rect x="60" y="248" width="628" height="60" rx="8" fill="#062E22" stroke="#10B981" stroke-width="1.2"/>
  <text x="76" y="268" fill="#6EE7B7" font-size="12" font-weight="800">✅ Fabric 破局：8ms KQL 凸性/追保感知 + 9ms 1.56 亿向量检索 + ALDO 交易室边缘 (`$11.3K/月`)</text>
  <text x="76" y="286" fill="#D1FAE5" font-size="11">• Eventhouse KQL $0 kdb+ 税摄入 910K EPS 流，asof_join 8ms 锁定 +65bps 二阶凸性缺口与 $2.40B 追保瀑布</text>
  <text x="76" y="301" fill="#D1FAE5" font-size="11">• Cosmos SSD DiskANN 9ms 检索 1.56 亿条精算梯队与 Repo 向量：调母基金短债免抛售升级 (-54bps) + 基建冲抵 $1.80B 掉期</text>

  <rect x="60" y="316" width="628" height="54" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="76" y="335" fill="#93C5FD" font-size="11.5" font-weight="800">🤝 互补共存 (Better Together)：1,000 万路径随机长寿蒙特卡洛 vs 35ms 实时 LDI 防挤兑闭环</text>
  <text x="76" y="353" fill="#E2E8F0" font-size="11">• Hull-White × Lee-Carter 千万路径精算模拟归 Databricks/HPC；SimCorp 托管净值归 Snowflake/SAP；35ms 闭环归 Fabric</text>

