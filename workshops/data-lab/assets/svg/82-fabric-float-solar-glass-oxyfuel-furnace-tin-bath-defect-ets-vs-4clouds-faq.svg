  <!-- Step 1 -->
  <rect x="60" y="182" width="800" height="68" rx="10" fill="#0F1A30" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="74" y="196" width="86" height="40" rx="8" fill="#78350F"/>
  <text x="117" y="214" fill="#FDE68A" font-size="11" font-weight="800" text-anchor="middle">STEP 1</text>
  <text x="117" y="229" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">6 ms</text>
  <text x="176" y="206" fill="#F8FAFC" font-size="13" font-weight="800">Eventhouse KQL 920K EPS 大碹红外热像、锡槽微氧/露点与 40μm 激光探伤流感知 ($0/GB 写入税)</text>
  <text x="176" y="226" fill="#CBD5E1" font-size="11.5">• 56 座 1,600°C 熔窑 + 112 条锡槽 + 3,400 台激光探伤仪实时入湖；免除每月 $85.4K 按属性/按 GB 工业云写入税</text>
  <text x="176" y="242" fill="#FBBF24" font-size="11.5" font-weight="700">• series_fit_line() 6ms 锁定：#04 窑 3R 大碹升至 1,618°C (+1.8°C/min) + 锡槽第 9 区微氧 11.4ppm + 冷端 95μm 高危散射斑</text>

