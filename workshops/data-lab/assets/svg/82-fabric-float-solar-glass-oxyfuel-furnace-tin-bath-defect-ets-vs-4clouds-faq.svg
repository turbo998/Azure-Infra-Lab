  <text x="117" y="463" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">7 ms</text>
  <text x="176" y="440" fill="#F8FAFC" font-size="13" font-weight="800">熔窑总工程师 Teams Confirm 联签 + SQL on Azure Local (ALDO) 边缘 PLC 执行 + 1GB 免费 SQL 落盘</text>
  <text x="176" y="460" fill="#CBD5E1" font-size="11.5">• 熔窑总工在 Teams 审批卡一键联签；ALDO 窑炉车间断网控制面下发 Modbus-TCP/Profinet 烧枪阀门与冷端横切刀指令</text>
