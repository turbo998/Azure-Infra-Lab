  <text x="196" y="68" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">ROUND 74 · $25.00M SLA &amp; -91.0% TCO MILESTONE</text>
  <text x="350" y="68" fill="#F8FAFC" font-size="16" font-weight="800">浮法与光伏玻璃 1,600°C 全氧熔窑大碹防烧穿、锡槽微氧防沾锡、硫化镍 (NiS) 激光探伤与欧盟 ETS 1.64 亿向量选型</text>
  <text x="58" y="101" fill="#94A3B8" font-size="12.5">Float &amp; Solar Glass (28 Plants · 56 1,200t/d Furnaces + 112 Tin Baths + 3,400 Scanners) · Eventhouse 6ms + 164M SSD DiskANN 7ms + SDS EU ETS + ALDO (27ms E2E · Save $116.3K/mo)</text>
  <rect x="1186" y="48" width="194" height="58" rx="10" fill="#0B1324" stroke="#10B981" stroke-width="1.5"/>
  <text x="1283" y="70" fill="#34D399" font-size="11.5" font-weight="700" text-anchor="middle">SCENARIO CC · DL-337..340</text>
