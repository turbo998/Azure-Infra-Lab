  <text x="176" y="382" fill="#CBD5E1" font-size="11.5">• 强制核验《FLOAT-SOLAR-GLASS-FURNACE-TIN-ETS-SOP-081》：确认大碹硅砖温度压回 1,592°C &lt;= 1,605°C 安全红线</text>
  <text x="176" y="398" fill="#C084FC" font-size="11.5" font-weight="700">• 确认锡槽微氧降至 1.8ppm &lt;= 3.0ppm、含 NiS 结石的 3.2m 板段 100% 进碎玻璃槽，且掺入 36% 碎玻璃通过 EU ETS 碳酸盐分解核查</text>

