  <rect x="60" y="260" width="800" height="68" rx="10" fill="#0F1A30" stroke="#06B6D4" stroke-width="1.2"/>
  <rect x="74" y="274" width="86" height="40" rx="8" fill="#164E63"/>
  <text x="117" y="292" fill="#67E8F9" font-size="11" font-weight="800" text-anchor="middle">STEP 2</text>
  <text x="117" y="307" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">7 ms</text>
  <text x="176" y="284" fill="#F8FAFC" font-size="13" font-weight="800">Fabric IQ 6 跳玻璃基地孪生 × Cosmos DB 1.64 亿向量 (164M) SSD DiskANN 检索 (省 92% 内存)</text>
  <text x="176" y="304" fill="#CBD5E1" font-size="11.5">• 检索 1.64 亿条池窑泡界线热对流图谱、冷端明暗场激光衍射向量与退火窑光弹应力曲线 (0.99 相似度，仅 $1,920/月 vs $31.9K/月)</text>
  <text x="176" y="320" fill="#22D3EE" font-size="11.5" font-weight="700">• 确诊 95μm 夹杂物为 α-NiS 硫化镍自爆结石；生成 #04 窑 3R 烧枪氧燃比 -3.8%、锡槽第 9 区形成气 +15% 与 3.2m 横切剔除处方</text>

