<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1871 · Semantic Cache Consistency Workbench</title>
<style>body{margin:0;background:#0b3762;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:22px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1871｜Semantic Cache Consistency 工作台</h1>
<div class="g">
<div class="c"><label>缓存命中率(%)</label><input id="hit" type="range" min="30" max="100" value="88"><label>陈旧输出率(%)</label><input id="stale" type="range" min="0" max="20" value="2"><label>失效后恢复窗口(s)</label><input id="rec" type="range" min="1" max="120" value="18"></div>
<div class="c"><h3>一致性治理评分</h3><p id="state"></p><p id="score"></p></div>
</div><div class="c">建议：优先压低陈旧输出率，再提升命中率，最后缩短失效恢复窗口。</div></div>
<script>
function calc(){const hit=+document.getElementById('hit').value,stale=+document.getElementById('stale').value,rec=+document.getElementById('rec').value;const v=((hit-30)*1.3)+((20-stale)*3.2)+((120-rec)*0.75);if(v>182)state.textContent='可生产：缓存收益与一致性平衡稳定';else if(v>152)state.textContent='可上线：建议继续压缩恢复窗口';else state.textContent='风险偏高：需强化失效与回源保护';score.textContent=`综合分 ${v.toFixed(2)}`;}
['hit','stale','rec'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
