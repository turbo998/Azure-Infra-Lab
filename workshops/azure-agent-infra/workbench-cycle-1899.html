<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1899 · APIM Inference Quota Burst Smoothing</title>
<style>body{margin:0;background:#0a1120;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1899｜APIM Inference Quota Burst Smoothing 工作台</h1>
<div class="g"><div class="c">
<label>突刺吸收率(%)</label><input id="absorb" type="range" min="20" max="99" value="82">
<label>拒绝率(%)</label><input id="reject" type="range" min="0" max="30" value="6">
<label>尾延迟P95(ms)</label><input id="p95" type="range" min="50" max="2000" value="390">
</div><div class="c"><h3>配额平滑治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：先压低拒绝率，再继续提升突刺吸收率。</div></div>
<script>
function calc(){const a=+absorb.value,r=+reject.value,p=+p95.value;const s=(a*2.1)+((30-r)*3.7)+((2000-p)/11);state.textContent=s>250?'可生产：配额平滑与延迟控制稳定':(s>210?'可上线：建议继续收敛拒绝率':'风险偏高：需强化桶参数与优先级策略');score.textContent=`综合分 ${s.toFixed(2)}`;}
['absorb','reject','p95'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
