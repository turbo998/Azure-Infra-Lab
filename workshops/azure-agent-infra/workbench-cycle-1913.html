<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1913 · ACA Sandbox Image Prewarm Fairness</title>
<style>body{margin:0;background:#09132a;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1913｜Sandbox Image Prewarm Fairness 工作台</h1>
<div class="g"><div class="c">
<label>冷启 P95(ms)</label><input id="p95" type="range" min="80" max="950" value="236">
<label>预热配额冲突率(%)</label><input id="conf" type="range" min="0" max="45" value="13">
<label>公平窗口借用率(%)</label><input id="borrow" type="range" min="0" max="60" value="17">
</div><div class="c"><h3>预热公平治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：先降配额冲突率，再收敛借用率，最后进一步压低冷启 P95。</div></div>
<script>
function calc(){const p=+p95.value,c=+conf.value,b=+borrow.value;const s=((950-p)*0.20)+((45-c)*3.0)+((60-b)*2.1);state.textContent=s>255?'可生产：预热公平窗口与回收重排协同稳定':(s>210?'可上线：建议继续降低冲突':'风险偏高：需优化配额和回收策略');score.textContent=`综合分 ${s.toFixed(2)}`;}
['p95','conf','borrow'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
