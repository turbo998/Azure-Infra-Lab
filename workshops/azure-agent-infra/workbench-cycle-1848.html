<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1848 · Sandbox Lease Governance Workbench</title>
<style>body{margin:0;background:#0b2844;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:22px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1848｜MCP 沙箱租约治理工作台</h1>
<div class="g">
<div class="c"><label>默认租约(min)</label><input id="l" type="range" min="1" max="120" value="18"><label>续租成功率(%)</label><input id="r" type="range" min="60" max="100" value="93"><label>残留事件/月</label><input id="x" type="range" min="0" max="50" value="6"></div>
<div class="c"><h3>租约治理健康度</h3><p id="state"></p><p id="score"></p></div>
</div><div class="c">建议：先降低残留事件，再提升续租成功率，最后优化默认租约长度。</div></div>
<script>
function calc(){const l=+document.getElementById('l').value,r=+document.getElementById('r').value,x=+document.getElementById('x').value;const s=((120-l)*0.35)+((r-60)*1.5)+((50-x)*1.35);if(s>120)state.textContent='租约安全与性能平衡良好';else if(s>98)state.textContent='可上线，建议继续压缩残留事件';else state.textContent='风险偏高，建议收紧续租与回收策略';score.textContent=`综合分 ${s.toFixed(2)}`;}
['l','r','x'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
