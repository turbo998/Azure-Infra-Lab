<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1836 · Cold Pool Refill Latency Workbench</title>
<style>body{margin:0;background:#0a1b2e;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1836｜沙盒冷池补充时延工作台</h1>
<div class="grid">
<div class="card"><label>补池触发水位(%)</label><input id="water" type="range" min="20" max="95" value="62"><label>单位分钟补池上限</label><input id="rate" type="range" min="1" max="200" value="48"><label>预热保留时长(min)</label><input id="keep" type="range" min="1" max="120" value="18"></div>
<div class="card"><h3>补池稳态判定</h3><p id="state"></p><p id="detail"></p></div>
</div><div class="card">建议：先压缩触发水位，再校准补池上限，最后优化预热保留时长。</div></div>
<script>
function evalS(){const w=+water.value,r=+rate.value,k=+keep.value;const score=(w*0.16)+(r*0.05)-((k)*0.12)+10;if(score>22)state.textContent='补池与成本平衡良好';else if(score>16)state.textContent='可用但空转风险偏高';else state.textContent='冷启动抖动风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['water','rate','keep'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
