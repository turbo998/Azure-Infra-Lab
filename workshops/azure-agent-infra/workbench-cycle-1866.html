<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1866 · WebSocket Session Pin Workbench</title>
<style>body{margin:0;background:#0b3762;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:22px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1866｜WebSocket Session Pin 工作台</h1>
<div class="g">
<div class="c"><label>pin 命中率(%)</label><input id="pin" type="range" min="40" max="100" value="94"><label>迁移成功率(%)</label><input id="mig" type="range" min="40" max="100" value="92"><label>连接预算使用率(%)</label><input id="bud" type="range" min="30" max="130" value="84"></div>
<div class="c"><h3>长连接稳定度评分</h3><p id="state"></p><p id="score"></p></div>
</div><div class="c">建议：先提升 pin 命中率，再增强迁移成功率，最后压低预算使用率波动。</div></div>
<script>
function calc(){const pin=+document.getElementById('pin').value,mig=+document.getElementById('mig').value,bud=+document.getElementById('bud').value;const v=((pin-40)*1.6)+((mig-40)*1.45)+((130-bud)*1.0);if(v>176)state.textContent='可生产：会话连续性与容量控制稳定';else if(v>146)state.textContent='可上线：建议优化预算波动';else state.textContent='风险偏高：需提升 pin 与迁移鲁棒性';score.textContent=`综合分 ${v.toFixed(2)}`;}
['pin','mig','bud'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
