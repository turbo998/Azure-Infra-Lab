<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1804 · SLO Admission Controller Workbench</title>
<style>body{margin:0;background:#0a1222;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1804｜SLO 准入控制工作台</h1>
<div class="grid"><div class="card"><label>高优保留配额(%)</label><input id="high" type="range" min="10" max="90" value="55"><label>入口并发上限</label><input id="con" type="range" min="10" max="1000" value="260"><label>低优降级触发阈值(%)</label><input id="deg" type="range" min="30" max="95" value="74"></div><div class="card"><h3>准入稳态评估</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先固定高优保留，再调并发上限与降级阈值。</div></div>
<script>
function evalA(){const h=+high.value,c=+con.value,d=+deg.value;const score=(h*0.16)+(c/38)-(d*0.07);if(score>13)state.textContent='稳态良好';else if(score>8)state.textContent='可优化';else state.textContent='风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['high','con','deg'].forEach(id=>document.getElementById(id).addEventListener('input',evalA));evalA();
</script></body></html>
