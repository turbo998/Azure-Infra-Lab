<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1915 · ACA Kata Runtime Eviction Protection Ring</title>
<style>body{margin:0;background:#09132a;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1915｜Kata Eviction Protection Ring 工作台</h1>
<div class="g"><div class="c">
<label>误驱逐率(%)</label><input id="fe" type="range" min="0" max="35" value="8">
<label>回补等待 P95(ms)</label><input id="p95" type="range" min="120" max="1200" value="278">
<label>预算冲突率(%)</label><input id="bc" type="range" min="0" max="45" value="11">
</div><div class="c"><h3>保护环治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：先压低误驱逐率，再降低预算冲突率，最后优化回补等待 P95。</div></div>
<script>
function calc(){const f=+fe.value,p=+p95.value,b=+bc.value;const s=((35-f)*3.2)+((1200-p)*0.16)+((45-b)*2.9);state.textContent=s>255?'可生产：保护环与预算护栏协同稳定':(s>215?'可上线：建议继续降低冲突':'风险偏高：需优化驱逐阈值与回补门禁');score.textContent=`综合分 ${s.toFixed(2)}`;}
['fe','p95','bc'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
