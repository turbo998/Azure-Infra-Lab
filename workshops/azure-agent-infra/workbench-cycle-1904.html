<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1904 · ACA Sandbox Lease Rollback Coordinator</title>
<style>body{margin:0;background:#091125;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1904｜ACA Lease Rollback Coordinator 工作台</h1>
<div class="g"><div class="c">
<label>一致性错误率(%)</label><input id="err" type="range" min="0" max="20" value="3">
<label>孤儿租约清理P95(s)</label><input id="gc" type="range" min="1" max="300" value="46">
<label>回滚后恢复成功率(%)</label><input id="rec" type="range" min="40" max="100" value="93">
</div><div class="c"><h3>租约回滚治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：优先压低一致性错误率，再持续缩短清理P95。</div></div>
<script>
function calc(){const e=+err.value,g=+gc.value,r=+rec.value;const s=((20-e)*4.2)+((300-g)*0.8)+(r*1.9);state.textContent=s>255?'可生产：回滚协调闭环稳定':(s>215?'可上线：建议继续收敛残留清理时延':'风险偏高：需强化双阶段确认与补偿策略');score.textContent=`综合分 ${s.toFixed(2)}`;}
['err','gc','rec'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
