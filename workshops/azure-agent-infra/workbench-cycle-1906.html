<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1906 · ACA Sandbox Admission Debt Heatmap</title>
<style>body{margin:0;background:#091228;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1906｜ACA Admission Debt Heatmap 工作台</h1>
<div class="g"><div class="c">
<label>热区债务指数</label><input id="hot" type="range" min="0" max="100" value="28">
<label>拒绝率(%)</label><input id="rej" type="range" min="0" max="35" value="6">
<label>队列P95(s)</label><input id="q95" type="range" min="1" max="200" value="32">
</div><div class="c"><h3>债务热图治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：优先降低热区债务指数，再压缩队列P95。</div></div>
<script>
function calc(){const h=+hot.value,r=+rej.value,q=+q95.value;const s=((100-h)*1.7)+((35-r)*3.8)+((200-q)*1.0);state.textContent=s>250?'可生产：债务热图联动稳定':(s>210?'可上线：建议继续收敛热区斜率':'风险偏高：需加强阈值联动与回补编排');score.textContent=`综合分 ${s.toFixed(2)}`;}
['hot','rej','q95'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
