<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1784 · Rule Short-Circuit Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1784｜Rule Evaluation 短路策略工作台</h1>
<div class="grid"><div class="card"><label>高风险规则占比（%）</label><input id="risk" type="range" min="0" max="100" value="34"><label>高成本规则触发率（%）</label><input id="costly" type="range" min="0" max="100" value="22"><label>决策缓存命中率（%）</label><input id="cache" type="range" min="0" max="100" value="63"></div><div class="card"><h3>评估策略判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先压低高成本规则触发率，再提升缓存命中率。</div></div>
<script>
function evalRule(){const r=+risk.value,c=+costly.value,h=+cache.value;const score=(r*0.25)+(h*0.6)-c*0.5;if(score>34){state.textContent='可控';detail.textContent=`短路指数 ${score.toFixed(1)}`;}else if(score>20){state.textContent='临界';detail.textContent=`短路指数 ${score.toFixed(1)}`;}else{state.textContent='高压';detail.textContent=`短路指数 ${score.toFixed(1)}`;}}
['risk','costly','cache'].forEach(id=>document.getElementById(id).addEventListener('input',evalRule));evalRule();
</script></body></html>
