<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1822 · Failure Domain Fencing Workbench</title>
<style>body{margin:0;background:#0a1127;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1822｜运行时故障域围栏工作台</h1>
<div class="grid">
<div class="card"><label>围栏触发错误率(%)</label><input id="err" type="range" min="1" max="40" value="12"><label>泄漏判定窗口(秒)</label><input id="leak" type="range" min="10" max="300" value="75"><label>恢复探针通过率(%)</label><input id="probe" type="range" min="50" max="100" value="92"></div>
<div class="card"><h3>围栏稳态判定</h3><p id="state"></p><p id="detail"></p></div>
</div><div class="card">建议：先收紧围栏触发阈值防扩散，再提高恢复探针通过门槛。</div></div>
<script>
function evalS(){const e=+err.value,l=+leak.value,p=+probe.value;const score=(p*0.22)+((300-l)*0.03)-((e)*0.2)+8;if(score>20)state.textContent='隔离与恢复平衡良好';else if(score>14)state.textContent='可用但存在振荡风险';else state.textContent='级联或误封风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['err','leak','probe'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
