<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1769 · Sandbox Admission Planner Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1769｜Sandbox 准入容量规划工作台</h1>
<div class="grid"><div class="card"><label>峰值请求/秒</label><input id="rps" type="range" min="10" max="2000" value="680"><label>冷启动预算（ms）</label><input id="cold" type="range" min="100" max="5000" value="1400"><label>关键任务保留槽位（%）</label><input id="reserve" type="range" min="0" max="60" value="22"></div><div class="card"><h3>容量判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先守住关键任务保留槽位，再优化整体吞吐。</div></div>
<script>
function evalCap(){const r=+rps.value,c=+cold.value,s=+reserve.value;const score=(s*1.6)+(1200/c*35)-(r/60);if(score>35){state.textContent='容量健康';detail.textContent=`指数 ${score.toFixed(1)}`;}else if(score>18){state.textContent='临界，可灰度';detail.textContent=`指数 ${score.toFixed(1)}`;}else{state.textContent='高压，需限流/扩池';detail.textContent=`指数 ${score.toFixed(1)}`;}}
['rps','cold','reserve'].forEach(id=>document.getElementById(id).addEventListener('input',evalCap));evalCap();
</script></body></html>
