<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1764 · ACA vs Firecracker Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1764｜ACA/Firecracker 分层隔离工作台</h1>
<div class="grid"><div class="card"><label>高风险请求占比（%）</label><input id="risk" type="range" min="0" max="100" value="32"><label>Firecracker 车道容量（%）</label><input id="fc" type="range" min="5" max="100" value="30"><label>允许冷启动预算（ms）</label><input id="cold" type="range" min="200" max="4000" value="1200"></div><div class="card"><h3>分层决策建议</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：高风险>40% 时优先提高 Firecracker lane 配额并收紧策略门槛。</div></div>
<script>
function evalTier(){const r=+risk.value,f=+fc.value,c=+cold.value;const fit=(f*0.8)+(c/120)-(r*0.9);if(fit>35){state.textContent='当前分层可行';detail.textContent=`适配指数 ${fit.toFixed(1)}`;}else if(fit>10){state.textContent='临界，需调参';detail.textContent=`适配指数 ${fit.toFixed(1)}`;}else{state.textContent='不建议放量';detail.textContent=`适配指数 ${fit.toFixed(1)}`;}}
['risk','fc','cold'].forEach(id=>document.getElementById(id).addEventListener('input',evalTier));evalTier();
</script></body></html>
