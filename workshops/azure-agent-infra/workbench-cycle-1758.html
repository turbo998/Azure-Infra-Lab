<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1758 · Cosmos State RU Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1758｜Cosmos Agent State RU 成本工作台</h1>
<div class="grid"><div class="card"><label>每会话状态写入条数</label><input id="writes" type="range" min="10" max="400" value="120"><label>跨分区查询比例（%）</label><input id="cross" type="range" min="0" max="100" value="35"><label>索引字段宽度因子</label><input id="idx" type="range" min="1" max="10" value="6"></div><div class="card"><h3>RU 预算评估</h3><p id="score"></p><p id="detail"></p></div></div>
<div class="card">建议：tenant+session 分区 + 热冷分层 + 索引裁剪 + 策略账本回放。</div></div>
<script>
function evalRU(){const w=+writes.value,c=+cross.value,i=+idx.value;const ru=(w*0.9)+(c*1.7)+(i*12);if(ru<260){score.textContent='预算健康';detail.textContent=`估算 RU 指数 ${ru.toFixed(1)}`;}else if(ru<420){score.textContent='预算偏高，建议优化';detail.textContent=`估算 RU 指数 ${ru.toFixed(1)}`;}else{score.textContent='高风险，需重构分区与索引';detail.textContent=`估算 RU 指数 ${ru.toFixed(1)}`;}}
['writes','cross','idx'].forEach(id=>document.getElementById(id).addEventListener('input',evalRU));evalRU();
</script></body></html>
