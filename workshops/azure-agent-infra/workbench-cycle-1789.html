<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1789 · Idempotency TTL Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1789｜A2A 幂等键 TTL 工作台</h1>
<div class="grid"><div class="card"><label>状态变更 TTL（分钟）</label><input id="state" type="range" min="1" max="1440" value="240"><label>查询类 TTL（分钟）</label><input id="read" type="range" min="1" max="240" value="18"><label>重复请求占比（%）</label><input id="dup" type="range" min="0" max="60" value="14"></div><div class="card"><h3>幂等策略判定</h3><p id="stateText"></p><p id="detail"></p></div></div>
<div class="card">建议：先按动作分级 TTL，再按重复占比细调回放保护。</div></div>
<script>
function evalIdem(){const s=+state.value,r=+read.value,d=+dup.value;const score=(s/20)+(r/12)-(d*1.1);if(score>14){stateText.textContent='策略可控';detail.textContent=`幂等指数 ${score.toFixed(1)}`;}else if(score>6){stateText.textContent='临界';detail.textContent=`幂等指数 ${score.toFixed(1)}`;}else{stateText.textContent='高风险';detail.textContent=`幂等指数 ${score.toFixed(1)}`;}}
['state','read','dup'].forEach(id=>document.getElementById(id).addEventListener('input',evalIdem));evalIdem();
</script></body></html>
