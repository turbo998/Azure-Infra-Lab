<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1829 · Policy Drift Control Workbench</title>
<style>body{margin:0;background:#0a142b;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1829｜来源策略漂移控制工作台</h1>
<div class="grid">
<div class="card"><label>漂移检测频率(秒)</label><input id="freq" type="range" min="10" max="600" value="90"><label>高风险阻断阈值(分)</label><input id="risk" type="range" min="40" max="100" value="84"><label>自动回滚时限(分钟)</label><input id="roll" type="range" min="1" max="120" value="18"></div>
<div class="card"><h3>治理稳态判定</h3><p id="state"></p><p id="detail"></p></div>
</div><div class="card">建议：先缩短检测频率，再收紧阻断阈值，最后优化回滚时限。</div></div>
<script>
function evalS(){const f=+freq.value,r=+risk.value,o=+roll.value;const score=((600-f)*0.02)+(r*0.18)-((o)*0.12)+8;if(score>22)state.textContent='漂移控制稳定';else if(score>16)state.textContent='可用但修复窗口偏长';else state.textContent='高风险漂移暴露偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['freq','risk','roll'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
