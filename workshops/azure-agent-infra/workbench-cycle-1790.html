<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1790 · KV Cache Guardrails Workbench</title>
<style>body{margin:0;background:#0a1020;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1790｜KV Cache 驱逐护栏工作台</h1>
<div class="grid"><div class="card"><label>租户配额(GB)</label><input id="quota" type="range" min="1" max="64" value="18"><label>敏感会话占比(%)</label><input id="sensitive" type="range" min="0" max="80" value="22"><label>P95预算(ms)</label><input id="p95" type="range" min="200" max="4000" value="1180"></div><div class="card"><h3>驱逐稳态判定</h3><p id="status"></p><p id="detail"></p></div></div>
<div class="card">建议：先锁定租户配额，再对敏感会话施加短 TTL，最后调热度驱逐曲线。</div></div>
<script>
function f(){const q=+quota.value,s=+sensitive.value,p=+p95.value;const score=(q*0.8)-(s*0.6)-((p-900)/220);if(score>8){status.textContent='稳态良好';}else if(score>2){status.textContent='可优化';}else{status.textContent='高风险';}detail.textContent=`综合分 ${score.toFixed(2)}`;}
['quota','sensitive','p95'].forEach(id=>document.getElementById(id).addEventListener('input',f));f();
</script></body></html>
