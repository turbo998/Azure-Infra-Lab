<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1907 · APIM Gateway Circuit Entropy</title>
<style>body{margin:0;background:#091225;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1907｜APIM Gateway Circuit Entropy 工作台</h1>
<div class="g"><div class="c">
<label>熔断分歧率(%)</label><input id="div" type="range" min="0" max="40" value="9">
<label>误拒绝率(%)</label><input id="false" type="range" min="0" max="25" value="4">
<label>恢复吞吐波动(%)</label><input id="var" type="range" min="0" max="50" value="12">
</div><div class="c"><h3>熔断熵治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：优先压低分歧率，再收敛恢复窗口波动。</div></div>
<script>
function calc(){const d=+div.value,f=+false.value,v=+var.value;const s=((40-d)*3.2)+((25-f)*3.8)+((50-v)*2.1);state.textContent=s>250?'可生产：熔断熵控制稳定':(s>210?'可上线：建议继续收敛误拒绝':'风险偏高：需强化仲裁与冷却同步');score.textContent=`综合分 ${s.toFixed(2)}`;}
['div','false','var'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
