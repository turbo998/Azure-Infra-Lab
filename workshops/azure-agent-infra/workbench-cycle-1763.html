<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1763 · Foundry Control Plane SLO Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1763｜Foundry 控制面 SLO 工作台</h1>
<div class="grid"><div class="card"><label>控制面 QPS 负载（%）</label><input id="qps" type="range" min="0" max="120" value="78"><label>重试放大系数</label><input id="retry" type="range" min="1" max="6" value="2"><label>关键租户保留容量（%）</label><input id="reserve" type="range" min="0" max="60" value="24"></div><div class="card"><h3>SLO 风险判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：QPS 超 85% 时，先启用降级和优先级保护，再考虑扩大预算。</div></div>
<script>
function evalSlo(){const q=+qps.value,r=+retry.value,s=+reserve.value;const risk=(q*0.8)+(r*9)-(s*0.7);if(risk<55){state.textContent='SLO 稳定';detail.textContent=`风险指数 ${risk.toFixed(1)}`;}else if(risk<80){state.textContent='临界，建议灰度降级';detail.textContent=`风险指数 ${risk.toFixed(1)}`;}else{state.textContent='高风险，触发保护策略';detail.textContent=`风险指数 ${risk.toFixed(1)}`;}}
['qps','retry','reserve'].forEach(id=>document.getElementById(id).addEventListener('input',evalSlo));evalSlo();
</script></body></html>
