<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1882 · Snapshot Lineage Consistency Workbench</title>
<style>body{margin:0;background:#0b3762;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:22px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1882｜Snapshot Lineage Consistency 工作台</h1>
<div class="g">
<div class="c"><label>Lineage 断链率(%)</label><input id="br" type="range" min="0" max="20" value="1"><label>恢复前校验覆盖率(%)</label><input id="cov" type="range" min="40" max="100" value="97"><label>补偿重建时长(s)</label><input id="reb" type="range" min="1" max="900" value="58"></div>
<div class="c"><h3>Lineage 治理评分</h3><p id="state"></p><p id="score"></p></div>
</div><div class="c">建议：保持高覆盖率，继续压低断链率和补偿重建时长。</div></div>
<script>
function calc(){const br=+document.getElementById('br').value,cov=+document.getElementById('cov').value,reb=+document.getElementById('reb').value;const v=((20-br)*3.6)+((cov-40)*1.15)+((900-reb)*0.16);if(v>188)state.textContent='可生产：lineage 连续性稳定可控';else if(v>158)state.textContent='可上线：建议继续缩短补偿时长';else state.textContent='风险偏高：需强化冻结与一致性闸门';score.textContent=`综合分 ${v.toFixed(2)}`;}
['br','cov','reb'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
