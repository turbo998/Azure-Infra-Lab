<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1776 · APIM Fallback Order Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1776｜APIM 多模型回退顺序工作台</h1>
<div class="grid"><div class="card"><label>L1 超时预算（ms）</label><input id="t1" type="range" min="100" max="4000" value="900"><label>L2 超时预算（ms）</label><input id="t2" type="range" min="100" max="4000" value="1100"><label>最大回退跳数</label><input id="hop" type="range" min="1" max="5" value="3"></div><div class="card"><h3>回退策略判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：优先收敛最大跳数，再优化单层超时预算。</div></div>
<script>
function evalOrder(){const a=+t1.value,b=+t2.value,h=+hop.value;const score=(1800/(a+b))*80 + (5-h)*8;if(score>38){state.textContent='顺序可控';detail.textContent=`策略指数 ${score.toFixed(1)}`;}else if(score>24){state.textContent='临界';detail.textContent=`策略指数 ${score.toFixed(1)}`;}else{state.textContent='高风险';detail.textContent=`策略指数 ${score.toFixed(1)}`;}}
['t1','t2','hop'].forEach(id=>document.getElementById(id).addEventListener('input',evalOrder));evalOrder();
</script></body></html>
