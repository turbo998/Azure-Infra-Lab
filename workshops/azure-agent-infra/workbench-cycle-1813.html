<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1813 · Model Context Sharding Workbench</title>
<style>body{margin:0;background:#0a1223;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1813｜模型上下文分片工作台</h1>
<div class="grid"><div class="card"><label>分片数量</label><input id="shard" type="range" min="1" max="32" value="8"><label>会话亲和强度(%)</label><input id="aff" type="range" min="0" max="100" value="78"><label>汇总校验开销(ms)</label><input id="merge" type="range" min="1" max="1500" value="180"></div><div class="card"><h3>分片稳态评估</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先提升亲和强度，再优化分片规模与汇总校验开销。</div></div>
<script>
function evalS(){const s=+shard.value,a=+aff.value,m=+merge.value;const score=(s*0.5)+(a*0.12)-(m*0.02)+6;if(score>12)state.textContent='稳态良好';else if(score>8)state.textContent='可优化';else state.textContent='风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['shard','aff','merge'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
