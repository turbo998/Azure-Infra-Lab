<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1774 · Foundry PTU Spillover Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1774｜Foundry PTU 溢出控制工作台</h1>
<div class="grid"><div class="card"><label>峰值到达速率（req/s）</label><input id="arr" type="range" min="50" max="2400" value="860"><label>主 PTU 余量（%）</label><input id="head" type="range" min="0" max="100" value="28"><label>溢出车道预算（%）</label><input id="burst" type="range" min="0" max="80" value="24"></div><div class="card"><h3>溢出治理判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先保证关键请求溢出车道预算，再优化整体吞吐。</div></div>
<script>
function evalSpill(){const a=+arr.value,h=+head.value,b=+burst.value;const score=(h*0.9)+(b*1.2)-(a/45);if(score>18){state.textContent='可控';detail.textContent=`溢出指数 ${score.toFixed(1)}`;}else if(score>4){state.textContent='临界';detail.textContent=`溢出指数 ${score.toFixed(1)}`;}else{state.textContent='高风险，需降载';detail.textContent=`溢出指数 ${score.toFixed(1)}`;}}
['arr','head','burst'].forEach(id=>document.getElementById(id).addEventListener('input',evalSpill));evalSpill();
</script></body></html>
