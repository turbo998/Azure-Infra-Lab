<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1826 · Queue Drain Fairness Workbench</title>
<style>body{margin:0;background:#0a1329;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1826｜队列清退公平性工作台</h1>
<div class="grid">
<div class="card"><label>P0 清退保护强度(%)</label><input id="p0" type="range" min="50" max="100" value="92"><label>P2 清退权重(%)</label><input id="p2" type="range" min="5" max="80" value="28"><label>回补窗口时长(s)</label><input id="bf" type="range" min="10" max="600" value="150"></div>
<div class="card"><h3>公平稳态判定</h3><p id="state"></p><p id="detail"></p></div>
</div><div class="card">建议：先确保 P0 保护，再压缩 P2 清退，最后调优回补窗口。</div></div>
<script>
function evalS(){const a=+p0.value,b=+p2.value,c=+bf.value;const score=(a*0.2)-((b)*0.12)+((600-c)*0.015)+10;if(score>22)state.textContent='拥塞恢复与公平均衡';else if(score>16)state.textContent='可用但长尾公平需优化';else state.textContent='存在饥饿与抖动风险';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['p0','p2','bf'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
