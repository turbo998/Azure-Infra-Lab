<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1909 · APIM Tenant Fairshare Retry Budget</title>
<style>body{margin:0;background:#09132a;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1909｜APIM Tenant Fairshare Retry Budget 工作台</h1>
<div class="g"><div class="c">
<label>重试放大率(%)</label><input id="amp" type="range" min="0" max="60" value="18">
<label>租户公平偏差(%)</label><input id="fair" type="range" min="0" max="50" value="14">
<label>关键租户失败率(%)</label><input id="fail" type="range" min="0" max="25" value="4">
</div><div class="c"><h3>公平份额重试预算评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：先压低重试放大率，再收敛公平偏差，最后优化关键租户失败率。</div></div>
<script>
function calc(){const a=+amp.value,f=+fair.value,l=+fail.value;const s=((60-a)*3.2)+((50-f)*2.3)+((25-l)*4.0);state.textContent=s>280?'可生产：预算门禁与公平份额协同稳定':(s>230?'可上线：建议继续优化公平偏差':'风险偏高：需强化预算扣减与冷却回填');score.textContent=`综合分 ${s.toFixed(2)}`;}
['amp','fair','fail'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
