<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1886 · L4/L7 Fallback Slicing Workbench</title>
<style>body{margin:0;background:#0b3762;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:22px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1886｜L4/L7 Egress Fallback Slicing 工作台</h1>
<div class="g">
<div class="c"><label>关键切片成功率(%)</label><input id="succ" type="range" min="40" max="100" value="96"><label>回退窗口 P99(ms)</label><input id="p99" type="range" min="50" max="3000" value="420"><label>切回抖动率(%)</label><input id="jit" type="range" min="0" max="20" value="3"></div>
<div class="c"><h3>切片回退治理评分</h3><p id="state"></p><p id="score"></p></div>
</div><div class="c">建议：先压低切回抖动率，再优化回退 P99，保持关键切片高成功率。</div></div>
<script>
function calc(){const s=+document.getElementById('succ').value,p=+document.getElementById('p99').value,j=+document.getElementById('jit').value;const v=((s-40)*1.35)+((3000-p)*0.05)+((20-j)*3.1);if(v>188)state.textContent='可生产：分层回退与切回稳定';else if(v>158)state.textContent='可上线：建议继续收敛 P99';else state.textContent='风险偏高：需强化配额与恢复策略';score.textContent=`综合分 ${v.toFixed(2)}`;}
['succ','p99','jit'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
