<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1783 · Sandbox Egress Shaping Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1783｜Tool Sandbox 出网整形工作台</h1>
<div class="grid"><div class="card"><label>高风险目的地占比（%）</label><input id="risk" type="range" min="0" max="100" value="27"><label>租户总出口速率（req/s）</label><input id="rate" type="range" min="10" max="5000" value="920"><label>内容感知覆盖（%）</label><input id="guard" type="range" min="0" max="100" value="79"></div><div class="card"><h3>整形治理判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先提高内容感知覆盖，再收紧高风险目的地速率。</div></div>
<script>
function evalShape(){const r=+risk.value,t=+rate.value,g=+guard.value;const score=(g*0.7)+(1100/t*22)-(r*0.5);if(score>40){state.textContent='可控';detail.textContent=`整形指数 ${score.toFixed(1)}`;}else if(score>26){state.textContent='临界';detail.textContent=`整形指数 ${score.toFixed(1)}`;}else{state.textContent='高风险';detail.textContent=`整形指数 ${score.toFixed(1)}`;}}
['risk','rate','guard'].forEach(id=>document.getElementById(id).addEventListener('input',evalShape));evalShape();
</script></body></html>
