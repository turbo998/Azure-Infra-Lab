<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1772 · Cosmos State Tiering Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1772｜Cosmos 状态分层与 TTL 工作台</h1>
<div class="grid"><div class="card"><label>热状态 TTL（分钟）</label><input id="hot" type="range" min="1" max="180" value="18"><label>冷摘要 TTL（小时）</label><input id="cold" type="range" min="1" max="168" value="48"><label>RU 峰值压力（0-100）</label><input id="ru" type="range" min="0" max="100" value="62"></div><div class="card"><h3>分层策略判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：优先降低 RU 峰值压力，再调整热冷 TTL 比例。</div></div>
<script>
function evalTier(){const h=+hot.value,c=+cold.value,r=+ru.value;const score=(c/2.8)+(30/h*10)-r;if(score>18){state.textContent='策略可行';detail.textContent=`分层指数 ${score.toFixed(1)}`;}else if(score>4){state.textContent='临界，建议调参';detail.textContent=`分层指数 ${score.toFixed(1)}`;}else{state.textContent='高压，需重配';detail.textContent=`分层指数 ${score.toFixed(1)}`;}}
['hot','cold','ru'].forEach(id=>document.getElementById(id).addEventListener('input',evalTier));evalTier();
</script></body></html>
