<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1824 · Sandbox Image Provenance Workbench</title>
<style>body{margin:0;background:#091128;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1824｜沙盒镜像来源证明工作台</h1>
<div class="grid">
<div class="card"><label>签署覆盖率(%)</label><input id="sign" type="range" min="50" max="100" value="96"><label>准入验证时延(ms)</label><input id="admit" type="range" min="10" max="1200" value="180"><label>未签署拦截阈值(%)</label><input id="block" type="range" min="50" max="100" value="92"></div>
<div class="card"><h3>准入稳态判定</h3><p id="state"></p><p id="detail"></p></div>
</div><div class="card">建议：先拉高签署覆盖率，再压缩准入时延，确保拦截阈值稳定。</div></div>
<script>
function evalS(){const s=+sign.value,a=+admit.value,b=+block.value;const score=(s*0.2)+(b*0.18)-((a/1000)*2.2)+8;if(score>22)state.textContent='安全与效率平衡良好';else if(score>16)state.textContent='可用但准入时延需优化';else state.textContent='供应链准入风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['sign','admit','block'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
