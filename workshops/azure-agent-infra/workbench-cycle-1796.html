<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1796 · Trace Budget Workbench</title>
<style>body{margin:0;background:#0b1323;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1796｜Trace 传播预算工作台</h1>
<div class="grid"><div class="card"><label>基础采样率(%)</label><input id="base" type="range" min="1" max="100" value="24"><label>异常路径强制采样率(%)</label><input id="err" type="range" min="10" max="100" value="100"><label>预算令牌(每请求)</label><input id="tok" type="range" min="1" max="120" value="36"></div><div class="card"><h3>可观测稳态评估</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先保障异常路径全追踪，再细化常规路径降采样。</div></div>
<script>
function evalT(){const b=+base.value,e=+err.value,t=+tok.value;const score=(e*0.11)+(t*0.18)-(b*0.05);if(score>14)state.textContent='稳态良好';else if(score>8)state.textContent='可优化';else state.textContent='风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['base','err','tok'].forEach(id=>document.getElementById(id).addEventListener('input',evalT));evalT();
</script></body></html>
