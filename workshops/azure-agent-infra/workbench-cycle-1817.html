<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1817 · Burst Credit Governor Workbench</title>
<style>body{margin:0;background:#0b1126;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1817｜突发额度治理器工作台</h1>
<div class="grid">
<div class="card"><label>突发额度上限</label><input id="credit" type="range" min="10" max="500" value="180"><label>恢复速率(额度/秒)</label><input id="recover" type="range" min="1" max="80" value="18"><label>保护阀阈值(%)</label><input id="valve" type="range" min="40" max="100" value="82"></div>
<div class="card"><h3>突发稳态判定</h3><p id="state"></p><p id="detail"></p></div>
</div><div class="card">建议：先降低保护阀阈值防扩散，再迭代额度上限与恢复速率。</div></div>
<script>
function evalS(){const c=+credit.value,r=+recover.value,v=+valve.value;const score=(c*0.025)+(r*0.22)-((100-v)*0.18)+7;if(score>18)state.textContent='突发可控且弹性充足';else if(score>13)state.textContent='可用但有抖动风险';else state.textContent='存在级联风险';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['credit','recover','valve'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
