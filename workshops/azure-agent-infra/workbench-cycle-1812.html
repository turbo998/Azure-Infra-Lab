<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1812 · Schema Evolution Safety Workbench</title>
<style>body{margin:0;background:#0a1225;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1812｜Schema 演进安全工作台</h1>
<div class="grid"><div class="card"><label>兼容窗口(小时)</label><input id="win" type="range" min="1" max="240" value="36"><label>双写比例(%)</label><input id="dual" type="range" min="1" max="100" value="68"><label>回滚触发阈值(%)</label><input id="roll" type="range" min="1" max="40" value="9"></div><div class="card"><h3>演进稳态评估</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先稳定兼容窗口，再收紧回滚阈值。</div></div>
<script>
function evalS(){const w=+win.value,d=+dual.value,r=+roll.value;const score=(w*0.08)+(d*0.09)-(r*0.22);if(score>12)state.textContent='稳态良好';else if(score>8)state.textContent='可优化';else state.textContent='风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['win','dual','roll'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
