<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1910 · APIM Tenant Retry Storm Dampening Lane</title>
<style>body{margin:0;background:#09132a;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1910｜APIM Tenant Retry Storm Dampening 工作台</h1>
<div class="g"><div class="c">
<label>重试放大率(%)</label><input id="amp" type="range" min="0" max="70" value="21">
<label>阻尼触发频率(次/分)</label><input id="dmp" type="range" min="0" max="40" value="11">
<label>关键租户失败率(%)</label><input id="fail" type="range" min="0" max="25" value="5">
</div><div class="c"><h3>阻尼车道治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：先降低放大率，再优化阻尼触发频率，最后压低关键租户失败率。</div></div>
<script>
function calc(){const a=+amp.value,d=+dmp.value,f=+fail.value;const s=((70-a)*3.0)+((40-d)*2.6)+((25-f)*3.8);state.textContent=s>285?'可生产：阻尼门禁与冷却回填协同稳定':(s>235?'可上线：建议进一步优化触发频率':'风险偏高：需强化阻尼参数与租户配额');score.textContent=`综合分 ${s.toFixed(2)}`;}
['amp','dmp','fail'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
