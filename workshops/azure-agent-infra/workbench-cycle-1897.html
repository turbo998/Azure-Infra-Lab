<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1897 · Firecracker CPU Credit Fencing</title>
<style>body{margin:0;background:#0a1321;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1897｜Firecracker CPU Credit Fencing 工作台</h1>
<div class="g"><div class="c">
<label>credit 命中健康度(%)</label><input id="health" type="range" min="40" max="99" value="88">
<label>债务恢复时间(s)</label><input id="debt" type="range" min="5" max="240" value="52">
<label>关键业务P95(ms)</label><input id="p95" type="range" min="20" max="900" value="148">
</div><div class="c"><h3>Credit 围栏治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：先降低债务恢复时间，再持续压低关键P95。</div></div>
<script>
function calc(){const h=+health.value,d=+debt.value,p=+p95.value;const s=(h*2.2)+((240-d)*1.2)+((900-p)*0.12);state.textContent=s>255?'可生产：credit 围栏稳定且恢复可控':(s>215?'可上线：建议继续收敛债务恢复':'风险偏高：需强化围栏阈值与保底池');score.textContent=`综合分 ${s.toFixed(2)}`;}
['health','debt','p95'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
