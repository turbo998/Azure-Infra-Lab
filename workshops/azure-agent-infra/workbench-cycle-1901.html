<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1901 · Firecracker Kernel Pool Fragmentation</title>
<style>body{margin:0;background:#091224;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1901｜Firecracker Kernel Pool Fragmentation 工作台</h1>
<div class="g"><div class="c">
<label>池命中率(%)</label><input id="hit" type="range" min="20" max="99" value="79">
<label>冷启动P95(ms)</label><input id="p95" type="range" min="50" max="2500" value="510">
<label>低命中组合占比(%)</label><input id="tail" type="range" min="0" max="60" value="18">
</div><div class="c"><h3>Kernel 池治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：先降低低命中组合占比，再持续压低冷启动P95。</div></div>
<script>
function calc(){const h=+hit.value,p=+p95.value,t=+tail.value;const s=(h*2.0)+((2500-p)/12)+((60-t)*2.2);state.textContent=s>250?'可生产：内核池碎片治理稳定':(s>210?'可上线：建议继续裁剪长尾组合':'风险偏高：需强化目录分层与迁移压缩');score.textContent=`综合分 ${s.toFixed(2)}`;}
['hit','p95','tail'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
