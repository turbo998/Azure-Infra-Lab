<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1798 · Token Burst Shaping Workbench</title>
<style>body{margin:0;background:#0a1323;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1798｜Token 突发整形工作台</h1>
<div class="grid"><div class="card"><label>token 桶容量</label><input id="cap" type="range" min="50" max="3000" value="900"><label>突发配额(%)</label><input id="burst" type="range" min="0" max="80" value="22"><label>高优保留(%)</label><input id="pri" type="range" min="0" max="90" value="38"></div><div class="card"><h3>整形稳态评估</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先锁定高优保留比例，再细调突发窗口。</div></div>
<script>
function evalB(){const c=+cap.value,b=+burst.value,p=+pri.value;const score=(c/120)+(p*0.22)-(b*0.08);if(score>14)state.textContent='稳态良好';else if(score>8)state.textContent='可优化';else state.textContent='风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['cap','burst','pri'].forEach(id=>document.getElementById(id).addEventListener('input',evalB));evalB();
</script></body></html>
