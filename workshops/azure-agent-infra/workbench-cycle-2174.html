<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 2174 · APIM MCP Reentry Reliability Guard Lane Fairness</title>
<style>body{margin:0;background:#09132a;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 2174｜MCP 重入可靠性护栏延迟桶公平工作台</h1>
<div class="g"><div class="c">
<label>可靠性漂移率(%)</label><input id="prop" type="range" min="0" max="30" value="1">
<label>窗口 P95(ms)</label><input id="p95" type="range" min="120" max="1400" value="136">
<label>回退放大率(%)</label><input id="roll" type="range" min="0" max="40" value="2">
</div><div class="c"><h3>Reliability Guard Lane 评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：先压降可靠性漂移，再压缩回退放大率，最后收敛窗口 P95。</div></div>
<script>
function calc(){const p=+prop.value,l=+p95.value,r=+roll.value;const s=((30-p)*4.54)+((1400-l)*0.154)+((40-r)*3.68);state.textContent=s>347?'可生产：可靠性护栏恢复稳定':(s>319?'可上线：建议继续压降回退放大率':'风险偏高：需优化可靠性签名校验与配额策略');score.textContent=`综合分 ${s.toFixed(2)}`;}
['prop','p95','roll'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
