<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1832 · Shadow Route Governance Workbench</title>
<style>body{margin:0;background:#09172c;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1832｜网关影子路由治理工作台</h1>
<div class="grid">
<div class="card"><label>影子流量比例(%)</label><input id="shadow" type="range" min="1" max="80" value="18"><label>偏差阈值(%)</label><input id="drift" type="range" min="1" max="30" value="8"><label>自动关停窗口(min)</label><input id="stop" type="range" min="1" max="60" value="12"></div>
<div class="card"><h3>影子稳态判定</h3><p id="state"></p><p id="detail"></p></div>
</div><div class="card">建议：先收紧偏差阈值，再缩短关停窗口，最后调整影子流量比例。</div></div>
<script>
function evalS(){const s=+shadow.value,d=+drift.value,t=+stop.value;const score=(s*0.22)-((d)*0.35)-((t)*0.08)+20;if(score>20)state.textContent='影子治理稳定';else if(score>14)state.textContent='可用但偏差风险偏高';else state.textContent='影子失控风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['shadow','drift','stop'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
