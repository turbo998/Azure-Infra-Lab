<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1762 · Zero-Trust Lane Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1762｜金融零信任执行车道工作台</h1>
<div class="grid"><div class="card"><label>高风险请求占比（%）</label><input id="risk" type="range" min="0" max="100" value="28"><label>高保障车道容量（%）</label><input id="cap" type="range" min="5" max="100" value="35"><label>审计回放覆盖（%）</label><input id="audit" type="range" min="0" max="100" value="78"></div><div class="card"><h3>车道治理判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：高风险占比上升时优先扩高保障车道与审计链路，不降低权限门槛。</div></div>
<script>
function evalLane(){const r=+risk.value,c=+cap.value,a=+audit.value;const score=(c*0.5)+(a*0.6)-(r*0.4);if(score>55){state.textContent='治理健康';detail.textContent=`指数 ${score.toFixed(1)}`;}else if(score>35){state.textContent='可灰度';detail.textContent=`指数 ${score.toFixed(1)}`;}else{state.textContent='高风险，需加固';detail.textContent=`指数 ${score.toFixed(1)}`;}}
['risk','cap','audit'].forEach(id=>document.getElementById(id).addEventListener('input',evalLane));evalLane();
</script></body></html>
