<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1815 · Tenant Fairness Quota Workbench</title>
<style>body{margin:0;background:#0a1022;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1815｜多租户公平配额工作台</h1>
<div class="grid">
<div class="card"><label>关键租户保底份额(%)</label><input id="base" type="range" min="5" max="80" value="35"><label>借额开放比例(%)</label><input id="borrow" type="range" min="0" max="60" value="22"><label>回收时延阈值(ms)</label><input id="reclaim" type="range" min="50" max="2000" value="420"></div>
<div class="card"><h3>公平稳态判定</h3><p id="state"></p><p id="detail"></p></div>
</div><div class="card">建议：先保证关键租户保底，再用借额提升利用率，最后压缩回收时延。</div></div>
<script>
function evalS(){const b=+base.value,br=+borrow.value,r=+reclaim.value;const score=(b*0.22)+(br*0.35)-((r/1000)*1.4)+6;if(score>18)state.textContent='公平与效率均衡';else if(score>12)state.textContent='可用但需优化';else state.textContent='存在饥饿风险';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['base','borrow','reclaim'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
