<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1864 · Schema Drift Burn-rate Workbench</title>
<style>body{margin:0;background:#0b3762;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:22px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1864｜Schema Drift Burn-rate 工作台</h1>
<div class="g">
<div class="c"><label>5m 漂移错误率(%)</label><input id="e5" type="range" min="0" max="20" value="3"><label>1h 漂移错误率(%)</label><input id="e1" type="range" min="0" max="20" value="2"><label>降级切换成功率(%)</label><input id="sw" type="range" min="40" max="100" value="95"></div>
<div class="c"><h3>契约稳定性评分</h3><p id="state"></p><p id="score"></p></div>
</div><div class="c">建议：先压低 5m 漂移错误率，再提升降级切换成功率，最后优化 1h 预算稳定性。</div></div>
<script>
function calc(){const e5=+document.getElementById('e5').value,e1=+document.getElementById('e1').value,sw=+document.getElementById('sw').value;const v=((20-e5)*2.1)+((20-e1)*1.7)+((sw-40)*1.25);if(v>150)state.textContent='可生产：漂移风险在预算内';else if(v>126)state.textContent='可上线：建议加强短窗告警';else state.textContent='风险偏高：需收敛漂移并强化降级';score.textContent=`综合分 ${v.toFixed(2)}`;}
['e5','e1','sw'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
