<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1927 · APIM MCP Degrade Lane Jitter Fairness</title>
<style>body{margin:0;background:#09132a;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1927｜MCP 降档车道抖动公平工作台</h1>
<div class="g"><div class="c">
<label>降档抖动率(%)</label><input id="jit" type="range" min="0" max="30" value="5">
<label>窗口 P95(ms)</label><input id="p95" type="range" min="120" max="1400" value="274">
<label>回补滞后率(%)</label><input id="lag" type="range" min="0" max="40" value="6">
</div><div class="c"><h3>Jitter Fairness 评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：先压降抖动率，再削减回补滞后，最后收敛窗口 P95。</div></div>
<script>
function calc(){const j=+jit.value,l=+p95.value,g=+lag.value;const s=((30-j)*3.8)+((1400-l)*0.14)+((40-g)*2.9);state.textContent=s>280?'可生产：抖动门限与回补节奏稳定':(s>240?'可上线：建议继续压降滞后率':'风险偏高：需优化降档门限与回补策略');score.textContent=`综合分 ${s.toFixed(2)}`;}
['jit','p95','lag'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
