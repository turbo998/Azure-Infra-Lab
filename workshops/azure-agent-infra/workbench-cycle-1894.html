<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1894 · Wasm Policy Pack Hot Reload</title>
<style>body{margin:0;background:#0b1020;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1894｜Wasm Policy Pack Hot Reload 工作台</h1>
<div class="g"><div class="c">
<label>热加载成功率(%)</label><input id="ok" type="range" min="50" max="100" value="94">
<label>误报率(%)</label><input id="fp" type="range" min="0" max="25" value="4">
<label>回滚平均耗时(s)</label><input id="rb" type="range" min="1" max="120" value="18">
</div><div class="c"><h3>策略热加载治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：优先压低误报率，再持续降低回滚耗时。</div></div>
<script>
function calc(){const o=+ok.value,f=+fp.value,r=+rb.value;const s=(o*2.1)+((25-f)*4.2)+((120-r)*1.1);state.textContent=s>255?'可生产：热加载稳定且回滚可控':(s>215?'可上线：建议继续收敛误报率':'风险偏高：需加强灰度与保险丝策略');score.textContent=`综合分 ${s.toFixed(2)}`;}
['ok','fp','rb'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
