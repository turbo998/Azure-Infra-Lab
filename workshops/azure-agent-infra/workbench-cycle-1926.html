<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1926 · APIM MCP Route Guard Latency Shed Fairness</title>
<style>body{margin:0;background:#09132a;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1926｜MCP 路由护栏延迟削峰公平工作台</h1>
<div class="g"><div class="c">
<label>路由失配率(%)</label><input id="unfair" type="range" min="0" max="30" value="5">
<label>窗口 P95(ms)</label><input id="p95" type="range" min="120" max="1400" value="279">
<label>降档回退率(%)</label><input id="deny" type="range" min="0" max="40" value="7">
</div><div class="c"><h3>Route Guard 治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：优先压低路由失配率，再收敛降档回退率，最后优化窗口 P95。</div></div>
<script>
function calc(){const u=+unfair.value,l=+p95.value,d=+deny.value;const s=((30-u)*3.7)+((1400-l)*0.14)+((40-d)*2.8);state.textContent=s>276?'可生产：路由护栏与削峰协同稳定':(s>236?'可上线：建议继续收敛回退率':'风险偏高：需优化护栏阈值与降档策略');score.textContent=`综合分 ${s.toFixed(2)}`;}
['unfair','p95','deny'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
