<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1808 · Circuit State Persistence Workbench</title>
<style>body{margin:0;background:#0a1224;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1808｜熔断状态持久化工作台</h1>
<div class="grid"><div class="card"><label>半开探测配额</label><input id="probe" type="range" min="1" max="200" value="28"><label>冷却窗口(秒)</label><input id="cool" type="range" min="5" max="600" value="72"><label>恢复放量步长(%)</label><input id="ramp" type="range" min="1" max="50" value="12"></div><div class="card"><h3>恢复稳态评估</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先稳定冷却窗口，再调探测配额与放量步长。</div></div>
<script>
function evalC(){const p=+probe.value,c=+cool.value,r=+ramp.value;const score=(p*0.19)+(c*0.03)-(r*0.22);if(score>11)state.textContent='稳态良好';else if(score>7)state.textContent='可优化';else state.textContent='风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['probe','cool','ramp'].forEach(id=>document.getElementById(id).addEventListener('input',evalC));evalC();
</script></body></html>
