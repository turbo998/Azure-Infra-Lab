<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1768 · Multi-Region Residency Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1768｜多区域驻留与切换工作台</h1>
<div class="grid"><div class="card"><label>主区负载（%）</label><input id="load" type="range" min="0" max="100" value="70"><label>镜像状态体积（GB）</label><input id="state" type="range" min="1" max="200" value="36"><label>容灾切换预算（秒）</label><input id="rto" type="range" min="10" max="600" value="95"></div><div class="card"><h3>驻留切换判定</h3><p id="stateText"></p><p id="detail"></p></div></div>
<div class="card">建议：优先压缩镜像状态体积，再优化切换预算，避免合规与成本双失控。</div></div>
<script>
function evalResidency(){const l=+load.value,s=+state.value,r=+rto.value;const score=100-(l*0.3+s*0.4+r*0.08);if(score>55){stateText.textContent='可控';detail.textContent=`韧性指数 ${score.toFixed(1)}`;}else if(score>35){stateText.textContent='临界';detail.textContent=`韧性指数 ${score.toFixed(1)}`;}else{stateText.textContent='高风险';detail.textContent=`韧性指数 ${score.toFixed(1)}`;}}
['load','state','rto'].forEach(id=>document.getElementById(id).addEventListener('input',evalResidency));evalResidency();
</script></body></html>
