<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1835 · Retry Budget Isolation Workbench</title>
<style>body{margin:0;background:#0a1a2d;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1835｜重试预算租户隔离工作台</h1>
<div class="grid">
<div class="card"><label>每租户重试预算</label><input id="budget" type="range" min="5" max="500" value="80"><label>退避基线(ms)</label><input id="backoff" type="range" min="10" max="2000" value="260"><label>抖动幅度(%)</label><input id="jitter" type="range" min="0" max="100" value="35"></div>
<div class="card"><h3>重试稳态判定</h3><p id="state"></p><p id="detail"></p></div>
</div><div class="card">建议：先限制预算上限，再调退避基线，最后优化抖动幅度。</div></div>
<script>
function evalS(){const b=+budget.value,o=+backoff.value,j=+jitter.value;const score=(b*0.04)-((o/1000)*2.0)+(j*0.12)+12;if(score>20)state.textContent='重试放大受控';else if(score>14)state.textContent='可用但重试噪声偏高';else state.textContent='重试风暴风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['budget','backoff','jitter'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
