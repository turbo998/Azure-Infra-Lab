<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1775 · Breakglass Control Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1775｜Private Link Breakglass 工作台</h1>
<div class="grid"><div class="card"><label>审批延迟（分钟）</label><input id="approve" type="range" min="1" max="120" value="15"><label>Breakglass TTL（分钟）</label><input id="ttl" type="range" min="1" max="240" value="30"><label>白名单覆盖率（%）</label><input id="allow" type="range" min="0" max="100" value="84"></div><div class="card"><h3>通道风险判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：优先压缩 TTL 与审批延迟，避免临时通道长期常驻。</div></div>
<script>
function evalGate(){const a=+approve.value,t=+ttl.value,w=+allow.value;const score=(w*0.7)+(120/(a+2)*8)+(90/(t+5)*5);if(score>78){state.textContent='边界可控';detail.textContent=`指数 ${score.toFixed(1)}`;}else if(score>58){state.textContent='临界';detail.textContent=`指数 ${score.toFixed(1)}`;}else{state.textContent='高风险';detail.textContent=`指数 ${score.toFixed(1)}`;}}
['approve','ttl','allow'].forEach(id=>document.getElementById(id).addEventListener('input',evalGate));evalGate();
</script></body></html>
