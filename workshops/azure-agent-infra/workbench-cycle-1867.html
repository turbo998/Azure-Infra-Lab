<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1867 · APIM Response Shape Firewall Workbench</title>
<style>body{margin:0;background:#0b3762;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:22px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1867｜Response Shape Firewall 工作台</h1>
<div class="g">
<div class="c"><label>结构异常拦截率(%)</label><input id="hit" type="range" min="40" max="100" value="92"><label>正常流量附加时延(ms)</label><input id="lat" type="range" min="5" max="400" value="62"><label>误拦截率(%)</label><input id="fp" type="range" min="0" max="12" value="1"></div>
<div class="c"><h3>防火墙治理评分</h3><p id="state"></p><p id="score"></p></div>
</div><div class="c">建议：先压低误拦截率，再提升拦截率，最后持续优化附加时延。</div></div>
<script>
function calc(){const hit=+document.getElementById('hit').value,lat=+document.getElementById('lat').value,fp=+document.getElementById('fp').value;const v=((hit-40)*1.5)+((400-lat)*0.25)+((12-fp)*4.1);if(v>176)state.textContent='可生产：风险拦截与时延平衡稳定';else if(v>146)state.textContent='可上线：建议进一步降低误拦截';else state.textContent='风险偏高：需加强规则与归一化联动';score.textContent=`综合分 ${v.toFixed(2)}`;}
['hit','lat','fp'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
