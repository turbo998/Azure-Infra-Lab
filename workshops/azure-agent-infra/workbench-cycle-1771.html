<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1771 · Backpressure Signals Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1771｜事件驱动回压信号工作台</h1>
<div class="grid"><div class="card"><label>入口速率占用（%）</label><input id="rate" type="range" min="0" max="150" value="82"><label>队列积压指数（0-100）</label><input id="backlog" type="range" min="0" max="100" value="48"><label>执行器失败率（%）</label><input id="fail" type="range" min="0" max="30" value="6"></div><div class="card"><h3>回压治理判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：失败率与积压同步上升时优先降载，而不是单纯扩队列。</div></div>
<script>
function evalBp(){const r=+rate.value,b=+backlog.value,f=+fail.value;const score=100-(r*0.4+b*0.45+f*1.8);if(score>45){state.textContent='稳定';detail.textContent=`回压指数 ${score.toFixed(1)}`;}else if(score>25){state.textContent='临界';detail.textContent=`回压指数 ${score.toFixed(1)}`;}else{state.textContent='高风险，触发降载';detail.textContent=`回压指数 ${score.toFixed(1)}`;}}
['rate','backlog','fail'].forEach(id=>document.getElementById(id).addEventListener('input',evalBp));evalBp();
</script></body></html>
