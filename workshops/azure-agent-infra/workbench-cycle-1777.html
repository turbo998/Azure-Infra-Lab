<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1777 · Supply Chain Gate Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1777｜运行时供应链闸门工作台</h1>
<div class="grid"><div class="card"><label>签名覆盖率（%）</label><input id="sig" type="range" min="0" max="100" value="86"><label>SBOM 规则命中率（%）</label><input id="sbom" type="range" min="0" max="100" value="78"><label>admission 阻断准确率（%）</label><input id="adm" type="range" min="0" max="100" value="83"></div><div class="card"><h3>闸门可靠性判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：优先提高 admission 阻断准确率，再扩大规则覆盖。</div></div>
<script>
function evalGate(){const s=+sig.value,b=+sbom.value,a=+adm.value;const score=(s*0.3+b*0.3+a*0.4);if(score>82){state.textContent='闸门稳定';detail.textContent=`可信指数 ${score.toFixed(1)}`;}else if(score>68){state.textContent='临界';detail.textContent=`可信指数 ${score.toFixed(1)}`;}else{state.textContent='高风险';detail.textContent=`可信指数 ${score.toFixed(1)}`;}}
['sig','sbom','adm'].forEach(id=>document.getElementById(id).addEventListener('input',evalGate));evalGate();
</script></body></html>
