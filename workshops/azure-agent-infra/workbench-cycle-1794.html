<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1794 · Memory Tiering Workbench</title>
<style>body{margin:0;background:#0a1324;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1794｜有状态记忆分层工作台</h1>
<div class="grid"><div class="card"><label>Hot 层 TTL(分钟)</label><input id="hot" type="range" min="1" max="180" value="30"><label>Warm 层命中率(%)</label><input id="warm" type="range" min="20" max="100" value="74"><label>Cold 层查询占比(%)</label><input id="cold" type="range" min="0" max="60" value="12"></div><div class="card"><h3>分层稳态评估</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先固化 Hot 层低延迟，再优化 Warm 召回和 Cold 成本。</div></div>
<script>
function evalM(){const h=+hot.value,w=+warm.value,c=+cold.value;const score=(w*0.2)+(h*0.08)-(c*0.18);if(score>16)state.textContent='稳态良好';else if(score>10)state.textContent='可优化';else state.textContent='风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['hot','warm','cold'].forEach(id=>document.getElementById(id).addEventListener('input',evalM));evalM();
</script></body></html>
