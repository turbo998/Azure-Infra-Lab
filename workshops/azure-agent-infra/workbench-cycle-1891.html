<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1891 · ACA Sandbox Capacity Hedging</title>
<style>body{margin:0;background:#0b1324;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1891｜ACA Sandbox Capacity Hedging 工作台</h1>
<div class="g"><div class="c">
<label>对冲池命中率(%)</label><input id="hit" type="range" min="20" max="95" value="61">
<label>峰值拒绝率(%)</label><input id="rej" type="range" min="0" max="35" value="6">
<label>对冲额外成本(%)</label><input id="cost" type="range" min="0" max="40" value="11">
</div><div class="c"><h3>容量对冲治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：先压低拒绝率，再优化对冲额外成本。</div></div>
<script>
function calc(){const h=+hit.value,r=+rej.value,c=+cost.value;const s=(h*2.2)+((35-r)*3.4)+((40-c)*1.6);state.textContent=s>245?'可生产：对冲收益显著且成本可控':(s>205?'可上线：建议持续优化命中率':'风险偏高：需强化池容量与预算门控');score.textContent=`综合分 ${s.toFixed(2)}`;}
['hit','rej','cost'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
