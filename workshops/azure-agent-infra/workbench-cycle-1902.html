<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1902 · ACA GPU Slice Admission Stability</title>
<style>body{margin:0;background:#0a1022;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1902｜ACA GPU Slice Admission Stability 工作台</h1>
<div class="g"><div class="c">
<label>准入成功率(%)</label><input id="adm" type="range" min="30" max="99" value="84">
<label>拒绝率(%)</label><input id="rej" type="range" min="0" max="35" value="7">
<label>队列P95(s)</label><input id="q95" type="range" min="1" max="180" value="28">
</div><div class="c"><h3>GPU 准入治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：优先压低拒绝率，再降低队列P95。</div></div>
<script>
function calc(){const a=+adm.value,r=+rej.value,q=+q95.value;const s=(a*2.1)+((35-r)*3.9)+((180-q)*1.0);state.textContent=s>250?'可生产：GPU准入稳定且恢复可控':(s>210?'可上线：建议继续收敛队列尾部':'风险偏高：需强化配额与回填稳定器');score.textContent=`综合分 ${s.toFixed(2)}`;}
['adm','rej','q95'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
