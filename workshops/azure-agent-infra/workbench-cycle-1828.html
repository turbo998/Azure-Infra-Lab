<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1828 · Runtime Throttle Stepdown Workbench</title>
<style>body{margin:0;background:#091529;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1828｜运行时节流阶梯降档工作台</h1>
<div class="grid">
<div class="card"><label>触发门槛 CPU(%)</label><input id="cpu" type="range" min="40" max="98" value="78"><label>切换滞回窗口(s)</label><input id="hys" type="range" min="5" max="180" value="45"><label>恢复稳定窗口(s)</label><input id="rec" type="range" min="10" max="300" value="90"></div>
<div class="card"><h3>节流稳态判定</h3><p id="state"></p><p id="detail"></p></div>
</div><div class="card">建议：先增大滞回窗口，再调恢复窗口，最后微调触发门槛。</div></div>
<script>
function evalS(){const c=+cpu.value,h=+hys.value,r=+rec.value;const score=(c*0.14)+(h*0.08)+(r*0.05)-6;if(score>20)state.textContent='降档与恢复平衡良好';else if(score>15)state.textContent='可用但存在边界抖动';else state.textContent='过载振荡风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['cpu','hys','rec'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
