<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1782 · Session Memory Compaction Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1782｜Agent Session 内存压缩工作台</h1>
<div class="grid"><div class="card"><label>热窗口长度（条）</label><input id="hot" type="range" min="10" max="1000" value="160"><label>冷摘要压缩率（%）</label><input id="compress" type="range" min="10" max="95" value="68"><label>事实保留覆盖（%）</label><input id="facts" type="range" min="0" max="100" value="84"></div><div class="card"><h3>压缩策略判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先提高事实保留覆盖，再提升压缩率，避免语义断裂。</div></div>
<script>
function evalMem(){const h=+hot.value,c=+compress.value,f=+facts.value;const score=(f*0.55)+(c*0.35)-(h*0.03);if(score>56){state.textContent='策略稳定';detail.textContent=`压缩指数 ${score.toFixed(1)}`;}else if(score>42){state.textContent='临界';detail.textContent=`压缩指数 ${score.toFixed(1)}`;}else{state.textContent='高风险';detail.textContent=`压缩指数 ${score.toFixed(1)}`;}}
['hot','compress','facts'].forEach(id=>document.getElementById(id).addEventListener('input',evalMem));evalMem();
</script></body></html>
