<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1833 · SLA Burn Rate Circuit Workbench</title>
<style>body{margin:0;background:#0a182c;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1833｜SLA 燃尽率熔断工作台</h1>
<div class="grid">
<div class="card"><label>5min 燃尽率阈值</label><input id="b5" type="range" min="1" max="20" value="6"><label>30min 燃尽率阈值</label><input id="b30" type="range" min="1" max="20" value="3"><label>恢复稳定窗口(min)</label><input id="rec" type="range" min="1" max="60" value="12"></div>
<div class="card"><h3>熔断稳态判定</h3><p id="state"></p><p id="detail"></p></div>
</div><div class="card">建议：先收紧 5min 阈值，再校准 30min 阈值，最后优化恢复窗口。</div></div>
<script>
function evalS(){const b5=+b5El.value,b30=+b30El.value,r=+recEl.value;const score=((20-b5)*0.9)+((20-b30)*0.6)-((r)*0.15)+10;if(score>20)state.textContent='提前止损能力良好';else if(score>14)state.textContent='可用但误触发风险偏高';else state.textContent='熔断迟滞或误杀风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
const b5El=document.getElementById('b5');const b30El=document.getElementById('b30');const recEl=document.getElementById('rec');['b5','b30','rec'].forEach(id=>document.getElementById(id).addEventListener('input',evalS));evalS();
</script></body></html>
