  <text x="90" y="215" fill="#e2e8f0" font-size="26" font-family="Segoe UI,Arial" font-weight="600">Daily capability breakthroughs (official-first)</text>
  <text x="90" y="258" fill="#cbd5e1" font-size="20" font-family="Segoe UI,Arial">1) Durable saga orchestration improves deterministic compensation in multi-step payment/ERP flows.</text>
  <text x="90" y="296" fill="#cbd5e1" font-size="20" font-family="Segoe UI,Arial">2) APIM idempotency-key policy intercepts duplicate transactional requests before downstream side effects.</text>
  <text x="90" y="334" fill="#cbd5e1" font-size="20" font-family="Segoe UI,Arial">3) Cosmos transactional outbox provides replay-safe event relay and side-effect deduplication.</text>
  <text x="90" y="372" fill="#cbd5e1" font-size="20" font-family="Segoe UI,Arial">4) Entra step-up approval gates high-risk refund compensation actions.</text>
