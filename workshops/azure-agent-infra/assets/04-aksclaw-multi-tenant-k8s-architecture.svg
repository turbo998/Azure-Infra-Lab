  <text x="756" y="454" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">Workload Identity 平台绑定，绝不继承用户个人完整权限</text>

  <rect x="744" y="472" width="288" height="46" rx="6" fill="#0F172A" fill-opacity="0.82" stroke="#F87171"/>
