  <rect width="1080" height="720" rx="16" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1080" height="6" rx="3" fill="url(#headerGrad)"/>
  <text x="32" y="40" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="700">图 7 · 多智能体协同工作流 (MAF × Copilot SDK × Durable) 与状态持久化选型矩阵</text>
  <text x="32" y="64" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13">上：自动化故障诊断与代码修复闭环 (Pitch Slide 13) · 下：Azure HorizonDB vs Cosmos DB vs Sandbox Snapshot 状态底座对比</text>

  <!-- Top Workflow Sequence -->
  <rect x="32" y="84" width="1016" height="276" rx="10" fill="#0F172A" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="48" y="110" fill="#93C5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">END-TO-END MULTI-AGENT WORKFLOW · MICROSOFT AGENT FRAMEWORK (MAF) + GITHUB COPILOT SDK</text>

  <!-- Step Boxes -->
  <rect x="48" y="128" width="180" height="142" rx="8" fill="url(#roseGrad)" stroke="#F87171"/>
  <text x="138" y="150" text-anchor="middle" fill="#FECDD3" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">STEP 1 · TRIGGER</text>
  <text x="138" y="170" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">生产告警 / 工单到达</text>
  <text x="138" y="192" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Azure Monitor / IcM P1</text>
  <text x="138" y="210" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Event Grid / Webhook</text>
  <text x="138" y="228" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 注入 TraceID 与租户上下文</text>
  <text x="138" y="252" text-anchor="middle" fill="#FDE68A" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">t = 0s</text>

  <rect x="248" y="128" width="188" height="142" rx="8" fill="url(#blueGrad)" stroke="#60A5FA"/>
  <text x="342" y="150" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">STEP 2 · DIAGNOSIS</text>
  <text x="342" y="170" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">LangGraph 诊断 Agent</text>
  <text x="342" y="192" text-anchor="middle" fill="#DBEAFE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 运行于 AKS / ACA Apps</text>
  <text x="342" y="210" text-anchor="middle" fill="#DBEAFE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 查询 Kusto 日志 + 近期 PR</text>
  <text x="342" y="228" text-anchor="middle" fill="#DBEAFE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 写入 HorizonDB Checkpoint</text>
  <text x="342" y="252" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">定位根因文件与行号</text>

  <rect x="456" y="128" width="196" height="142" rx="8" fill="url(#tealGrad)" stroke="#34D399"/>
  <text x="554" y="150" text-anchor="middle" fill="#A7F3D0" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">STEP 3 · CODING AGENT</text>
  <text x="554" y="170" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">GitHub Copilot SDK</text>
  <text x="554" y="192" text-anchor="middle" fill="#D1FAE5" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 运行于 ACA Sandbox / Kata VM</text>
  <text x="554" y="210" text-anchor="middle" fill="#D1FAE5" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 检出代码 + 生成修复补丁</text>
  <text x="554" y="228" text-anchor="middle" fill="#D1FAE5" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 沙箱内执行 pytest 验证通过</text>
  <text x="554" y="252" text-anchor="middle" fill="#FDE68A" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">快照保存工作区状态</text>

  <rect x="672" y="128" width="180" height="142" rx="8" fill="url(#purpleGrad)" stroke="#A78BFA"/>
  <text x="762" y="150" text-anchor="middle" fill="#DDD6FE" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">STEP 4 · COMPLIANCE</text>
  <text x="762" y="170" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Foundry 合规审计 Agent</text>
  <text x="762" y="192" text-anchor="middle" fill="#EDE9FE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 校验安全基线与变更策略</text>
  <text x="762" y="210" text-anchor="middle" fill="#EDE9FE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Entra Agent ID 签名留痕</text>
  <text x="762" y="228" text-anchor="middle" fill="#EDE9FE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 生成风险评估卡片</text>
  <text x="762" y="252" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">Policy Gate Passed</text>

  <rect x="872" y="128" width="160" height="142" rx="8" fill="url(#amberGrad)" stroke="#FBBF24"/>
  <text x="952" y="150" text-anchor="middle" fill="#FDE68A" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">STEP 5 · APPROVAL</text>
  <text x="952" y="170" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Durable 人工审批门</text>
  <text x="952" y="192" text-anchor="middle" fill="#FEF3C7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 推送 Teams/Slack 审批卡</text>
  <text x="952" y="210" text-anchor="middle" fill="#FEF3C7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 零算力消耗挂起等待</text>
  <text x="952" y="228" text-anchor="middle" fill="#FEF3C7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 批准后合并 PR 并灰度发布</text>
  <text x="952" y="252" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">MTTR 缩短 70%+</text>

  <rect x="48" y="284" width="984" height="60" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="64" y="308" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">为什么计算与状态必须解耦 (Pitch Slide 10)？</text>
  <text x="330" y="308" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">多步推理、工具调用失败重试、跨天人工审批要求工作流状态绝不能绑定在随时可能缩容或重启的容器进程内存里。</text>
  <text x="64" y="330" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">通过 MAF 统一状态机 + Durable Functions 持久化调度 + HorizonDB/Cosmos DB 检查点，任何计算节点故障均可从最近一步精准恢复。</text>

  <!-- Bottom State & Memory Comparison -->
  <rect x="32" y="376" width="1016" height="320" rx="10" fill="#0F172A" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="48" y="402" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">STATE, MEMORY &amp; CHECKPOINT PERSISTENCE MATRIX (三大状态与记忆机制深度对比)</text>

  <rect x="48" y="418" width="320" height="260" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="208" y="444" text-anchor="middle" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="700">1. Azure HorizonDB (Preview)</text>
  <text x="208" y="464" text-anchor="middle" fill="#C4B5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">AI 原生 PostgreSQL 融合状态与向量引擎</text>
  <text x="64" y="490" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 单一引擎统一承载三类数据：</text>
  <text x="76" y="508" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- ACID 关系型事务表 (订单、配额、审计、权限)</text>
  <text x="76" y="524" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- JSONB 半结构化数据 (Thread 消息树、Tool 输出)</text>
  <text x="76" y="540" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- DiskANN 向量索引 (长短期语义记忆混合检索)</text>
  <text x="64" y="564" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 存算分离架构 + 最高 15 个只读副本毫秒级扩展</text>
  <text x="64" y="584" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 原生兼容 LangGraph / MAF Checkpoint 存储接口</text>
  <text x="64" y="604" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 消除“关系库+文档库+向量库”三套系统的数据同步延迟</text>
  <text x="64" y="632" fill="#F87171" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">⚠ 架构边界：当前为 Preview，生产关键负载需核验目标 Region 可用性，或使用 Azure Database for PostgreSQL Flexible Server 生产兜底。</text>

  <rect x="380" y="418" width="320" height="260" rx="8" fill="#1E293B" stroke="#38BDF8"/>
  <text x="540" y="444" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="700">2. Azure Cosmos DB</text>
  <text x="540" y="464" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">全球多活低延迟 NoSQL 会话与事件存储</text>
  <text x="396" y="490" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 单一毫秒级读写延迟与 99.999% 多区域高可用 SLA</text>
  <text x="396" y="512" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 无模式 JSON 文档天然契合高并发 Agent 对话流与事件溯源</text>
  <text x="396" y="534" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 内置向量搜索与 Change Feed 实时触发 Azure Functions</text>
  <text x="396" y="556" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Foundry Agent Service 原生支持自带 Cosmos DB 线程存储</text>
  <text x="396" y="584" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 标杆实证：德国商业银行 (Commerzbank) 虚拟助手 Ava</text>
  <text x="408" y="602" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- 支撑每月 30,000+ 客户服务会话，~75% 咨询全自动闭环</text>
  <text x="408" y="618" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- 跨多个专业化子 Agent 共享实时状态上下文</text>
  <text x="396" y="646" fill="#38BDF8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">适用：全球分布式 To-C / 超大规模高并发会话状态</text>

  <rect x="712" y="418" width="320" height="260" rx="8" fill="#1E293B" stroke="#34D399"/>
  <text x="872" y="444" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="700">3. Sandbox Snapshot &amp; Volumes</text>
  <text x="872" y="464" text-anchor="middle" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">工作区进程内存 + 文件系统级状态冻结</text>
  <text x="728" y="490" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 数据库只能存结构化变量，无法保存：</text>
  <text x="740" y="508" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- 已打开的浏览器 DOM 登录态与 Cookie</text>
  <text x="740" y="524" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- Jupyter / Python 进程内存中的 Pandas/PyTorch 变量</text>
  <text x="740" y="540" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- 编译中间产物、Git 工作树与临时安装依赖</text>
  <text x="728" y="564" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 三层方案协同：</text>
  <text x="740" y="582" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">1. ACA Sandboxes: 容器内存/磁盘快照 + Persistent Volume</text>
  <text x="740" y="598" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">2. AKSClaw: 共享只读技能 PV + 实例读写状态 PV</text>
  <text x="740" y="614" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">3. E2B on VMSS: UFFD 内存镜像 + NBD 块差分快照 (108ms)</text>
  <text x="728" y="646" fill="#34D399" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">黄金组合：数据库存业务检查点 + 快照存执行环境</text>
</svg>
