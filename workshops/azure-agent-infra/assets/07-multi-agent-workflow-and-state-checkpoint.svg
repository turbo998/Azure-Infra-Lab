      <stop offset="0%" stop-color="#065F46" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.88"/>
