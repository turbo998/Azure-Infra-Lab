<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1785 · Label Cardinality Budget Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1785｜可观测标签基数预算工作台</h1>
<div class="grid"><div class="card"><label>每指标标签组合上限</label><input id="cap" type="range" min="50" max="50000" value="4800"><label>当前估算基数</label><input id="current" type="range" min="50" max="60000" value="4300"><label>降采样强度（%）</label><input id="sample" type="range" min="0" max="90" value="28"></div><div class="card"><h3>预算判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先控制估算基数低于上限，再调整降采样强度。</div></div>
<script>
function evalCard(){const cap=+document.getElementById('cap').value;const cur=+document.getElementById('current').value;const s=+document.getElementById('sample').value;const headroom=(cap-cur)/cap*100;const score=headroom*0.8 + s*0.4; if(score>28){state.textContent='可控';detail.textContent=`预算指数 ${score.toFixed(1)}`;}else if(score>12){state.textContent='临界';detail.textContent=`预算指数 ${score.toFixed(1)}`;}else{state.textContent='超压';detail.textContent=`预算指数 ${score.toFixed(1)}`;}}
['cap','current','sample'].forEach(id=>document.getElementById(id).addEventListener('input',evalCard));evalCard();
</script></body></html>
