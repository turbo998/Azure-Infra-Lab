<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1780 · Cache Coherence Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1780｜跨区域缓存一致性工作台</h1>
<div class="grid"><div class="card"><label>热键强一致窗口（ms）</label><input id="hot" type="range" min="10" max="3000" value="260"><label>冷键延迟同步窗口（s）</label><input id="cold" type="range" min="1" max="600" value="85"><label>回源预算占用（%）</label><input id="origin" type="range" min="0" max="100" value="58"></div><div class="card"><h3>一致性判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：优先收敛回源预算占用，再缩短热键窗口。</div></div>
<script>
function evalCoherence(){const h=+hot.value,c=+cold.value,o=+origin.value;const score=(100-o)*0.7 + (350/(h+40)*25) + (120/(c+10)*18);if(score>54){state.textContent='策略可控';detail.textContent=`一致性指数 ${score.toFixed(1)}`;}else if(score>36){state.textContent='临界';detail.textContent=`一致性指数 ${score.toFixed(1)}`;}else{state.textContent='高风险';detail.textContent=`一致性指数 ${score.toFixed(1)}`;}}
['hot','cold','origin'].forEach(id=>document.getElementById(id).addEventListener('input',evalCoherence));evalCoherence();
</script></body></html>
