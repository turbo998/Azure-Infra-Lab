<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1896 · ACA Fleet Drain Protection</title>
<style>body{margin:0;background:#09101f;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1896｜ACA Fleet Drain Protection 工作台</h1>
<div class="g"><div class="c">
<label>迁移成功率(%)</label><input id="mig" type="range" min="40" max="100" value="92">
<label>会话中断率(%)</label><input id="drop" type="range" min="0" max="25" value="4">
<label>回填P95(s)</label><input id="p95" type="range" min="1" max="180" value="34">
</div><div class="c"><h3>Drain 保护治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：优先压低会话中断率，再优化回填P95。</div></div>
<script>
function calc(){const m=+mig.value,d=+drop.value,p=+p95.value;const s=(m*2.2)+((25-d)*4.0)+((180-p)*1.0);state.textContent=s>255?'可生产：drain保护稳定且恢复可预测':(s>215?'可上线：建议继续收敛中断率':'风险偏高：需强化续租缓冲与回填限速');score.textContent=`综合分 ${s.toFixed(2)}`;}
['mig','drop','p95'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
