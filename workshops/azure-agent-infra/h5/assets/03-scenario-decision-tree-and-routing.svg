<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 740" width="1080" height="740">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F1D1D" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="740" rx="16" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1080" height="6" rx="3" fill="url(#headerGrad)"/>
  <text x="32" y="40" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="700">图 3 · AI Agent Infra on Azure 双阶段架构选型决策树与数据底座配对图</text>
  <text x="32" y="64" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13">阶段 A：商务与交付资质门控 (Playbook Slide 7) × 阶段 B：运行时与状态存储精准路由 (Pitch Slides 7–12)</text>

  <!-- Left Panel: Stage A Macro Qualification -->
  <rect x="32" y="84" width="490" height="624" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="52" y="112" fill="#60A5FA" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">STAGE A · 商务模式与研发交付门控 (FIELD DECISION TREE)</text>

  <rect x="142" y="132" width="270" height="48" rx="8" fill="url(#blueGrad)" stroke="#93C5FD"/>
  <text x="277" y="154" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">Q1: 业务客群定位 (To-B 还是 To-C)？</text>
  <text x="277" y="171" text-anchor="middle" fill="#DBEAFE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">决定并发弹性模型、毛利敏感度与多租户隔离强度</text>

  <!-- To-C Branch -->
  <line x1="205" y1="180" x2="135" y2="228" stroke="#38BDF8" stroke-width="2"/>
  <text x="145" y="208" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">To-C / AI Native</text>
  <rect x="52" y="228" width="175" height="72" rx="8" fill="url(#tealGrad)" stroke="#34D399"/>
  <text x="139" y="252" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">直通 Modernization PaaS</text>
  <text x="139" y="270" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">ACA / AKS / Azure VMSS</text>
  <text x="139" y="287" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">极致弹性 + 单位 Token/沙箱成本</text>

  <!-- To-B Branch -->
  <line x1="345" y1="180" x2="380" y2="228" stroke="#60A5FA" stroke-width="2"/>
  <text x="372" y="208" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">To-B 企业内部/B2B</text>
  <rect x="255" y="228" width="245" height="62" rx="8" fill="#1E293B" stroke="#60A5FA"/>
  <text x="377" y="252" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Q2: 是否需要超越托管服务的底层控制？</text>
  <text x="377" y="272" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">(自定义OS内核/私有网络拓扑/不可信代码沙箱/极致成本)</text>

  <!-- Q2 -> No -->
  <line x1="315" y1="290" x2="155" y2="346" stroke="#34D399" stroke-width="2"/>
  <text x="200" y="324" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">否 (标准受控工具)</text>
  <rect x="52" y="346" width="205" height="74" rx="8" fill="url(#blueGrad)" stroke="#60A5FA"/>
  <text x="154" y="370" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Microsoft Foundry Hosted</text>
  <text x="154" y="388" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">1,400+ MCP 连接器 + Agent ID</text>
  <text x="154" y="405" text-anchor="middle" fill="#DBEAFE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">注：仍需应用层 Prompt/工具联调</text>

  <!-- Q2 -> Yes -->
  <line x1="415" y1="290" x2="415" y2="346" stroke="#FBBF24" stroke-width="2"/>
  <text x="424" y="324" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">是 (需底层控制)</text>
  <rect x="280" y="346" width="220" height="62" rx="8" fill="#1E293B" stroke="#FBBF24"/>
  <text x="390" y="370" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Q3: 客户是否有专职研发/平台团队？</text>
  <text x="390" y="390" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">能够承担容器/K8s/VM与编排工程落地</text>

  <!-- Q3 -> No (Red Gate) -->
  <line x1="335" y1="408" x2="165" y2="465" stroke="#F87171" stroke-width="2"/>
  <text x="210" y="445" fill="#F87171" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">否 (无研发团队)</text>
  <rect x="52" y="465" width="225" height="82" rx="8" fill="url(#roseGrad)" stroke="#F87171" stroke-width="1.5"/>
  <text x="164" y="489" text-anchor="middle" fill="#FECDD3" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">⛔ 交付门禁拦截 (Hold Gate)</text>
  <text x="164" y="507" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">引入 CSU 或 AI 合作伙伴共建</text>
  <text x="164" y="525" text-anchor="middle" fill="#FDA4AF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">严禁将需底层控制的场景硬塞回 Foundry</text>

  <!-- Q3 -> Yes -->
  <line x1="435" y1="408" x2="405" y2="465" stroke="#34D399" stroke-width="2"/>
  <text x="430" y="445" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">是 (具备团队)</text>
  <rect x="295" y="465" width="205" height="82" rx="8" fill="url(#tealGrad)" stroke="#34D399" stroke-width="1.5"/>
  <text x="397" y="489" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">✅ 进入 Stage B 技术选型</text>
  <text x="397" y="507" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Modernization PaaS / VM</text>
  <text x="397" y="525" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">按工作负载特征映射 6 大运行时</text>

  <rect x="52" y="566" width="448" height="122" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="68" y="588" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">商机筛选四要素 (4 Foundations) 与 $10K 模型信号门禁：</text>
  <text x="68" y="608" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">1. Runtime (ACA/AKS/Functions/App Service) · 2. Data/State (HorizonDB/PG/Cosmos/Redis)</text>
  <text x="68" y="626" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">3. AI &amp; Integration (Foundry Models/Search/APIM) · 4. Ops/Security (Monitor/KeyVault/Defender)</text>
  <text x="68" y="646" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 持续性门禁：非模型家族需在 5 个月窗口内 ≥3 个月活跃且包含最近连续 2 个月</text>
  <text x="68" y="666" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 模型门禁：最近 3 个月每月 Foundry Models ≥$10,000 计入强信号，但未达标仍可走非模型强路径</text>

  <!-- Right Panel: Stage B Technical Routing -->
  <rect x="542" y="84" width="506" height="624" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="562" y="112" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">STAGE B · 工作负载特征 → 运行时 + 状态存储精准配对</text>

  <!-- 5 Technical Routing Cards -->
  <rect x="562" y="130" width="466" height="96" rx="8" fill="#1E293B" stroke="#38BDF8"/>
  <text x="578" y="152" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">路径 1 · 长周期审批 / 跨系统事务 / 外部事件唤醒</text>
  <text x="578" y="172" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">特征：采购/财务/工单流，需挂起数小时~数天等待人工审批，要求断电/重启后确定性重放与幂等重试</text>
  <text x="578" y="192" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">Runtime: Azure Functions + Durable Functions + ACA Apps</text>
  <text x="578" y="210" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">State: Durable Task Scheduler + Azure HorizonDB / Cosmos DB</text>

  <rect x="562" y="238" width="466" height="96" rx="8" fill="#1E293B" stroke="#34D399"/>
  <text x="578" y="260" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">路径 2 · 短时不可信代码执行 / 数据分析 / 文件解析</text>
  <text x="578" y="280" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">特征：LLM 动态生成 Python/Shell 脚本处理单次任务，需毫秒级预热池分配 (~210ms) 与用完即焚</text>
  <text x="578" y="300" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">Runtime: ACA Apps (宿主编排) + ACA Dynamic Sessions (Hyper-V 预热池)</text>
  <text x="578" y="318" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">State: 必须外置至 HorizonDB / Cosmos DB (Session 回收后本地目录清零)</text>

  <rect x="562" y="346" width="466" height="96" rx="8" fill="#1E293B" stroke="#FBBF24"/>
  <text x="578" y="368" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">路径 3 · 有状态 Coding Agent / 浏览器自动化 / 跨任务工作区</text>
  <text x="578" y="388" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">特征：需自定义 OCI 镜像、挂载持久卷、开放特定端口，并按用户生命周期显式 pause/resume</text>
  <text x="578" y="408" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">Runtime: ACA Apps / AKS + ACA Sandboxes (Preview)</text>
  <text x="578" y="426" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">State: Sandbox 内存/磁盘快照 + Persistent Volume + HorizonDB</text>

  <rect x="562" y="454" width="466" height="106" rx="8" fill="#1E293B" stroke="#A78BFA"/>
  <text x="578" y="476" fill="#C4B5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">路径 4 · 企业级多租户 Agent 平台 / 研发与 SRE 舰队 (AKSClaw)</text>
  <text x="578" y="496" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">特征：每位工程师/租户独立持久实例，BYO Harness (Copilot/Hermes/OpenClaw)，5道平台安全硬边界</text>
  <text x="578" y="516" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">Runtime: AKS (Automatic/Standard) + Kata Pod VM + KEDA + AI Gateway</text>
  <text x="578" y="534" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">State: 共享只读技能 PV + 实例独占状态 PV + Azure HorizonDB (ACID+Vector)</text>

  <rect x="562" y="572" width="466" height="116" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="578" y="594" fill="#FDA4AF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">路径 5 · 10万+ 并发云端虚拟电脑 / 亚 150ms 极速恢复 (Manus × E2B)</text>
  <text x="578" y="614" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">特征：AI Native 产品为每个任务分配完整 Linux/GUI 桌面，要求 ~108ms–132ms 唤醒与百万级会话限流</text>
  <text x="578" y="634" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">Runtime: Azure VMSS Flexible (D96as_v7) + Nomad/Consul + Firecracker</text>
  <text x="578" y="652" fill="#38BDF8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">Gateway: AppGW WAF v2 (双前端) + APIM (按动态 Host Header 独立限流)</text>
  <text x="578" y="670" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">State: UFFD 缺页流式内存恢复 + NBD 块差分快照 + PG 主从 + Azure Blob</text>
</svg>
