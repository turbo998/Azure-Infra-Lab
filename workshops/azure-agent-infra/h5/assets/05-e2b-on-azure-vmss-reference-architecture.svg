<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 740" width="1080" height="740">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F1D1D" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="740" rx="16" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1080" height="6" rx="3" fill="url(#headerGrad)"/>
  <text x="32" y="40" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="700">图 5 · E2B on Azure VMSS 生产级参考架构图 (Manus × E2B 10万+ 并发云端沙箱底座)</text>
  <text x="32" y="64" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13">Application Gateway WAF v2 双前端 × APIM 按动态 Host 独立限流 × Nomad/Consul 调度 × Azure VMSS Flexible (D96as_v7)</text>

  <!-- Top Traffic & Dual-Hop Gateway Layer -->
  <rect x="32" y="84" width="1016" height="156" rx="10" fill="url(#blueGrad)" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="48" y="108" fill="#93C5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">INGRESS &amp; PER-SANDBOX SESSION RATE-LIMITING PLANE (100,000+ DYNAMIC SUBDOMAINS)</text>

  <rect x="48" y="122" width="185" height="102" rx="8" fill="#0F172A" fill-opacity="0.82" stroke="#38BDF8"/>
  <text x="140" y="144" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">1. Agent SDK / Client</text>
  <text x="140" y="164" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">*.e2b.domain.com</text>
  <text x="140" y="182" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• HTTPS 控制面 API</text>
  <text x="140" y="198" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• WSS 终端/桌面流式连接</text>
  <text x="140" y="214" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">&lt;port&gt;-&lt;id&gt;.domain</text>

  <rect x="255" y="122" width="250" height="102" rx="8" fill="#0F172A" fill-opacity="0.82" stroke="#60A5FA"/>
  <text x="380" y="144" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">2. Application Gateway (WAF v2)</text>
  <text x="380" y="164" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">双前端 IP 架构 (Public + Private)</text>
  <text x="380" y="182" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Public IP (443): 通配符 TLS 卸载 + OWASP WAF</text>
  <text x="380" y="198" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Private IP (8080): 接收 APIM 回调并转发</text>
  <text x="380" y="214" text-anchor="middle" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 规避 APIM 直连 VMSS 后端池限制</text>

  <rect x="527" y="122" width="275" height="102" rx="8" fill="#0F172A" fill-opacity="0.82" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="664" y="144" text-anchor="middle" fill="#FDE68A" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">3. Azure API Management (APIM)</text>
  <text x="664" y="164" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">按动态 Host Header 精细化会话限流</text>
  <text x="664" y="182" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">counter-key="@(Headers['Host'])"</text>
  <text x="664" y="198" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 10万+ 活跃沙箱会话彼此独立计数互不干扰</text>
  <text x="664" y="214" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 原生支持 WebSocket 双向长连接透传</text>

  <rect x="824" y="122" width="208" height="102" rx="8" fill="#0F172A" fill-opacity="0.82" stroke="#34D399"/>
  <text x="928" y="144" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">4. API Pool (VMSS)</text>
  <text x="928" y="164" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Client Proxy + E2B API</text>
  <text x="928" y="182" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 端口 3001/3002 动态路由</text>
  <text x="928" y="198" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 端口 50001 会话创建/销毁</text>
  <text x="928" y="214" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Consul 服务发现健康检查</text>

  <!-- Middle Compute & Orchestration Plane -->
  <rect x="32" y="254" width="680" height="310" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="48" y="280" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">CLIENT POOL · AZURE VMSS FLEXIBLE (STANDARD_D96AS_V7 · UP TO 1,000 VMS)</text>
  <text x="48" y="300" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">5th Gen AMD EPYC Turin (4.5GHz) + Azure Boost · 96 vCPU / 384 GiB RAM · 承载高密 KVM + Firecracker 沙箱</text>

  <rect x="48" y="314" width="312" height="162" rx="8" fill="#1E293B" stroke="#34D399"/>
  <text x="204" y="336" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Client Node #1 (D96as_v7 · 96vCPU/384GiB)</text>
  <text x="64" y="358" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Nomad Client + Consul Agent + Node Exporter</text>
  <text x="64" y="378" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Orchestrator Daemon (gRPC 管理沙箱生命周期)</text>
  <text x="64" y="398" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• HugePages 大页内存池 (~326 GiB 预留给 MicroVM)</text>
  <text x="64" y="418" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 数百个并发 Firecracker MicroVM (108ms 启动)</text>
  <text x="64" y="438" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Template Manager (构建自定义 OCI → rootfs.ext4)</text>
  <text x="64" y="458" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Vector Agent 采集沙箱日志与指标流</text>

  <rect x="376" y="314" width="320" height="162" rx="8" fill="#1E293B" stroke="#34D399"/>
  <text x="536" y="336" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">VMSS 非对称弹性扩缩容法则 (Scale Rules)</text>
  <text x="392" y="358" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">▲ Scale-Out (扩容)：CPU &gt; 60% 自动触发</text>
  <text x="392" y="376" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 预留 40% CPU 余量吸收突发 MicroVM 创建洪峰</text>
  <text x="392" y="398" fill="#F87171" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">▼ Scale-In (缩容)：严禁仅凭 CPU 指标盲目缩容</text>
  <text x="392" y="416" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Firecracker 使用 HugePages，宿主机常规内存指标失真</text>
  <text x="392" y="434" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 必须结合自定义 HugePages 监控 + 沙箱快照热迁移排空</text>
  <text x="392" y="454" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 单一 VMSS Flexible 规模集最高支持 1,000 台宿主机</text>

  <rect x="48" y="488" width="648" height="62" rx="8" fill="url(#tealGrad)" stroke="#34D399"/>
  <text x="64" y="512" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">10万并发沙箱容量测算 (agent_infra_sizer.py 验证)：</text>
  <text x="64" y="532" fill="#D1FAE5" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">512 MiB/Sandbox × 85% HugePages × 60% 水位 = 384 稳态沙箱/节点 → 261 台 D96as_v7 节点即可承载 100,000 并发</text>

  <!-- Right Column: Server Pool + Data + Observability -->
  <rect x="728" y="254" width="320" height="310" rx="10" fill="url(#purpleGrad)" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="744" y="280" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">CONTROL, STORAGE &amp; OBSERVABILITY</text>

  <rect x="744" y="294" width="288" height="76" rx="6" fill="#0F172A" fill-opacity="0.82" stroke="#8B5CF6"/>
  <text x="888" y="316" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Server Pool (Nomad + Consul)</text>
  <text x="888" y="336" text-anchor="middle" fill="#C4B5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 3~5 节点 Raft 强一致集群调度</text>
  <text x="888" y="354" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 替代 K8s 直接调度裸金属/VM 上的 MicroVM</text>

  <rect x="744" y="380" width="288" height="84" rx="6" fill="#0F172A" fill-opacity="0.82" stroke="#8B5CF6"/>
  <text x="888" y="402" text-anchor="middle" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Azure Database for PostgreSQL</text>
  <text x="888" y="422" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Primary 写库 + Read Replicas 读扩展</text>
  <text x="888" y="440" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• PgBouncer 连接池 + Cache Lease Lock 防击穿</text>
  <text x="888" y="456" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">OpenAI 同源架构 (50只读副本·100万+ QPS)</text>

  <rect x="744" y="474" width="288" height="76" rx="6" fill="#0F172A" fill-opacity="0.82" stroke="#8B5CF6"/>
  <text x="888" y="496" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Snapshots &amp; Observability</text>
  <text x="888" y="516" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Azure Blob / Files / Lustre 存 memfile+rootfs</text>
  <text x="888" y="534" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Prometheus + Loki + Grafana + Azure Monitor</text>

  <!-- Bottom Warning on Open-Source E2B Gaps -->
  <rect x="32" y="578" width="1016" height="130" rx="10" fill="url(#roseGrad)" stroke="#F87171" stroke-width="1.5"/>
  <text x="48" y="604" fill="#FECDD3" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">ARCHITECTURAL CAUTION · 开源版 E2B 直接上生产的三大架构缺陷与 Azure 加固方案 (Deep Dive Slide 34)</text>
  <text x="48" y="628" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">1. 控制面单点内存态：开源 E2B API 将节点与沙箱映射保存在单进程内存中，不支持多实例水平扩展且重启即丢失状态 → 需外置状态至 PostgreSQL/Redis。</text>
  <text x="48" y="652" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">2. VM 重启孤儿沙箱：Client Node 重启后缺乏自动 GC 与自愈重调度机制 → 需结合 Nomad 健康探针与 VMSS 自动实例修复策略。</text>
  <text x="48" y="676" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">3. 网关单点限流瓶颈：原生缺少百万级动态子域名分布式限流与 WAF 防护 → 必须前置 AppGW WAF v2 (双前端) + APIM rate-limit-by-key。</text>
</svg>
