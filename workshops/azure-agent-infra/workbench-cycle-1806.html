<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1806 · Tool Timeout Budget Workbench</title>
<style>body{margin:0;background:#0a1223;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1806｜工具超时预算工作台</h1>
<div class="grid"><div class="card"><label>总预算(ms)</label><input id="total" type="range" min="100" max="15000" value="4200"><label>执行阶段占比(%)</label><input id="exec" type="range" min="20" max="90" value="62"><label>熔断阈值(%)</label><input id="cb" type="range" min="40" max="99" value="84"></div><div class="card"><h3>预算稳态评估</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先锁定总预算，再调执行占比与熔断阈值。</div></div>
<script>
function evalT(){const t=+total.value,e=+exec.value,c=+cb.value;const score=(t/430)+(e*0.11)-(c*0.05);if(score>12)state.textContent='稳态良好';else if(score>8)state.textContent='可优化';else state.textContent='风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['total','exec','cb'].forEach(id=>document.getElementById(id).addEventListener('input',evalT));evalT();
</script></body></html>
