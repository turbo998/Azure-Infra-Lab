<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1900 · ACA Session TTL Debt Reconciliation</title>
<style>body{margin:0;background:#0a1323;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1900｜ACA Session TTL Debt Reconciliation 工作台</h1>
<div class="g"><div class="c">
<label>债务余额健康度(%)</label><input id="health" type="range" min="20" max="99" value="81">
<label>回收成功率(%)</label><input id="reclaim" type="range" min="40" max="100" value="90">
<label>续租债务P95(min)</label><input id="debt" type="range" min="1" max="120" value="26">
</div><div class="c"><h3>TTL 对账治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：先提高回收成功率，再压缩债务P95。</div></div>
<script>
function calc(){const h=+health.value,r=+reclaim.value,d=+debt.value;const s=(h*2.0)+(r*1.9)+((120-d)*1.1);state.textContent=s>250?'可生产：TTL债务闭环稳定':(s>210?'可上线：建议继续压缩债务尾部':'风险偏高：需强化预算分层与回收梯度');score.textContent=`综合分 ${s.toFixed(2)}`;}
['health','reclaim','debt'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
