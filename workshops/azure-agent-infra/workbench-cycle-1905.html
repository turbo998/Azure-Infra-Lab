<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1905 · Firecracker Snapshot Warmth Budget</title>
<style>body{margin:0;background:#091322;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1905｜Firecracker Snapshot Warmth Budget 工作台</h1>
<div class="g"><div class="c">
<label>暖池命中率(%)</label><input id="hit" type="range" min="20" max="99" value="83">
<label>预热成本占比(%)</label><input id="cost" type="range" min="0" max="45" value="14">
<label>冷启动P95(ms)</label><input id="p95" type="range" min="50" max="2200" value="360">
</div><div class="c"><h3>Warmth 预算治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：先压低预热成本占比，再提升命中率稳定性。</div></div>
<script>
function calc(){const h=+hit.value,c=+cost.value,p=+p95.value;const s=(h*2.0)+((45-c)*3.0)+((2200-p)/12);state.textContent=s>250?'可生产：预热预算与收益平衡稳定':(s>210?'可上线：建议继续收敛成本占比':'风险偏高：需强化热度分级与熔断阈值');score.textContent=`综合分 ${s.toFixed(2)}`;}
['hit','cost','p95'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
