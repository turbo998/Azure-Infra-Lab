<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1801 · Cache Fairness Workbench</title>
<style>body{margin:0;background:#0a1321;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1801｜缓存隔离与公平工作台</h1>
<div class="grid"><div class="card"><label>租户分区数</label><input id="part" type="range" min="1" max="40" value="12"><label>公平权重偏置(%)</label><input id="bias" type="range" min="0" max="80" value="24"><label>热点削峰阈值</label><input id="shed" type="range" min="10" max="100" value="62"></div><div class="card"><h3>公平稳态评估</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先稳定分区边界，再压低权重偏置与热点抖动。</div></div>
<script>
function evalC(){const p=+part.value,b=+bias.value,s=+shed.value;const score=(p*0.55)+(s*0.08)-(b*0.20);if(score>10)state.textContent='稳态良好';else if(score>6)state.textContent='可优化';else state.textContent='风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['part','bias','shed'].forEach(id=>document.getElementById(id).addEventListener('input',evalC));evalC();
</script></body></html>
