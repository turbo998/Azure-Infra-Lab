<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1805 · Session Ledger Compaction Workbench</title>
<style>body{margin:0;background:#0a1224;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1805｜会话账本压缩工作台</h1>
<div class="grid"><div class="card"><label>热层保留时长(小时)</label><input id="hot" type="range" min="1" max="168" value="36"><label>压缩批量大小</label><input id="batch" type="range" min="100" max="20000" value="3600"><label>冷归档压缩比(%)</label><input id="ratio" type="range" min="10" max="95" value="68"></div><div class="card"><h3>压缩稳态评估</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先稳定热层保留窗口，再调批量与压缩比。</div></div>
<script>
function evalL(){const h=+hot.value,b=+batch.value,r=+ratio.value;const score=(h*0.08)+(b/900)+(r*0.12);if(score>16)state.textContent='稳态良好';else if(score>10)state.textContent='可优化';else state.textContent='风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['hot','batch','ratio'].forEach(id=>document.getElementById(id).addEventListener('input',evalL));evalL();
</script></body></html>
