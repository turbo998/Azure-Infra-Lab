<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1807 · Preflight Policy Snapshot Workbench</title>
<style>body{margin:0;background:#0a1222;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="wrap"><h1>Cycle 1807｜预检策略快照工作台</h1>
<div class="grid"><div class="card"><label>快照有效期(秒)</label><input id="ttl" type="range" min="5" max="600" value="96"><label>漂移检测阈值(%)</label><input id="drift" type="range" min="1" max="50" value="12"><label>回退触发门限(%)</label><input id="rollback" type="range" min="1" max="60" value="18"></div><div class="card"><h3>一致性稳态评估</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：先稳定快照有效期，再细调漂移阈值与回退门限。</div></div>
<script>
function evalP(){const t=+ttl.value,d=+drift.value,r=+rollback.value;const score=(t*0.07)-(d*0.18)-(r*0.12)+16;if(score>12)state.textContent='稳态良好';else if(score>8)state.textContent='可优化';else state.textContent='风险偏高';detail.textContent=`综合分 ${score.toFixed(2)}`;}
['ttl','drift','rollback'].forEach(id=>document.getElementById(id).addEventListener('input',evalP));evalP();
</script></body></html>
