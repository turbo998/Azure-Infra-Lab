<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1786 · Rollback Consistency Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1786｜Checkpoint 回滚一致性工作台</h1>
<div class="grid"><div class="card"><label>检查点覆盖率（%）</label><input id="cov" type="range" min="0" max="100" value="82"><label>补偿重试上限（次）</label><input id="retry" type="range" min="1" max="10" value="4"><label>回滚后校验通过率（%）</label><input id="pass" type="range" min="0" max="100" value="88"></div><div class="card"><h3>一致性判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：优先提升检查点覆盖，再优化补偿重试策略。</div></div>
<script>
function evalRollback(){const c=+cov.value,r=+retry.value,p=+pass.value;const score=(c*0.45)+(p*0.5)-(r*1.2);if(score>68){state.textContent='一致性优';detail.textContent=`回滚指数 ${score.toFixed(1)}`;}else if(score>52){state.textContent='临界';detail.textContent=`回滚指数 ${score.toFixed(1)}`;}else{state.textContent='高风险';detail.textContent=`回滚指数 ${score.toFixed(1)}`;}}
['cov','retry','pass'].forEach(id=>document.getElementById(id).addEventListener('input',evalRollback));evalRollback();
</script></body></html>
