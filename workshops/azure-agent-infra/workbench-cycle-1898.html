<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1898 · ACA Eviction Backpressure</title>
<style>body{margin:0;background:#0a1020;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:24px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1898｜ACA Eviction Backpressure 工作台</h1>
<div class="g"><div class="c">
<label>池健康度(%)</label><input id="health" type="range" min="20" max="99" value="76">
<label>中断率(%)</label><input id="drop" type="range" min="0" max="30" value="5">
<label>重建P95(s)</label><input id="rebuild" type="range" min="1" max="240" value="41">
</div><div class="c"><h3>驱逐回压治理评分</h3><p id="state"></p><p id="score"></p></div></div>
<div class="c">建议：优先压低中断率，再收敛重建P95。</div></div>
<script>
function calc(){const h=+health.value,d=+drop.value,r=+rebuild.value;const s=(h*2.0)+((30-d)*3.8)+((240-r)*0.9);state.textContent=s>245?'可生产：驱逐回压联动稳定':(s>205?'可上线：建议继续优化恢复速度':'风险偏高：需强化阈值与门控联动');score.textContent=`综合分 ${s.toFixed(2)}`;}
['health','drop','rebuild'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
