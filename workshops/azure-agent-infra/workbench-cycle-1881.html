<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1881 · Egress Policy Shadow Release Workbench</title>
<style>body{margin:0;background:#0b3762;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:22px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1881｜Egress Policy Shadow Release 工作台</h1>
<div class="g">
<div class="c"><label>主影差异率(%)</label><input id="diff" type="range" min="0" max="20" value="2"><label>影子误报率(%)</label><input id="fp" type="range" min="0" max="15" value="1"><label>放量阶段完成度(%)</label><input id="ramp" type="range" min="0" max="100" value="68"></div>
<div class="c"><h3>影子发布治理评分</h3><p id="state"></p><p id="score"></p></div>
</div><div class="c">建议：优先压低差异率与误报率，再稳步提升放量完成度。</div></div>
<script>
function calc(){const d=+document.getElementById('diff').value,f=+document.getElementById('fp').value,r=+document.getElementById('ramp').value;const v=((20-d)*3.0)+((15-f)*3.4)+(r*0.9);if(v>188)state.textContent='可生产：影子发布风险受控且放量平稳';else if(v>158)state.textContent='可上线：建议继续收敛差异率';else state.textContent='风险偏高：需强化比对与回退阈值';score.textContent=`综合分 ${v.toFixed(2)}`;}
['diff','fp','ramp'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
