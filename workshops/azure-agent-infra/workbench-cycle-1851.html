<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1851 · Dynamic Sessions Prewarm Workbench</title>
<style>body{margin:0;background:#0b2b4a;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:22px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1851｜ACA Dynamic Sessions 预热池工作台</h1>
<div class="g">
<div class="c"><label>基线预热实例数</label><input id="b" type="range" min="0" max="300" value="64"><label>预测补池提前量(min)</label><input id="f" type="range" min="1" max="60" value="14"><label>空闲成本占比(%)</label><input id="i" type="range" min="1" max="60" value="17"></div>
<div class="c"><h3>预热策略健康度</h3><p id="state"></p><p id="score"></p></div>
</div><div class="c">建议：先降低空闲成本占比，再微调补池提前量，最后校准基线规模。</div></div>
<script>
function calc(){const b=+document.getElementById('b').value,f=+document.getElementById('f').value,i=+document.getElementById('i').value;const v=((300-b)*0.12)+((60-f)*0.95)+((60-i)*1.4);if(v>130)state.textContent='预热效率与成本平衡良好';else if(v>108)state.textContent='可上线，建议继续压缩空闲占比';else state.textContent='风险偏高，建议收敛基线并重估预测窗口';score.textContent=`综合分 ${v.toFixed(2)}`;}
['b','f','i'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
