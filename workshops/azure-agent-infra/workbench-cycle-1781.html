<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1781 · Human Takeover Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1781｜Browser/CUA 人机接管工作台</h1>
<div class="grid"><div class="card"><label>失败检测延迟（ms）</label><input id="detect" type="range" min="50" max="6000" value="520"><label>接管通道建立（ms）</label><input id="channel" type="range" min="50" max="6000" value="680"><label>状态快照恢复（ms）</label><input id="restore" type="range" min="50" max="8000" value="920"></div><div class="card"><h3>接管判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">建议：优先降低通道建立与快照恢复耗时，再优化检测阈值。</div></div>
<script>
function evalTakeover(){const d=+detect.value,c=+channel.value,r=+restore.value;const score=2400/(d+c+r)*120;if(score>58){state.textContent='接管优';detail.textContent=`指数 ${score.toFixed(1)}`;}else if(score>40){state.textContent='可用';detail.textContent=`指数 ${score.toFixed(1)}`;}else{state.textContent='高风险';detail.textContent=`指数 ${score.toFixed(1)}`;}}
['detect','channel','restore'].forEach(id=>document.getElementById(id).addEventListener('input',evalTakeover));evalTakeover();
</script></body></html>
