<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1865 · Session Lease Budget Workbench</title>
<style>body{margin:0;background:#0b3762;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.w{max-width:1080px;margin:0 auto;padding:22px}.c{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div class="w"><h1>Cycle 1865｜Session Lease Budget 工作台</h1>
<div class="g">
<div class="c"><label>热池占比(%)</label><input id="hot" type="range" min="5" max="60" value="28"><label>预算使用率(%)</label><input id="bud" type="range" min="30" max="140" value="82"><label>优先级回收成功率(%)</label><input id="rec" type="range" min="40" max="100" value="93"></div>
<div class="c"><h3>租约治理健康度</h3><p id="state"></p><p id="score"></p></div>
</div><div class="c">建议：先稳定预算使用率，再优化热池占比，最后提升回收成功率。</div></div>
<script>
function calc(){const hot=+document.getElementById('hot').value,bud=+document.getElementById('bud').value,rec=+document.getElementById('rec').value;const hotScore=(60-Math.abs(hot-30))*1.4;const budScore=(140-bud)*1.2;const recScore=(rec-40)*1.6;const v=hotScore+budScore+recScore;if(v>172)state.textContent='可生产：租约与预算平衡稳定';else if(v>146)state.textContent='可上线：建议收敛预算波动';else state.textContent='风险偏高：需优化热池与回收联动';score.textContent=`综合分 ${v.toFixed(2)}`;}
['hot','bud','rec'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
