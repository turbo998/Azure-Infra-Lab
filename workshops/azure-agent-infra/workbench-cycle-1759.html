<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cycle 1759 · Entra OBO Boundary Workbench</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Segoe UI,Microsoft YaHei}.wrap{max-width:1080px;margin:0 auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%}</style>
</head><body><div class="wrap"><h1>Cycle 1759｜Entra Agent ID OBO 权限边界工作台</h1>
<div class="grid"><div class="card"><label>scope 粗粒度风险（0-100）</label><input id="scope" type="range" min="0" max="100" value="62"><label>身份边界分离得分（0-100）</label><input id="sep" type="range" min="0" max="100" value="71"><label>拒绝可解释性得分（0-100）</label><input id="deny" type="range" min="0" max="100" value="66"></div><div class="card"><h3>授权安全判定</h3><p id="state"></p><p id="detail"></p></div></div>
<div class="card">目标：最小权限、最短时效、可回放审计链。</div></div>
<script>
function evalOBO(){const s=+scope.value,sep=+document.getElementById('sep').value,d=+deny.value;const risk=s-(sep*0.45)-(d*0.35);if(risk<5){state.textContent='边界健康';detail.textContent=`风险指数 ${risk.toFixed(1)}`;}else if(risk<20){state.textContent='可灰度，需补强';detail.textContent=`风险指数 ${risk.toFixed(1)}`;}else{state.textContent='高风险，禁止放量';detail.textContent=`风险指数 ${risk.toFixed(1)}`;}}
['scope','sep','deny'].forEach(id=>document.getElementById(id).addEventListener('input',evalOBO));evalOBO();
</script></body></html>
