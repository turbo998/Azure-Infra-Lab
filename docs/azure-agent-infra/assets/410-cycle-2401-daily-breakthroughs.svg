  <text x="90" y="215" fill="#e2e8f0" font-size="26" font-family="Segoe UI,Arial" font-weight="600">Daily capability breakthroughs (official-first)</text>
  <text x="90" y="258" fill="#cbd5e1" font-size="20" font-family="Segoe UI,Arial">1) Prompt caching + APC materially lowers long-context TTFT under repeated prefixes.</text>
  <text x="90" y="296" fill="#cbd5e1" font-size="20" font-family="Segoe UI,Arial">2) Versioned invalidation is required to avoid stale cache reuse on dynamic system prompts.</text>
  <text x="90" y="334" fill="#cbd5e1" font-size="20" font-family="Segoe UI,Arial">3) LMCache with Redis metadata and NVMe offload improves distributed KV durability depth.</text>
  <text x="90" y="372" fill="#cbd5e1" font-size="20" font-family="Segoe UI,Arial">4) Memory compaction plus cache governance reduces context-rot incidents in long trajectories.</text>
