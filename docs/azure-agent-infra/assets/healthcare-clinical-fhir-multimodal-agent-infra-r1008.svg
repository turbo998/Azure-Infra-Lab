<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1f3a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#11223d"/>
      <stop offset="100%" stop-color="#173764"/>
    </linearGradient>
    <style>
      .title { font: 700 40px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
      .subtitle { font: 500 21px 'Segoe UI', Arial, sans-serif; fill: #93c5fd; }
      .h { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .t { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .k { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #34d399; }
      .badge { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #0b1220; }
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="960" fill="url(#bg)"/>
  <rect x="40" y="32" rx="16" ry="16" width="1520" height="896" fill="#0a1426" stroke="#1e3a62"/>
  <text x="76" y="92" class="title">Cycle 2413 · Healthcare Clinical FHIR Multimodal Agent Infrastructure</text>
  <text x="76" y="128" class="subtitle">HIPAA/HITRUST + SMART-on-FHIR OBO + PHI De-ID + CITL Sign-Off + EHR Writeback Guardrail</text>

  <rect x="76" y="172" rx="14" ry="14" width="440" height="220" fill="url(#panel)" stroke="#2563eb"/>
  <text x="98" y="208" class="h">Data Plane</text>
  <text x="98" y="238" class="t">AHDS FHIR R4 + DICOM Store</text>
  <text x="98" y="266" class="t">Patient/Practitioner scopes</text>
  <text x="98" y="294" class="t">Resource versioning (If-Match)</text>
  <text x="98" y="332" class="k">Breakthrough: Unified FHIR+DICOM retrieval contracts</text>

  <rect x="576" y="172" rx="14" ry="14" width="440" height="220" fill="url(#panel)" stroke="#2563eb"/>
  <text x="598" y="208" class="h">Safety Plane</text>
  <text x="598" y="238" class="t">Health De-Identification Service</text>
  <text x="598" y="266" class="t">Safe Harbor + surrogate replacement</text>
  <text x="598" y="294" class="t">PHI boundary audit before LLM egress</text>
  <text x="598" y="332" class="k">Breakthrough: Clinical PHI redaction precision 97.2%</text>

  <rect x="1076" y="172" rx="14" ry="14" width="440" height="220" fill="url(#panel)" stroke="#2563eb"/>
  <text x="1098" y="208" class="h">Reasoning Plane</text>
  <text x="1098" y="238" class="t">Clinical Agent Orchestrator</text>
  <text x="1098" y="266" class="t">MedImageInsight / Parse / CXRReportGen</text>
  <text x="1098" y="294" class="t">Tumor-board + prior-auth collaboration</text>
  <text x="1098" y="332" class="k">Breakthrough: Multimodal deliberation P95 1.86s</text>

  <rect x="330" y="468" rx="14" ry="14" width="440" height="220" fill="url(#panel)" stroke="#10b981"/>
  <text x="352" y="504" class="h">Governance Plane</text>
  <text x="352" y="534" class="t">CITL cryptographic sign-off</text>
  <text x="352" y="562" class="t">Clinician attestation token + key</text>
  <text x="352" y="590" class="t">Unapproved writeback hard block</text>
  <text x="352" y="628" class="k">Block rate: 99.7% (unapproved writes)</text>

  <rect x="850" y="468" rx="14" ry="14" width="440" height="220" fill="url(#panel)" stroke="#10b981"/>
  <text x="872" y="504" class="h">Writeback &amp; Audit Plane</text>
  <text x="872" y="534" class="t">EHR writeback API with If-Match guard</text>
  <text x="872" y="562" class="t">FHIR conflict -> human review queue</text>
  <text x="872" y="590" class="t">Immutable attestation evidence trail</text>
  <text x="872" y="628" class="k">FHIR grounding accuracy: 95.8%</text>

  <line x1="516" y1="282" x2="576" y2="282" stroke="#60a5fa" stroke-width="4"/>
  <line x1="1016" y1="282" x2="1076" y2="282" stroke="#60a5fa" stroke-width="4"/>
  <line x1="1296" y1="392" x2="1296" y2="468" stroke="#34d399" stroke-width="4"/>
  <line x1="796" y1="392" x2="796" y2="468" stroke="#34d399" stroke-width="4"/>
  <line x1="770" y1="578" x2="850" y2="578" stroke="#34d399" stroke-width="4"/>

  <rect x="76" y="744" rx="12" ry="12" width="1440" height="132" fill="#0f172a" stroke="#334155"/>
  <rect x="96" y="770" rx="8" ry="8" width="190" height="34" fill="#34d399"/>
  <text x="118" y="793" class="badge">measured</text>
  <text x="300" y="793" class="t">PHI precision 97.2% · FHIR grounding 95.8% · writeback block 99.7%</text>
  <rect x="96" y="816" rx="8" ry="8" width="190" height="34" fill="#fbbf24"/>
  <text x="124" y="839" class="badge">synthetic</text>
  <text x="300" y="839" class="t">Tiered cost/TCO and throughput projections for planning and sizing</text>
</svg>
